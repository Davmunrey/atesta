[project]
name = "atesta-api"
version = "0.0.0"
description = "Atesta API: FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "atesta-core",
]

[tool.uv.sources]
atesta-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atesta_api"]
