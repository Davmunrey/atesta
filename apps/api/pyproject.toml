[project]
name = "atesta-api"
version = "0.0.0"
description = "Atesta API: FastAPI modular monolith"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "atesta-core",
    "atesta-mcp",  # mounted at /mcp only with ATESTA_MCP_REMOTE=1 (ADR-016)
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "procrastinate==3.11.0",
    "python-multipart>=0.0.20",  # evidence file uploads (multipart/form-data)
    "boto3>=1.40",  # S3 evidence store (evidence-file-uploads spec)
]

[tool.uv.sources]
atesta-core = { workspace = true }
atesta-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atesta_api"]
# *.pem is git-ignored repo-wide; the pinned RDS CA must still ship in the wheel and the image.
artifacts = ["src/atesta_api/platform/certs/*.pem"]
