[project]
name = "atesta-worker"
version = "0.0.0"
description = "Atesta background jobs on Procrastinate (ADR-003)"
requires-python = ">=3.12"
dependencies = [
    "atesta-api",
    "procrastinate==3.11.0",
    "pyyaml>=6.0",
]

[project.scripts]
atesta-worker = "atesta_worker.__main__:main"
atesta-dev-scan = "atesta_worker.dev_scan:main"

[tool.uv.sources]
atesta-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atesta_worker"]
