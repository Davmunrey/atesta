<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Atesta">
  <!-- Atesta mark (original, 2026; DESIGN.md "Brand system"): a double seal ring around three ledger
       lines, the middle one attested on the highlighter. Ink #141414, highlighter #FFE58A. -->
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#141414" stroke-width="2"/>
  <circle cx="16" cy="16" r="11.25" fill="none" stroke="#141414" stroke-width="1"/>
  <rect x="10.5" y="11" width="9" height="2" rx="1" fill="#141414"/>
  <rect x="9" y="14" width="14" height="4" rx="0.75" fill="#FFE58A"/>
  <rect x="10.5" y="15" width="11" height="2" rx="1" fill="#141414"/>
  <rect x="10.5" y="19" width="6" height="2" rx="1" fill="#141414"/>
</svg>
