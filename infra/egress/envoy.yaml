# Scan egress proxy (scanner-connectors spec, AWS runner; issue 454).
#
# Envoy terminates HTTP/1.1 CONNECT and tunnels the bytes to a fixed cluster per allowed host, on
# port 443 only. Every other request, CONNECT or plain HTTP, gets 403. There is no admin
# interface, no dynamic forward proxy and no original-destination cluster, so a client never
# chooses where a tunnel goes: a CONNECT to graph.microsoft.com:443 reaches Graph's own address,
# whatever the TLS inside says. TLS stays end to end; the proxy sees no path and no body.
#
# The access log carries the CONNECT authority, the response code and flags, bytes and duration.
# Adding a host means a virtual host and a cluster here, and the host in the spec's Runners table
# (infra/tests/test_egress.py checks both).

static_resources:
  listeners:
  - name: egress
    address:
      socket_address: { address: 0.0.0.0, port_value: 3128 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: egress
          http_protocol_options: {}
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  event: egress
                  start: "%START_TIME%"
                  method: "%REQ(:METHOD)%"
                  authority: "%REQ(:AUTHORITY)%"
                  code: "%RESPONSE_CODE%"
                  flags: "%RESPONSE_FLAGS%"
                  upstream: "%UPSTREAM_CLUSTER%"
                  sent: "%BYTES_SENT%"
                  received: "%BYTES_RECEIVED%"
                  duration_ms: "%DURATION%"
          route_config:
            name: allowlist
            virtual_hosts:
            - name: login_microsoftonline_com
              domains: ["login.microsoftonline.com:443"]
              routes:
              - match: { connect_matcher: {} }
                route:
                  cluster: login_microsoftonline_com
                  upgrade_configs:
                  - upgrade_type: CONNECT
                    connect_config: {}
              - match: { prefix: "/" }
                direct_response: { status: 403 }
            - name: graph_microsoft_com
              domains: ["graph.microsoft.com:443"]
              routes:
              - match: { connect_matcher: {} }
                route:
                  cluster: graph_microsoft_com
                  upgrade_configs:
                  - upgrade_type: CONNECT
                    connect_config: {}
              - match: { prefix: "/" }
                direct_response: { status: 403 }
            - name: management_azure_com
              domains: ["management.azure.com:443"]
              routes:
              - match: { connect_matcher: {} }
                route:
                  cluster: management_azure_com
                  upgrade_configs:
                  - upgrade_type: CONNECT
                    connect_config: {}
              - match: { prefix: "/" }
                direct_response: { status: 403 }
            - name: oauth2_googleapis_com
              domains: ["oauth2.googleapis.com:443"]
              routes:
              - match: { connect_matcher: {} }
                route:
                  cluster: oauth2_googleapis_com
                  upgrade_configs:
                  - upgrade_type: CONNECT
                    connect_config: {}
              - match: { prefix: "/" }
                direct_response: { status: 403 }
            - name: admin_googleapis_com
              domains: ["admin.googleapis.com:443"]
              routes:
              - match: { connect_matcher: {} }
                route:
                  cluster: admin_googleapis_com
                  upgrade_configs:
                  - upgrade_type: CONNECT
                    connect_config: {}
              - match: { prefix: "/" }
                direct_response: { status: 403 }
            - name: cloudidentity_googleapis_com
              domains: ["cloudidentity.googleapis.com:443"]
              routes:
              - match: { connect_matcher: {} }
                route:
                  cluster: cloudidentity_googleapis_com
                  upgrade_configs:
                  - upgrade_type: CONNECT
                    connect_config: {}
              - match: { prefix: "/" }
                direct_response: { status: 403 }
            - name: deny
              domains: ["*"]
              routes:
              - match: { connect_matcher: {} }
                direct_response: { status: 403 }
              - match: { prefix: "/" }
                direct_response: { status: 403 }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: login_microsoftonline_com
    type: LOGICAL_DNS
    connect_timeout: 5s
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: login_microsoftonline_com
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: login.microsoftonline.com, port_value: 443 }
  - name: graph_microsoft_com
    type: LOGICAL_DNS
    connect_timeout: 5s
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: graph_microsoft_com
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: graph.microsoft.com, port_value: 443 }
  - name: management_azure_com
    type: LOGICAL_DNS
    connect_timeout: 5s
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: management_azure_com
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: management.azure.com, port_value: 443 }
  - name: oauth2_googleapis_com
    type: LOGICAL_DNS
    connect_timeout: 5s
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: oauth2_googleapis_com
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: oauth2.googleapis.com, port_value: 443 }
  - name: admin_googleapis_com
    type: LOGICAL_DNS
    connect_timeout: 5s
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: admin_googleapis_com
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: admin.googleapis.com, port_value: 443 }
  - name: cloudidentity_googleapis_com
    type: LOGICAL_DNS
    connect_timeout: 5s
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: cloudidentity_googleapis_com
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: cloudidentity.googleapis.com, port_value: 443 }
