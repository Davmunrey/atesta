[project]
name = "atesta-scanner"
version = "0.0.0"
description = "Atesta scan wrapper around the pinned Prowler engine (scanner-connectors spec)"
requires-python = ">=3.12"
dependencies = ["atesta-core"]

[project.scripts]
atesta-scan = "atesta_scanner.__main__:main"

[tool.uv.sources]
atesta-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atesta_scanner"]
