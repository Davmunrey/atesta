name: Bug
description: Something Atesta does is wrong.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what should have happened
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps or commands on local compose, with synthetic data only. Never paste customer data.
      render: text
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Command output, test name or log lines, with secrets and tokens removed.
      render: text
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: What must be true when this is fixed. Include the test that would have caught it.
    validations:
      required: true
