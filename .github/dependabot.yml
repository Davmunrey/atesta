# Dependency updates (supply-chain policy: 7-day cooldown, as pyproject `exclude-newer` and pnpm
# `minimumReleaseAge`). Version updates wait 7 days after a release; security updates do not
# wait (GitHub: cooldown applies to version updates only). Minor and patch are grouped per
# ecosystem to keep the PR count low; majors come one per PR.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    # procrastinate is no longer ignored (owner decision, 2026-11-23): its migrations are vendored in
    # apps/api/migrations/sql, and test_queue_migrations fails on any upgrade that brings new SQL,
    # so a bump PR stays red until the new migration is copied and reviewed.
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"  # pnpm is configured through the npm ecosystem
    # The pnpm workspace root (ADR-017): one lockfile for apps/web and packages/ui.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Types must match the Node runtime major (.nvmrc, engines ">=22 <23"); bump both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "opentofu"
    directories:
      - "/infra/envs/dev"
      - "/infra/modules/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    # One pull request for every directory: a provider bumped in one module but not the others,
    # or without its lock file, fails `tofu validate` (#125-#127). infra/tests pins the version.
    groups:
      opentofu-providers:
        patterns: ["*"]

  # Base images are pinned by tag and digest (ADR-013); without these entries the digests never
  # move and base-image security fixes are missed (#259). Dependabot reads each directory's
  # `Dockerfile`; the CI Postgres service image is not covered and follows compose.yaml
  # (apps/api/tests/test_ci_workflow.py). The scanner's PowerShell tarball (version and sha256 in
  # scanner/Dockerfile) is not an image: it stays a manual bump.
  - package-ecosystem: "docker"
    directories:
      - "/apps"
      - "/scanner"
      - "/infra/egress" # the scan egress proxy's Envoy base (issue 454; owner, 2026-11-24)
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    ignore:
      # Python stays on 3.13 everywhere (requires-python, mypy, ruff, CI, both image bases, the
      # scanner lock; #298); a minor or major move is a planned upgrade of every image and
      # toolchain together, so only 3.13.x patches come through. 3.13 is the newest Prowler allows;
      # the weekly newest-Python run (python-newest.yml) gives the early warning.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    ignore:
      # PostgreSQL stays on 18 (RDS engine_version and the postgres18 parameter group, #299); a
      # major upgrade moves RDS, CI and compose together and runs the migrations and the RLS suite
      # on the new major first. 18.x patches come through.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
