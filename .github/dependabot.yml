# Dependency updates (supply-chain policy: 7-day cooldown, as pyproject `exclude-newer` and pnpm
# `minimumReleaseAge`). Version updates wait 7 days after a release; security updates do not
# wait (GitHub: cooldown applies to version updates only). Minor and patch are grouped per
# ecosystem to keep the PR count low; majors come one per PR.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    # procrastinate is no longer ignored (owner decision, 2026-11-23): its migrations are vendored in
    # apps/api/migrations/sql, and test_queue_migrations fails on any upgrade that brings new SQL,
    # so a bump PR stays red until the new migration is copied and reviewed.
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"  # pnpm is configured through the npm ecosystem
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Types must match the Node runtime major (.nvmrc, engines ">=22 <23"); bump both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "opentofu"
    directories:
      - "/infra/envs/dev"
      - "/infra/modules/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    # One pull request for every directory: a provider bumped in one module but not the others,
    # or without its lock file, fails `tofu validate` (#125-#127). infra/tests pins the version.
    groups:
      opentofu-providers:
        patterns: ["*"]
