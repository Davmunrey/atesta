name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so an advisory or a stale pin surfaces on a quiet week; a failure lands on main.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its previous run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ATESTA_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/postgres
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.11.32"
      - name: Install
        run: uv sync --all-packages --locked
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Validate framework catalog
        run: uv run python -m apps.api.devtools.preview_catalog
      - name: Module boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -q

  changes:
    # Changelog fragments (changes/README.md). Pull requests only; stdlib, no project install.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.11.32"
      - name: Changelog fragment
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          uv run --no-project python -m apps.api.devtools.changes check --base "origin/$BASE_REF" --body "$RUNNER_TEMP/pr-body.md" --author "$PR_AUTHOR"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Build (static export)
        run: pnpm build
      - name: Licenses (no GPL or AGPL)
        run: pnpm check-licenses

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ATESTA_E2E_ADMIN_URL: postgresql+psycopg://postgres@localhost:5432/postgres
      UV_LOCKED: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.11.32"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: |
          uv sync --all-packages --locked
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build (static export and CSP hashes)
        run: pnpm build
      - name: e2e (fake Cognito, real API and Postgres, axe)
        run: pnpm exec playwright test --trace off

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.11.32"
      # uvx ignores the workspace cooldown, so each tool is pinned and gets --exclude-newer.
      - name: Dependency audit (locked runtime dependencies)
        run: |
          uv export --locked --all-packages --no-dev --no-emit-workspace --quiet -o "$RUNNER_TEMP/req.txt"
          uvx --exclude-newer "7 days" pip-audit==2.10.1 --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/req.txt" -f json -o "$RUNNER_TEMP/audit.json" || { jq . "$RUNNER_TEMP/audit.json"; exit 1; }
          jq -e '[.dependencies[].name] | index("fastapi") != null' "$RUNNER_TEMP/audit.json"
      - name: Dependency audit (scanner image)
        run: |
          for f in scanner/requirements.txt scanner/build-requirements.txt; do
            uvx --exclude-newer "7 days" pip-audit==2.10.1 --strict --require-hashes --disable-pip -r "$f"
          done
      - name: Static analysis (semgrep)
        run: uvx --exclude-newer "7 days" --from semgrep==1.184.0 semgrep scan --config auto --error

  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the scanner image
        run: docker build -f scanner/Dockerfile -t atesta-scanner:ci .
      - name: Offline golden
        run: scanner/golden.sh atesta-scanner:ci

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
      - name: Format
        run: tofu fmt -check -recursive infra
      - name: Validate dev
        working-directory: infra/envs/dev
        run: |
          tofu init -backend=false -input=false
          tofu validate
      # Plan with the OIDC plan role is added once the dev AWS account exists (AWS postponed).
