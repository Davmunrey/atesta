name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so an advisory or a stale pin surfaces on a quiet week; a failure lands on main.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its previous run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ATESTA_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/postgres
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          version: "0.11.32"
      - name: Install
        run: uv sync --all-packages --locked
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Validate framework catalog
        run: uv run python -m apps.api.devtools.preview_catalog
      - name: Module boundaries
        run: uv run lint-imports
      - name: Licences (no GPL or AGPL)
        run: uv run python -m apps.api.devtools.python_licenses
      - name: Tests
        run: uv run pytest -q

  changes:
    # Changelog fragments (changes/README.md). Pull requests only; stdlib, no project install.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          version: "0.11.32"
      - name: Changelog fragment
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          uv run --no-project python -m apps.api.devtools.changes check --base "origin/$BASE_REF" --body "$RUNNER_TEMP/pr-body.md" --author "$PR_AUTHOR"

  secrets:
    # gitleaks (MIT) from its release, checksum-verified; no gitleaks-action (it needs a licence
    # key). Pull requests scan the commits they add; push and schedule scan the whole history.
    # Reviewed non-secrets are listed by fingerprint in .gitleaksignore.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then range="origin/$BASE_REF..HEAD"; else range="--all"; fi
          "$RUNNER_TEMP/gitleaks" git --log-opts="$range" --redact --no-banner .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Build (static export)
        run: pnpm build
      - name: Licenses (no GPL or AGPL)
        run: pnpm check-licenses
      # The operator portal (ADR-017): the same checks, then each export holds only its own screens.
      - name: Portal types
        working-directory: apps/operator-web
        run: pnpm typecheck
      - name: Portal lint
        working-directory: apps/operator-web
        run: pnpm lint
      - name: Portal tests
        working-directory: apps/operator-web
        run: pnpm test
      - name: Portal build (static export)
        working-directory: apps/operator-web
        run: pnpm build
      - name: Portal licenses (no GPL or AGPL)
        working-directory: apps/operator-web
        run: pnpm check-licenses
      - name: Each app ships only its own screens
        working-directory: apps/operator-web
        run: node scripts/check-bundles.ts ../web/out out

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ATESTA_E2E_ADMIN_URL: postgresql+psycopg://postgres@localhost:5432/postgres
      UV_LOCKED: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          version: "0.11.32"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: |
          uv sync --all-packages --locked
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build (static export and CSP hashes)
        run: pnpm build
      - name: e2e (fake Cognito, real API and Postgres, axe)
        run: pnpm exec playwright test --trace off
      - name: Portal build (static export and CSP hashes)
        working-directory: apps/operator-web
        run: pnpm build
      - name: Portal e2e (fake staff pool, real operator API and Postgres, axe)
        working-directory: apps/operator-web
        run: pnpm exec playwright test --trace off

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          version: "0.11.32"
      # uvx ignores the workspace cooldown, so each tool is pinned and gets --exclude-newer.
      - name: Dependency audit (locked runtime dependencies)
        run: |
          uv export --locked --all-packages --no-dev --no-emit-workspace --quiet -o "$RUNNER_TEMP/req.txt"
          uvx --exclude-newer "7 days" pip-audit==2.10.1 --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/req.txt" -f json -o "$RUNNER_TEMP/audit.json" || { jq . "$RUNNER_TEMP/audit.json"; exit 1; }
          jq -e '[.dependencies[].name] | index("fastapi") != null' "$RUNNER_TEMP/audit.json"
      - name: Dependency audit (scanner image)
        run: |
          for f in scanner/requirements.txt scanner/build-requirements.txt; do
            uvx --exclude-newer "7 days" pip-audit==2.10.1 --strict --require-hashes --disable-pip -r "$f"
          done
      - name: Static analysis (semgrep)
        run: uvx --exclude-newer "7 days" --from semgrep==1.184.0 semgrep scan --config auto --error

  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the scanner image
        run: docker build -f scanner/Dockerfile -t atesta-scanner:ci .
      - name: Offline golden
        run: scanner/golden.sh atesta-scanner:ci

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the API and worker images
        run: |
          docker build -f apps/Dockerfile --target api -t atesta-api:ci .
          docker build -f apps/Dockerfile --target worker -t atesta-worker:ci .
      - name: Smoke as ECS runs them (read-only root, user 10001, no capabilities)
        run: |
          locked=(--rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges)
          docker run "${locked[@]}" atesta-api:ci python -c "import atesta_api.main"
          docker run "${locked[@]}" atesta-worker:ci python -c "import atesta_worker.__main__"
          # The customer API image holds no operator service (ADR-017, "Images").
          docker run "${locked[@]}" atesta-api:ci python -c 'import importlib.util, sys; sys.exit(importlib.util.find_spec("atesta_operator") is not None)'
          test "$(docker run "${locked[@]}" atesta-api:ci id -u)" = 10001
      # Scan egress proxy (issue 454): the allowlist must load, and as ECS runs it, an allowed
      # host gets a 200 CONNECT while any other host, or plain HTTP, gets 403.
      - name: Egress proxy, validated and tested as ECS runs it
        run: |
          docker build -f infra/egress/Dockerfile -t atesta-egress:ci .
          locked=(--read-only --tmpfs /tmp --user 10001 --cap-drop ALL --security-opt no-new-privileges)
          docker run --rm "${locked[@]}" atesta-egress:ci --mode validate -c /etc/envoy/envoy.yaml
          docker run -d --name egress "${locked[@]}" -p 127.0.0.1:3128:3128 atesta-egress:ci
          trap 'docker logs egress; docker rm -f egress' EXIT
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:3128/ && break; sleep 1; done
          probe() { curl -s -o /dev/null -x http://127.0.0.1:3128 --max-time 20 "$@" || true; }
          allowed=$(probe -w '%{http_connect}' https://login.microsoftonline.com/)
          denied=$(probe -w '%{http_connect}' https://example.com/)
          plain=$(probe -w '%{http_code}' http://example.com/)
          echo "allowed=$allowed denied=$denied plain=$plain"
          test "$allowed" = 200
          test "$denied" = 403 && test "$plain" = 403

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
      - name: Format
        run: tofu fmt -check -recursive infra
      - name: Validate dev
        working-directory: infra/envs/dev
        run: |
          tofu init -backend=false -input=false
          tofu validate
      - name: Validate prod
        working-directory: infra/envs/prod
        run: |
          tofu init -backend=false -input=false
          tofu validate
      # Plan with the OIDC plan role is added once the dev AWS account exists (AWS postponed).
