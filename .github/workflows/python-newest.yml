name: python-newest

# The newest CPython, weekly and on demand only (owner, 2026-11-23, #266). It is not a required
# check and never runs on a pull request, so a break shows up here on a Monday and never blocks a
# merge. Its uv is the image's (apps/Dockerfile): the ci.yml jobs' pinned uv predates this Python.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-newest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ATESTA_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/postgres
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          version: "0.13.9"
      - name: Install
        run: uv sync --all-packages --locked
      - name: Interpreter
        run: uv run python --version
      - name: Tests
        run: uv run pytest -q
