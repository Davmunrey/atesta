[project]
name = "atesta"
version = "0.0.0"
description = "Atesta workspace root"
requires-python = ">=3.12"

[tool.uv]
package = false
# Supply-chain cooldown: never resolve package versions published in the last 7 days.
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/core", "scanner"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "import-linter>=2.15",  # protected contracts and module wildcards
    "httpx>=0.27",
    "types-pyyaml>=6.0.12.20261103",
    "python-multipart>=0.0.20",
    "python-hcl2>=4.3",
    "py-ocsf-models==0.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and fake token literals

[tool.mypy]
strict = true
python_version = "3.12"
files = [
    "apps/api/src",
    "apps/api/devtools",
    "apps/worker/src",
    "packages/core/src",
    "scanner/atesta_scanner",
    "scanner/tools",
]
mypy_path = ["apps/api/src", "apps/worker/src", "packages/core/src", "scanner"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = [
    "apps/api/tests",
    "apps/worker/tests",
    "packages/core/tests",
    "scanner/tests",
    "infra/tests",
]
# A deprecated SQLAlchemy call fails the suite, so the next upgrade cannot break it silently.
filterwarnings = ["error::sqlalchemy.exc.SADeprecationWarning"]

[tool.importlinter]
root_packages = ["atesta_api", "atesta_worker"]

[[tool.importlinter.contracts]]
name = "Modules talk only through their public api.py"
type = "independence"
modules = ["atesta_api.modules.*"]  # every module, including ones added later
ignore_imports = [
    "atesta_api.modules.** -> atesta_api.modules.*.api",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Jobs call modules only through their api.py (rule 8)"
type = "forbidden"
source_modules = ["atesta_worker"]
forbidden_modules = ["atesta_api.modules", "atesta_api.main"]
allow_indirect_imports = "True"
ignore_imports = ["atesta_worker.** -> atesta_api.modules.*.api"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Shared kernel imports no module (ADR-008)"
type = "forbidden"
source_modules = ["atesta_api.platform"]
forbidden_modules = ["atesta_api.modules", "atesta_api.main"]

# Protected: only identity may import tenancy directly, wherever the importer lives (main,
# platform, any module, a new top-level file). Going through identity.api stays legal.
[[tool.importlinter.contracts]]
name = "Only identity sets tenant context (ADR-012)"
type = "protected"
protected_modules = ["atesta_api.platform.tenancy"]
allowed_importers = ["atesta_api.modules.identity"]
