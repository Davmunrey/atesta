[project]
name = "atesta"
version = "0.0.0"
description = "Atesta workspace root"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/core"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "import-linter>=2.1",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["apps/api/src", "packages/core/src"]
mypy_path = ["apps/api/src", "packages/core/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/core/tests"]

[tool.importlinter]
root_packages = ["atesta_api"]

[[tool.importlinter.contracts]]
name = "Modules talk only through their public api.py"
type = "independence"
modules = [
    "atesta_api.modules.identity",
    "atesta_api.modules.connections",
    "atesta_api.modules.scanning",
    "atesta_api.modules.compliance",
    "atesta_api.modules.evidence",
    "atesta_api.modules.ai",
    "atesta_api.modules.billing",
]
ignore_imports = [
    "atesta_api.modules.** -> atesta_api.modules.*.api",
]
unmatched_ignore_imports_alerting = "none"
