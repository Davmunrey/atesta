id: ctl.device_management
title_es: "Gestión de dispositivos"
title_en: "Device management"
description_es: |
  Preparar: decide qué dispositivos pueden acceder (corporativos, gestionados, personales) y cómo se inscriben.
  1. Marca como no conformes los dispositivos sin política de cumplimiento y exige dispositivo gestionado o conforme para acceder.
  2. Restringe quién une dispositivos, limita cuántos por persona, activa LAPS y evita que quien los registra sea administrador local.
  3. Limita la sincronización y el acceso de escritorio desde equipos no gestionados.
  Evidencia: políticas de cumplimiento y de acceso, configuración de registro y resultado del escaneo.
  Límite: los checks no inventarían los equipos ni comprueban su cifrado o parches; eso sigue siendo manual.
description_en: |
  Prepare: decide which devices may connect (corporate, managed, personal) and how they enrol.
  1. Mark devices without a compliance policy as not compliant, and require a managed or compliant device for access.
  2. Restrict who can join devices, limit how many per person, turn on LAPS, and keep the registering user from becoming local administrator.
  3. Limit sync and desktop access from unmanaged devices.
  Evidence: compliance and access policies, registration settings and the scan result.
  Limit: the checks do not inventory the devices or check their encryption or patches; that stays manual.
manual: false
