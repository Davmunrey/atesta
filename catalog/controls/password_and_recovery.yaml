id: ctl.password_and_recovery
title_es: "Contraseñas, bloqueo y recuperación de cuentas"
title_en: "Passwords, lockout and account recovery"
description_es: |
  Preparar: define la política de contraseñas y de recuperación de cuentas.
  1. Evita la caducidad forzada sin motivo, aplica la lista de contraseñas prohibidas y un bloqueo inteligente razonable.
  2. En Google Workspace, exige contraseñas robustas y revisa la recuperación de cuentas y la Protección Avanzada para perfiles de riesgo.
  Evidencia: configuración de contraseñas y bloqueo, y resultado del escaneo.
  Límite: la política de contraseñas no sustituye a la MFA; revisa también la medida de autenticación de usuarios.
description_en: |
  Prepare: define the password and account recovery policy.
  1. Avoid forced expiry without cause, enforce the banned password list and a reasonable smart lockout.
  2. In Google Workspace, require strong passwords and review account recovery and Advanced Protection for high-risk profiles.
  Evidence: password and lockout settings, and the scan result.
  Limit: a password policy does not replace MFA; review the user authentication measure too.
manual: false
prowler_checks:
  - admincenter_settings_password_never_expire
  - entra_password_protection_custom_banned_list_enforced
  - entra_password_protection_lockout_duration_configured
  - entra_password_protection_lockout_threshold_limited
  - security_password_policy_strong
  - security_user_recovery_enabled
  - security_advanced_protection_configured
atesta_checks: []
