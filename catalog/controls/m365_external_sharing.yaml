id: ctl.m365_external_sharing
title_es: "Compartición externa e invitados en Microsoft 365"
title_en: "External sharing and guests in Microsoft 365"
description_es: |
  Preparar: decide con quién se comparte información fuera de la organización y qué dominios están permitidos.
  1. En SharePoint y OneDrive, limita la compartición externa a invitados existentes o a dominios permitidos, e impide que los invitados vuelvan a compartir lo que no es suyo.
  2. En Microsoft Entra, restringe quién puede invitar, a qué dominios y qué ven los invitados del directorio.
  3. Restringe el acceso saliente entre inquilinos por defecto y mantén privados los grupos de Microsoft 365.
  Evidencia: configuración de compartición, lista de dominios permitidos y resultado del escaneo.
  Límite: los checks no revisan cada sitio ni cada enlace ya compartido; esa revisión sigue siendo manual.
description_en: |
  Prepare: decide who information is shared with outside the organization and which domains are allowed.
  1. In SharePoint and OneDrive, limit external sharing to existing guests or allowed domains, and stop guests from resharing items they do not own.
  2. In Microsoft Entra, restrict who can invite, to which domains, and what guests can see in the directory.
  3. Restrict default outbound cross-tenant access and keep Microsoft 365 groups private.
  Evidence: sharing settings, the allowed domain list and the scan result.
  Limit: the checks do not review each site or each link already shared; that review stays manual.
manual: false
