id: ctl.privileged_accounts
title_es: "Cuentas privilegiadas en Microsoft 365 y Google Workspace"
title_en: "Privileged accounts in Microsoft 365 and Google Workspace"
description_es: |
  Preparar: inventaria las cuentas con roles de administración global o superadministración, quién las usa y para qué.
  1. Mantén entre dos y cuatro administradores globales o superadministradores, dedicados a esa función y sin uso diario.
  2. Exige autenticación resistente al phishing (llaves FIDO2) a las cuentas privilegiadas y a las de emergencia, y desactiva la recuperación de contraseña por autoservicio para ellas.
  3. En Microsoft Entra, activa la aprobación en PIM para los roles más críticos; revisa que las cuentas de administración sean solo de nube.
  4. En Defender XDR, comprueba que no haya credenciales de cuentas privilegiadas expuestas en equipos vulnerables.
  Evidencia: lista de cuentas privilegiadas con su responsable, configuración de PIM o equivalente y resultado del escaneo.
  Límite: los checks miran la configuración del inquilino, no si cada administrador la usa bien. La revisión periódica de quién tiene el rol sigue siendo manual. El paso 4 no se escanea: el check necesita un permiso que Atesta no solicita. Aporta evidencia documental.
description_en: |
  Prepare: list the accounts with global administrator or super administrator roles, who uses them and why.
  1. Keep between two and four global or super administrators, dedicated to that role and not used for daily work.
  2. Require phishing-resistant authentication (FIDO2 keys) for privileged and emergency accounts, and turn off self-service password reset for them.
  3. In Microsoft Entra, require approval in PIM for the most critical roles; check that administrator accounts are cloud-only.
  4. In Defender XDR, check that no privileged account credentials are exposed on vulnerable endpoints.
  Evidence: list of privileged accounts with their owner, the PIM or equivalent settings, and the scan result.
  Limit: the checks read tenant settings, not whether each administrator uses them well. Reviewing who holds each role stays manual. Step 4 is not scanned: the check needs a permission Atesta never requests. Provide documentary evidence.
manual: false
prowler_checks:
