id: ctl.directory_governance
title_es: "Gobierno del directorio en Microsoft Entra"
title_en: "Directory governance in Microsoft Entra"
description_es: |
  Preparar: decide quién crea grupos e inquilinos y cómo se revisan los invitados y los roles privilegiados.
  1. Limita la creación de grupos de Microsoft 365, grupos de seguridad e inquilinos a administradores.
  2. Programa revisiones de acceso para invitados y roles privilegiados; usa grupos dinámicos para invitados sin la regla memberOf.
  3. Restringe los portales de administración y aprueba la clasificación de activos críticos en Defender XDR.
  Evidencia: configuración del directorio, revisiones programadas y resultado del escaneo.
  Límite: que exista una revisión de acceso programada no prueba que se haga; regístralas en Revisiones de acceso.
description_en: |
  Prepare: decide who creates groups and tenants and how guests and privileged roles are reviewed.
  1. Limit creation of Microsoft 365 groups, security groups and tenants to administrators.
  2. Schedule access reviews for guests and privileged roles; use dynamic groups for guests without the memberOf rule.
  3. Restrict the admin portals and approve critical asset classification in Defender XDR.
  Evidence: directory settings, scheduled reviews and the scan result.
  Limit: a scheduled access review does not show it is done; record them in Access reviews.
manual: false
