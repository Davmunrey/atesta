id: ctl.conditional_access_coverage
title_es: "Cobertura del acceso condicional en Microsoft Entra"
title_en: "Conditional Access coverage in Microsoft Entra"
description_es: |
  Preparar: inventaria las políticas de acceso condicional, sus exclusiones y las cuentas de emergencia.
  1. Asegura que alguna política cubre todas las aplicaciones y todas las personas, y que cada exclusión queda cubierta por otra política.
  2. Retira referencias a usuarios, grupos o roles eliminados y protege los grupos usados en las políticas.
  3. Bloquea ubicaciones no confiables, plataformas desconocidas y la transferencia de autenticación; exige MFA para la API de administración.
  Evidencia: exportación de políticas, lista de exclusiones justificadas y resultado del escaneo.
  Límite: algunos checks dependen de licencias o de servicios que puede que no uséis; documenta por qué no aplican.
description_en: |
  Prepare: list the Conditional Access policies, their exclusions and the emergency accounts.
  1. Make sure some policy covers all apps and all users, and that every exclusion is covered by another policy.
  2. Remove references to deleted users, groups or roles, and protect the groups the policies use.
  3. Block untrusted locations, unknown platforms and authentication transfer; require MFA for the management API.
  Evidence: policy export, the list of justified exclusions and the scan result.
  Limit: some checks depend on licences or on services you may not use; document why they do not apply.
