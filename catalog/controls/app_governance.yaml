id: ctl.app_governance
title_es: "Gobierno de aplicaciones e integraciones"
title_en: "App and integration governance"
description_es: |
  Preparar: lista las aplicaciones registradas, las de terceros y quién puede autorizarlas.
  1. Impide que las personas usuarias consientan aplicaciones o registren las suyas; limita el acceso de apps de terceros y del Marketplace.
  2. Revisa credenciales de aplicaciones y principales de servicio: sin secretos de cliente, sin permisos privilegiados sin usar, sin propietarios en roles críticos.
  3. Retira accesos heredados (módulo MSOnline, autenticación no moderna, POP/IMAP) y los webhooks entrantes de Chat.
  Evidencia: inventario de aplicaciones, configuración de consentimiento y resultado del escaneo.
  Límite: un PASS no revisa qué hace cada aplicación con los datos; esa evaluación es manual.
description_en: |
  Prepare: list the registered apps, the third-party ones, and who may authorise them.
  1. Stop users from consenting to apps or registering their own; limit access for third-party and Marketplace apps.
  2. Review credentials of apps and service principals: no client secrets, no unused privileged permissions, no owners on critical roles.
  3. Remove legacy access (MSOnline module, non-modern authentication, POP/IMAP) and incoming Chat webhooks.
  Evidence: the app inventory, consent settings and the scan result.
  Limit: a PASS does not review what each app does with data; that assessment is manual.
manual: false
prowler_checks:
  - entra_app_registration_client_secret_unused
  - entra_app_registration_no_unused_privileged_permissions
  - entra_app_registration_redirect_uris_secure
