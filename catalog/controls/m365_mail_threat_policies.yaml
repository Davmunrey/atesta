id: ctl.m365_mail_threat_policies
title_es: "Directivas de protección del correo en Microsoft 365"
title_en: "Mail threat policies in Microsoft 365"
description_es: |
  Preparar: confirma la licencia de Defender para Office 365 y quién administra las directivas de correo de Exchange Online.
  1. Configura antiphishing, antispam (entrada, salida y filtro de conexión) y antimalware con el filtro de adjuntos comunes; valora la directiva predefinida estricta y las cuentas prioritarias.
  2. Activa DKIM en cada dominio, Datos adjuntos seguros, Vínculos seguros y ZAP para Teams; envía los informes de las personas usuarias a un buzón propio.
  3. Bloquea el reenvío externo y el envío directo, no saltes el filtrado con reglas de flujo, etiqueta a los remitentes externos y activa las sugerencias de correo (MailTips).
  Evidencia: directivas efectivas, dominios con DKIM y resultado del escaneo.
  Límite: los checks miran la configuración, no los mensajes entregados. Depende de PowerShell, excluido de la recogida actual: no hay resultado hasta que se conceda; ausencia de datos no significa correcto.
description_en: |
  Prepare: confirm the Defender for Office 365 licence and who manages Exchange Online mail policies.
  1. Configure anti-phishing, anti-spam (inbound, outbound and connection filter) and anti-malware with the common attachments filter; consider the strict preset policy and priority accounts.
  2. Turn on DKIM for every domain, Safe Attachments, Safe Links and ZAP for Teams; send user reports to your own mailbox.
  3. Block external forwarding and Direct Send, do not bypass filtering with mail flow rules, tag external senders and turn on MailTips.
  Evidence: effective policies, domains with DKIM and the scan result.
  Limit: the checks read settings, not delivered messages. It needs PowerShell, excluded from current collection: there is no result until it is granted; missing data never means correct.
manual: false
prowler_checks:
  - defender_antiphishing_policy_configured
  - defender_antispam_connection_filter_policy_empty_ip_allowlist
  - defender_antispam_connection_filter_policy_safe_list_off
  - defender_antispam_outbound_policy_configured
  - defender_antispam_outbound_policy_forwarding_disabled
  - defender_antispam_policy_inbound_no_allowed_domains
  - defender_atp_safe_attachments_and_docs_configured
  - defender_chat_report_policy_configured
  - defender_domain_dkim_enabled
  - defender_malware_policy_common_attachments_filter_enabled
  - defender_malware_policy_comprehensive_attachments_filter_applied
  - defender_malware_policy_notifications_internal_users_malware_enabled
  - defender_priority_account_protection_enabled
  - defender_safe_attachments_policy_enabled
  - defender_safelinks_policy_enabled
  - defender_strict_preset_security_policy_enabled
  - defender_zap_for_teams_enabled
  - exchange_external_email_tagging_enabled
  - exchange_organization_mailtips_enabled
  - exchange_organization_reject_direct_send_enabled
  - exchange_transport_rules_mail_forwarding_disabled
  - exchange_transport_rules_whitelist_disabled
atesta_checks: []
