id: ctl.workspace_collaboration
title_es: "Colaboración externa en Google Workspace"
title_en: "External collaboration in Google Workspace"
description_es: |
  Preparar: decide qué se comparte fuera (Drive, Calendar, Chat, Grupos, Sites) y con qué dominios.
  1. Avisa al compartir fuera, impide publicar en la web y limita quién distribuye contenido y crea unidades compartidas.
  2. Restringe Chat, Calendar y Grupos externos; desactiva Sites si no se usa.
  3. Configura reglas DLP para Drive, desactiva la delegación de correo y las pasarelas de salida por usuario, y conserva el correo de forma completa.
  Evidencia: configuración de uso compartido por servicio, reglas DLP y resultado del escaneo.
  Límite: los checks miran la configuración, no los archivos ya compartidos; revisa esos enlaces aparte. No se escanean los ajustes por unidad compartida ni las reglas DLP de Drive: esos checks piden un token de licencias sin variante de solo lectura. Aporta evidencia documental.
description_en: |
  Prepare: decide what is shared outside (Drive, Calendar, Chat, Groups, Sites) and with which domains.
  1. Warn when sharing outside, stop publishing to the web, and limit who distributes content and creates shared drives.
  2. Restrict external Chat, Calendar and Groups; turn off Sites if unused.
  3. Configure DLP rules for Drive, turn off mail delegation and per-user outbound gateways, and keep comprehensive mail storage.
  Evidence: sharing settings per service, DLP rules and the scan result.
  Limit: the checks read settings, not files already shared; review those links separately. Per-shared-drive settings and Drive DLP rules are not scanned: those checks ask for a licensing token with no read-only variant. Provide documentary evidence.
manual: false
prowler_checks:
  - additionalservices_external_groups_disabled
  - calendar_external_invitations_warning
  - calendar_external_sharing_primary_calendar
  - calendar_external_sharing_secondary_calendar
