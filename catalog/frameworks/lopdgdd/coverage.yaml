  status: excluded
  reason_es: 'Garantía de los derechos digitales: derechos de las personas en entornos digitales y laborales.
    Fuera de este marco; algunos (por ejemplo, el artículo 87 sobre dispositivos digitales en el trabajo)
    pueden importarse aparte.'
