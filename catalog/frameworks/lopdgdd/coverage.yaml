  status: excluded
  reason_es: 'Corresponsables y representantes de responsables no establecidos en la Unión: reparto de
    responsabilidad, no medidas de seguridad.'
  reason_en: 'Joint controllers and representatives of controllers not established in the Union: allocation
    of responsibility, not security measures.'
