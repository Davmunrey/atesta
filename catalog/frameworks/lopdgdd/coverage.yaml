  reason_es: 'Delegado de protección de datos, códigos de conducta y certificación: gobierno de la protección
    de datos; pendiente de una importación propia.'
  reason_en: 'Data protection officer, codes of conduct and certification: data protection governance;
    awaiting its own import.'
