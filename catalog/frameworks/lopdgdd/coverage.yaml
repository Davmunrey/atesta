  status: excluded
  reason_es: 'Bases jurídicas, consentimiento, categorías especiales, transparencia, derechos de las personas
    y tratamientos concretos: protección de datos más allá de la seguridad del tratamiento. Fuera de este
    marco.'
  reason_en: 'Legal bases, consent, special categories, transparency, data subject rights and specific
    processing: data protection beyond security of processing. Outside this framework.'
