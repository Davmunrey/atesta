requirements:
- id: art5
  title_es: Deber de confidencialidad · artículo 5
  title_en: null
  applies_to: []
  source: https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673#a5
  attributes:
    official_text_es: '1. Los responsables y encargados del tratamiento de datos así como todas las personas
      que intervengan en cualquier fase de este estarán sujetas al deber de confidencialidad al que se
      refiere el artículo 5.1.f) del Reglamento (UE) 2016/679.


      2. La obligación general señalada en el apartado anterior será complementaria de los deberes de
      secreto profesional de conformidad con su normativa aplicable.


      3. Las obligaciones establecidas en los apartados anteriores se mantendrán aun cuando hubiese finalizado
      la relación del obligado con el responsable o encargado del tratamiento.'
    section: Artículo 5
    source_sha256: 608fa7df3509d0148b8fe3fe28bf9458bb0d74cc8d5d4dbc048792e2679a508f
- id: art28
  title_es: Obligaciones generales del responsable y encargado del tratamiento · artículo 28
  title_en: null
  applies_to: []
  source: https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673#a2-10
  attributes:
    official_text_es: '1. Los responsables y encargados, teniendo en cuenta los elementos enumerados en
      los artículos 24 y 25 del Reglamento (UE) 2016/679, determinarán las medidas técnicas y organizativas
      apropiadas que deben aplicar a fin de garantizar y acreditar que el tratamiento es conforme con
      el citado reglamento, con la presente ley orgánica, sus normas de desarrollo y la legislación sectorial
      aplicable. En particular valorarán si procede la realización de la evaluación de impacto en la protección
      de datos y la consulta previa a que se refiere la Sección 3 del Capítulo IV del citado reglamento.


      2. Para la adopción de las medidas a que se refiere el apartado anterior los responsables y encargados
      del tratamiento tendrán en cuenta, en particular, los mayores riesgos que podrían producirse en
      los siguientes supuestos:


      a) Cuando el tratamiento pudiera generar situaciones de discriminación, usurpación de identidad
      o fraude, pérdidas financieras, daño para la reputación, pérdida de confidencialidad de datos sujetos
      al secreto profesional, reversión no autorizada de la seudonimización o cualquier otro perjuicio
      económico, moral o social significativo para los afectados.


      b) Cuando el tratamiento pudiese privar a los afectados de sus derechos y libertades o pudiera impedirles
      el ejercicio del control sobre sus datos personales.


      c) Cuando se produjese el tratamiento no meramente incidental o accesorio de las categorías especiales
      de datos a las que se refieren los artículos 9 y 10 del Reglamento (UE) 2016/679 y 9 y 10 de esta
      ley orgánica o de los datos relacionados con la comisión de infracciones administrativas.


      d) Cuando el tratamiento implicase una evaluación de aspectos personales de los afectados con el
      fin de crear o utilizar perfiles personales de los mismos, en particular mediante el análisis o
      la predicción de aspectos referidos a su rendimiento en el trabajo, su situación económica, su salud,
      sus preferencias o intereses personales, su fiabilidad o comportamiento, su solvencia financiera,
      su localización o sus movimientos.


      e) Cuando se lleve a cabo el tratamiento de datos de grupos de afectados en situación de especial
      vulnerabilidad y, en particular, de menores de edad y personas con discapacidad.


      f) Cuando se produzca un tratamiento masivo que implique a un gran número de afectados o conlleve
      la recogida de una gran cantidad de datos personales.


      g) Cuando los datos personales fuesen a ser objeto de transferencia, con carácter habitual, a terceros
      Estados u organizaciones internacionales respecto de los que no se hubiese declarado un nivel adecuado
      de protección.


      h) Cualesquiera otros que a juicio del responsable o del encargado pudieran tener relevancia y en
      particular aquellos previstos en códigos de conducta y estándares definidos por esquemas de certificación.'
    section: Artículo 28
    source_sha256: b4659ace80447bed94dec477a9b4138fd91ae423053902124d28c75efdcd5009
- id: art31
  title_es: Registro de las actividades de tratamiento · artículo 31
  title_en: null
  applies_to: []
  source: https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673#a3-3
  attributes:
    official_text_es: '1. Los responsables y encargados del tratamiento o, en su caso, sus representantes
      deberán mantener el registro de actividades de tratamiento al que se refiere el artículo 30 del
      Reglamento (UE) 2016/679, salvo que sea de aplicación la excepción prevista en su apartado 5.


      El registro, que podrá organizarse en torno a conjuntos estructurados de datos, deberá especificar,
      según sus finalidades, las actividades de tratamiento llevadas a cabo y las demás circunstancias
      establecidas en el citado reglamento.


      Cuando el responsable o el encargado del tratamiento hubieran designado un delegado de protección
      de datos deberán comunicarle cualquier adición, modificación o exclusión en el contenido del registro.


      2. Los sujetos enumerados en el artículo 77.1 de esta ley orgánica harán público un inventario de
      sus actividades de tratamiento accesible por medios electrónicos en el que constará la información
      establecida en el artículo 30 del Reglamento (UE) 2016/679 y su base legal.'
    section: Artículo 31
    source_sha256: 27f0fef17c9592ef2a54d10bfbd209064de43fda25e5df6719c20d1e3373ebd0
- id: art32
  title_es: Bloqueo de los datos · artículo 32
  title_en: null
  applies_to: []
  source: https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673#a3-4
  attributes:
    official_text_es: '1. El responsable del tratamiento estará obligado a bloquear los datos cuando proceda
      a su rectificación o supresión.


      2. El bloqueo de los datos consiste en la identificación y reserva de los mismos, adoptando medidas
      técnicas y organizativas, para impedir su tratamiento, incluyendo su visualización, excepto para
      la puesta a disposición de los datos a los jueces y tribunales, el Ministerio Fiscal o las Administraciones
      Públicas competentes, en particular de las autoridades de protección de datos, para la exigencia
      de posibles responsabilidades derivadas del tratamiento y solo por el plazo de prescripción de las
      mismas.


      Transcurrido ese plazo deberá procederse a la destrucción de los datos.


      3. Los datos bloqueados no podrán ser tratados para ninguna finalidad distinta de la señalada en
      el apartado anterior.


      4. Cuando para el cumplimiento de esta obligación, la configuración del sistema de información no
      permita el bloqueo o se requiera una adaptación que implique un esfuerzo desproporcionado, se procederá
      a un copiado seguro de la información de modo que conste evidencia digital, o de otra naturaleza,
      que permita acreditar la autenticidad de la misma, la fecha del bloqueo y la no manipulación de
      los datos durante el mismo.


      5. La Agencia Española de Protección de Datos y las autoridades autonómicas de protección de datos,
      dentro del ámbito de sus respectivas competencias, podrán fijar excepciones a la obligación de bloqueo
      establecida en este artículo, en los supuestos en que, atendida la naturaleza de los datos o el
      hecho de que se refieran a un número particularmente elevado de afectados, su mera conservación,
      incluso bloqueados, pudiera generar un riesgo elevado para los derechos de los afectados, así como
      en aquellos casos en los que la conservación de los datos bloqueados pudiera implicar un coste desproporcionado
      para el responsable del tratamiento.'
    section: Artículo 32
    source_sha256: 329b0152c90ef6068c8b7c8a701ec66587a968f29eac4465f3c38fa225a8318e
- id: art33
  title_es: Encargado del tratamiento · artículo 33
  title_en: null
  applies_to: []
  source: https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673#a3-5
  attributes:
    official_text_es: '1. El acceso por parte de un encargado de tratamiento a los datos personales que
      resulten necesarios para la prestación de un servicio al responsable no se considerará comunicación
      de datos siempre que se cumpla lo establecido en el Reglamento (UE) 2016/679, en la presente ley
      orgánica y en sus normas de desarrollo.


      2. Tendrá la consideración de responsable del tratamiento y no la de encargado quien en su propio
      nombre y sin que conste que actúa por cuenta de otro, establezca relaciones con los afectados aun
      cuando exista un contrato o acto jurídico con el contenido fijado en el artículo 28.3 del Reglamento
      (UE) 2016/679. Esta previsión no será aplicable a los encargos de tratamiento efectuados en el marco
      de la legislación de contratación del sector público.


      Tendrá asimismo la consideración de responsable del tratamiento quien figurando como encargado utilizase
      los datos para sus propias finalidades.


      3. El responsable del tratamiento determinará si, cuando finalice la prestación de los servicios
      del encargado, los datos personales deben ser destruidos, devueltos al responsable o entregados,
      en su caso, a un nuevo encargado.


      No procederá la destrucción de los datos cuando exista una previsión legal que obligue a su conservación,
      en cuyo caso deberán ser devueltos al responsable, que garantizará su conservación mientras tal
      obligación persista.


      4. El encargado del tratamiento podrá conservar, debidamente bloqueados, los datos en tanto pudieran
      derivarse responsabilidades de su relación con el responsable del tratamiento.


      5. En el ámbito del sector público podrán atribuirse las competencias propias de un encargado del
      tratamiento a un determinado órgano de la Administración General del Estado, la Administración de
      las comunidades autónomas, las Entidades que integran la Administración Local o a los Organismos
      vinculados o dependientes de las mismas mediante la adopción de una norma reguladora de dichas competencias,
      que deberá incorporar el contenido exigido por el artículo 28.3 del Reglamento (UE) 2016/679.'
    section: Artículo 33
    source_sha256: b95c9dbb860f7e92f07b7293fb93e213dcee81117d40dd76190c364c682c2304
- id: da1
  title_es: Medidas de seguridad en el ámbito del sector público · disposición adicional primera
  title_en: null
  applies_to: []
  source: https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673#da
  attributes:
    official_text_es: '1. El Esquema Nacional de Seguridad incluirá las medidas que deban implantarse
      en caso de tratamiento de datos personales para evitar su pérdida, alteración o acceso no autorizado,
      adaptando los criterios de determinación del riesgo en el tratamiento de los datos a lo establecido
      en el artículo 32 del Reglamento (UE) 2016/679.


      2. Los responsables enumerados en el artículo 77.1 de esta ley orgánica deberán aplicar a los tratamientos
      de datos personales las medidas de seguridad que correspondan de las previstas en el Esquema Nacional
      de Seguridad, así como impulsar un grado de implementación de medidas equivalentes en las empresas
      o fundaciones vinculadas a los mismos sujetas al Derecho privado.


      En los casos en los que un tercero preste un servicio en régimen de concesión, encomienda de gestión
      o contrato, las medidas de seguridad se corresponderán con las de la Administración pública de origen
      y se ajustarán al Esquema Nacional de Seguridad.'
    section: Disposición adicional primera
    source_sha256: 4548966bdeccfd0a0da12545adf4edcc804e7b9c01fdd9545717db503f382b24
