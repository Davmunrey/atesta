- id: t2c4.art25
  title_es: Pruebas de los planes de continuidad de la actividad en materia de TIC · artículo 25
  title_en: Testing of the ICT business continuity plans · Article 25
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_25
  attributes:
    official_text_es: '1. Al someter a prueba los planes de continuidad de la actividad en materia de
      TIC de conformidad con el artículo 11, apartado 6, del Reglamento (UE) 2022/2554, las entidades
      financieras tendrán en cuenta su análisis de impacto en el negocio y la evaluación del riesgo relacionado
      con las TIC a que se refiere el artículo 3, apartado 1, letra b), del presente Reglamento.


      2. Las entidades financieras, mediante las pruebas de los planes de continuidad de la actividad
      en materia de TIC a que se refiere el apartado 1, evaluarán si dichos planes son capaces de garantizar
      la continuidad de sus funciones esenciales o importantes. Dichas pruebas:


      a) se llevarán a cabo sobre la base de escenarios de prueba que simulen posibles perturbaciones,
      incluido un conjunto adecuado de escenarios graves pero verosímiles;


      b) comprenderán, en su caso, el sometimiento a prueba de los servicios de TIC prestados por proveedores
      terceros de servicios de TIC;


      c) en el caso de las entidades financieras que no sean microempresas, tal como se contempla en el
      artículo 11, apartado 6, párrafo segundo, del Reglamento (UE) 2022/2554, comprenderán escenarios
      de conmutación entre la infraestructura primaria de TIC y la capacidad redundante, las copias de
      seguridad y las instalaciones redundantes;


      d) estarán diseñadas para poner en cuestión las hipótesis en las que se basen los planes de continuidad
      de la actividad, incluidos los mecanismos de gobernanza y los planes de comunicación de crisis;


      e) incluirán procedimientos para verificar la capacidad del personal de las entidades financieras,
      los proveedores terceros de servicios de TIC, los sistemas de TIC y los servicios de TIC para responder
      de forma adecuada ante los escenarios que han de tenerse debidamente en cuenta de conformidad con
      el artículo 26, apartado 2.


      A efectos de la letra a), las entidades financieras incluirán siempre en las pruebas los escenarios
      que se hayan tomado en consideración a la hora de elaborar los planes de continuidad de la actividad.


      A efectos de la letra b), las entidades financieras tomarán debidamente en consideración los escenarios
      vinculados a la insolvencia u otros fallos de los proveedores terceros de servicios de TIC o vinculados
      a riesgos políticos en los países o territorios de tales proveedores, en su caso.


      A efectos de la letra c), las pruebas verificarán si al menos las funciones esenciales o importantes
      pueden desempeñarse adecuadamente durante un período de tiempo suficiente y si es posible restablecer
      el funcionamiento normal.


      3. Además de los requisitos a que se refiere el apartado 2, las entidades de contrapartida central
      asociarán a las pruebas de los planes de continuidad de la actividad en materia de TIC a que se
      refiere el apartado 1 a:


      a) los miembros compensadores;


      b) los proveedores externos;


      c) las entidades pertinentes de la infraestructura financiera con respecto a las cuales hayan determinado
      la existencia de interdependencias en el marco de su política de continuidad de la actividad.


      4. Además de los requisitos a que se refiere el apartado 2, los depositarios centrales de valores
      asociarán a las pruebas de los planes de continuidad de la actividad en materia de TIC a que se
      refiere el apartado 1, según proceda, a:


      a) sus usuarios;


      b) los prestadores de servicios esenciales;


      c) otros depositarios centrales de valores;


      d) otras infraestructuras del mercado;


      e) otras entidades con respecto a las cuales hayan determinado la existencia de interdependencias
      en el marco de su política de continuidad de la actividad.


      5. Las entidades financieras documentarán los resultados de las pruebas a que se refiere el apartado
      1. Toda deficiencia detectada en las pruebas será objeto de análisis, tratamiento y comunicación
      al órgano de dirección.'
    official_text_en: '1. When testing the ICT business continuity plans in accordance with Article 11(6),
      of Regulation (EU) 2022/2554, financial entities shall take into account the financial entity’s
      business impact analysis (BIA) and the ICT risk assessment referred to in Article 3(1), point (b),
      of this Regulation.


      2. Financial entities shall assess through the testing of their ICT business continuity plans referred
      to in paragraph 1 whether they are able to ensure the continuity of the financial entity’s critical
      or important functions. That testing shall:


      (a) be performed on the basis of test scenarios that simulate potential disruptions, including an
      adequate set of severe but plausible scenarios;


      (b) contain the testing of ICT services provided by ICT third-party service providers, where applicable;


      (c) for financial entities, other than microenterprises, as referred to in Article 11(6), second
      subparagraph, of Regulation (EU) 2022/2554, contain scenarios of switchover from primary ICT infrastructure
      to the redundant capacity, backups and redundant facilities;


      (d) be designed to challenge the assumptions on which the business continuity plans are based, including
      governance arrangements and crisis communication plans;


      (e) contain procedures to verify the ability of the financial entities’ staff, of ICT third-party
      service providers, of ICT systems, and ICT services to respond adequately to the scenarios duly
      taken into account in accordance with Article 26(2).


      For the purposes of point (a), financial entities shall always include in the testing the scenarios
      considered for the development of the business continuity plans.


      For the purposes of point (b), financial entities shall duly consider scenarios linked to insolvency
      or failures of the ICT third-party service providers or linked to political risks in the ICT third-party
      service providers’ jurisdictions, where relevant.


      For the purposes of point (c), the testing shall verify whether at least critical or important functions
      can be operated appropriately for a sufficient period of time, and whether the normal functioning
      may be restored.


      3. In addition to the requirements referred to in paragraph 2, central counterparties shall involve
      in the testing of their ICT business continuity plans referred to in paragraph 1:


      (a) clearing members;


      (b) external providers;


      (c) relevant institutions in the financial infrastructure with which central counterparties have
      identified interdependencies in their business continuity policies.


      4. In addition to the requirements referred to in paragraph 2, central securities depositories shall
      involve in the testing of their ICT business continuity plans referred to in paragraph 1, as appropriate:


      (a) users of the central securities depositories;


      (b) critical utilities and critical service providers;


      (c) other central securities depositories;


      (d) other market infrastructures;


      (e) any other institutions with which central securities depositories have identified interdependencies
      in their business continuity policy.


      5. Financial entities shall document the results of the testing referred to in paragraph 1. Any
      identified deficiencies resulting from that testing shall be analysed, addressed, and reported to
      the management body.'
