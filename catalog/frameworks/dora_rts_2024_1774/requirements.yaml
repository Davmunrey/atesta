- id: t2c4.art26
  title_es: Planes de respuesta y recuperación en materia de TIC · artículo 26
  title_en: ICT response and recovery plans · Article 26
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_26
  attributes:
    official_text_es: '1. Al elaborar los planes de respuesta y recuperación en materia de TIC a que se
      refiere el artículo 11, apartado 3, del Reglamento (UE) 2022/2554, las entidades financieras tendrán
      en cuenta los resultados de su análisis de impacto en el negocio. Dichos planes de respuesta y recuperación
      en materia de TIC:


      a) especificarán las condiciones que motivarán su activación o desactivación, así como toda excepción
      a dicha activación o desactivación;


      b) describirán las medidas que deben adoptarse para garantizar la disponibilidad, integridad, continuidad
      y recuperación de, al menos, los sistemas y servicios de TIC que sustenten funciones esenciales
      o importantes de la entidad financiera;


      c) estarán concebidos para cumplir los objetivos de recuperación de las operaciones de las entidades
      financieras;


      d) se documentarán y pondrán a disposición del personal que participe en su ejecución y serán fácilmente
      accesibles en caso de emergencia;


      e) contemplarán opciones de recuperación tanto a corto como a largo plazo, incluida la recuperación
      parcial de los sistemas;


      f) establecerán los objetivos que persiguen y las condiciones para considerar que se han ejecutado
      correctamente.


      A efectos de la letra d), las entidades financieras especificarán claramente las funciones y responsabilidades.


      2. Los planes de respuesta y recuperación en materia de TIC a que se refiere el apartado 1 determinarán
      los escenarios pertinentes, entre ellos escenarios de perturbaciones graves en la actividad y de
      incremento de la probabilidad de que se produzcan perturbaciones. Los escenarios de los planes se
      elaborarán sobre la base de la información actual en materia de amenazas y las conclusiones extraídas
      de anteriores perturbaciones de la actividad. Las entidades financieras tendrán debidamente en cuenta
      todos los escenarios siguientes:


      a) ciberataques y conmutaciones entre la infraestructura primaria de TIC y la capacidad redundante,
      las copias de seguridad y las instalaciones redundantes;


      b) escenarios en los que la calidad de la ejecución de una función esencial o importante se deteriore
      hasta un nivel inaceptable o falle, así como escenarios en los que se contemplen debidamente las
      posibles repercusiones de la insolvencia u otros fallos de cualquier proveedor tercero de servicios
      de TIC pertinente;


      c) fallo parcial o total de los locales, incluidas las oficinas y los locales de uso profesional,
      y de los centros de datos;


      d) fallo importante de los activos de TIC o de la infraestructura de comunicación;


      e) indisponibilidad de un número crucial de miembros del personal o de los miembros del personal
      a cargo de garantizar la continuidad de las operaciones;


      f) repercusiones de sucesos relacionados con el cambio climático y la degradación del medio ambiente,
      catástrofes naturales, pandemias y ataques físicos, como intrusiones y atentados terroristas;


      g) ataques internos;


      h) inestabilidad política y social, en particular, cuando proceda, en el territorio o país del proveedor
      tercero de servicios de TIC y en la ubicación en la que se almacenen y traten los datos;


      i) cortes de energía generalizados.


      3. Los planes de respuesta y recuperación en materia de TIC a que se refiere el apartado 1 contemplarán
      opciones alternativas ante la eventualidad de que las medidas primarias de recuperación no sean
      viables a corto plazo debido a los costes, los riesgos, la logística o circunstancias imprevistas.


      4. Dentro de los planes de respuesta y recuperación en materia de TIC a que se refiere el apartado
      1, las entidades financieras contemplarán y aplicarán medidas de continuidad para mitigar los fallos
      de los proveedores terceros de servicios de TIC que sustenten funciones esenciales o importantes
      de dichas entidades.'
    official_text_en: '1. When developing the ICT response and recovery plans referred to in Article 11(3)
      of Regulation (EU) 2022/2554, financial entities shall take into account the results of the financial
      entity’s business impact analysis (BIA). Those ICT response and recovery plans shall:


      (a) specify the conditions prompting their activation or deactivation, and any exceptions for such
      activation or deactivation;


      (b) describe what actions are to be taken to ensure the availability, integrity, continuity, and
      recovery of at least ICT systems and services supporting critical or important functions of the
      financial entity;


      (c) be designed to meet the recovery objectives of the operations of the financial entities;


      (d) be documented and made available to the staff involved in the execution of ICT response and
      recovery plans and be readily accessible in case of emergency;


      (e) provide for both short-term and long-term recovery options, including partial systems recovery;


      (f) lay down the objectives of ICT response and recovery plans and the conditions to declare a successful
      execution of those plans.


      For the purposes of point (d), financial entities shall clearly specify roles and responsibilities.


      2. The ICT response and recovery plans referred to in paragraph 1 shall identify relevant scenarios,
      including scenarios of severe business disruptions and increased likelihood of occurrence of disruption.
      Those plans shall develop scenarios based on current information on threats and on lessons learned
      from previous occurrences of business disruptions. Financial entities shall duly take into account
      all of the following scenarios:


      (a) cyber-attacks and switchovers between the primary ICT infrastructure and the redundant capacity,
      backups, and redundant facilities;


      (b) scenarios in which the quality of the provision of a critical or important function deteriorates
      to an unacceptable level or fails, and duly consider the potential impact of the insolvency, or
      other failures, of any relevant ICT third-party service provider;


      (c) partial or total failure of premises, including office and business premises, and data centres;


      (d) substantial failure of ICT assets or of the communication infrastructure;


      (e) the non-availability of a critical number of staff or staff members in charge of guaranteeing
      the continuity of operations;


      (f) impact of climate change and environment degradation related events, natural disasters, pandemics,
      and physical attacks, including intrusions and terrorist attacks;


      (g) insider attacks;


      (h) political and social instability, including, where relevant, in the ICT third-party service
      provider’s jurisdiction and the location where the data are stored and processed;


      (i) widespread power outages.


      3. Where the primary recovery measures may not be feasible in the short term because of costs, risks,
      logistics, or unforeseen circumstances, the ICT response and recovery plans referred to in paragraph
      1 shall consider alternative options.


      4. As part of the ICT response and recovery plans referred to in paragraph 1, financial entities
      shall consider and implement continuity measures to mitigate failures of ICT third-party service
      providers of ICT services supporting critical or important functions of the financial entity.'
    section: Artículo 26
    source_sha256: dc3fb6e9dfbebfc652848f9cc1a5507ab5ce027bb48f5951ccabb1e83df52784
- id: t2c5.art27
  title_es: Formato y contenido del informe sobre la revisión del marco de gestión del riesgo relacionado
    con las TIC · artículo 27
  title_en: Format and content of the report on the review of the ICT risk management framework · Article
    27
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_27
  attributes:
    official_text_es: '1. Las entidades financieras presentarán el informe sobre la revisión del marco
      de gestión del riesgo relacionado con las TIC a que se refiere el artículo 6, apartado 5, del Reglamento
      (UE) 2022/2554 en un formato electrónico que permita realizar búsquedas.


      2. Las entidades financieras incluirán en el informe a que se refiere el apartado 1 toda la información
      siguiente:


      a) una parte introductoria en la que: i) se identificará claramente la entidad financiera objeto
      del informe y, en su caso, se describirá su estructura de grupo, ii) se describirá el contexto del
      informe atendiendo a la naturaleza, escala y complejidad de los servicios, actividades y operaciones
      de la entidad financiera, su organización, sus funciones esenciales identificadas, su estrategia,
      sus principales proyectos o actividades en curso, sus relaciones y su dependencia de servicios y
      sistemas de TIC internos y contratados, o las implicaciones que tendría una pérdida total o una
      degradación grave de dichos sistemas para las funciones esenciales o importantes y la eficiencia
      del mercado, iii) se resumirán los principales cambios en el marco de gestión del riesgo relacionado
      con las TIC desde el anterior informe presentado, iv) se ofrecerá un resumen del perfil de riesgo
      de TIC actual y a corto plazo, el panorama de amenazas, la evaluación de la eficacia de los controles
      y la postura de ciberseguridad de la entidad financiera,


      i) se identificará claramente la entidad financiera objeto del informe y, en su caso, se describirá
      su estructura de grupo,


      ii) se describirá el contexto del informe atendiendo a la naturaleza, escala y complejidad de los
      servicios, actividades y operaciones de la entidad financiera, su organización, sus funciones esenciales
      identificadas, su estrategia, sus principales proyectos o actividades en curso, sus relaciones y
      su dependencia de servicios y sistemas de TIC internos y contratados, o las implicaciones que tendría
      una pérdida total o una degradación grave de dichos sistemas para las funciones esenciales o importantes
      y la eficiencia del mercado,


      iii) se resumirán los principales cambios en el marco de gestión del riesgo relacionado con las
      TIC desde el anterior informe presentado,


      iv) se ofrecerá un resumen del perfil de riesgo de TIC actual y a corto plazo, el panorama de amenazas,
      la evaluación de la eficacia de los controles y la postura de ciberseguridad de la entidad financiera,


      b) la fecha de aprobación del informe por parte del órgano de dirección de la entidad financiera;


      c) una descripción de los motivos para revisar el marco de gestión del riesgo relacionado con las
      TIC de conformidad con el artículo 6, apartado 5, del Reglamento (UE) 2022/2554;


      d) las fechas de inicio y finalización del período de revisión;


      e) la indicación de la función responsable de la revisión;


      f) una descripción de los principales cambios y mejoras en el marco de gestión del riesgo relacionado
      con las TIC desde el informe anterior;


      g) un resumen de las constataciones de la revisión y un análisis y evaluación detallados de la gravedad
      de las debilidades, deficiencias y carencias en el marco de gestión del riesgo relacionado con las
      TIC durante el período de revisión;


      h) una descripción de las medidas para tratar las debilidades, deficiencias y carencias detectadas,
      incluidos todos los aspectos siguientes: i) un resumen de las medidas adoptadas para subsanar las
      debilidades, deficiencias y carencias detectadas, ii) la fecha prevista para la aplicación de las
      medidas y las fechas relativas al control interno de la aplicación, junto con información sobre
      el estado de la aplicación en la fecha de elaboración del informe, que explique, en su caso, si
      existe el riesgo de que no se respeten los plazos, iii) las herramientas que se vayan a utilizar
      y la determinación de la función responsable de llevar a cabo las medidas, con indicación de si
      las herramientas y funciones son internas o externas, iv) una descripción de las repercusiones de
      los cambios previstos en las medidas sobre los recursos presupuestarios, humanos y materiales de
      la entidad financiera, incluidos los recursos dedicados a la aplicación de cualquier medida correctora,
      v) información sobre el proceso de información a la autoridad competente, en su caso, vi) cuando
      las debilidades, deficiencias o carencias detectadas no sean objeto de medidas correctoras, una
      explicación detallada de los criterios utilizados para analizar las repercusiones de dichas debilidades,
      deficiencias o carencias, para evaluar el correspondiente riesgo residual relacionado con las TIC
      y para aceptar ese riesgo;


      i) un resumen de las medidas adoptadas para subsanar las debilidades, deficiencias y carencias detectadas,


      ii) la fecha prevista para la aplicación de las medidas y las fechas relativas al control interno
      de la aplicación, junto con información sobre el estado de la aplicación en la fecha de elaboración
      del informe, que explique, en su caso, si existe el riesgo de que no se respeten los plazos,


      iii) las herramientas que se vayan a utilizar y la determinación de la función responsable de llevar
      a cabo las medidas, con indicación de si las herramientas y funciones son internas o externas,


      iv) una descripción de las repercusiones de los cambios previstos en las medidas sobre los recursos
      presupuestarios, humanos y materiales de la entidad financiera, incluidos los recursos dedicados
      a la aplicación de cualquier medida correctora,


      v) información sobre el proceso de información a la autoridad competente, en su caso,


      vi) cuando las debilidades, deficiencias o carencias detectadas no sean objeto de medidas correctoras,
      una explicación detallada de los criterios utilizados para analizar las repercusiones de dichas
      debilidades, deficiencias o carencias, para evaluar el correspondiente riesgo residual relacionado
      con las TIC y para aceptar ese riesgo;


      i) información sobre la evolución prevista del marco de gestión del riesgo relacionado con las TIC;


      j) conclusiones extraídas de la revisión del marco de gestión del riesgo relacionado con las TIC;


      k) información sobre revisiones anteriores, en particular: i) una lista de las revisiones realizadas
      hasta la fecha presente, ii) en su caso, el estado de aplicación de las medidas correctoras señaladas
      en el último informe, iii) cuando las medidas correctoras previstas en revisiones anteriores hayan
      demostrado ser ineficaces o hayan dado lugar a problemas inesperados, una descripción del modo en
      que podrían mejorarse esas medidas correctoras o de esos problemas inesperados;


      i) una lista de las revisiones realizadas hasta la fecha presente,


      ii) en su caso, el estado de aplicación de las medidas correctoras señaladas en el último informe,


      iii) cuando las medidas correctoras previstas en revisiones anteriores hayan demostrado ser ineficaces
      o hayan dado lugar a problemas inesperados, una descripción del modo en que podrían mejorarse esas
      medidas correctoras o de esos problemas inesperados;


      l) fuentes de información empleadas para elaborar el informe, en particular todas las siguientes:
      i) en el caso de las entidades financieras que no sean microempresas a que se refiere el artículo
      6, apartado 6, del Reglamento (UE) 2022/2554, los resultados de las auditorías internas, ii) los
      resultados de las evaluaciones de cumplimiento, iii) los resultados de las pruebas de resiliencia
      operativa digital y, en su caso, los resultados de las pruebas avanzadas de las herramientas, los
      sistemas y los procesos de TIC sustentadas en pruebas de penetración basadas en amenazas, iv) las
      fuentes externas.


      i) en el caso de las entidades financieras que no sean microempresas a que se refiere el artículo
      6, apartado 6, del Reglamento (UE) 2022/2554, los resultados de las auditorías internas,


      ii) los resultados de las evaluaciones de cumplimiento,


      iii) los resultados de las pruebas de resiliencia operativa digital y, en su caso, los resultados
      de las pruebas avanzadas de las herramientas, los sistemas y los procesos de TIC sustentadas en
      pruebas de penetración basadas en amenazas,


      iv) las fuentes externas.


      A efectos de la letra c), cuando la revisión se haya iniciado siguiendo instrucciones de las autoridades
      de supervisión o conclusiones derivadas de las pruebas de la resiliencia operativa digital o los
      procesos de auditoría pertinentes, el informe incluirá referencias explícitas a dichas instrucciones
      o conclusiones que permitan conocer el motivo para iniciar la revisión. Cuando la revisión se haya
      iniciado a raíz de incidentes relacionados con las TIC, el informe incluirá la lista de todos los
      incidentes relacionados con las TIC junto con el análisis de sus causas subyacentes.


      A efectos de la letra f), la descripción incluirá un análisis de las repercusiones de los cambios
      sobre la estrategia de resiliencia operativa digital, el marco de control interno de las TIC y la
      gobernanza de la gestión del riesgo relacionado con las TIC de la entidad financiera.'
    official_text_en: '1. Financial entities shall submit the report on the review of the ICT risk management
      framework referred to in Article 6(5) of Regulation (EU) 2022/2554 in a searchable electronic format.


      2. Financial entities shall include all of the following information in the report referred to in
      paragraph 1:


      (a) an introductory section that: (i) clearly identifies the financial entity that is the subject
      of the report, and describes its group structure, where relevant; (ii) describes the context of
      the report in terms of the nature, scale, and complexity of the financial entity’s services, activities,
      and operations, its organisation, identified critical functions, strategy, major ongoing projects
      or activities, relationships and its dependence on in-house and contracted ICT services and systems
      or the implications that a total loss or severe degradation of such systems would have in terms
      of critical or important functions and market efficiency; (iii) summarises the major changes in
      the ICT risk management framework since the previous report submitted; (iv) provides an executive
      level summary of the current and near-term ICT risk profile, threat landscape, the assessed effectiveness
      of its controls, and the security posture of the financial entity;


      (i) clearly identifies the financial entity that is the subject of the report, and describes its
      group structure, where relevant;


      (ii) describes the context of the report in terms of the nature, scale, and complexity of the financial
      entity’s services, activities, and operations, its organisation, identified critical functions,
      strategy, major ongoing projects or activities, relationships and its dependence on in-house and
      contracted ICT services and systems or the implications that a total loss or severe degradation
      of such systems would have in terms of critical or important functions and market efficiency;


      (iii) summarises the major changes in the ICT risk management framework since the previous report
      submitted;


      (iv) provides an executive level summary of the current and near-term ICT risk profile, threat landscape,
      the assessed effectiveness of its controls, and the security posture of the financial entity;


      (b) the date of the approval of the report by the management body of the financial entity;


      (c) a description of the reason for the review of the ICT risk management framework in accordance
      with Article 6(5) of Regulation (EU) 2022/2554.;


      (d) the start and end dates of the review period;


      (e) an indication of the function responsible for the review;


      (f) a description of the major changes and improvements to the ICT risk management framework since
      the previous review;


      (g) a summary of the findings of the review and detailed analysis and assessment of the severity
      of the weaknesses, deficiencies, and gaps in the ICT risk management framework during the review
      period;


      (h) a description of the measures to address identified weaknesses, deficiencies, and gaps, including
      all of the following: (i) a summary of measures taken to remediate to identified weaknesses, deficiencies
      and gaps; (ii) an expected date for implementing the measures and dates related to the internal
      control of the implementation, including information on the state of progress of the implementation
      of those measures as at the date of drafting of the report, explaining, where applicable, if there
      is a risk that deadlines may not be respected; (iii) tools to be used, and the identification of
      the function responsible for carrying out the measures, detailing whether the tools and functions
      are internal or external; (iv) a description of the impact of the changes envisaged in the measures
      on the financial entity’s budgetary, human, and material resources, including resources dedicated
      to the implementation of any corrective measures; (v) information on the process for informing the
      competent authority, where appropriate; (vi) where the weaknesses, deficiencies, or gaps identified
      are not subject to corrective measures, a detailed explanation of the criteria used to analyse the
      impact of those weaknesses, deficiencies, or gaps, to evaluate the related residual ICT risk, and
      of the criteria used to accept the related residual risk;


      (i) a summary of measures taken to remediate to identified weaknesses, deficiencies and gaps;


      (ii) an expected date for implementing the measures and dates related to the internal control of
      the implementation, including information on the state of progress of the implementation of those
      measures as at the date of drafting of the report, explaining, where applicable, if there is a risk
      that deadlines may not be respected;


      (iii) tools to be used, and the identification of the function responsible for carrying out the
      measures, detailing whether the tools and functions are internal or external;


      (iv) a description of the impact of the changes envisaged in the measures on the financial entity’s
      budgetary, human, and material resources, including resources dedicated to the implementation of
      any corrective measures;


      (v) information on the process for informing the competent authority, where appropriate;


      (vi) where the weaknesses, deficiencies, or gaps identified are not subject to corrective measures,
      a detailed explanation of the criteria used to analyse the impact of those weaknesses, deficiencies,
      or gaps, to evaluate the related residual ICT risk, and of the criteria used to accept the related
      residual risk;


      (i) information on planned further developments of the ICT risk management framework;


      (j) conclusions resulting from the review of the ICT risk management framework;


      (k) information on past reviews, including: (i) a list of past reviews to date; (ii) where applicable,
      a state of implementation of the corrective measures identified by the last report; (iii) where
      the proposed corrective measures in past reviews have proven ineffective or have created unexpected
      challenges, a description of how those corrective measures could be improved or of those unexpected
      challenges;


      (i) a list of past reviews to date;


      (ii) where applicable, a state of implementation of the corrective measures identified by the last
      report;


      (iii) where the proposed corrective measures in past reviews have proven ineffective or have created
      unexpected challenges, a description of how those corrective measures could be improved or of those
      unexpected challenges;


      (l) sources of information used in the preparation of the report, including all of the following:
      (i) for financial entities other than microenterprises as referred to in Article 6(6) of Regulation
      (EU) 2022/2554, the results of internal audits; (ii) the results of compliance assessments; (iii)
      results of digital operational resilience testing, and where applicable the results of advanced
      testing, based on threat-led penetration testing (TLPT), of ICT tools, systems, and processes; (iv)
      external sources.


      (i) for financial entities other than microenterprises as referred to in Article 6(6) of Regulation
      (EU) 2022/2554, the results of internal audits;


      (ii) the results of compliance assessments;


      (iii) results of digital operational resilience testing, and where applicable the results of advanced
      testing, based on threat-led penetration testing (TLPT), of ICT tools, systems, and processes;


      (iv) external sources.


      For the purposes of point (c), where the review was initiated following supervisory instructions,
      or conclusions derived from relevant digital operational resilience testing or audit processes,
      the report shall contain explicit references to such instructions or conclusions, allowing for the
      identification of the reason for initiating the review. Where the review was initiated following
      ICT-related incidents, the report shall contain the list of all ICT-related incidents with incident
      root-cause analysis.


      For the purposes of point (f), the description shall contain an analysis of the impact of the changes
      on the financial entity’s digital operational resilience strategy, on the financial entity’s ICT
      internal control framework, and on the financial entity’s ICT risk management governance.'
    section: Artículo 27
    source_sha256: f95cf8b9847b091e9e08e3d91374bb43aabdde41a7fe4fa18d658ebcf99d56ef
- id: t3c1.art28
  title_es: Gobernanza y organización · artículo 28
  title_en: Governance and organisation · Article 28
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_28
  attributes:
    official_text_es: '1. Las entidades financieras a que se refiere el artículo 16, apartado 1, del Reglamento
      (UE) 2022/2554 dispondrán de un marco interno de gobernanza y control que garantice una gestión
      efectiva y prudente del riesgo relacionado con las TIC para lograr un nivel elevado de resiliencia
      operativa digital.


      2. Dentro de su marco simplificado de gestión del riesgo relacionado con las TIC, las entidades
      financieras a que se refiere el apartado 1 velarán por que su órgano de dirección:


      a) asuma la responsabilidad general de garantizar que el marco simplificado de gestión del riesgo
      relacionado con las TIC permita realizar la estrategia empresarial de la entidad financiera de conformidad
      con su apetito de riesgo y que, en ese contexto, se tenga en cuenta el riesgo relacionado con las
      TIC;


      b) defina claramente las funciones y responsabilidades para todas las tareas relacionadas con las
      TIC;


      c) defina los objetivos de seguridad de la información y requisitos en materia de TIC;


      d) apruebe, supervise y revise periódicamente: i) la clasificación de los activos de información
      de la entidad financiera a que se refiere el artículo 30, apartado 1, del presente Reglamento, la
      lista de los principales riesgos detectados y el análisis de impacto en el negocio y las políticas
      conexas, ii) los planes de continuidad de la actividad de la entidad financiera y las medidas de
      respuesta y recuperación a que se refiere el artículo 16, apartado 1, letra f), del Reglamento (UE)
      2022/2554;


      i) la clasificación de los activos de información de la entidad financiera a que se refiere el artículo
      30, apartado 1, del presente Reglamento, la lista de los principales riesgos detectados y el análisis
      de impacto en el negocio y las políticas conexas,


      ii) los planes de continuidad de la actividad de la entidad financiera y las medidas de respuesta
      y recuperación a que se refiere el artículo 16, apartado 1, letra f), del Reglamento (UE) 2022/2554;


      e) asigne y revise, al menos una vez al año, el presupuesto necesario para satisfacer las necesidades
      de resiliencia operativa digital de la entidad financiera con respecto a todos los tipos de recursos,
      incluidos los pertinentes programas de sensibilización en materia de seguridad de las TIC y las
      pertinentes actividades de formación sobre resiliencia operativa digital y capacidades en materia
      de TIC para todo el personal;


      f) especifique y aplique las políticas y medidas contempladas en los capítulos I, II y III del presente
      título para determinar, evaluar y gestionar el riesgo relacionado con las TIC al que está expuesta
      la entidad financiera;


      g) determine y aplique los procedimientos, protocolos y herramientas de TIC necesarios para proteger
      todos los activos de información y activos de TIC;


      h) garantice que el personal de la entidad financiera se mantiene al día con conocimientos y capacidades
      suficientes para comprender y evaluar el riesgo relacionado con las TIC y sus repercusiones en las
      operaciones de la entidad financiera, de manera acorde con el riesgo relacionado con las TIC que
      se esté gestionando;


      i) establezca disposiciones sobre presentación de información, en particular la frecuencia, forma
      y contenido de los informes que se le deban presentar sobre la seguridad de la información y la
      resiliencia operativa digital.


      3. Las entidades financieras a que se refiere el apartado 1 podrán externalizar, de conformidad
      con el Derecho sectorial de la Unión y nacional, a proveedores intragrupo o terceros de servicios
      de TIC las tareas de verificación del cumplimiento de los requisitos de gestión del riesgo relacionado
      con las TIC. En los casos en que se produzca tal externalización, las entidades financieras seguirán
      siendo plenamente responsables de la verificación del cumplimiento de los requisitos en materia
      de gestión del riesgo relacionado con las TIC.


      4. Las entidades financieras a que se refiere el apartado 1 garantizarán una separación adecuada,
      así como la independencia, de las funciones de control y las funciones de auditoría interna.


      5. Las entidades financieras a que se refiere el apartado 1 garantizarán que su marco simplificado
      de gestión del riesgo relacionado con las TIC sea objeto de auditoría interna llevada a cabo por
      auditores, en consonancia con su plan de auditoría. Los auditores poseerán conocimientos, capacidades
      y pericia suficientes en materia de riesgo relacionado con las TIC y serán independientes. La frecuencia
      y el enfoque de las auditorías de TIC serán acordes con el riesgo relacionado con las TIC de la
      entidad financiera.


      6. A la luz del resultado de la auditoría contemplada en el apartado 5, las entidades financieras
      a que se refiere el apartado 1 velarán por la oportuna verificación y corrección de los resultados
      problemáticos de la auditoría de TIC.'
    official_text_en: '1. The financial entities referred to in Article 16(1) of Regulation (EU) 2022/2554
      shall have in place an internal governance and control framework that ensures an effective and prudent
      management of ICT risk to achieve a high level of digital operational resilience.


      2. The financial entities referred to in paragraph 1 shall, as part of their simplified ICT risk
      management framework, ensure that their management body:


      (a) bears the overall responsibility for ensuring that the simplified ICT risk management framework
      allows for the achievement of the financial entity’s business strategy in accordance with the risk
      appetite of that financial entity, and ensures that ICT risk is considered in that context;


      (b) sets clear roles and responsibilities for all ICT-related tasks;


      (c) sets out information security objectives and ICT requirements;


      (d) approves, oversees, and periodically reviews: (i) the classification of information assets of
      the financial entity as referred to in Article 30(1) of this Regulation, the list of main risks
      identified, and the business impact analysis and related policies; (ii) the business continuity
      plans of the financial entity, and the response and recovery measures referred to in Article 16(1),
      point (f), of Regulation (EU) 2022/2554;


      (i) the classification of information assets of the financial entity as referred to in Article 30(1)
      of this Regulation, the list of main risks identified, and the business impact analysis and related
      policies;


      (ii) the business continuity plans of the financial entity, and the response and recovery measures
      referred to in Article 16(1), point (f), of Regulation (EU) 2022/2554;


      (e) allocates and reviews at least once a year the budget necessary to fulfil the financial entity’s
      digital operational resilience needs in respect of all types of resources, including relevant ICT
      security awareness programmes and digital operational resilience training and ICT skills for all
      staff;


      (f) specifies and implements the policies and measures included in Chapters I, II and III of this
      Title to identify, assess and manage the ICT risk the financial entity is exposed to;


      (g) identifies and implements procedures, ICT protocols, and tools that are necessary to protect
      all information assets and ICT assets;


      (h) ensures that the staff of the financial entity is kept up to date with sufficient knowledge
      and skills to understand and assess ICT risk and its impact on the operations of the financial entity,
      commensurate to the ICT risk being managed;


      (i) establishes reporting arrangements, including the frequency, form, and content of reporting
      to the management body on the information security and digital operational resilience.


      3. The financial entities referred to in paragraph 1 may, in accordance with Union and national
      sectoral law, outsource the tasks of verifying compliance with ICT risk management requirements
      to ICT intra-group or ICT third-party service providers. In case of such outsourcing, financial
      entities shall remain fully responsible for the verification of compliance with the ICT risk management
      requirements.


      4. The financial entities referred to in paragraph 1 shall ensure an appropriate segregation and
      the independence of control functions and internal audit functions.


      5. The financial entities referred to in paragraph 1 shall ensure that their simplified ICT risk
      management framework is subject to an internal audit by auditors, in line with the financial entities’
      audit plan. The auditors shall have sufficient knowledge, skills, and expertise in ICT risk, and
      shall be independent. The frequency and focus of ICT audits shall be commensurate to the ICT risk
      of the financial entity.


      6. Based on the outcome of the audit referred to in paragraph 5, the financial entities referred
      to in paragraph 1 shall ensure the timely verification and remediation of critical ICT audit findings.'
    section: Artículo 28
    source_sha256: dd1bcb8085cdea7d28e48abfd368e7d8efa03c90de4c594b7e52adee6f4ca1a8
- id: t3c1.art29
  title_es: Política y medidas de seguridad de la información · artículo 29
  title_en: Information security policy and measures · Article 29
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_29
  attributes:
    official_text_es: '1. Las entidades financieras a que se refiere el artículo 16, apartado 1, del Reglamento
      (UE) 2022/2554 elaborarán, documentarán y aplicarán una política de seguridad de la información
      en el contexto del marco simplificado de gestión del riesgo relacionado con las TIC. Dicha política
      de seguridad de la información especificará los principios y normas de alto nivel para proteger
      la confidencialidad, integridad, disponibilidad y autenticidad de los datos y de los servicios prestados
      por esas entidades financieras.


      2. Sobre la base de la política de seguridad de la información contemplada en el apartado 1, las
      entidades financieras a que se refiere dicho apartado establecerán y aplicarán medidas de seguridad
      de las TIC para mitigar su exposición al riesgo relacionado con las TIC, incluidas medidas de mitigación
      que aplicarán los proveedores terceros de servicios de TIC.


      Las medidas de seguridad de las TIC incluirán todas las medidas contempladas en los artículos 30
      a 38.'
    official_text_en: '1. The financial entities referred to in Article 16(1) of Regulation (EU) 2022/2554
      shall develop, document, and implement an information security policy in the context of the simplified
      ICT risk management framework. That information security policy shall specify the high-level principles
      and rules to protect the confidentiality, integrity, availability, and authenticity of data and
      of the services those financial entities provide.


      2. Based on their information security policy referred to in paragraph 1, the financial entities
      referred to in paragraph 1 shall establish and implement ICT security measures to mitigate their
      exposure to ICT risk, including mitigating measures implemented by ICT third-party service providers.


      The ICT security measures shall include all of the measures referred to in Articles 30 to 38.'
    section: Artículo 29
    source_sha256: 0e90656d0492e79cce933a59b620d063be259bdb0bdbcb1cbf8ce52407704e27
- id: t3c1.art30
  title_es: Clasificación de activos de información y activos de TIC · artículo 30
  title_en: Classification of information assets and ICT assets · Article 30
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_30
  attributes:
    official_text_es: '1. Dentro del marco simplificado de gestión del riesgo relacionado con las TIC
      contemplado en el artículo 16, apartado 1, letra a), del Reglamento (UE) 2022/2554, las entidades
      financieras a que se refiere el apartado 1 de dicho artículo identificarán, clasificarán y documentarán
      todas las funciones esenciales o importantes, los activos de información y los activos de TIC que
      sustenten dichas funciones, así como sus interdependencias. Las entidades financieras revisarán
      los elementos identificados y su clasificación cuando sea necesario.


      2. Las entidades financieras a que se refiere el apartado 1 identificarán todas las funciones esenciales
      o importantes sustentadas por proveedores terceros de servicios de TIC.'
    official_text_en: '1. As part of the simplified ICT risk management framework referred to in Article
      16(1), point (a), of Regulation (EU) 2022/2554, the financial entities referred to in paragraph
      1 of that Article shall identify, classify, and document all critical or important functions, the
      information assets and ICT assets supporting them and their interdependencies. Financial entities
      shall review that identification and classification as needed.


      2. The financial entities referred to in paragraph 1 shall identify all critical or important functions
      supported by ICT third-party service providers.'
    section: Artículo 30
    source_sha256: 792a19952dffd8df065597e4f9210e034e426e6c60df8ae671e46342ea543a95
- id: t3c1.art31
  title_es: Gestión del riesgo relacionado con las TIC · artículo 31
  title_en: ICT risk management · Article 31
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_31
  attributes:
    official_text_es: '1. Las entidades financieras a que se refiere el artículo 16, apartado 1, del Reglamento
      (UE) 2022/2554 incluirán en su marco simplificado de gestión del riesgo relacionado con las TIC
      todos los aspectos siguientes:


      a) la determinación de los niveles de tolerancia al riesgo relacionado con las TIC, de acuerdo con
      el apetito de riesgo de la entidad financiera;


      b) la determinación y evaluación de los riesgos relacionados con las TIC a los que la entidad financiera
      esté expuesta;


      c) la especificación de las estrategias de mitigación al menos para los riesgos relacionados con
      las TIC que no entren dentro de los niveles de tolerancia al riesgo de la entidad financiera;


      d) el seguimiento de la eficacia de las estrategias de mitigación a que se refiere la letra c);


      e) la determinación y evaluación de todo riesgo relacionado con las TIC y la seguridad de la información
      que sea consecuencia de un cambio importante en los sistemas de TIC o los servicios, procesos o
      procedimientos de TIC, se derive de los resultados de las pruebas de seguridad de las TIC o surja
      tras un incidente grave relacionado con las TIC.


      2. Las entidades financieras a que se refiere el apartado 1 llevarán a cabo y documentarán la evaluación
      del riesgo relacionado con las TIC con carácter periódico, de manera acorde con su perfil de riesgo
      relacionado con las TIC.


      3. Las entidades financieras a que se refiere el apartado 1 harán un seguimiento continuo de las
      amenazas y vulnerabilidades que sean pertinentes para sus funciones esenciales o importantes, así
      como para sus activos de información y activos de TIC, y revisarán periódicamente los escenarios
      de riesgo que afecten a dichas funciones esenciales o importantes.


      4. Las entidades financieras a que se refiere el apartado 1 establecerán umbrales de alerta y criterios
      para activar e iniciar procesos de respuesta a incidentes relacionados con las TIC.'
    official_text_en: '1. The financial entities referred to in Article 16(1) of Regulation (EU) 2022/2554
      shall include in their simplified ICT risk management framework all of the following:


      (a) a determination of the risk tolerance levels for ICT risk, in accordance with the risk appetite
      of the financial entity;


      (b) the identification and assessment of the ICT risks to which the financial entity is exposed;


      (c) the specification of mitigation strategies at least for the ICT risks that are not within the
      risk tolerance levels of the financial entity;


      (d) the monitoring of the effectiveness of the mitigation strategies referred to in point (c);


      (e) the identification and assessment of any ICT and information security risks resulting from any
      major change in ICT system or ICT services, processes, or procedures, and from ICT security testing
      results and after any major ICT-related incident.


      2. The financial entities referred to in paragraph 1 shall carry out and document the ICT risk assessment
      periodically commensurate to the financial entities’ ICT risk profile.


      3. The financial entities referred to in paragraph 1 shall continuously monitor threats and vulnerabilities
      that are relevant to their critical or important functions, and information assets and ICT assets,
      and shall regularly review the risk scenarios impacting those critical or important functions.


      4. The financial entities referred to in paragraph 1 shall set out alert thresholds and criteria
      to trigger and initiate ICT-related incident response processes.'
    section: Artículo 31
    source_sha256: 334713f4f30bbe0ad3b496e8c18726f4d515b2661c679ae363431e0cdaa43510
- id: t3c1.art32
  title_es: Seguridad física y del entorno · artículo 32
  title_en: Physical and environmental security · Article 32
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_32
  attributes:
    official_text_es: '1. Las entidades financieras a que se refiere el artículo 16, apartado 1, del Reglamento
      (UE) 2022/2554 determinarán y aplicarán medidas de seguridad física concebidas sobre la base del
      panorama de amenazas y de conformidad con la clasificación contemplada en el artículo 30, apartado
      1, del presente Reglamento, el perfil de riesgo general de los activos de TIC y los activos de información
      accesibles.


      2. Las medidas a que se refiere el apartado 1 protegerán los locales y, en su caso, los centros
      de datos de las entidades financieras en los que se encuentren los activos de TIC y de información
      contra el acceso no autorizado, los ataques y los accidentes, así como contra las amenazas y peligros
      medioambientales.


      3. La protección contra las amenazas y peligros medioambientales será acorde con la importancia
      de los locales afectados y, en su caso, de los centros de datos y con el carácter esencial de las
      operaciones que se realicen en ellos o los sistemas de TIC que se encuentren en ellos.'
    official_text_en: '1. The financial entities referred to in Article 16(1) of Regulation (EU) 2022/2554
      shall identify and implement physical security measures designed on the basis of the threat landscape
      and in accordance with the classification referred to in Article 30(1) of this Regulation, the overall
      risk profile of ICT assets, and accessible information assets.


      2. The measures referred to in paragraph 1 shall protect the premises of financial entities and,
      where applicable, data centres of financial entities where ICT assets and information assets reside
      from unauthorised access, attacks, and accidents, and from environmental threats and hazards.


      3. The protection from environmental threats and hazards shall be commensurate with the importance
      of the premises concerned and, where applicable, the data centres and the criticality of the operations
      or ICT systems located therein.'
    section: Artículo 32
    source_sha256: 54883750703403878bbdef3fdb02afdf2ebb72d8cf6008bb8efb7cec0cd146da
- id: t3c2.art33
  title_es: Control de acceso · artículo 33
  title_en: Access Control · Article 33
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_33
  attributes:
    official_text_es: 'Las entidades financieras a que se refiere el artículo 16, apartado 1, del Reglamento
      (UE) 2022/2554 elaborarán, documentarán y aplicarán procedimientos para controlar el acceso lógico
      y físico, velarán por su cumplimiento, los someterán a seguimiento y los revisarán periódicamente.
      Dichos procedimientos incluirán los siguientes elementos de control del acceso lógico y físico:


      a) derechos de acceso a los activos de información, los activos de TIC y las funciones que sustentan,
      así como a los emplazamientos esenciales de actividad de la entidad financiera, gestionados sobre
      la base de los principios de «necesidad de conocer», «necesidad de uso» y «mínimo privilegio», también
      para el acceso a distancia y de emergencia;


      b) responsabilidad de los usuarios, en virtud de la cual se garantice la identificación de los usuarios
      en las acciones realizadas en los sistemas de TIC;


      c) procedimientos de gestión de cuentas para la concesión, modificación o revocación de derechos
      de acceso en relación con las cuentas de usuario y cuentas genéricas, incluidas las cuentas de administrador
      genéricas;


      d) métodos de autenticación acordes con la clasificación a que se refiere el artículo 30, apartado
      1, y con el perfil de riesgo general de los activos de TIC, y basados en las prácticas punteras;


      e) revisión periódica de los derechos de acceso y retirada de esos derechos cuando ya no sean necesarios.


      A efectos de la letra c), la entidad financiera asignará, para todos los activos de TIC, acceso
      privilegiado, de emergencia y de administrador sobre la base del principio de «necesidad de uso»
      o con carácter ad hoc, y lo registrará de conformidad con el artículo 34, apartado 1, letra f).


      A efectos de la letra d), las entidades financieras utilizarán métodos de autenticación fuerte basados
      en las prácticas punteras para el acceso a distancia a sus redes, el acceso privilegiado y el acceso
      a los activos de TIC que sustenten funciones esenciales o importantes que sean de acceso público.'
    official_text_en: 'The financial entities referred to in Article 16(1) of Regulation (EU) 2022/2554
      shall develop, document, and implement procedures for the control of logical and physical access
      and shall enforce, monitor, and periodically review those procedures. Those procedures shall contain
      the following elements of control of logical and physical access:


      (a) access rights to information assets, ICT assets, and their supported functions, and to critical
      locations of operation of the financial entity, are managed on a need-to-know, need-to-use and least
      privileges basis, including for remote and emergency access;


      (b) user accountability, which ensures that users can be identified for the actions performed in
      the ICT systems;


      (c) account management procedures to grant, change, or revoke access rights for user and generic
      accounts, including generic administrator accounts;


      (d) authentication methods that are commensurate to the classification referred to in Article 30(1)
      and to the overall risk profile of ICT assets, and which are based on leading practices;


      (e) access rights are periodically reviewed and are withdrawn when no longer required.


      For the purposes of point (c), the financial entity shall assign privileged, emergency, and administrator
      access on a need-to-use or an ad-hoc basis for all ICT systems, and shall be logged in accordance
      with Article 34, first paragraph, point (f).


      For the purposes of point (d), financial entities shall use strong authentication methods that are
      based on leading practices for remote access to the financial entities’ network, for privileged
      access, and for access to ICT assets supporting critical or important functions that are publicly
      available.'
    section: Artículo 33
    source_sha256: 3863309b21dbefb84b2349b5ff696d17bb4af296947c499af4a0ab9e5d2497e2
- id: t3c2.art34
  title_es: Seguridad de las operaciones de TIC · artículo 34
  title_en: ICT operations security · Article 34
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_34
  attributes:
    official_text_es: 'Dentro de sus sistemas, protocolos y herramientas, y con respecto a todos los activos
      de TIC, las entidades financieras a que se refiere el artículo 16, apartado 1, del Reglamento (UE)
      2022/2554:


      a) harán un seguimiento del ciclo de vida de todos los activos de TIC y lo gestionarán;


      b) harán un seguimiento, en su caso, de si los activos de TIC cuentan con el soporte de proveedores
      terceros de servicios de TIC;


      c) determinarán los requisitos de capacidad de sus activos de TIC y las medidas para mantener y
      mejorar la disponibilidad y eficiencia de los sistemas de TIC y prevenir la escasez de capacidad
      de TIC antes de que se materialice;


      d) llevarán a cabo exploraciones y evaluaciones automatizadas de vulnerabilidad de los activos de
      TIC, acordes con la clasificación de tales activos contemplada en el artículo 30, apartado 1, y
      con el perfil de riesgo general de cada activo de TIC, e implementarán parches para hacer frente
      a las vulnerabilidades detectadas;


      e) gestionarán los riesgos relacionados con los activos de TIC obsoletos, sin soporte o heredados;


      f) registrarán los acontecimientos relacionados con el control del acceso lógico y físico, las operaciones
      de TIC, incluidas las actividades de sistema y de tráfico de red, y la gestión de cambios en las
      TIC;


      g) determinarán y aplicarán medidas para el seguimiento y el análisis de la información sobre actividades
      y comportamientos anómalos respecto de operaciones de TIC esenciales o importantes;


      h) aplicarán medidas para el seguimiento de la información pertinente y actualizada sobre las ciberamenazas;


      i) aplicarán medidas para la detección de posibles fugas de información, códigos maliciosos y otras
      amenazas para la seguridad, así como vulnerabilidades en el software y el hardware conocidas públicamente,
      y comprobarán las nuevas actualizaciones de seguridad correspondientes.


      A efectos de la letra f), las entidades financieras adaptarán el grado de detalle de los registros
      a la finalidad y al uso del activo de TIC que los genere.'
    official_text_en: 'The financial entities referred to in Article 16(1) of Regulation (EU) 2022/2554
      shall, as part of their systems, protocols, and tools, and for all ICT assets:


      (a) monitor and manage the lifecycle of all ICT assets;


      (b) monitor whether the ICT assets are supported by ICT third-party service providers of financial
      entities, where applicable;


      (c) identify capacity requirements of their ICT assets and measures to maintain and improve the
      availability and efficiency of ICT systems and prevent ICT capacity shortages before they materialise;


      (d) perform automated vulnerability scanning and assessments of ICT assets commensurate to their
      classification as referred to in Article 30(1) and to the overall risk profile of the ICT asset,
      and deploy patches to address identified vulnerabilities;


      (e) manage the risks related to outdated, unsupported, or legacy ICT assets;


      (f) log events related to logical and physical access control, ICT operations, including system
      and network traffic activities, and ICT change management;


      (g) identify and implement measures to monitor and analyse information on anomalous activities and
      behaviour for critical or important ICT operations;


      (h) implement measures to monitor relevant and up-to-date information about cyber threats;


      (i) implement measures to identify possible information leakages, malicious code and other security
      threats, and publicly known vulnerabilities in software and hardware, and check for corresponding
      new security updates.


      For the purposes of point (f), financial entities shall align the level of detail of the logs with
      their purpose and usage of the ICT asset producing those logs.'
    section: Artículo 34
    source_sha256: e5c4ba602cd5296e56181583ca3db98dfe148b623d82413180328dd1053d3b5f
- id: t3c2.art35
  title_es: Seguridad de los datos, sistemas y redes · artículo 35
  title_en: Data, system and network security · Article 35
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_35
  attributes:
    official_text_es: 'Dentro de sus sistemas, protocolos y herramientas, las entidades financieras a
      que se refiere el artículo 16, apartado 1, del Reglamento (UE) 2022/2554 elaborarán y aplicarán
      salvaguardias que garanticen la seguridad de las redes frente a intrusiones y al uso indebido de
      los datos y que preserven la disponibilidad, autenticidad, integridad y confidencialidad de los
      datos. En particular, teniendo en cuenta la clasificación a que se refiere el artículo 30, apartado
      1, del presente Reglamento, las entidades financieras establecerán todos los aspectos siguientes:


      a) la determinación y aplicación de medidas para proteger los datos en uso, en tránsito y en reposo;


      b) la determinación y aplicación de medidas de seguridad relativas al uso del software, los soportes
      de almacenamiento de datos, los sistemas y los dispositivos de nodo final que transfieran y almacenen
      datos de la entidad financiera;


      c) la determinación y aplicación de medidas para prevenir y detectar las conexiones no autorizadas
      a sus redes, así como para proteger el tráfico de red entre sus redes internas e internet y otras
      conexiones externas;


      d) la determinación y aplicación de medidas que garanticen la disponibilidad, autenticidad, integridad
      y confidencialidad de los datos durante las transmisiones en redes;


      e) un proceso para la supresión segura de los datos que se encuentren en los locales o estén almacenados
      externamente y que la entidad financiera ya no necesite recopilar o almacenar;


      f) un proceso para desechar o desactivar de forma segura los dispositivos de almacenamiento de datos
      que se encuentren en los locales o estén almacenados externamente y que contengan información confidencial;


      g) la determinación y aplicación de medidas de seguridad para garantizar que el teletrabajo y el
      uso de dispositivos de nodo final privados no afecten negativamente a la capacidad para llevar a
      cabo sus actividades esenciales de manera adecuada, oportuna y segura.'
    official_text_en: 'The financial entities referred to in Article 16(1) of Regulation (EU) 2022/2554
      shall, as part of their systems, protocols, and tools, develop and implement safeguards that ensure
      the security of networks against intrusions and data misuse and that preserve the availability,
      authenticity, integrity, and confidentiality of data. In particular, financial entities shall, taking
      into account the classification referred to in Article 30(1) of this Regulation, establish all of
      the following:


      (a) the identification and implementation of measures to protect data in use, in transit, and at
      rest;


      (b) the identification and implementation of security measures regarding the use of software, data
      storage media, systems and endpoint devices that transfer and store data of the financial entity;


      (c) the identification and implementation of measures to prevent and detect unauthorised connections
      to the financial entity’s network, and to secure the network traffic between the financial entity’s
      internal networks and the internet and other external connections;


      (d) the identification and implementation of measures that ensure the availability, authenticity,
      integrity, and confidentiality of data during network transmissions;


      (e) a process to securely delete data on premises, or that are stored externally, that the financial
      entity no longer needs to collect or store;


      (f) a process to securely dispose of, or decommission, data storage devices on premises, or data
      storage devices that are stored externally, that contain confidential information;


      (g) the identification and implementation of measures to ensure that teleworking and the use of
      private endpoint devices does not adversely impact the financial entity’s ability to carry out its
      critical activities in an adequate, timely, and secure manner.'
    section: Artículo 35
    source_sha256: 6000d4911e1c4e719a90b0a909f27b4e4fee6cecd40a7f0a59f26c0f0655ad01
- id: t3c2.art36
  title_es: Pruebas de seguridad de las TIC · artículo 36
  title_en: ICT security testing · Article 36
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_36
  attributes:
    official_text_es: '1. Las entidades financieras a que se refiere el artículo 16, apartado 1, del Reglamento
      (UE) 2022/2554 establecerán y aplicarán un plan de pruebas de seguridad de las TIC para validar
      la eficacia de las medidas de seguridad de las TIC que hayan elaborado de conformidad con los artículos
      33, 34, 35, 37 y 38 del presente Reglamento. Las entidades financieras velarán por que dicho plan
      tenga en cuenta las amenazas y vulnerabilidades detectadas dentro del marco simplificado de gestión
      del riesgo relacionado con las TIC a que se refiere el artículo 31 del presente Reglamento.


      2. Las entidades financieras a que se refiere el apartado 1 revisarán, evaluarán y someterán a prueba
      las medidas de seguridad de las TIC, tomando en consideración el perfil de riesgo general de sus
      activos de TIC.


      3. Las entidades financieras a que se refiere el apartado 1 harán un seguimiento y una evaluación
      de los resultados de las pruebas de seguridad y actualizarán sus medidas de seguridad en consecuencia
      y sin demora indebida en el caso de los sistemas de TIC que sustenten funciones esenciales o importantes.'
    official_text_en: '1. The financial entities referred to in Article 16(1) of Regulation (EU) 2022/2554
      shall establish and implement an ICT security testing plan to validate the effectiveness of their
      ICT security measures developed in accordance with Articles 33, 34 and 35 and Articles 37 and 38
      of this Regulation. Financial entities shall ensure that that plan considers threats and vulnerabilities
      identified as part of the simplified ICT risk management framework referred to in Article 31 of
      this Regulation.


      2. The financial entities referred to in paragraph 1 shall review, asses and test ICT security measures,
      taking into consideration the overall risk profile of the ICT assets of the financial entity.


      3. The financial entities referred to in paragraph 1 shall monitor and evaluate the results of the
      security tests and update their security measures accordingly without undue delay in the case of
      ICT systems supporting critical or important functions.'
    section: Artículo 36
    source_sha256: b3637d10cd10bafbe84e728df9292352c376efb08c60fc8887eaad6ed1661039
- id: t3c2.art37
  title_es: Adquisición, desarrollo y mantenimiento de los sistemas de TIC · artículo 37
  title_en: ICT systems acquisition, development, and maintenance · Article 37
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_37
  attributes:
    official_text_es: 'Las entidades financieras a que se refiere el artículo 16, apartado 1, del Reglamento
      (UE) 2022/2554 diseñarán y aplicarán, en su caso, un procedimiento para la adquisición, el desarrollo
      y el mantenimiento de los sistemas de TIC con arreglo a un enfoque basado en el riesgo. Dicho procedimiento:


      a) garantizará que, antes de la adquisición o el desarrollo de un sistema de TIC, los requisitos
      funcionales y no funcionales, incluidos los requisitos de seguridad de la información, hayan sido
      claramente especificados y aprobados por la función empresarial pertinente;


      b) garantizará que los sistemas de TIC se sometan a prueba y sean aprobados antes de su primera
      utilización y antes de introducir cambios en el entorno de producción;


      c) determinará medidas para mitigar el riesgo de alteración no intencionada o de manipulación intencionada
      de los sistemas de TIC durante el desarrollo y la implementación en el entorno de producción.'
    official_text_en: 'The financial entities referred to in Article 16(1) of Regulation (EU) 2022/2554
      shall design and implement, where appropriate, a procedure governing the acquisition, development,
      and maintenance of ICT systems following a risk-based approach. That procedure shall:


      (a) ensure that, before any acquisition or development of ICT systems takes place, the functional
      and non-functional requirements, including information security requirements, are clearly specified
      and approved by the business function concerned;


      (b) ensure the testing and approval of ICT systems prior to their first use and before introducing
      changes to the production environment;


      (c) identify measures to mitigate the risk of unintentional alteration or intentional manipulation
      of the ICT systems during development and implementation in the production environment.'
    section: Artículo 37
    source_sha256: 28cd6f88f3bd006f043771f4fc88e1f360e1043df7f5058691f29f173d742cae
- id: t3c2.art38
  title_es: Gestión de proyectos de TIC y de cambios en las TIC · artículo 38
  title_en: ICT project and change management · Article 38
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_38
  attributes:
    official_text_es: '1. Las entidades financieras a que se refiere el artículo 16, apartado 1, del Reglamento
      (UE) 2022/2554 elaborarán, documentarán y aplicarán un procedimiento de gestión de proyectos de
      TIC y especificarán las funciones y responsabilidades en relación con su aplicación. Dicho procedimiento
      abarcará todas las fases de los proyectos de TIC, desde su inicio hasta su cierre.


      2. Las entidades financieras a que se refiere el apartado 1 elaborarán, documentarán y aplicarán
      un procedimiento de gestión de cambios en las TIC para garantizar que todo cambio en los sistemas
      de TIC se registre, someta a prueba, evalúe, apruebe, aplique y verifique de manera controlada y
      con las salvaguardias adecuadas a fin de preservar la resiliencia operativa digital de la entidad
      financiera.'
    official_text_en: '1. The financial entities referred to in Article 16(1) of Regulation (EU) 2022/2554
      shall develop, document, and implement an ICT project management procedure and shall specify the
      roles and responsibilities for its implementation. That procedure shall cover all stages of the
      ICT projects from their initiation to their closure.


      2. The financial entities referred to in paragraph 1 shall develop, document, and implement an ICT
      change management procedure to ensure that all changes to ICT systems are recorded, tested, assessed,
      approved, implemented, and verified in a controlled manner and with the adequate safeguards to preserve
      the financial entity’s digital operational resilience.'
    section: Artículo 38
    source_sha256: c32ba52cf811747074a01a41a13de49e0a56ca47002b60b97ec253aa1dd9b404
- id: t3c3.art39
  title_es: Componentes del plan de continuidad de la actividad en materia de TIC · artículo 39
  title_en: Components of the ICT business continuity plan · Article 39
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_39
  attributes:
    official_text_es: '1. Las entidades financieras a que se refiere el artículo 16, apartado 1, del Reglamento
      (UE) 2022/2554 elaborarán sus planes de continuidad de la actividad en materia de TIC teniendo en
      cuenta los resultados del análisis de sus exposiciones a perturbaciones graves de la actividad,
      así como de las posibles repercusiones de esas perturbaciones, y los escenarios a los que puedan
      estar expuestos sus activos de TIC que sustenten funciones esenciales o importantes, en particular
      un escenario de ciberataque.


      2. Los planes de continuidad de la actividad en materia de TIC a que se refiere el apartado 1:


      a) serán aprobados por el órgano de dirección de la entidad financiera;


      b) estarán documentados y serán fácilmente accesibles en caso de emergencia o crisis;


      c) asignarán recursos suficientes para su ejecución;


      d) establecerán los niveles de recuperación previstos y los plazos para la recuperación y reanudación
      de las funciones y las dependencias internas y externas clave, en particular con respecto a los
      proveedores terceros de servicios de TIC;


      e) determinarán las condiciones que pueden motivar su activación y las medidas que deben adoptarse
      para garantizar la disponibilidad, continuidad y recuperación de los activos de TIC de las entidades
      financieras que sustenten funciones esenciales o importantes;


      f) determinarán las medidas de restauración y recuperación en relación con las funciones empresariales
      esenciales o importantes, los procesos de apoyo y los activos de información, así como sus interdependencias,
      con el fin de evitar efectos adversos en el funcionamiento de las entidades financieras;


      g) determinarán procedimientos y medidas de copia de seguridad que especifiquen el alcance de los
      datos objeto de dicha copia y la frecuencia mínima de su realización, de acuerdo con el carácter
      esencial de la función que utilice los datos de que se trate;


      h) contemplarán opciones alternativas ante la eventualidad de que la recuperación no sea viable
      a corto plazo debido a los costes, los riesgos, la logística o circunstancias imprevistas;


      i) especificarán los mecanismos de comunicación interna y externa, incluidos los planes para el
      traslado a la instancia jerárquica superior;


      j) se actualizarán en consonancia con las conclusiones extraídas de incidentes, las pruebas, los
      nuevos riesgos y amenazas detectados, los cambios en los objetivos de recuperación y los cambios
      importantes en la organización de la entidad financiera y en los activos de TIC que sustenten funciones
      esenciales o empresariales.


      A efectos de la letra f), las medidas a que se refiere dicha letra contemplarán la mitigación de
      los fallos de los proveedores terceros esenciales.'
    official_text_en: '1. The financial entities referred to in Article 16(1) of Regulation (EU) 2022/2554
      shall develop their ICT business continuity plans considering the results of the analysis of their
      exposures to and potential impact of severe business disruptions and scenarios to which their ICT
      assets supporting critical or important functions might be exposed, including a cyber-attack scenario.


      2. The ICT business continuity plans referred to in paragraph 1 shall:


      (a) be approved by the management body of the financial entity;


      (b) be documented and readily accessible in the event of an emergency or crisis;


      (c) allocate sufficient resources for their execution;


      (d) establish planned recovery levels and timeframes for the recovery and resumption of functions
      and key internal and external dependencies, including ICT third-party service providers;


      (e) identify the conditions that may prompt the activation of the ICT business continuity plans
      and what actions are to be taken to ensure the availability, continuity, and recovery of the financial
      entities’ ICT assets supporting critical or important functions;


      (f) identify the restoration and recovery measures for critical or important business functions,
      supporting processes, information assets, and their interdependencies to avoid adverse effects on
      the functioning of the financial entities;


      (g) identify backup procedures and measures that specify the scope of the data that are subject
      to the backup, and the minimum frequency of the backup, based on the criticality of the function
      using those data;


      (h) consider alternative options where recovery may not be feasible in the short term because of
      costs, risks, logistics, or unforeseen circumstances;


      (i) specify the internal and external communication arrangements, including escalation plans;


      (j) be updated in line with lessons learned from incidents, tests, new risks, and threats identified,
      changed recovery objectives, major changes to the financial entity’s organisation, and to the ICT
      assets supporting critical or business functions.


      For the purposes of point (f), the measures referred to in that point shall provide for the mitigation
      of failures of critical third-party providers.'
    section: Artículo 39
    source_sha256: f072c95fd2613d8464004b9e9d77e12f50e480efc5365e19bd4c724766ec2dcf
- id: t3c3.art40
  title_es: Pruebas de los planes de continuidad de la actividad · artículo 40
  title_en: Testing of business continuity plans · Article 40
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_40
  attributes:
    official_text_es: '1. Las entidades financieras a que se refiere el artículo 16, apartado 1, del Reglamento
      (UE) 2022/2554 someterán a prueba los planes de continuidad de la actividad a que se refiere el
      artículo 39 del presente Reglamento, incluidos los escenarios contemplados en dicho artículo, al
      menos una vez al año en el caso de los procedimientos de copia de seguridad y restauración, o cada
      vez que se produzca un cambio importante en el plan de continuidad de la actividad.


      2. Las pruebas de los planes de continuidad de la actividad a que se refiere el apartado 1 deberán
      demostrar que las entidades financieras contempladas en dicho apartado son capaces de mantener la
      viabilidad de sus actividades hasta que se restablezcan las operaciones esenciales y detectar cualquier
      deficiencia en dichos planes.


      3. Las entidades financieras a que se refiere el apartado 1 documentarán los resultados de las pruebas
      de los planes de continuidad de la actividad, y toda deficiencia detectada a raíz de dichas pruebas
      será analizada, tratada y comunicada al órgano de dirección.'
    official_text_en: '1. The financial entities referred to in Article 16(1) of Regulation (EU) 2022/2554
      shall test their business continuity plans referred to in Article 39 of this Regulation, including
      the scenarios referred to in that Article, at least once every year for the back-up and restore
      procedures, or upon every major change of the business continuity plan.


      2. The testing of business continuity plans referred to in paragraph 1 shall demonstrate that the
      financial entities referred to in that paragraph are able to sustain the viability of their businesses
      until critical operations are re-established and identify any deficiencies in those plans.


      3. The financial entities referred to in paragraph 1 shall document the results of the testing of
      business continuity plans and any identified deficiencies resulting from that testing shall be analysed,
      addressed, and reported to the management body.'
    section: Artículo 40
    source_sha256: 44d116619c9787c22b72dbf0a475d5b0f2f8c980bad786b875cb11b14d3dec76
- id: t3c4.art41
  title_es: Formato y contenido del informe sobre la revisión del marco simplificado de gestión del riesgo
    relacionado con las TIC · artículo 41
  title_en: Format and content of the report on the review of the simplified ICT risk management framework
    · Article 41
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_41
  attributes:
    official_text_es: '1. Las entidades financieras a que se refiere el artículo 16, apartado 1, del Reglamento
      (UE) 2022/2554 presentarán el informe sobre la revisión del marco de gestión del riesgo relacionado
      con las TIC a que se refiere el apartado 2 de dicho artículo en un formato electrónico que permita
      realizar búsquedas.


      2. El informe a que se refiere el apartado 1 incluirá toda la información siguiente:


      a) una parte introductoria que contenga: i) una descripción del contexto del informe atendiendo
      a la naturaleza, escala y complejidad de los servicios, actividades y operaciones de la entidad
      financiera, su organización, sus funciones esenciales identificadas, su estrategia, sus principales
      proyectos o actividades en curso, sus relaciones y su dependencia de servicios y sistemas de TIC
      internos y externalizados, o las implicaciones que tendría una pérdida total o una degradación grave
      de dichos sistemas para las funciones esenciales o importantes y la eficiencia del mercado, ii)
      un resumen del riesgo relacionado con las TIC actual y a corto plazo identificado, el panorama de
      amenazas, la evaluación de la eficacia de los controles y la postura de ciberseguridad de la entidad
      financiera, iii) información sobre el ámbito objeto del informe, iv) un resumen de los principales
      cambios en el marco de gestión del riesgo relacionado con las TIC desde el informe anterior, v)
      un resumen y una descripción de las repercusiones de los principales cambios en el marco simplificado
      de gestión del riesgo relacionado con las TIC desde el informe anterior;


      i) una descripción del contexto del informe atendiendo a la naturaleza, escala y complejidad de
      los servicios, actividades y operaciones de la entidad financiera, su organización, sus funciones
      esenciales identificadas, su estrategia, sus principales proyectos o actividades en curso, sus relaciones
      y su dependencia de servicios y sistemas de TIC internos y externalizados, o las implicaciones que
      tendría una pérdida total o una degradación grave de dichos sistemas para las funciones esenciales
      o importantes y la eficiencia del mercado,


      ii) un resumen del riesgo relacionado con las TIC actual y a corto plazo identificado, el panorama
      de amenazas, la evaluación de la eficacia de los controles y la postura de ciberseguridad de la
      entidad financiera,


      iii) información sobre el ámbito objeto del informe,


      iv) un resumen de los principales cambios en el marco de gestión del riesgo relacionado con las
      TIC desde el informe anterior,


      v) un resumen y una descripción de las repercusiones de los principales cambios en el marco simplificado
      de gestión del riesgo relacionado con las TIC desde el informe anterior;


      b) en su caso, la fecha de aprobación del informe por parte del órgano de dirección de la entidad
      financiera;


      c) una descripción de los motivos de la revisión, incluidos los aspectos siguientes: i) cuando la
      revisión se haya iniciado siguiendo instrucciones de las autoridades de supervisión, las pruebas
      de dichas instrucciones, ii) cuando la revisión se haya iniciado a raíz del acontecimiento de incidentes
      relacionados con las TIC, la lista de todos esos incidentes con el correspondiente análisis de las
      causas subyacentes;


      i) cuando la revisión se haya iniciado siguiendo instrucciones de las autoridades de supervisión,
      las pruebas de dichas instrucciones,


      ii) cuando la revisión se haya iniciado a raíz del acontecimiento de incidentes relacionados con
      las TIC, la lista de todos esos incidentes con el correspondiente análisis de las causas subyacentes;


      d) las fechas de inicio y finalización del período de revisión;


      e) la persona responsable de la revisión;


      f) un resumen de las constataciones y una autoevaluación de la gravedad de las debilidades, deficiencias
      y carencias detectadas en el marco de gestión del riesgo relacionado con las TIC durante el período
      de revisión, junto con un análisis detallado de esas debilidades, deficiencias y carencias;


      g) medidas correctoras determinadas para hacer frente a las debilidades, deficiencias y carencias
      en el marco simplificado de gestión del riesgo relacionado con las TIC y fecha prevista para la
      aplicación de dichas medidas, incluidas las medidas de respuesta a debilidades, deficiencias y carencias
      señaladas en informes anteriores, cuando aún no se hayan subsanado;


      h) conclusiones generales de la revisión del marco simplificado de gestión del riesgo relacionado
      con las TIC, incluida la posible evolución prevista de dicho marco.'
    official_text_en: '1. The financial entities referred to in Article 16(1) of Regulation (EU) 2022/2554
      shall submit the report on the review of the ICT risk management framework referred to in paragraph
      2 of that Article in a searchable electronic format.


      2. The report referred to in paragraph 1 shall contain all of the following information:


      (a) an introductory section providing: (i) a description of the context of the report in terms of
      the nature, scale, and complexity of the financial entity’s services, activities, and operations,
      the financial entity’s organisation, identified critical functions, strategy, major ongoing projects
      or activities, and relationships, and the financial entity’s dependence on in-house and outsourced
      ICT services and systems, or the implications that a total loss or severe degradation of such systems
      would have on critical or important functions and market efficiency; (ii) an executive level summary
      of the current and near-term ICT risk identified, threat landscape, the assessed effectiveness of
      its controls, and the security posture of the financial entity; (iii) information about the reported
      area; (iv) a summary of the major changes in the ICT risk management framework since the previous
      report; (v) a summary and a description of the impact of major changes to the simplified ICT risk
      management framework since the previous report;


      (i) a description of the context of the report in terms of the nature, scale, and complexity of
      the financial entity’s services, activities, and operations, the financial entity’s organisation,
      identified critical functions, strategy, major ongoing projects or activities, and relationships,
      and the financial entity’s dependence on in-house and outsourced ICT services and systems, or the
      implications that a total loss or severe degradation of such systems would have on critical or important
      functions and market efficiency;


      (ii) an executive level summary of the current and near-term ICT risk identified, threat landscape,
      the assessed effectiveness of its controls, and the security posture of the financial entity;


      (iii) information about the reported area;


      (iv) a summary of the major changes in the ICT risk management framework since the previous report;


      (v) a summary and a description of the impact of major changes to the simplified ICT risk management
      framework since the previous report;


      (b) where applicable, the date of the approval of the report by the management body of the financial
      entity;


      (c) a description of the reasons for the review, including: (i) where the review has been initiated
      following supervisory instructions, evidence of such instructions; (ii) where the review has been
      initiated following the occurrence of ICT-related incidents, the list of all those ICT-related incidents
      with related incident root-cause analysis;


      (i) where the review has been initiated following supervisory instructions, evidence of such instructions;


      (ii) where the review has been initiated following the occurrence of ICT-related incidents, the
      list of all those ICT-related incidents with related incident root-cause analysis;


      (d) the start and end date of the review period;


      (e) the person responsible for the review;


      (f) a summary of findings, and a self-assessment of the severity of the weaknesses, deficiencies,
      and gaps identified in ICT risk management framework for the review period, including a detailed
      analysis thereof;


      (g) remedying measures identified to address weaknesses, deficiencies, and gaps in the simplified
      ICT risk management framework, and the expected date for implementing those measures, including
      the follow-up on weaknesses, deficiencies, and gaps identified in previous reports, where those
      weaknesses, deficiencies, and gaps have not yet been remedied;


      (h) overall conclusions on the review of the simplified ICT risk management framework, including
      any further planned developments.'
