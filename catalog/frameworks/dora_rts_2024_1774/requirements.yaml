requirements:
- id: t1.art1
  title_es: Perfil de riesgo general y complejidad · artículo 1
  title_en: Overall risk profile and complexity · Article 1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_1
  attributes:
    official_text_es: 'Al elaborar y aplicar las políticas, procedimientos, protocolos y herramientas
      en materia de seguridad de las TIC a que se refiere el título II y el marco simplificado de gestión
      del riesgo relacionado con las TIC a que se refiere el título III, se tendrán en cuenta el tamaño
      y el perfil de riesgo general de la entidad financiera, la naturaleza y escala de sus servicios,
      actividades y operaciones, y los elementos que supongan un aumento o una disminución de la complejidad
      de estos, en particular los elementos relativos a:


      a) el cifrado y la criptografía;


      b) la seguridad de las operaciones de TIC;


      c) la seguridad de las redes;


      d) la gestión de proyectos de TIC y de cambios en las TIC;


      e) las posibles repercusiones del riesgo relacionado con las TIC sobre la confidencialidad, integridad
      y disponibilidad de los datos, y las posibles repercusiones de las perturbaciones sobre la continuidad
      y disponibilidad de las actividades de la entidad financiera.'
    official_text_en: 'When developing and implementing the ICT security policies, procedures, protocols
      and tools referred to in Title II and the simplified ICT risk management framework referred to in
      Title III, the size and the overall risk profile of the financial entity, and the nature, scale
      and elements of increased or reduced complexity of its services, activities and operations shall
      be taken into account, including elements relating to:


      (a) encryption and cryptography;


      (b) ICT operations security;


      (c) network security;


      (d) ICT project and change management;


      (e) the potential impact of the ICT risk on confidentiality, integrity and availability of data,
      and of the disruptions on the continuity and availability of the financial entity’s activities.'
    section: Artículo 1
    source_sha256: 7c0877b0279cc383935b745e0f3e6fdca19825a5d6bf4f98f858fce138be00b5
- id: t2c1.art2
  title_es: Elementos generales de las políticas, procedimientos, protocolos y herramientas en materia
    de seguridad de las TIC · artículo 2
  title_en: General elements of ICT security policies, procedures, protocols, and tools · Article 2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_2
  attributes:
    official_text_es: '1. Las entidades financieras velarán por que sus políticas en materia de seguridad
      de las TIC, la seguridad de la información y los procedimientos, protocolos y herramientas conexos
      a que se refiere el artículo 9, apartado 2, del Reglamento (UE) 2022/2554 estén integrados en su
      marco de gestión del riesgo relacionado con las TIC. Las entidades financieras establecerán políticas,
      procedimientos, protocolos y herramientas en materia de seguridad de las TIC, conforme a lo dispuesto
      en el presente capítulo, que:


      a) garanticen la seguridad de las redes;


      b) contengan salvaguardias adecuadas contra las intrusiones y el uso indebido de los datos;


      c) preserven la disponibilidad, autenticidad, integridad y confidencialidad de los datos, en particular
      mediante el uso de técnicas criptográficas;


      d) garanticen una transmisión exacta y rápida de los datos sin perturbaciones importantes ni demoras
      indebidas.


      2. Las entidades financieras velarán por que las políticas en materia de seguridad de las TIC a
      que se refiere el apartado 1:


      a) estén en consonancia con los objetivos de seguridad de la información contenidos en la estrategia
      de resiliencia operativa digital a que se refiere el artículo 6, apartado 8, del Reglamento (UE)
      2022/2554;


      b) indiquen la fecha de su aprobación formal por el órgano de dirección;


      c) contengan indicadores y parámetros de medición para: i) realizar el seguimiento de la aplicación
      de las políticas, procedimientos, protocolos y herramientas en materia de seguridad de las TIC,
      ii) registrar las excepciones a dicha aplicación, iii) garantizar que se mantenga la resiliencia
      operativa digital de la entidad financiera cuando se produzcan las excepciones a que se refiere
      el inciso ii);


      i) realizar el seguimiento de la aplicación de las políticas, procedimientos, protocolos y herramientas
      en materia de seguridad de las TIC,


      ii) registrar las excepciones a dicha aplicación,


      iii) garantizar que se mantenga la resiliencia operativa digital de la entidad financiera cuando
      se produzcan las excepciones a que se refiere el inciso ii);


      d) especifiquen las responsabilidades del personal a todos los niveles para garantizar la seguridad
      de las TIC en la entidad financiera;


      e) especifiquen las consecuencias de su incumplimiento por parte del personal de la entidad financiera,
      cuando las disposiciones a tal efecto no estén establecidas en otras políticas de la entidad financiera;


      f) enumeren la documentación que debe conservarse;


      g) especifiquen las disposiciones sobre separación de funciones en el contexto del modelo de las
      tres líneas de defensa u otro modelo interno de gestión y control de riesgos, según proceda, con
      el fin de evitar los conflictos de intereses;


      h) tengan en cuenta las prácticas punteras y, en su caso, las normas definidas en el artículo 2,
      punto 1, del Reglamento (UE) n.o 1025/2012;


      i) determinen las funciones y responsabilidades a efectos de su propia elaboración, aplicación y
      mantenimiento, así como de la elaboración, aplicación y mantenimiento de los procedimientos, protocolos
      y herramientas conexos;


      j) se revisen de conformidad con el artículo 6, apartado 5, del Reglamento (UE) 2022/2554;


      k) tomen en consideración los cambios importantes que afecten a la entidad financiera, en particular
      los cambios importantes en sus actividades o procesos, en el panorama de ciberamenazas o en las
      obligaciones jurídicas aplicables.'
    official_text_en: '1. Financial entities shall ensure that their ICT security policies, information
      security, and related procedures, protocols, and tools as referred to in Article 9(2) of Regulation
      (EU) 2022/2554 are embedded in their ICT risk management framework. Financial entities shall establish
      the ICT security policies, procedures, protocols, and tools laid down in this Chapter that:


      (a) ensure the security of networks;


      (b) contain safeguards against intrusions and data misuse;


      (c) preserve the availability, authenticity, integrity, and confidentiality of data, including via
      the use of cryptographic techniques;


      (d) guarantee an accurate and prompt data transmission without major disruptions and undue delays.


      2. Financial entities shall ensure that the ICT security policies referred to in paragraph 1:


      (a) are aligned to the financial entity’s information security objectives included in the digital
      operational resilience strategy referred to in Article 6(8) of Regulation (EU) 2022/2554;


      (b) indicate the date of the formal approval of the ICT security policies by the management body;


      (c) contain indicators and measures to: (i) monitor the implementation of the ICT security policies,
      procedures, protocols, and tools; (ii) record exceptions from that implementation; (iii) ensure
      that the digital operational resilience of the financial entity is ensured in case of exceptions
      as referred to in point (ii);


      (i) monitor the implementation of the ICT security policies, procedures, protocols, and tools;


      (ii) record exceptions from that implementation;


      (iii) ensure that the digital operational resilience of the financial entity is ensured in case
      of exceptions as referred to in point (ii);


      (d) specify the responsibilities of staff at all levels to ensure the financial entity’s ICT security;


      (e) specify the consequences of non-compliance by staff of the financial entity with the ICT security
      policies, where provisions to that effect are not laid down in other policies of the financial entity;


      (f) list the documentation to be maintained;


      (g) specify the segregation of duties arrangements in the context of the three lines of defence
      model or other internal risk management and control model, as applicable, to avoid conflicts of
      interest;


      (h) consider leading practices and, where applicable, standards as defined in Article 2, point (1),
      of Regulation (EU) No 1025/2012;


      (i) identify the roles and responsibilities for the development, implementation and maintenance
      of ICT security policies, procedures, protocols, and tools;


      (j) are reviewed in accordance with Article 6(5) of Regulation (EU) 2022/2554;


      (k) take into account material changes concerning the financial entity, including material changes
      to the activities or processes of the financial entity, to the cyber threat landscape, or to applicable
      legal obligations.'
    section: Artículo 2
    source_sha256: 3124e05ad40cb03f3fd44776bd0fe0880a5ad12b866ecb180247bacc2a711640
- id: t2c1.art3
  title_es: Gestión del riesgo relacionado con las TIC · artículo 3
  title_en: ICT risk management · Article 3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_3
  attributes:
    official_text_es: 'Las entidades financieras elaborarán, documentarán y aplicarán políticas y procedimientos
      para la gestión del riesgo relacionado con las TIC que contengan todos los elementos siguientes:


      a) la indicación de la aprobación del nivel de tolerancia al riesgo relacionado con las TIC que
      se haya establecido de conformidad con el artículo 6, apartado 8, letra b), del Reglamento (UE)
      2022/2554;


      b) un procedimiento y una metodología para llevar a cabo la evaluación del riesgo relacionado con
      las TIC que determinen: i) las vulnerabilidades y amenazas que afecten o puedan afectar a las funciones
      empresariales sustentadas y a los sistemas de TIC y activos de TIC que sustenten dichas funciones,
      ii) los indicadores cuantitativos o cualitativos para medir las repercusiones y la probabilidad
      de las vulnerabilidades y amenazas a que se refiere el inciso i);


      i) las vulnerabilidades y amenazas que afecten o puedan afectar a las funciones empresariales sustentadas
      y a los sistemas de TIC y activos de TIC que sustenten dichas funciones,


      ii) los indicadores cuantitativos o cualitativos para medir las repercusiones y la probabilidad
      de las vulnerabilidades y amenazas a que se refiere el inciso i);


      c) el procedimiento para determinar, aplicar y documentar las medidas de tratamiento de los riesgos
      relacionados con las TIC que hayan sido detectados y evaluados, incluidas las medidas de tratamiento
      necesarias para situar el riesgo relacionado con las TIC dentro del nivel de tolerancia al riesgo
      a que se refiere la letra a);


      d) respecto de los riesgos residuales relacionados con las TIC que persistan tras aplicar las medidas
      de tratamiento a que se refiere la letra c): i) disposiciones sobre la determinación de dichos riesgos
      residuales relacionados con las TIC, ii) la asignación de funciones y responsabilidades en relación
      con: 1) la aceptación de los riesgos residuales relacionados con las TIC que superen el nivel de
      tolerancia al riesgo de la entidad financiera a que se refiere la letra a); 2) el proceso de revisión
      a que se refiere el inciso iv) de la presente letra d), iii) la elaboración de un inventario de
      los riesgos residuales relacionados con las TIC aceptados, que incluya la justificación para tal
      aceptación, iv) disposiciones sobre la revisión, al menos una vez al año, de los riesgos residuales
      relacionados con las TIC aceptados, incluido lo siguiente: 1) determinación de posibles cambios
      en los riesgos residuales relacionados con las TIC; 2) evaluación de las medidas de mitigación disponibles;
      3) evaluación de la validez y aplicabilidad, en la fecha de la revisión, de las razones que hayan
      justificado la aceptación de los riesgos residuales relacionados con las TIC;


      i) disposiciones sobre la determinación de dichos riesgos residuales relacionados con las TIC,


      ii) la asignación de funciones y responsabilidades en relación con: 1) la aceptación de los riesgos
      residuales relacionados con las TIC que superen el nivel de tolerancia al riesgo de la entidad financiera
      a que se refiere la letra a); 2) el proceso de revisión a que se refiere el inciso iv) de la presente
      letra d),


      1) la aceptación de los riesgos residuales relacionados con las TIC que superen el nivel de tolerancia
      al riesgo de la entidad financiera a que se refiere la letra a);


      2) el proceso de revisión a que se refiere el inciso iv) de la presente letra d),


      iii) la elaboración de un inventario de los riesgos residuales relacionados con las TIC aceptados,
      que incluya la justificación para tal aceptación,


      iv) disposiciones sobre la revisión, al menos una vez al año, de los riesgos residuales relacionados
      con las TIC aceptados, incluido lo siguiente: 1) determinación de posibles cambios en los riesgos
      residuales relacionados con las TIC; 2) evaluación de las medidas de mitigación disponibles; 3)
      evaluación de la validez y aplicabilidad, en la fecha de la revisión, de las razones que hayan justificado
      la aceptación de los riesgos residuales relacionados con las TIC;


      1) determinación de posibles cambios en los riesgos residuales relacionados con las TIC;


      2) evaluación de las medidas de mitigación disponibles;


      3) evaluación de la validez y aplicabilidad, en la fecha de la revisión, de las razones que hayan
      justificado la aceptación de los riesgos residuales relacionados con las TIC;


      e) disposiciones sobre el seguimiento de: i) los cambios en el panorama de los riesgos relacionados
      con las TIC y las ciberamenazas, ii) las vulnerabilidades y amenazas internas y externas, iii) los
      riesgos relacionados con las TIC de la entidad financiera, de manera que se detecte rápidamente
      todo cambio que pueda afectar a su perfil de riesgo relacionado con las TIC;


      i) los cambios en el panorama de los riesgos relacionados con las TIC y las ciberamenazas,


      ii) las vulnerabilidades y amenazas internas y externas,


      iii) los riesgos relacionados con las TIC de la entidad financiera, de manera que se detecte rápidamente
      todo cambio que pueda afectar a su perfil de riesgo relacionado con las TIC;


      f) disposiciones sobre un proceso para garantizar que se tenga en cuenta todo cambio en la estrategia
      empresarial y la estrategia de resiliencia operativa digital de la entidad financiera.


      A efectos del párrafo primero, letra c), el procedimiento a que se refiere dicha letra garantizará
      que:


      a) se haga un seguimiento de la eficacia de las medidas aplicadas para el tratamiento del riesgo
      relacionado con las TIC;


      b) se evalúe si se han alcanzado los niveles de tolerancia al riesgo establecidos por la entidad
      financiera;


      c) se evalúe si la entidad financiera ha emprendido acciones para corregir o mejorar dichas medidas
      en caso necesario.'
    official_text_en: 'Financial entities shall develop, document, and implement ICT risk management policies
      and procedures that shall contain all of the following:


      (a) an indication of the approval of the risk tolerance level for ICT risk established in accordance
      with Article 6(8), point (b), of Regulation (EU) 2022/2554;


      (b) a procedure and a methodology to conduct the ICT risk assessment, identifying: (i) vulnerabilities
      and threats that affect or may affect the supported business functions, the ICT systems and ICT
      assets supporting those functions; (ii) the quantitative or qualitative indicators to measure the
      impact and likelihood of the vulnerabilities and threats referred to in point (i);


      (i) vulnerabilities and threats that affect or may affect the supported business functions, the
      ICT systems and ICT assets supporting those functions;


      (ii) the quantitative or qualitative indicators to measure the impact and likelihood of the vulnerabilities
      and threats referred to in point (i);


      (c) the procedure to identify, implement, and document ICT risk treatment measures for the ICT risks
      identified and assessed, including the determination of ICT risk treatment measures necessary to
      bring ICT risk within the risk tolerance level referred to in point (a);


      (d) for the residual ICT risks that are still present following the implementation of the ICT risk
      treatment measures referred to in point (c): (i) provisions on the identification of those residual
      ICT risks; (ii) the assignment of roles and responsibilities regarding: (1) the acceptance of the
      residual ICT risks that exceed the financial entity’s risk tolerance level referred to in point
      (a); (2) for the review process referred to in point (iv) of this point (d); (iii) the development
      of an inventory of the accepted residual ICT risks, including a justification for their acceptance;
      (iv) provisions on the review of the accepted residual ICT risks at least once a year, including:
      (1) the identification of any changes to the residual ICT risks; (2) the assessment of available
      mitigation measures; (3) the assessment of whether the reasons justifying the acceptance of residual
      ICT risks are still valid and applicable at the date of the review;


      (i) provisions on the identification of those residual ICT risks;


      (ii) the assignment of roles and responsibilities regarding: (1) the acceptance of the residual
      ICT risks that exceed the financial entity’s risk tolerance level referred to in point (a); (2)
      for the review process referred to in point (iv) of this point (d);


      (1) the acceptance of the residual ICT risks that exceed the financial entity’s risk tolerance level
      referred to in point (a);


      (2) for the review process referred to in point (iv) of this point (d);


      (iii) the development of an inventory of the accepted residual ICT risks, including a justification
      for their acceptance;


      (iv) provisions on the review of the accepted residual ICT risks at least once a year, including:
      (1) the identification of any changes to the residual ICT risks; (2) the assessment of available
      mitigation measures; (3) the assessment of whether the reasons justifying the acceptance of residual
      ICT risks are still valid and applicable at the date of the review;


      (1) the identification of any changes to the residual ICT risks;


      (2) the assessment of available mitigation measures;


      (3) the assessment of whether the reasons justifying the acceptance of residual ICT risks are still
      valid and applicable at the date of the review;


      (e) provisions on the monitoring of: (i) any changes to the ICT risk and cyber threat landscape;
      (ii) internal and external vulnerabilities and threats: (iii) ICT risk of the financial entity that
      enables promp detection of changes that could affect its ICT risk profile;


      (i) any changes to the ICT risk and cyber threat landscape;


      (ii) internal and external vulnerabilities and threats:


      (iii) ICT risk of the financial entity that enables promp detection of changes that could affect
      its ICT risk profile;


      (f) provisions on a process to ensure that any changes to the business strategy and the digital
      operational resilience strategy of the financial entity are taken into account.


      For the purposes of the first paragraph, point (c), the procedure referred to in that point shall
      ensure:


      (a) the monitoring of the effectiveness of the ICT risk treatment measures implemented;


      (b) the assessment of whether the established risk tolerance levels of the financial entity have
      been attained;


      (c) the assessment of whether the financial entity has taken actions to correct or improve those
      measures where necessary.'
    section: Artículo 3
    source_sha256: 9374d58529886b5073e426464d3d96fca7dddab5e8619a095d183f465e1f65dc
- id: t2c1.art4
  title_es: Política de gestión de activos de TIC · artículo 4
  title_en: ICT asset management policy · Article 4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_4
  attributes:
    official_text_es: '1. Dentro de las políticas, procedimientos, protocolos y herramientas en materia
      de seguridad de las TIC a que se refiere el artículo 9, apartado 2, del Reglamento (UE) 2022/2554,
      las entidades financieras elaborarán, documentarán y aplicarán una política de gestión de activos
      de TIC.


      2. La política de gestión de activos de TIC a que se refiere el apartado 1:


      a) exigirá el seguimiento y la gestión del ciclo de vida de los activos de TIC que hayan sido identificados
      y clasificados de conformidad con el artículo 8, apartado 1, del Reglamento (UE) 2022/2554;


      b) exigirá que la entidad financiera lleve un registro de todos los aspectos siguientes: i) el identificador
      único de cada activo de TIC, ii) la ubicación, física o lógica, de todos los activos de TIC, iii)
      la clasificación de todos los activos de TIC a que se refiere el artículo 8, apartado 1, del Reglamento
      (UE) 2022/2254, iv) la identidad de los propietarios de los activos de TIC, v) las funciones o servicios
      empresariales sustentados por el activo de TIC de que se trate, vi) los requisitos relativos a la
      continuidad de la actividad en materia de TIC, incluidos los objetivos de tiempo de recuperación
      y de punto de recuperación, vii) si el activo de TIC de que se trate puede estar o está expuesto
      a redes externas, incluida internet, viii) los vínculos e interdependencias entre los activos de
      TIC y las funciones empresariales que utilicen cada activo de TIC, ix) cuando proceda, en relación
      con todos los activos de TIC, la fecha de finalización de los servicios de soporte normales, ampliados
      y personalizados del proveedor tercero de servicios de TIC tras la cual los activos de TIC dejarán
      de contar con el soporte de su suministrador o de un proveedor tercero de servicios de TIC;


      i) el identificador único de cada activo de TIC,


      ii) la ubicación, física o lógica, de todos los activos de TIC,


      iii) la clasificación de todos los activos de TIC a que se refiere el artículo 8, apartado 1, del
      Reglamento (UE) 2022/2254,


      iv) la identidad de los propietarios de los activos de TIC,


      v) las funciones o servicios empresariales sustentados por el activo de TIC de que se trate,


      vi) los requisitos relativos a la continuidad de la actividad en materia de TIC, incluidos los objetivos
      de tiempo de recuperación y de punto de recuperación,


      vii) si el activo de TIC de que se trate puede estar o está expuesto a redes externas, incluida
      internet,


      viii) los vínculos e interdependencias entre los activos de TIC y las funciones empresariales que
      utilicen cada activo de TIC,


      ix) cuando proceda, en relación con todos los activos de TIC, la fecha de finalización de los servicios
      de soporte normales, ampliados y personalizados del proveedor tercero de servicios de TIC tras la
      cual los activos de TIC dejarán de contar con el soporte de su suministrador o de un proveedor tercero
      de servicios de TIC;


      c) en el caso de las entidades financieras que no sean microempresas, exigirá que tales entidades
      conserven la información necesaria para realizar la evaluación específica del riesgo relacionado
      con las TIC en todos los sistemas de TIC heredados a que se refiere el artículo 8, apartado 7, del
      Reglamento (UE) 2022/2554.'
    official_text_en: '1. As part of the ICT security policies, procedures, protocols, and tools referred
      to in Article 9(2) of Regulation (EU) 2022/2554, financial entities shall develop, document, and
      implement a policy on management of ICT assets.


      2. The policy on management of ICT assets referred to in paragraph 1 shall:


      (a) prescribe the monitoring and management of the lifecycle of ICT assets identified and classified
      in accordance with Article 8(1) of Regulation (EU) 2022/2554;


      (b) prescribe that the financial entity keeps records of all of the following: (i) the unique identifier
      of each ICT asset; (ii) information on the location, either physical or logical, of all ICT assets;
      (iii) the classification of all ICT assets, as referred to in Article 8(1) of Regulation (EU) 2022/2254;
      (iv) the identity of ICT asset owners; (v) the business functions or services supported by the ICT
      asset; (vi) the ICT business continuity requirements, including recovery time objectives and recovery
      point objectives; (vii) whether the ICT asset can be or is exposed to external networks, including
      the internet; (viii) the links and interdependencies among ICT assets and the business functions
      using each ICT asset; (ix) where applicable, for all ICT assets, the end dates of the ICT third-party
      service provider’s regular, extended, and custom support services after which those ICT assets are
      no longer supported by their supplier or by an ICT third-party service provider;


      (i) the unique identifier of each ICT asset;


      (ii) information on the location, either physical or logical, of all ICT assets;


      (iii) the classification of all ICT assets, as referred to in Article 8(1) of Regulation (EU) 2022/2254;


      (iv) the identity of ICT asset owners;


      (v) the business functions or services supported by the ICT asset;


      (vi) the ICT business continuity requirements, including recovery time objectives and recovery point
      objectives;


      (vii) whether the ICT asset can be or is exposed to external networks, including the internet;


      (viii) the links and interdependencies among ICT assets and the business functions using each ICT
      asset;


      (ix) where applicable, for all ICT assets, the end dates of the ICT third-party service provider’s
      regular, extended, and custom support services after which those ICT assets are no longer supported
      by their supplier or by an ICT third-party service provider;


      (c) for financial entities other than microenterprises, prescribe that those financial entities
      keep records of the information necessary to perform a specific ICT risk assessment on all legacy
      ICT systems referred to in Article 8(7) of Regulation (EU) 2022/2554.'
    section: Artículo 4
    source_sha256: 613d3135deb0067ce869ca5f0f9013f52c12e701d289f61eacae4145ece845f7
- id: t2c1.art5
  title_es: Procedimiento de gestión de activos de TIC · artículo 5
  title_en: ICT asset management procedure · Article 5
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_5
  attributes:
    official_text_es: '1. Las entidades financieras elaborarán, documentarán y aplicarán un procedimiento
      de gestión de activos de TIC.


      2. El procedimiento de gestión de activos de TIC a que se refiere el apartado 1 especificará los
      criterios para la evaluación del carácter esencial de los activos de información y los activos de
      TIC que sustenten funciones empresariales. Dicha evaluación tendrá en cuenta lo siguiente:


      a) el riesgo relacionado con las TIC que llevan asociado tales funciones empresariales, así como
      su dependencia de los activos de información o activos de TIC;


      b) la forma en que la pérdida de confidencialidad, integridad y disponibilidad de tales activos
      de información y activos de TIC afectaría a los procesos empresariales y las actividades de las
      entidades financieras.'
    official_text_en: '1. Financial entities shall develop, document, and implement a procedure for the
      management of ICT assets.


      2. The procedure for management of ICT assets referred to in paragraph 1 shall specify the criteria
      to perform the criticality assessment of information assets and ICT assets supporting business functions.
      That assessment shall take into account:


      (a) the ICT risk related to those business functions and their dependencies on the information assets
      or ICT assets;


      (b) how the loss of confidentiality, integrity, and availability of such information assets and
      ICT assets would impact the business processes and activities of the financial entities.'
    section: Artículo 5
    source_sha256: 8293b3b3975b054372b2541f8d458c48659eba37a700a0aab6b6e8c34982f165
- id: t2c1.art6
  title_es: Cifrado y controles criptográficos · artículo 6
  title_en: Encryption and cryptographic controls · Article 6
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_6
  attributes:
    official_text_es: '1. Dentro de las políticas, procedimientos, protocolos y herramientas en materia
      de seguridad de las TIC a que se refiere el artículo 9, apartado 2, del Reglamento (UE) 2022/2554,
      las entidades financieras elaborarán, documentarán y aplicarán una política de cifrado y controles
      criptográficos.


      2. Las entidades financieras diseñarán la política de cifrado y controles criptográficos a que se
      refiere el apartado 1 basándose en los resultados de una clasificación de datos aprobada y una evaluación
      del riesgo relacionado con las TIC. Dicha política contendrá normas sobre todos los aspectos siguientes:


      a) el cifrado de los datos en reposo y en tránsito;


      b) el cifrado de los datos en uso, cuando proceda;


      c) el cifrado de las conexiones de red internas y del tráfico con partes externas;


      d) la gestión de claves criptográficas a que se refiere el artículo 7, con normas sobre el uso correcto,
      la protección y el ciclo de vida de esas claves.


      A efectos de la letra b), cuando el cifrado de los datos en uso no sea posible, las entidades financieras
      tratarán tales datos en un entorno separado y protegido, o adoptarán medidas equivalentes para garantizar
      la confidencialidad, integridad, autenticidad y disponibilidad de los datos.


      3. Las entidades financieras incluirán en la política de cifrado y controles criptográficos a que
      se refiere el apartado 1 criterios para la selección de técnicas y prácticas de uso en materia de
      criptografía, tomando en consideración las prácticas punteras y las normas definidas en el artículo
      2, punto 1, del Reglamento (UE) n.o 1025/2012, así como la clasificación de los activos de TIC pertinentes
      establecida de conformidad con el artículo 8, apartado 1, del Reglamento (UE) 2022/2554. Las entidades
      financieras que no puedan adherirse a dichas prácticas punteras o normas, o utilizar las técnicas
      más fiables, adoptarán medidas de mitigación y de seguimiento que garanticen la resiliencia frente
      a las ciberamenazas.


      4. Las entidades financieras incluirán en la política de cifrado y controles criptográficos a que
      se refiere el apartado 1 disposiciones para actualizar o modificar, en caso necesario, la tecnología
      criptográfica, a la luz de la evolución del criptoanálisis. Dichas actualizaciones o modificaciones
      garantizarán que se preserve la resiliencia de la tecnología criptográfica frente a las ciberamenazas,
      tal como se exige en el artículo 10, apartado 2, letra a). Las entidades financieras que no puedan
      actualizar o modificar la tecnología criptográfica adoptarán medidas de mitigación y de seguimiento
      que garanticen la resiliencia frente a las ciberamenazas.


      5. Las entidades financieras incluirán en la política de cifrado y controles criptográficos a que
      se refiere el apartado 1 la obligación de registrar la adopción de medidas de mitigación y de seguimiento
      con arreglo a los apartados 3 y 4 y de proporcionar una explicación motivada al respecto.'
    official_text_en: '1. As part of their ICT security policies, procedures, protocols, and tools referred
      to in Article 9(2) of Regulation (EU) 2022/2554, financial entities shall develop, document, and
      implement a policy on encryption and cryptographic controls.


      2. Financial entities shall design the policy on encryption and cryptographic controls referred
      to in paragraph 1 on the basis of the results of an approved data classification and ICT risk assessment.
      That policy shall contain rules for all of the following:


      (a) the encryption of data at rest and in transit;


      (b) the encryption of data in use, where necessary;


      (c) the encryption of internal network connections and traffic with external parties;


      (d) the cryptographic key management referred to in Article 7, laying down rules on the correct
      use, protection, and lifecycle of cryptographic keys.


      For the purposes of point (b), where encryption of data in use is not possible, financial entities
      shall process data in use in a separated and protected environment, or take equivalent measures
      to ensure the confidentiality, integrity, authenticity, and availability of data.


      3. Financial entities shall include in the policy on encryption and cryptographic controls referred
      to in paragraph 1 criteria for the selection of cryptographic techniques and use practices, taking
      into account leading practices, and standards as defined in Article 2, point (1), of Regulation
      (EU) No 1025/2012, and the classification of relevant ICT assets established in accordance with
      Article 8(1) of Regulation (EU) 2022/2554. Financial entities that are not able to adhere to the
      leading practices or standards, or to use the most reliable techniques, shall adopt mitigation and
      monitoring measures that ensure resilience against cyber threats.


      4. Financial entities shall include in the policy on encryption and cryptographic controls referred
      to in paragraph 1 provisions for updating or changing, where necessary, the cryptographic technology
      on the basis of developments in cryptanalysis. Those updates or changes shall ensure that the cryptographic
      technology remains resilient against cyber threats, as required by Article 10(2), point (a). Financial
      entities that are not able to update or change the cryptographic technology shall adopt mitigation
      and monitoring measures that ensure resilience against cyber threats.


      5. Financial entities shall include in the policy on encryption and cryptographic controls referred
      to in paragraph 1 a requirement to record the adoption of mitigation and monitoring measures adopted
      in accordance with paragraphs 3 and 4 and to provide a reasoned explanation for doing so.'
    section: Artículo 6
    source_sha256: 5dba1d6e9ec10dfbe82d6cc43319e68f416ad3a7d584c401a5678be5c6ce450f
- id: t2c1.art7
  title_es: Gestión de claves criptográficas · artículo 7
  title_en: Cryptographic key management · Article 7
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_7
  attributes:
    official_text_es: '1. Las entidades financieras incluirán en la política de gestión de claves criptográficas
      a que se refiere el artículo 6, apartado 2, letra d), requisitos relativos a la gestión de las claves
      criptográficas a lo largo de todo su ciclo de vida, en particular por lo que respecta a su generación,
      renovación, almacenamiento, copia de seguridad, archivo, recuperación, transmisión, retirada, revocación
      y destrucción.


      2. Las entidades financieras determinarán y aplicarán controles para proteger las claves criptográficas
      a lo largo de todo su ciclo de vida contra la pérdida, el acceso no autorizado, la divulgación y
      la modificación. Las entidades financieras diseñarán dichos controles basándose en los resultados
      de la clasificación de datos aprobada y la evaluación del riesgo relacionado con las TIC.


      3. Las entidades financieras elaborarán y aplicarán métodos para sustituir las claves criptográficas
      en caso de pérdida o cuando esas claves se vean comprometidas o resulten dañadas.


      4. Las entidades financieras crearán y mantendrán un registro de todos los certificados y dispositivos
      de almacenamiento de certificados al menos para los activos de TIC que sustenten funciones esenciales
      o importantes. Las entidades financieras mantendrán actualizado dicho registro.


      5. Las entidades financieras velarán por la rápida renovación de los certificados antes de su expiración.'
    official_text_en: '1. Financial entities shall include in the cryptographic key management policy
      referred to in Article 6(2), point (d), requirements for managing cryptographic keys through their
      whole lifecycle, including generating, renewing, storing, backing up, archiving, retrieving, transmitting,
      retiring, revoking, and destroying those cryptographic keys.


      2. Financial entities shall identify and implement controls to protect cryptographic keys through
      their whole lifecycle against loss, unauthorised access, disclosure, and modification. Financial
      entities shall design those controls on the basis of the results of the approved data classification
      and the ICT risk assessment.


      3. Financial entities shall develop and implement methods to replace the cryptographic keys in the
      case of loss, or where those keys are compromised or damaged.


      4. Financial entities shall create and maintain a register for all certificates and certificate-storing
      devices for at least ICT assets supporting critical or important functions. Financial entities shall
      keep that register up to date.


      5. Financial entities shall ensure the prompt renewal of certificates in advance of their expiration.'
    section: Artículo 7
    source_sha256: 7461047a7958bbc6de7e85777400b958425619d016d5f3a323e2598e2b1eade0
- id: t2c1.art8
  title_es: Políticas y procedimientos relacionados con las operaciones de TIC · artículo 8
  title_en: Policies and procedures for ICT operations · Article 8
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_8
  attributes:
    official_text_es: '1. Dentro de las políticas, procedimientos, protocolos y herramientas en materia
      de seguridad de las TIC a que se refiere el artículo 9, apartado 2, del Reglamento (UE) 2022/2554,
      las entidades financieras elaborarán, documentarán y aplicarán políticas y procedimientos de gestión
      de las operaciones de TIC. Dichas políticas y procedimientos especificarán el modo en que las entidades
      financieras llevarán a cabo la explotación, el seguimiento, el control y la restauración de sus
      activos de TIC, así como la documentación de las operaciones de TIC.


      2. Las políticas y procedimientos relacionados con las operaciones de TIC a que se refiere el apartado
      1 contendrán todos los elementos siguientes:


      a) una descripción de los activos de TIC, incluidos todos los requisitos siguientes: i) requisitos
      relativos a la instalación, el mantenimiento, la configuración y la desinstalación con seguridad
      de un sistema de TIC, ii) requisitos relativos a la gestión de los activos de información utilizados
      por los activos de TIC, en particular su tratamiento y manejo, tanto automatizado como manual, iii)
      requisitos relativos a la identificación de los sistemas de TIC heredados y su control;


      i) requisitos relativos a la instalación, el mantenimiento, la configuración y la desinstalación
      con seguridad de un sistema de TIC,


      ii) requisitos relativos a la gestión de los activos de información utilizados por los activos de
      TIC, en particular su tratamiento y manejo, tanto automatizado como manual,


      iii) requisitos relativos a la identificación de los sistemas de TIC heredados y su control;


      b) controles y seguimiento de los sistemas de TIC, incluidos todos los aspectos siguientes: i) requisitos
      relativos a la copia de seguridad y restauración de los sistemas de TIC, ii) requisitos de planificación,
      teniendo en cuenta las interdependencias entre los sistemas de TIC, iii) protocolos para la pista
      de auditoría y la información de registro del sistema, iv) requisitos para garantizar que la realización
      de auditorías internas y otras pruebas cause las mínimas perturbaciones de las operaciones comerciales,
      v) requisitos relativos a la separación entre los entornos de producción de TIC y los de desarrollo
      y de pruebas y otros entornos distintos del de producción, vi) requisitos para llevar a cabo el
      desarrollo y las pruebas en entornos separados del entorno de producción, vii) requisitos para llevar
      a cabo el desarrollo y las pruebas en entornos de producción;


      i) requisitos relativos a la copia de seguridad y restauración de los sistemas de TIC,


      ii) requisitos de planificación, teniendo en cuenta las interdependencias entre los sistemas de
      TIC,


      iii) protocolos para la pista de auditoría y la información de registro del sistema,


      iv) requisitos para garantizar que la realización de auditorías internas y otras pruebas cause las
      mínimas perturbaciones de las operaciones comerciales,


      v) requisitos relativos a la separación entre los entornos de producción de TIC y los de desarrollo
      y de pruebas y otros entornos distintos del de producción,


      vi) requisitos para llevar a cabo el desarrollo y las pruebas en entornos separados del entorno
      de producción,


      vii) requisitos para llevar a cabo el desarrollo y las pruebas en entornos de producción;


      c) gestión de errores en relación con los sistemas de TIC, incluidos todos los aspectos siguientes:
      i) procedimientos y protocolos para la gestión de errores, ii) contactos para asistencia y traslado
      a una instancia jerárquica superior, incluidos los contactos externos para asistencia en caso de
      problemas operativos o técnicos imprevistos, iii) procedimientos de reinicio, reversión y recuperación
      de los sistemas de TIC en caso de interrupción de dichos sistemas.


      i) procedimientos y protocolos para la gestión de errores,


      ii) contactos para asistencia y traslado a una instancia jerárquica superior, incluidos los contactos
      externos para asistencia en caso de problemas operativos o técnicos imprevistos,


      iii) procedimientos de reinicio, reversión y recuperación de los sistemas de TIC en caso de interrupción
      de dichos sistemas.


      A efectos de la separación a que se refiere la letra b), inciso v), se tendrán en cuenta todos los
      componentes del entorno, incluidas las cuentas, los datos o las conexiones, tal como se exige en
      el artículo 13, apartado 1, letra a).


      A efectos de la letra b), inciso vii), las políticas y procedimientos a que se refiere el apartado
      1 dispondrán que los casos en que se realicen pruebas en un entorno de producción estén claramente
      definidos y motivados, sean de duración limitada y cuenten con la aprobación de la función pertinente,
      de conformidad con el artículo 16, apartado 6. Las entidades financieras garantizarán la disponibilidad,
      confidencialidad, integridad y autenticidad de los sistemas de TIC y los datos de producción durante
      las actividades de desarrollo y prueba en el entorno de producción.'
    official_text_en: '1. As part of the ICT security policies, procedures, protocols, and tools referred
      to in Article 9(2) of Regulation (EU) 2022/2554, financial entities shall develop, document, and
      implement policies and procedures to manage the ICT operations. Those policies and procedures shall
      specify how financial entities operate, monitor, control, and restore their ICT assets, including
      the documentation of ICT operations.


      2. The policies and procedures for ICT operations referred to in paragraph 1 shall contain all of
      the following:


      (a) an ICT assets description, including all of the following: (i) requirements regarding secure
      installation, maintenance, configuration, and deinstallation of an ICT system; (ii) requirements
      regarding the management of information assets used by ICT assets, including their processing and
      handling, both automated and manual; (iii) requirements regarding the identification and control
      of legacy ICT systems;


      (i) requirements regarding secure installation, maintenance, configuration, and deinstallation of
      an ICT system;


      (ii) requirements regarding the management of information assets used by ICT assets, including their
      processing and handling, both automated and manual;


      (iii) requirements regarding the identification and control of legacy ICT systems;


      (b) controls and monitoring of ICT systems, including all of the following: (i) backup and restore
      requirements of ICT systems; (ii) scheduling requirements, taking into consideration interdependencies
      among the ICT systems; (iii) protocols for audit-trail and system log information; (iv) requirements
      to ensure that the performance of internal audit and other testing minimises disruptions to business
      operations; (v) requirements on the separation of ICT production environments from the development,
      testing, and other non-production environments; (vi) requirements to conduct the development and
      testing in environments which are separated from the production environment; (vii) requirements
      to conduct the development and testing in production environments;


      (i) backup and restore requirements of ICT systems;


      (ii) scheduling requirements, taking into consideration interdependencies among the ICT systems;


      (iii) protocols for audit-trail and system log information;


      (iv) requirements to ensure that the performance of internal audit and other testing minimises disruptions
      to business operations;


      (v) requirements on the separation of ICT production environments from the development, testing,
      and other non-production environments;


      (vi) requirements to conduct the development and testing in environments which are separated from
      the production environment;


      (vii) requirements to conduct the development and testing in production environments;


      (c) error handling concerning ICT systems, including all of the following: (i) procedures and protocols
      for handling errors; (ii) support and escalation contacts, including external support contacts in
      case of unexpected operational or technical issues; (iii) ICT system restart, rollback, and recovery
      procedures for use in the event of ICT system disruption.


      (i) procedures and protocols for handling errors;


      (ii) support and escalation contacts, including external support contacts in case of unexpected
      operational or technical issues;


      (iii) ICT system restart, rollback, and recovery procedures for use in the event of ICT system disruption.


      For the purposes of point (b)(v), the separation shall consider all of the components of the environment,
      including accounts, data or connections, as required by Article 13, first subparagraph, point (a).


      For the purposes of point (b)(vii), the policies and procedures referred to in paragraph 1 shall
      provide that the instances in which testing is performed in a production environment are clearly
      identified, reasoned, are for limited periods of time, and are approved by the relevant function
      in accordance with Article 16(6). Financial entities shall ensure the availability, confidentiality,
      integrity, and authenticity of ICT systems and production data during development and test activities
      in the production environment.'
    section: Artículo 8
    source_sha256: 52d7b6ff65fea4c2e253c1c1d7fe50486fa4f5b81b9bc1515fa1ef464b7ddf61
- id: t2c1.art9
  title_es: Gestión de la capacidad y el rendimiento · artículo 9
  title_en: Capacity and performance management · Article 9
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_9
  attributes:
    official_text_es: '1. Dentro de las políticas, procedimientos, protocolos y herramientas en materia
      de seguridad de las TIC a que se refiere el artículo 9, apartado 2, del Reglamento (UE) 2022/2554,
      las entidades financieras elaborarán, documentarán y aplicarán procedimientos de gestión de la capacidad
      y el rendimiento a efectos de:


      a) la determinación de los requisitos de capacidad de sus sistemas de TIC;


      b) la aplicación de la optimización de recursos;


      c) los procedimientos de seguimiento para el mantenimiento y la mejora de: i) la disponibilidad
      de datos y de los sistemas de TIC, ii) la eficiencia de los sistemas de TIC, iii) la prevención
      de la falta de capacidad en materia de TIC.


      i) la disponibilidad de datos y de los sistemas de TIC,


      ii) la eficiencia de los sistemas de TIC,


      iii) la prevención de la falta de capacidad en materia de TIC.


      2. Los procedimientos de gestión de la capacidad y el rendimiento a que se refiere el apartado 1
      garantizarán que las entidades financieras adopten medidas adecuadas para tener en cuenta las especificidades
      de los sistemas de TIC con procesos de adquisición o aprobación largos o complejos o los sistemas
      de TIC que requieren un uso intensivo de recursos.'
    official_text_en: '1. As part of the ICT security policies, procedures, protocols, and tools referred
      to in Article 9(2) of Regulation (EU) 2022/2554, financial entities shall develop, document, and
      implement capacity and performance management procedures for the following:


      (a) the identification of capacity requirements of their ICT systems;


      (b) the application of resource optimisation;


      (c) the monitoring procedures for maintaining and improving: (i) the availability of data and ICT
      systems; (ii) the efficiency of ICT systems; (iii) the prevention of ICT capacity shortages.


      (i) the availability of data and ICT systems;


      (ii) the efficiency of ICT systems;


      (iii) the prevention of ICT capacity shortages.


      2. The capacity and performance management procedures referred to in paragraph 1 shall ensure that
      financial entities take measures that are appropriate to cater for the specificities of ICT systems
      with long or complex procurement or approval processes or ICT systems that are resource-intensive.'
    section: Artículo 9
    source_sha256: f491da67aa674518b1c2a93c1e11400b9c1078d8bd4771d9d72f96fa700ba99d
- id: t2c1.art10
  title_es: Gestión de vulnerabilidades y parches · artículo 10
  title_en: Vulnerability and patch management · Article 10
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_10
  attributes:
    official_text_es: '1. Dentro de las políticas, procedimientos, protocolos y herramientas en materia
      de seguridad de las TIC a que se refiere el artículo 9, apartado 2, del Reglamento (UE) 2022/2554,
      las entidades financieras elaborarán, documentarán y aplicarán procedimientos de gestión de vulnerabilidades.


      2. Los procedimientos de gestión de vulnerabilidades a que se refiere el apartado 1 deberán:


      a) determinar los recursos de información que sean pertinentes y fiables para desarrollar y mantener
      la sensibilización sobre las vulnerabilidades, y actualizarlos;


      b) garantizar la realización de exploraciones y evaluaciones automatizadas de vulnerabilidad de
      los activos de TIC cuya frecuencia y alcance serán acordes con la clasificación establecida de conformidad
      con el artículo 8, apartado 1, del Reglamento (UE) 2022/2554 y con el perfil de riesgo general del
      activo de TIC;


      c) verificar: i) si los proveedores terceros de servicios de TIC gestionan las vulnerabilidades
      relacionadas con los servicios de TIC prestados a la entidad financiera, ii) si dichos proveedores
      de servicios informan a la entidad financiera al menos de las vulnerabilidades graves y de las estadísticas
      y tendencias de manera oportuna;


      i) si los proveedores terceros de servicios de TIC gestionan las vulnerabilidades relacionadas con
      los servicios de TIC prestados a la entidad financiera,


      ii) si dichos proveedores de servicios informan a la entidad financiera al menos de las vulnerabilidades
      graves y de las estadísticas y tendencias de manera oportuna;


      d) hacer un seguimiento del uso de: i) las bibliotecas de terceros, incluidas las bibliotecas de
      código abierto, a las que recurran los servicios de TIC que sustentan funciones esenciales o importantes,
      ii) los servicios de TIC desarrollados por la propia entidad financiera o personalizados o desarrollados
      específicamente para la entidad financiera por un proveedor tercero de servicios de TIC;


      i) las bibliotecas de terceros, incluidas las bibliotecas de código abierto, a las que recurran
      los servicios de TIC que sustentan funciones esenciales o importantes,


      ii) los servicios de TIC desarrollados por la propia entidad financiera o personalizados o desarrollados
      específicamente para la entidad financiera por un proveedor tercero de servicios de TIC;


      e) establecer procedimientos para la divulgación responsable de las vulnerabilidades a los clientes,
      las contrapartes y el público;


      f) dar prioridad a la implementación de parches y otras medidas de mitigación para hacer frente
      a las vulnerabilidades detectadas;


      g) hacer un seguimiento de la subsanación de las vulnerabilidades y verificar esa subsanación;


      h) exigir el registro de toda vulnerabilidad detectada que afecte a los sistemas de TIC y el seguimiento
      de su resolución.


      A efectos de la letra b), las entidades financieras llevarán a cabo las exploraciones y evaluaciones
      automatizadas de vulnerabilidad al menos semanalmente en el caso de los activos de TIC que sustenten
      funciones esenciales o importantes.


      A efectos de la letra c), las entidades financieras solicitarán a los proveedores terceros de servicios
      de TIC que investiguen las vulnerabilidades pertinentes, determinen las causas subyacentes y apliquen
      las medidas de mitigación adecuadas.


      A efectos de la letra d), las entidades financieras, en su caso en colaboración con el proveedor
      tercero de servicios de TIC, harán un seguimiento de la versión y las posibles actualizaciones de
      las bibliotecas de terceros. En el caso de los activos de TIC o componentes de activos de TIC listos
      para usar (off-the-shelf) que se adquieran y utilicen en la explotación de servicios de TIC que
      no sustenten funciones esenciales o importantes, las entidades financieras harán, en la medida de
      lo posible, un seguimiento del uso de bibliotecas de terceros, incluidas las bibliotecas de código
      abierto.


      A efectos de la letra f), las entidades financieras tendrán en cuenta la gravedad de la vulnerabilidad,
      la clasificación establecida de conformidad con el artículo 8, apartado 1, del Reglamento (UE) 2022/2554
      y el perfil de riesgo de los activos de TIC afectados por las vulnerabilidades detectadas.


      3. Dentro de las políticas, procedimientos, protocolos y herramientas en materia de seguridad de
      las TIC a que se refiere el artículo 9, apartado 2, del Reglamento (UE) 2022/2554, las entidades
      financieras elaborarán, documentarán y aplicarán procedimientos de gestión de parches.


      4. Los procedimientos de gestión de parches a que se refiere el apartado 3 deberán:


      a) en la medida de lo posible, determinar y evaluar los parches de software y hardware y las actualizaciones
      disponibles utilizando herramientas automatizadas;


      b) determinar los procedimientos de emergencia para el parcheo y la actualización de los activos
      de TIC;


      c) probar e implementar los parches de software y hardware y las actualizaciones con arreglo al
      artículo 8, apartado 2, letra b), incisos v), vi) y vii);


      d) fijar plazos para la instalación de parches de software y hardware y actualizaciones y establecer
      procedimientos de traslado a la instancia jerárquica superior en caso de que dichos plazos no puedan
      cumplirse.'
    official_text_en: '1. As part of the ICT security policies, procedures, protocols, and tools referred
      to in Article 9(2) of Regulation (EU) 2022/2554, financial entities shall develop, document, and
      implement vulnerability management procedures.


      2. The vulnerability management procedures referred to in paragraph 1 shall:


      (a) identify and update relevant and trustworthy information resources to build and maintain awareness
      about vulnerabilities;


      (b) ensure the performance of automated vulnerability scanning and assessments on ICT assets, whereby
      the frequency and scope of those activities shall be commensurate to the classification established
      in accordance with Article 8(1) of Regulation (EU) 2022/2554 and the overall risk profile of the
      ICT asset;


      (c) verify whether: (i) ICT third-party service providers handle vulnerabilities related to the
      ICT services provided to the financial entity; (ii) whether those service providers report to the
      financial entity at least the critical vulnerabilities and statistics and trends in a timely manner;


      (i) ICT third-party service providers handle vulnerabilities related to the ICT services provided
      to the financial entity;


      (ii) whether those service providers report to the financial entity at least the critical vulnerabilities
      and statistics and trends in a timely manner;


      (d) track the usage of: (i) third-party libraries, including open-source libraries, used by ICT
      services supporting critical or important functions; (ii) ICT services developed by the financial
      entity itself or specifically customised or developed for the financial entity by an ICT third-party
      service provider;


      (i) third-party libraries, including open-source libraries, used by ICT services supporting critical
      or important functions;


      (ii) ICT services developed by the financial entity itself or specifically customised or developed
      for the financial entity by an ICT third-party service provider;


      (e) establish procedures for the responsible disclosure of vulnerabilities to clients, counterparties,
      and to the public;


      (f) prioritise the deployment of patches and other mitigation measures to address the vulnerabilities
      identified;


      (g) monitor and verify the remediation of vulnerabilities;


      (h) require the recording of any detected vulnerabilities affecting ICT systems and the monitoring
      of their resolution.


      For the purposes of point (b), financial entities shall perform the automated vulnerability scanning
      and assessments on ICT assets for the ICT assets supporting critical or important functions on at
      least a weekly basis.


      For the purposes of point (c), financial entities shall request that ICT third-party service providers
      investigate the relevant vulnerabilities, determine the root causes, and implement appropriate mitigating
      action.


      For the purposes of point (d), financial entities shall, where appropriate in collaboration with
      the ICT third-party service provider, monitor the version and possible updates of the third-party
      libraries. In case of ready to use (off-the-shelf) ICT assets or components of ICT assets acquired
      and used in the operation of ICT services not supporting critical or important functions, financial
      entities shall track the usage to the extent possible of third-party libraries, including open-source
      libraries.


      For the purposes of point (f), financial entities shall consider the criticality of the vulnerability,
      the classification established in accordance with Article 8(1) of Regulation (EU) 2022/2554, and
      the risk profile of the ICT assets affected by the identified vulnerabilities.


      3. As part of the ICT security policies, procedures, protocols, and tools referred to in Article
      9(2) of Regulation (EU) 2022/2554, financial entities shall develop, document and implement patch
      management procedures.


      4. The patch management procedures referred to in paragraph 3 shall:


      (a) to the extent possible identify and evaluate available software and hardware patches and updates
      using automated tools;


      (b) identify emergency procedures for the patching and updating of ICT assets;


      (c) test and deploy the software and hardware patches and the updates referred to in Article 8(2),
      points (b)(v), (vi) and (vii);


      (d) set deadlines for the installation of software and hardware patches and updates and escalation
      procedures in case those deadlines cannot be met.'
    section: Artículo 10
    source_sha256: 7ae4f832bf65773dcea91e3cbcc6660113d5f729359754b141ae855f20b84d62
- id: t2c1.art11
  title_es: Seguridad de los datos y sistemas · artículo 11
  title_en: Data and system security · Article 11
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_11
  attributes:
    official_text_es: '1. Dentro de las políticas, procedimientos, protocolos y herramientas en materia
      de seguridad de las TIC a que se refiere el artículo 9, apartado 2, del Reglamento (UE) 2022/2554,
      las entidades financieras elaborarán, documentarán y aplicarán un procedimiento de seguridad de
      los datos y sistemas.


      2. El procedimiento de seguridad de los datos y sistemas a que se refiere el apartado 1 contendrá
      todos los elementos relacionados con la seguridad de los datos y los sistemas de TIC que se indican
      a continuación, teniendo en cuenta la clasificación establecida de conformidad con el artículo 8,
      apartado 1, del Reglamento (UE) 2022/2554:


      a) las restricciones de acceso a que se refiere el artículo 21 del presente Reglamento, que respaldarán
      los requisitos de protección de cada nivel de clasificación;


      b) la determinación de una configuración segura de referencia para los activos de TIC que minimice
      su exposición a ciberamenazas y medidas para verificar periódicamente que dicha configuración se
      aplique de manera efectiva;


      c) la determinación de medidas de seguridad para garantizar que únicamente se instale software autorizado
      en los sistemas de TIC y los dispositivos de nodo final;


      d) la determinación de medidas de seguridad contra códigos maliciosos;


      e) la determinación de medidas de seguridad para garantizar que únicamente se utilicen soportes
      de almacenamiento de datos, sistemas y dispositivos de nodo final autorizados a la hora de transferir
      y almacenar datos de la entidad financiera;


      f) los siguientes requisitos para garantizar el uso seguro de los dispositivos de nodo final portátiles
      y los dispositivos de nodo final no portátiles privados: i) el requisito de utilizar una solución
      de gestión para gestionar a distancia los dispositivos de nodo final y borrar a distancia los datos
      de la entidad financiera, ii) el requisito de utilizar mecanismos de seguridad que no puedan ser
      modificados, retirados o eludidos sin autorización por los miembros del personal o los proveedores
      terceros de servicios de TIC, iii) el requisito de utilizar dispositivos de almacenamiento de datos
      extraíbles únicamente cuando el riesgo residual relacionado con las TIC permanezca dentro del nivel
      de tolerancia al riesgo de la entidad financiera a que se refiere el artículo 3, apartado 1, letra
      a);


      i) el requisito de utilizar una solución de gestión para gestionar a distancia los dispositivos
      de nodo final y borrar a distancia los datos de la entidad financiera,


      ii) el requisito de utilizar mecanismos de seguridad que no puedan ser modificados, retirados o
      eludidos sin autorización por los miembros del personal o los proveedores terceros de servicios
      de TIC,


      iii) el requisito de utilizar dispositivos de almacenamiento de datos extraíbles únicamente cuando
      el riesgo residual relacionado con las TIC permanezca dentro del nivel de tolerancia al riesgo de
      la entidad financiera a que se refiere el artículo 3, apartado 1, letra a);


      g) el proceso para la supresión segura de los datos que se encuentren en los locales de la entidad
      financiera o estén almacenados externamente y que la entidad financiera ya no necesite recopilar
      o almacenar;


      h) el proceso para desechar o desactivar de forma segura los dispositivos de almacenamiento de datos
      que se encuentren en los locales de la entidad financiera o estén almacenados externamente y que
      contengan información confidencial;


      i) la determinación y aplicación de medidas de seguridad para prevenir la pérdida y fuga de datos
      en relación con los sistemas y dispositivos de nodo final;


      j) la aplicación de medidas de seguridad para garantizar que el teletrabajo y el uso de dispositivos
      de nodo final privados no incidan negativamente en la seguridad de las TIC de la entidad financiera;


      k) en el caso de los activos o servicios de TIC explotados por un proveedor tercero de servicios
      de TIC, la determinación y aplicación de requisitos para mantener la resiliencia operativa digital,
      de conformidad con los resultados de la clasificación de datos y la evaluación del riesgo relacionado
      con las TIC.


      A efectos de la letra b), la configuración segura de referencia contemplada en dicha letra tendrá
      en cuenta las prácticas punteras y las técnicas adecuadas establecidas en las normas que se definen
      en el artículo 2, punto 1, del Reglamento (UE) n.o 1025/2012.


      A efectos de la letra k), las entidades financieras tendrán en cuenta lo siguiente:


      a) la aplicación de los parámetros recomendados por los proveedores en los elementos explotados
      por la entidad financiera;


      b) una distribución clara de funciones y responsabilidades en materia de seguridad de la información
      entre la entidad financiera y el proveedor tercero de servicios de TIC, de conformidad con el principio
      de plena responsabilidad de la entidad financiera respecto de su proveedor tercero de servicios
      de TIC a que se refiere el artículo 28, apartado 1, letra a), del Reglamento (UE) 2022/2554, y,
      en el caso de las entidades financieras a que se refiere el artículo 28, apartado 2, del mismo Reglamento,
      de conformidad con la política de la entidad financiera sobre el uso de servicios de TIC que sustentan
      funciones esenciales o importantes;


      c) la necesidad de garantizar y mantener las competencias adecuadas dentro de la entidad financiera
      en lo referente a la gestión y seguridad del servicio utilizado;


      d) medidas técnicas y organizativas destinadas a minimizar los riesgos relacionados con la infraestructura
      utilizada por el proveedor tercero para prestar sus servicios de TIC, teniendo en cuenta las prácticas
      punteras y las normas definidas en el artículo 2, punto 1, del Reglamento (UE) n.o 1025/2012.'
    official_text_en: '1. As part of the ICT security policies, procedures, protocols, and tools referred
      to in Article 9(2) of Regulation (EU) 2022/2554, financial entities shall develop, document, and
      implement a data and system security procedure.


      2. The data and system security procedure referred to in paragraph 1 shall contain all of the following
      elements related to data and ICT system security, in accordance with the classification established
      in accordance with Article 8(1) of Regulation (EU) 2022/2554:


      (a) the access restrictions referred to in Article 21 of this Regulation, supporting the protection
      requirements for each level of classification;


      (b) the identification of a secure configuration baseline for ICT assets that minimise exposure
      of those ICT assets to cyber threats and measures to verify regularly that those baselines are effectively
      deployed;


      (c) the identification of security measures to ensure that only authorised software is installed
      in ICT systems and endpoint devices;


      (d) the identification of security measures against malicious codes;


      (e) the identification of security measures to ensure that only authorised data storage media, systems,
      and endpoint devices are used to transfer and store data of the financial entity;


      (f) the following requirements to secure the use of portable endpoint devices and private non-portable
      endpoint devices: (i) the requirement to use a management solution to remotely manage the endpoint
      devices and remotely wipe the financial entity’s data; (ii) the requirement to use security mechanisms
      that cannot be modified, removed or bypassed by staff members or ICT third-party service providers
      in an unauthorised manner; (iii) the requirement to use removable data storage devices only where
      the residual ICT risk remains within the financial entity’s risk tolerance level referred to in
      Article 3, first subparagraph, point (a);


      (i) the requirement to use a management solution to remotely manage the endpoint devices and remotely
      wipe the financial entity’s data;


      (ii) the requirement to use security mechanisms that cannot be modified, removed or bypassed by
      staff members or ICT third-party service providers in an unauthorised manner;


      (iii) the requirement to use removable data storage devices only where the residual ICT risk remains
      within the financial entity’s risk tolerance level referred to in Article 3, first subparagraph,
      point (a);


      (g) the process to securely delete data, present on premises of the financial entity or stored externally,
      that the financial entity no longer needs to collect or to store;


      (h) the process to securely dispose or decommission of data storage devices present on premises
      of the financial entity or stored externally containing confidential information;


      (i) the identification and implementation of security measures to prevent data loss and leakage
      for systems and endpoint devices;


      (j) the implementation of security measures to ensure that teleworking and the use of private endpoint
      devices does not adversely impact the ICT security of the financial entity;


      (k) for ICT assets or services operated by an ICT third-party service provider, the identification
      and implementation of requirements to maintain digital operational resilience, in accordance with
      the results of the data classification and ICT risk assessment.


      For the purposes of point (b), the secure configuration baseline referred to in that point shall
      take into account leading practices and appropriate techniques laid down in the standards defined
      in Article 2, point (1), of Regulation (EU) No 1025/2012.


      For the purposes of point (k), financial entities shall consider the following:


      (a) the implementation of vendor recommended settings on the elements operated by the financial
      entity;


      (b) a clear allocation of information security roles and responsibilities between the financial
      entity and the ICT third-party service provider, in accordance with the principle of full responsibility
      of the financial entity over its ICT third-party service provider referred to in Article 28(1),
      point (a), of Regulation (EU) 2022/2554, and for financial entities referred to in Article 28(2)
      of that Regulation, and in accordance with the financial entity’s policy on the use of ICT services
      supporting critical or important functions;


      (c) the need to ensure and maintain adequate competences within the financial entity in the management
      and security of the service used;


      (d) technical and organisational measures to minimise the risks related to the infrastructure used
      by the ICT third-party service provider for its ICT services, considering leading practices, and
      standards as defined in Article 2, point (1), of Regulation (EU) No 1025/2012.'
    section: Artículo 11
    source_sha256: 9b98893b7502e71a2f6fe13fa920797033c46d86dfb75981a94ef32a6021ac1a
- id: t2c1.art12
  title_es: Registros · artículo 12
  title_en: Logging · Article 12
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_12
  attributes:
    official_text_es: '1. Dentro de las salvaguardias contra las intrusiones y el uso indebido de los
      datos, las entidades financieras elaborarán, documentarán y aplicarán procedimientos, protocolos
      y herramientas de registro.


      2. Los procedimientos, protocolos y herramientas de registro a que se refiere el apartado 1 contendrán
      todos los aspectos siguientes:


      a) la determinación de los hechos que deben registrarse, el período de conservación de los registros
      y las medidas para proteger y gestionar los datos de los registros, teniendo en cuenta la finalidad
      para la que se crean tales registros;


      b) la correspondencia entre el nivel de detalle de los registros y su finalidad y uso, a fin de
      permitir la detección eficaz de las actividades anómalas a que se refiere el artículo 24;


      c) el requisito de registrar los hechos relacionados con todos los aspectos siguientes: i) el control
      del acceso lógico y físico a que se refiere el artículo 21 y la gestión de la identidad, ii) la
      gestión de la capacidad, iii) la gestión de cambios, iv) las operaciones de TIC, incluidas las actividades
      de los sistemas de TIC, v) las actividades de tráfico de red, incluido el rendimiento de las redes
      de TIC;


      i) el control del acceso lógico y físico a que se refiere el artículo 21 y la gestión de la identidad,


      ii) la gestión de la capacidad,


      iii) la gestión de cambios,


      iv) las operaciones de TIC, incluidas las actividades de los sistemas de TIC,


      v) las actividades de tráfico de red, incluido el rendimiento de las redes de TIC;


      d) medidas para proteger los sistemas de registro y la información de los registros contra la manipulación,
      la supresión y el acceso no autorizado en reposo, en tránsito y, en su caso, en uso;


      e) medidas para detectar fallos en los sistemas de registro;


      f) sin perjuicio de los requisitos normativos aplicables en virtud del Derecho de la Unión o nacional,
      la sincronización de los relojes de cada uno de los sistemas de TIC de la entidad financiera con
      una fuente de tiempo de referencia fiable y documentada.


      A efectos de la letra a), las entidades financieras establecerán el período de conservación teniendo
      en cuenta los objetivos empresariales y de seguridad de la información, el motivo por el que se
      registra el correspondiente hecho y los resultados de la evaluación del riesgo relacionado con las
      TIC.'
    official_text_en: '1. Financial entities shall, as part of the safeguards against intrusions and data
      misuse, develop, document, and implement logging procedures, protocols and tools.


      2. The logging procedures, protocols, and tools referred to in paragraph 1 shall contain all of
      the following:


      (a) the identification of the events to be logged, the retention period of the logs, and the measures
      to secure and handle the log data, considering the purpose for which the logs are created;


      (b) the alignment of the level of detail of the logs with their purpose and usage to enable the
      effective detection of anomalous activities as referred to in Article 24;


      (c) the requirement to log events related to all of the following: (i) logical and physical access
      control, as referred to in Article 21, and identity management; (ii) capacity management; (iii)
      change management; (iv) ICT operations, including ICT system activities; (v) network traffic activities,
      including ICT network performance;


      (i) logical and physical access control, as referred to in Article 21, and identity management;


      (ii) capacity management;


      (iii) change management;


      (iv) ICT operations, including ICT system activities;


      (v) network traffic activities, including ICT network performance;


      (d) measures to protect logging systems and log information against tampering, deletion, and unauthorised
      access at rest, in transit, and, where relevant, in use;


      (e) measures to detect a failure of logging systems;


      (f) without prejudice to any applicable regulatory requirements under Union or national law, the
      synchronisation of the clocks of each of the financial entity’s ICT systems upon a documented reliable
      reference time source.


      For the purposes of point (a), financial entities shall establish the retention period, taking into
      account the business and information security objectives, the reason for recording the event in
      the logs, and the results of the ICT risk assessment.'
    section: Artículo 12
    source_sha256: 26289181d680be9873ac57052775b3475e5db23619f6643e851c502d61a5b2fc
- id: t2c1.art13
  title_es: Gestión de la seguridad de las redes · artículo 13
  title_en: Network security management · Article 13
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_13
  attributes:
    official_text_es: 'Dentro de las salvaguardias que garanticen la seguridad de las redes contra las
      intrusiones y el uso indebido de los datos, las entidades financieras elaborarán, documentarán y
      aplicarán políticas, procedimientos, protocolos y herramientas en materia de gestión de la seguridad
      de las redes que incluirán todos los aspectos siguientes:


      a) la separación y segmentación de los sistemas y redes de TIC teniendo en cuenta: i) el carácter
      esencial o la importancia de la función sustentada por dichos sistemas y redes de TIC, ii) la clasificación
      establecida de conformidad con el artículo 8, apartado 1, del Reglamento (UE) 2022/2554, iii) el
      perfil de riesgo general de los activos de TIC que utilicen dichos sistemas y redes de TIC;


      i) el carácter esencial o la importancia de la función sustentada por dichos sistemas y redes de
      TIC,


      ii) la clasificación establecida de conformidad con el artículo 8, apartado 1, del Reglamento (UE)
      2022/2554,


      iii) el perfil de riesgo general de los activos de TIC que utilicen dichos sistemas y redes de TIC;


      b) la documentación de todas las conexiones de red y flujos de datos de la entidad financiera;


      c) el uso de una red separada y específica para la administración de los activos de TIC;


      d) la determinación y aplicación de controles de acceso a las redes para prevenir y detectar las
      conexiones a la red de la entidad financiera mediante cualquier dispositivo o sistema no autorizado
      o cualquier nodo final que no cumpla los requisitos de seguridad de la entidad financiera;


      e) el cifrado de las conexiones de red que pasen por redes corporativas, redes públicas, redes domésticas,
      redes de terceros y redes inalámbricas, en lo referente a los protocolos de comunicación utilizados,
      teniendo en cuenta los resultados de la clasificación de datos aprobada, los resultados de la evaluación
      del riesgo relacionado con las TIC y el cifrado de las conexiones de red a que se refiere el artículo
      6, apartado 2;


      f) el diseño de las redes en consonancia con los requisitos de seguridad de las TIC establecidos
      por la entidad financiera, teniendo en cuenta las prácticas punteras para garantizar la confidencialidad,
      integridad y disponibilidad de las redes;


      g) la protección del tráfico de red entre las redes internas e internet y otras conexiones externas;


      h) la determinación de las funciones y responsabilidades y de las etapas para la especificación,
      aplicación, aprobación, modificación y revisión de las reglas cortafuegos y los filtros de conexión;


      i) la revisión de la arquitectura de las redes y del diseño de la seguridad de las redes una vez
      al año, y periódicamente en el caso de las microempresas, con el fin de detectar posibles vulnerabilidades;


      j) las medidas para aislar temporalmente, en caso necesario, las subredes y los componentes y dispositivos
      de red;


      k) la aplicación de una configuración segura de referencia de todos los componentes de las redes
      y el endurecimiento de las redes y de los dispositivos de red en consonancia con las instrucciones
      de los proveedores, las normas definidas en el artículo 2, punto 1, del Reglamento (UE) n.o 1025/2012,
      en su caso, y las prácticas punteras;


      l) los procedimientos para limitar, bloquear y cerrar las sesiones de sistema y a distancia tras
      un período de inactividad especificado;


      m) respecto de los acuerdos de servicios de red: i) la determinación y especificación de las medidas
      de seguridad de las TIC y de la información, los niveles de servicio y los requisitos de gestión
      de todos los servicios de red, ii) la especificación de si dichos servicios son prestados por un
      proveedor intragrupo o por proveedores terceros de servicios de TIC.


      i) la determinación y especificación de las medidas de seguridad de las TIC y de la información,
      los niveles de servicio y los requisitos de gestión de todos los servicios de red,


      ii) la especificación de si dichos servicios son prestados por un proveedor intragrupo o por proveedores
      terceros de servicios de TIC.


      A efectos de la letra h), las entidades financieras revisarán periódicamente las reglas cortafuegos
      y los filtros de conexión teniendo en cuenta la clasificación establecida de conformidad con el
      artículo 8, apartado 1, del Reglamento (UE) 2022/2554 y el perfil de riesgo general de los sistemas
      de TIC que intervengan. En el caso de los sistemas de TIC que sustenten funciones esenciales o importantes,
      las entidades financieras verificarán la adecuación de las reglas cortafuegos y los filtros de conexión
      vigentes al menos cada seis meses.'
    official_text_en: 'Financial entities shall, as part of the safeguards ensuring the security of networks
      against intrusions and data misuse, develop, document, and implement policies, procedures, protocols,
      and tools on network security management, including all of the following:


      (a) the segregation and segmentation of ICT systems and networks taking into account: (i) the criticality
      or importance of the function those ICT systems and networks support; (ii) the classification established
      in accordance with Article 8(1) of Regulation (EU) 2022/2554; (iii) the overall risk profile of
      ICT assets using those ICT systems and networks;


      (i) the criticality or importance of the function those ICT systems and networks support;


      (ii) the classification established in accordance with Article 8(1) of Regulation (EU) 2022/2554;


      (iii) the overall risk profile of ICT assets using those ICT systems and networks;


      (b) the documentation of all of the financial entity’s network connections and data flows;


      (c) the use of a separate and dedicated network for the administration of ICT assets;


      (d) the identification and implementation of network access controls to prevent and detect connections
      to the financial entity’s network by any unauthorised device or system, or any endpoint not meeting
      the financial entity’s security requirements;


      (e) the encryption of network connections passing over corporate networks, public networks, domestic
      networks, third-party networks, and wireless networks, for communication protocols used, taking
      into account the results of the approved data classification, the results of the ICT risk assessment
      and the encryption of network connections referred to in Article 6(2);


      (f) the design of networks in line with the ICT security requirements established by the financial
      entity, taking into account leading practices to ensure the confidentiality, integrity, and availability
      of the network;


      (g) the securing of network traffic between the internal networks and the internet and other external
      connections;


      (h) the identification of the roles and responsibilities and steps for the specification, implementation,
      approval, change, and review of firewall rules and connections filters;


      (i) the performance of reviews of the network architecture and of the network security design once
      a year, and periodically for microenterprises, to identify potential vulnerabilities;


      (j) the measures to temporarily isolate, where necessary, subnetworks, and network components and
      devices;


      (k) the implementation of a secure configuration baseline of all network components, and the hardening
      of the network and of network devices in line with any vendor instructions, where applicable standards,
      as defined in Article 2, point (1), of Regulation (EU) No 1025/2012, and leading practices;


      (l) the procedures to limit, lock, and terminate system and remote sessions after a specified period
      of inactivity;


      (m) for network services agreements: (i) the identification and specification of ICT and information
      security measures, service levels, and management requirements of all network services; (ii) whether
      those services are provided by an ICT intra-group service provider or by ICT third-party service
      providers.


      (i) the identification and specification of ICT and information security measures, service levels,
      and management requirements of all network services;


      (ii) whether those services are provided by an ICT intra-group service provider or by ICT third-party
      service providers.


      For the purposes of point (h), financial entities shall perform the review of firewall rules and
      connections filters on a regular basis in accordance with the classification established in accordance
      with Article 8(1) of Regulation (EU) 2022/2554 and the overall risk profile of ICT systems involved.
      For ICT systems that support critical or important functions, financial entities shall verify the
      adequacy of the existing firewall rules and connection filters at least every 6 months.'
    section: Artículo 13
    source_sha256: 187293fce3f2fa33951b82037bb35e957af39e873541a44609d791def5d3c5d8
- id: t2c1.art14
  title_es: Protección de la información en tránsito · artículo 14
  title_en: Securing information in transit · Article 14
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_14
  attributes:
    official_text_es: '1. Dentro de las salvaguardias para preservar la disponibilidad, autenticidad,
      integridad y confidencialidad de los datos, las entidades financieras elaborarán, documentarán y
      aplicarán políticas, procedimientos, protocolos y herramientas para proteger la información en tránsito.
      Las entidades financieras garantizarán, en particular, lo siguiente:


      a) la disponibilidad, autenticidad, integridad y confidencialidad de los datos durante las transmisiones
      en red y el establecimiento de procedimientos para evaluar el cumplimiento de tales requisitos;


      b) la prevención y detección de fugas de datos y la transferencia segura de información entre la
      entidad financiera y las partes externas;


      c) la aplicación de requisitos de confidencialidad o acuerdos de no divulgación que reflejen las
      necesidades de la entidad financiera en materia de protección de la información, en relación con
      el personal tanto de la entidad financiera como de terceros, y la documentación y revisión periódica
      de dichos requisitos o acuerdos.


      2. Las entidades financieras diseñarán las políticas, procedimientos, protocolos y herramientas
      para la protección de la información en tránsito a que se refiere el apartado 1 basándose en los
      resultados de la clasificación de datos aprobada y de la evaluación del riesgo relacionado con las
      TIC.'
    official_text_en: '1. As part of the safeguards to preserve the availability, authenticity, integrity
      and confidentiality of data, financial entities shall develop, document, and implement the policies,
      procedures, protocols, and tools to protect information in transit. Financial entities shall in
      particular ensure all of the following:


      (a) the availability, authenticity, integrity and confidentiality of data during network transmission,
      and the establishment of procedures to assess compliance with those requirements;


      (b) the prevention and detection of data leakages and the secure transfer of information between
      the financial entity and external parties;


      (c) that requirements on confidentiality or non-disclosure arrangements reflecting the financial
      entity’s needs for the protection of information for both the staff of the financial entity and
      of third parties are implemented, documented, and regularly reviewed.


      2. Financial entities shall design the policies, procedures, protocols, and tools to protect the
      information in transit referred to in paragraph 1 on the basis of the results of the approved data
      classification and of the ICT risk assessment.'
    section: Artículo 14
    source_sha256: 0b74703ef0279d6e27d06383d0800bcb4390052708ced74b3f1326ab24366f09
- id: t2c1.art15
  title_es: Gestión de proyectos de TIC · artículo 15
  title_en: ICT project management · Article 15
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_15
  attributes:
    official_text_es: '1. Dentro de las salvaguardias para preservar la disponibilidad, autenticidad,
      integridad y confidencialidad de los datos, las entidades financieras elaborarán, documentarán y
      aplicarán una política de gestión de proyectos de TIC.


      2. La política de gestión de proyectos de TIC a que se refiere el apartado 1 especificará los elementos
      que garanticen la gestión eficaz de los proyectos de TIC relacionados con la adquisición, el mantenimiento
      y, en su caso, el desarrollo de los sistemas de TIC de la entidad financiera.


      3. La política de gestión de proyectos de TIC a que se refiere el apartado 1 contendrá todos los
      aspectos siguientes:


      a) objetivos de los proyectos de TIC;


      b) gobernanza de los proyectos de TIC, en particular las funciones y responsabilidades;


      c) planificación, calendario y etapas de los proyectos de TIC;


      d) evaluación de los riesgos de los proyectos de TIC;


      e) hitos pertinentes;


      f) requisitos en materia de gestión de los cambios;


      g) sometimiento a prueba de todos los requisitos, entre ellos los requisitos de seguridad, y proceso
      correspondiente de aprobación para la implementación de un sistema de TIC en el entorno de producción.


      4. La política de gestión de proyectos de TIC a que se refiere el apartado 1 garantizará la ejecución
      segura de los proyectos de TIC mediante la facilitación, por el sector o las funciones empresariales
      a los que afecte el proyecto de TIC, de la información y los conocimientos especializados necesarios.


      5. De conformidad con la evaluación de los riesgos de los proyectos de TIC contemplada en el apartado
      3, letra d), la política de gestión de proyectos de TIC a que se refiere el apartado 1 dispondrá
      la obligación de informar al órgano de dirección, tal como se indica a continuación, de la puesta
      en marcha y el avance de los proyectos de TIC que afecten a funciones esenciales o importantes de
      la entidad financiera, así como de los riesgos asociados a tales proyectos:


      a) de forma individual o agregada, dependiendo de la importancia y las dimensiones de los proyectos
      de TIC;


      b) periódicamente y, en caso necesario, en función de hechos específicos.'
    official_text_en: '1. As part of the safeguards to preserve the availability, authenticity, integrity,
      and confidentiality of data, financial entities shall develop, document, and implement an ICT project
      management policy.


      2. The ICT project management policy referred to in paragraph 1 shall specify the elements that
      ensure the effective management of the ICT projects related to the acquisition, maintenance and,
      where applicable, development of the financial entity’s ICT systems.


      3. The ICT project management policy referred to in paragraph 1 shall contain all of the following:


      (a) ICT project objectives;


      (b) ICT project governance, including roles and responsibilities;


      (c) ICT project planning, timeframe, and steps;


      (d) ICT project risk assessment;


      (e) relevant milestones;


      (f) change management requirements;


      (g) the testing of all requirements, including security requirements, and the respective approval
      process when deploying an ICT system in the production environment.


      4. The ICT project management policy referred to in paragraph 1 shall ensure the secure ICT project
      implementation through the provision of the necessary information and expertise from the business
      area or functions impacted by the ICT project.


      5. In accordance with the ICT project risk assessment referred to in paragraph 3, point (d), the
      ICT project management policy referred to in paragraph 1 shall provide that the establishment and
      progress of ICT projects impacting critical or important functions of the financial entity and their
      associated risks are reported to the management body as follows:


      (a) individually or in aggregation, depending on the importance and size of the ICT projects;


      (b) periodically and, where necessary, on an event-driven basis.'
    section: Artículo 15
    source_sha256: e7a28c317e36f1648d853d5bc6323475559710176a354ec99cf315a1d1230533
- id: t2c1.art16
  title_es: Adquisición, desarrollo y mantenimiento de los sistemas de TIC · artículo 16
  title_en: ICT systems acquisition, development, and maintenance · Article 16
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_16
  attributes:
    official_text_es: '1. Dentro de las salvaguardias para preservar la disponibilidad, autenticidad,
      integridad y confidencialidad de los datos, las entidades financieras elaborarán, documentarán y
      aplicarán una política que regule la adquisición, el desarrollo y el mantenimiento de sistemas de
      TIC. Dicha política:


      a) determinará las prácticas de seguridad y las metodologías relacionadas con la adquisición, el
      desarrollo y el mantenimiento de sistemas de TIC;


      b) exigirá la determinación de: i) especificaciones técnicas y especificaciones técnicas de las
      TIC en el sentido del artículo 2, puntos 4 y 5, del Reglamento (UE) n.o 1025/2012, ii) requisitos
      relativos a la adquisición, desarrollo y mantenimiento de sistemas de TIC, prestando especial atención
      a los requisitos de seguridad de las TIC y a su aprobación por la función empresarial pertinente
      y el propietario de los activos de TIC de conformidad con los mecanismos de gobernanza interna de
      la entidad financiera;


      i) especificaciones técnicas y especificaciones técnicas de las TIC en el sentido del artículo 2,
      puntos 4 y 5, del Reglamento (UE) n.o 1025/2012,


      ii) requisitos relativos a la adquisición, desarrollo y mantenimiento de sistemas de TIC, prestando
      especial atención a los requisitos de seguridad de las TIC y a su aprobación por la función empresarial
      pertinente y el propietario de los activos de TIC de conformidad con los mecanismos de gobernanza
      interna de la entidad financiera;


      c) especificará medidas para mitigar el riesgo de alteración no intencionada o de manipulación intencionada
      de los sistemas de TIC durante su desarrollo, mantenimiento e implementación en el entorno de producción.


      2. Las entidades financieras elaborarán, documentarán y aplicarán un procedimiento de adquisición,
      desarrollo y mantenimiento de sistemas de TIC a efectos de la prueba y aprobación de todos los sistemas
      de TIC antes de su uso y después del mantenimiento, de conformidad con el artículo 8, apartado 2,
      letra b), incisos v), vi) y vii). El nivel de las pruebas será acorde con el carácter esencial de
      los procedimientos empresariales y los activos de TIC afectados. Las pruebas estarán diseñadas con
      el objetivo de verificar la idoneidad de los nuevos sistemas de TIC para funcionar según lo previsto,
      así como la calidad del software desarrollado internamente.


      Además de los requisitos establecidos en el párrafo primero, las entidades de contrapartida central
      asociarán al diseño y la realización de las pruebas a que se refiere dicho párrafo, según proceda,
      a:


      a) los miembros compensadores y clientes;


      b) las entidades de contrapartida central interoperables;


      c) otras partes interesadas.


      Además de los requisitos establecidos en el párrafo primero, los depositarios centrales de valores
      asociarán al diseño y la realización de las pruebas a que se refiere dicho párrafo, según proceda,
      a:


      a) los usuarios;


      b) los prestadores de servicios esenciales;


      c) otros depositarios centrales de valores;


      d) otras infraestructuras del mercado;


      e) otras entidades con respecto a las cuales hayan determinado la existencia de interdependencias
      en el marco de su política de continuidad de la actividad.


      3. El procedimiento a que se refiere el apartado 2 incluirá la realización de revisiones de códigos
      fuente que abarquen pruebas tanto estáticas como dinámicas. Dichas pruebas incluirán pruebas de
      seguridad de los sistemas y aplicaciones expuestos a internet de conformidad con el artículo 8,
      apartado 2, letra b), incisos v), vi) y vii). Las entidades financieras deberán:


      a) identificar y analizar las vulnerabilidades y anomalías en el código fuente;


      b) adoptar un plan de acción para hacer frente a esas vulnerabilidades y anomalías;


      c) hacer un seguimiento de la aplicación de dicho plan de acción.


      4. El procedimiento a que se refiere el apartado 2 incluirá pruebas de seguridad de los paquetes
      de software a más tardar en la fase de integración, de conformidad con el artículo 8, apartado 2,
      letra b), incisos v), vi) y vii).


      5. El procedimiento a que se refiere el apartado 2 dispondrá que:


      a) los entornos distintos del de producción únicamente almacenarán datos de producción anonimizados,
      seudonimizados o aleatorizados;


      b) las entidades financieras deberán proteger la integridad y la confidencialidad de los datos en
      los entornos distintos del de producción.


      6. No obstante lo dispuesto en el apartado 5, el procedimiento a que se refiere el apartado 2 podrá
      disponer que los datos de producción se almacenen únicamente para la realización de pruebas específicas,
      durante un tiempo limitado y previa aprobación de la función pertinente, y que dichas pruebas se
      notifiquen a la función de gestión del riesgo relacionado con las TIC.


      7. El procedimiento a que se refiere el apartado 2 incluirá la aplicación de controles para proteger
      la integridad del código fuente de los sistemas de TIC desarrollados internamente o desarrollados
      y entregados a la entidad financiera por un proveedor tercero de servicios de TIC.


      8. El procedimiento a que se refiere el apartado 2 dispondrá que el software propietario y, cuando
      sea factible, el código fuente proporcionado por proveedores terceros de servicios de TIC o procedente
      de proyectos de código abierto se analizarán y someterán a prueba de conformidad con el apartado
      3 antes de su implementación en el entorno de producción.


      9. Los apartados 1 a 8 del presente artículo se aplicarán también a los sistemas de TIC desarrollados
      o gestionados por usuarios ajenos a la función de TIC, utilizando un enfoque basado en el riesgo.'
    official_text_en: '1. As part of the safeguards to preserve the availability, authenticity, integrity,
      and confidentiality of data, financial entities shall develop, document and implement a policy governing
      the acquisition, development, and maintenance of ICT systems. That policy shall:


      (a) identify security practices and methodologies relating to the acquisition, development, and
      maintenance of ICT systems;


      (b) require the identification of: (i) technical specifications and ICT technical specifications,
      as defined in Article 2, points (4) and (5), of Regulation (EU) No 1025/2012; (ii) requirements
      relating to the acquisition, development, and maintenance of ICT systems, with a particular focus
      on ICT security requirements and on their approval by the relevant business function and ICT asset
      owner in accordance with the financial entity’s internal governance arrangements;


      (i) technical specifications and ICT technical specifications, as defined in Article 2, points (4)
      and (5), of Regulation (EU) No 1025/2012;


      (ii) requirements relating to the acquisition, development, and maintenance of ICT systems, with
      a particular focus on ICT security requirements and on their approval by the relevant business function
      and ICT asset owner in accordance with the financial entity’s internal governance arrangements;


      (c) specify measures to mitigate the risk of unintentional alteration or intentional manipulation
      of the ICT systems during the development, maintenance, and deployment of those ICT systems in the
      production environment.


      2. Financial entities shall develop, document, and implement an ICT systems’ acquisition, development,
      and maintenance procedure for the testing and approval of all ICT systems prior to their use and
      after maintenance, in accordance with Article 8(2), point (b), points (v), (vi) and (vii). The level
      of testing shall be commensurate to the criticality of the business procedures and ICT assets concerned.
      The testing shall be designed to verify that new ICT systems are adequate to perform as intended,
      including the quality of the software developed internally.


      Central counterparties shall, in addition to the requirements laid down in the first subparagraph,
      involve, as appropriate, in the design and conduct of the testing referred to in the first subparagraph:


      (a) clearing members and clients;


      (b) interoperable central counterparties;


      (c) other interested parties.


      Central securities depositories shall, in addition to the requirements laid down in the first subparagraph,
      involve, as appropriate, in the design and conduct of the testing referred to in the first subparagraph:


      (a) users;


      (b) critical utilities and critical service providers;


      (c) other central securities depositories;


      (d) other market infrastructures;


      (e) any other institutions with which central securities depositories have identified interdependencies
      in their business continuity policy.


      3. The procedure referred to in paragraph 2 shall contain the performance of source code reviews
      covering both static and dynamic testing. That testing shall contain security testing for internet-exposed
      systems and applications in accordance with Article 8(2), point (b), points (v), (vi) and (vii).
      Financial entities shall:


      (a) identify and analyse vulnerabilities and anomalies in the source code;


      (b) adopt an action plan to address those vulnerabilities and anomalies;


      (c) monitor the implementation of that action plan.


      4. The procedure referred to in paragraph 2 shall contain security testing of software packages
      no later than at the integration phase, in accordance with Article 8(2), points (b)(v), (vi) and(vii).


      5. The procedure referred to in paragraph 2 shall provide that:


      (a) non-production environments only store anonymised, pseudonymised, or randomised production data;


      (b) financial entities are to protect the integrity and confidentiality of data in non-production
      environments.


      6. By way of derogation from paragraph 5, the procedure referred to in paragraph 2 may provide that
      production data are stored only for specific testing occasions, for limited periods of time, and
      following the approval by the relevant function and the reporting of such occasions to the ICT risk
      management function.


      7. The procedure referred to in paragraph 2 shall contain the implementation of controls to protect
      the integrity of the source code of ICT systems that are developed in-house or by an ICT third-party
      service provider and delivered to the financial entity by an ICT third-parties service provider.


      8. The procedure referred to in paragraph 2 shall provide that proprietary software and, where feasible,
      the source code provided by ICT third-party service providers or coming from open-source projects,
      are to be analysed and tested in accordance with paragraph 3 prior to their deployment in the production
      environment.


      9. Paragraph 1 to 8 of this Article shall also apply to ICT systems developed or managed by users
      outside the ICT function, using a risk-based approach.'
    section: Artículo 16
    source_sha256: db903c63d22a7eab7cb0f81e27cad456f1895cf25b26f7b97ebdb91dfa5b374d
- id: t2c1.art17
  title_es: Gestión de cambios en las TIC · artículo 17
  title_en: ICT change management · Article 17
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_17
  attributes:
    official_text_es: '1. Como parte de las salvaguardias para preservar la disponibilidad, autenticidad,
      integridad y confidencialidad de los datos, las entidades financieras incluirán en los procedimientos
      de gestión de cambios en las TIC a que se refiere el artículo 9, apartado 4, letra e), del Reglamento
      (UE) 2022/2554, en relación con todos los cambios en el software, el hardware, los componentes de
      firmware, los sistemas o los parámetros de seguridad, todos los elementos siguientes:


      a) la verificación del cumplimiento de los requisitos de seguridad de las TIC;


      b) mecanismos para garantizar la independencia de las funciones que aprueban los cambios y las funciones
      responsables de solicitar y aplicar dichos cambios;


      c) una descripción clara de las funciones y responsabilidades a fin de garantizar: i) la especificación
      y planificación de los cambios, ii) el diseño de una transición adecuada, iii) el sometimiento a
      prueba y la ultimación de los cambios de manera controlada, iv) la existencia de un aseguramiento
      eficaz de la calidad;


      i) la especificación y planificación de los cambios,


      ii) el diseño de una transición adecuada,


      iii) el sometimiento a prueba y la ultimación de los cambios de manera controlada,


      iv) la existencia de un aseguramiento eficaz de la calidad;


      d) la documentación y comunicación de los detalles de los cambios, en particular: i) el objeto y
      alcance de los cambios, ii) el calendario para la aplicación de los cambios, iii) los resultados
      esperados;


      i) el objeto y alcance de los cambios,


      ii) el calendario para la aplicación de los cambios,


      iii) los resultados esperados;


      e) la determinación de responsabilidades y procedimientos alternativos, en particular responsabilidades
      y procedimientos para abortar un cambio o recuperarse de un cambio que no se ha ejecutado correctamente;


      f) procedimientos, protocolos y herramientas para gestionar los cambios de emergencia que ofrezcan
      las salvaguardias adecuadas;


      g) procedimientos para documentar, reexaminar, evaluar y aprobar los cambios de emergencia tras
      su aplicación, incluidas las soluciones alternativas y los parches;


      h) la determinación de las posibles repercusiones de un cambio sobre las medidas de seguridad de
      las TIC vigentes, y la evaluación de si dicho cambio requiere la adopción de medidas de seguridad
      de las TIC adicionales.


      2. Tras la introducción de cambios significativos en sus sistemas de TIC, las entidades de contrapartida
      central y los depositarios centrales de valores someterán tales sistemas a pruebas estrictas mediante
      la simulación de condiciones de tensión.


      Las entidades de contrapartida central asociarán al diseño y la realización de las pruebas a que
      se refiere el párrafo primero, según proceda, a:


      a) los miembros compensadores y clientes;


      b) las entidades de contrapartida central interoperables;


      c) otras partes interesadas.


      Los depositarios centrales de valores asociarán al diseño y la realización de las pruebas a que
      se refiere el párrafo primero, según proceda, a:


      a) los usuarios;


      b) los prestadores de servicios esenciales;


      c) otros depositarios centrales de valores;


      d) otras infraestructuras del mercado;


      e) otras entidades con respecto a las cuales hayan determinado la existencia de interdependencias
      en el marco de su política de continuidad de la actividad en materia de TIC.'
    official_text_en: '1. As part of the safeguards to preserve the availability, authenticity, integrity,
      and confidentiality of data, financial entities shall include in the ICT change management procedures
      referred to in Article 9(4), point (e), of Regulation (EU) 2022/2554, in respect of all changes
      to software, hardware, firmware components, systems, or security parameters, all of the following
      elements:


      (a) a verification of whether the ICT security requirements have been met;


      (b) mechanisms to ensure the independence of the functions that approve changes and the functions
      responsible for requesting and implementing those changes;


      (c) a clear description of the roles and responsibilities to ensure that: (i) changes are specified
      and planned; (ii) an adequate transition is designed; (iii) the changes are tested and finalised
      in a controlled manner; (iv) there is an effective quality assurance;


      (i) changes are specified and planned;


      (ii) an adequate transition is designed;


      (iii) the changes are tested and finalised in a controlled manner;


      (iv) there is an effective quality assurance;


      (d) the documentation and communication of change details, including: (i) the purpose and scope
      of the change; (ii) the timeline for the implementation of the change; (iii) the expected outcomes;


      (i) the purpose and scope of the change;


      (ii) the timeline for the implementation of the change;


      (iii) the expected outcomes;


      (e) the identification of fall-back procedures and responsibilities, including procedures and responsibilities
      for aborting changes or recovering from changes not successfully implemented;


      (f) procedures, protocols, and tools to manage emergency changes that provide adequate safeguards;


      (g) procedures to document, re-evaluate, assess, and approve emergency changes after their implementation,
      including workarounds and patches;


      (h) the identification of the potential impact of a change on existing ICT security measures and
      an assessment of whether such change requires the adoption of additional ICT security measures.


      2. After having made significant changes to their ICT systems, central counterparties and central
      securities depositories shall submit their ICT systems to stringent testing by simulating stressed
      conditions.


      Central counterparties shall involve, as appropriate, in the design and conduct of the testing referred
      to in the first subparagraph:


      (a) clearing members and clients;


      (b) interoperable central counterparties;


      (c) other interested parties,


      Central securities depositories shall, as appropriate, involve in the design and conduct of the
      testing referred to in the first subparagraph:


      (a) users;


      (b) critical utilities and critical service providers;


      (c) other central securities depositories;


      (d) other market infrastructures;


      (e) any other institutions with which central securities depositories have identified interdependencies
      in their ICT business continuity policy.'
    section: Artículo 17
    source_sha256: f97990e1d8c8bb56fda5742577b5ca1e0ae389f85b77042663543b11ef7a09cd
- id: t2c1.art18
  title_es: Seguridad física y del entorno · artículo 18
  title_en: Physical and environmental security · Article 18
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_18
  attributes:
    official_text_es: '1. Dentro de las salvaguardias para preservar la disponibilidad, autenticidad,
      integridad y confidencialidad de los datos, las entidades financieras especificarán, documentarán
      y aplicarán una política de seguridad física y del entorno. Las entidades financieras diseñarán
      dicha política a la luz del panorama de las ciberamenazas, teniendo en cuenta la clasificación establecida
      de conformidad con el artículo 8, apartado 1, del Reglamento (UE) 2022/2554, y a la luz del perfil
      de riesgo general de los activos de TIC y los activos de información accesibles.


      2. La política de seguridad física y del entorno a que se refiere el apartado 1 contendrá todos
      los aspectos siguientes:


      a) una referencia a la parte de la política sobre el control de los derechos de gestión de accesos
      a que se refiere el artículo 21, apartado 1, letra g);


      b) medidas para proteger contra ataques, accidentes y amenazas y peligros naturales los locales,
      los centros de datos de la entidad financiera y las zonas sensibles designadas determinadas por
      la entidad financiera en las que se encuentren los activos de TIC y los activos de información;


      c) medidas para proteger los activos de TIC, tanto dentro como fuera de los locales de la entidad
      financiera, teniendo en cuenta los resultados de la evaluación del riesgo relacionado con las TIC
      respecto de los activos de TIC pertinentes;


      d) medidas para garantizar la disponibilidad, autenticidad, integridad y confidencialidad de los
      activos de TIC, los activos de información y los dispositivos de control del acceso físico de la
      entidad financiera mediante el mantenimiento adecuado;


      e) medidas para preservar la disponibilidad, autenticidad, integridad y confidencialidad de los
      datos, en particular: i) una política de mesas limpias para los documentos, ii) una política de
      pantallas limpias para las instalaciones de tratamiento de información.


      i) una política de mesas limpias para los documentos,


      ii) una política de pantallas limpias para las instalaciones de tratamiento de información.


      A efectos de la letra b), las medidas de protección contra las amenazas y peligros medioambientales
      serán acordes con la importancia de los locales, los centros de datos y las zonas sensibles designadas
      y con el carácter esencial de las operaciones que se realicen en ellos o los sistemas de TIC que
      se encuentren en ellos.


      A efectos de la letra c), la política de seguridad física y del entorno a que se refiere el apartado
      1 incluirá medidas que garanticen una protección adecuada de los activos de TIC no vigilados.'
    official_text_en: '1. As part of the safeguards to preserve the availability, authenticity, integrity,
      and confidentiality of data, financial entities shall specify, document, and implement a physical
      and environmental security policy. Financial entities shall design that policy i light of the cyber
      threat landscape, in accordance with the classification established in accordance with Article 8(1)
      of Regulation (EU) 2022/2554, and in light of the overall risk profile of ICT assets and accessible
      information assets.


      2. The physical and environmental security policy referred to in paragraph 1 shall contain all of
      the following:


      (a) a reference to the section of the policy on control of access management rights referred to
      in Article 21, first paragraph, point (g);


      (b) measures to protect from attacks, accidents, and environmental threats and hazards, the premises,
      data centres of the financial entity, and sensitive designated areas identified by the financial
      entity, where ICT assets and information assets reside;


      (c) measures to secure ICT assets, both within and outside the premises of the financial entity,
      taking into account the results of the ICT risk assessment related to the relevant ICT assets;


      (d) measures to ensure the availability, authenticity, integrity, and confidentiality of ICT assets,
      information assets, and physical access control devices of the financial entity through the appropriate
      maintenance;


      (e) measures to preserve the availability, authenticity, integrity, and confidentiality of the data,
      including: (i) a clear desk policy for papers; (ii) a clear screen policy for information processing
      facilities.


      (i) a clear desk policy for papers;


      (ii) a clear screen policy for information processing facilities.


      For the purposes of point (b), the measures to protect from environmental threats and hazards shall
      be commensurate with the importance of the premises, data centres, sensitive designated areas, and
      the criticality of the operations or ICT systems located therein.


      For the purposes of point (c), the physical and environmental security policy referred to in paragraph
      1 shall contain measures to provide appropriate protection to unattended ICT assets.'
    section: Artículo 18
    source_sha256: 435249e33517b44a0af065df09d8763181dd88d98ebc34160eed2df517325456
- id: t2c2.art19
  title_es: Política de recursos humanos · artículo 19
  title_en: Human resources policy · Article 19
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_19
  attributes:
    official_text_es: 'Las entidades financieras incluirán en su política de recursos humanos u otras
      políticas pertinentes todos los elementos relacionados con la seguridad de las TIC que se indican
      a continuación:


      a) la determinación y asignación de toda responsabilidad específica en materia de seguridad de las
      TIC;


      b) los requisitos de que el personal de la entidad financiera y de los proveedores terceros de servicios
      de TIC que utilice activos de TIC de la entidad financiera o acceda a ellos: i) esté informado de
      las políticas, procedimientos y protocolos en materia de seguridad de las TIC de la entidad financiera
      y se adhiera a ellos, ii) conozca los canales de denuncia establecidos por la entidad financiera
      para la detección de comportamientos anómalos, incluidos, en su caso, los canales de denuncia establecidos
      de conformidad con la Directiva (UE) 2019/1937 del Parlamento Europeo y del Consejo (11), iii) restituya
      a la entidad financiera, al término de su relación laboral, todos los activos de TIC y los activos
      de información tangibles que obren en su poder y pertenezcan a la entidad financiera.


      i) esté informado de las políticas, procedimientos y protocolos en materia de seguridad de las TIC
      de la entidad financiera y se adhiera a ellos,


      ii) conozca los canales de denuncia establecidos por la entidad financiera para la detección de
      comportamientos anómalos, incluidos, en su caso, los canales de denuncia establecidos de conformidad
      con la Directiva (UE) 2019/1937 del Parlamento Europeo y del Consejo (11),


      iii) restituya a la entidad financiera, al término de su relación laboral, todos los activos de
      TIC y los activos de información tangibles que obren en su poder y pertenezcan a la entidad financiera.'
    official_text_en: 'Financial entities shall include in their human resource policy or other relevant
      policies all of the following ICT security related elements:


      (a) the identification and assignment of any specific ICT security responsibilities;


      (b) requirements for staff of the financial entity and of the ICT third-party service providers
      using or accessing ICT assets of the financial entity to: (i) be informed about, and adhere to,
      the financial entity’s ICT security policies, procedures, and protocols; (ii) be aware of the reporting
      channels put in place by the financial entity for the detection of anomalous behaviour, including,
      where applicable, the reporting channels established in line with Directive (EU) 2019/1937 of the
      European Parliament and of the Council (11); (iii) for the staff, to return to the financial entity,
      upon termination of employment, all ICT assets and tangible information assets in their possession
      that belong to the financial entity.


      (i) be informed about, and adhere to, the financial entity’s ICT security policies, procedures,
      and protocols;


      (ii) be aware of the reporting channels put in place by the financial entity for the detection of
      anomalous behaviour, including, where applicable, the reporting channels established in line with
      Directive (EU) 2019/1937 of the European Parliament and of the Council (11);


      (iii) for the staff, to return to the financial entity, upon termination of employment, all ICT
      assets and tangible information assets in their possession that belong to the financial entity.'
    section: Artículo 19
    source_sha256: 1647ffa7e73536251673fdb91d0d4fc55ded4aeff06b2c7f174f0bd59ba7f35f
- id: t2c2.art20
  title_es: Gestión de la identidad · artículo 20
  title_en: Identity management · Article 20
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_20
  attributes:
    official_text_es: '1. Dentro de su control de los derechos de gestión de accesos, las entidades financieras
      elaborarán, documentarán y aplicarán políticas y procedimientos de gestión de la identidad que garanticen
      la identificación y autenticación únicas de las personas físicas y los sistemas que accedan a su
      información a fin de poder asignar los derechos de acceso de usuario de conformidad con el artículo
      21.


      2. Las políticas y procedimientos de gestión de la identidad a que se refiere el apartado 1 incluirán
      todos los aspectos siguientes:


      a) sin perjuicio de lo dispuesto en el artículo 21, apartado 1, letra c), se asignará una identidad
      única correspondiente a una cuenta de usuario única a cada miembro del personal de la entidad financiera
      o del personal de los proveedores terceros de servicios de TIC que acceda a los activos de información
      y los activos de TIC de la entidad financiera;


      b) un proceso de gestión de identidades y cuentas a lo largo de su ciclo de vida que gestione la
      creación, modificación, revisión y actualización, la desactivación temporal y la cancelación de
      todas las cuentas.


      A efectos de la letra a), las entidades financieras llevarán un registro de todas las identidades
      asignadas. Dicho registro se conservará tras una reorganización de la entidad financiera o una vez
      finalizada la relación contractual, sin perjuicio de los requisitos de conservación establecidos
      en el Derecho nacional y de la Unión aplicable.


      A efectos de la letra b), las entidades financieras implementarán, cuando sea factible y adecuado,
      soluciones automatizadas para el proceso de gestión de identidades a lo largo de su ciclo de vida.'
    official_text_en: '1. As part of their control of access management rights, financial entities shall
      develop, document, and implement identity management policies and procedures that ensure the unique
      identification and authentication of natural persons and systems accessing the financial entities’
      information to enable assignment of user access rights in accordance with Article 21.


      2. The identity management policies and procedures referred to in paragraph 1 shall contain all
      of the following:


      (a) without prejudice to Article 21, first paragraph, point (c), a unique identity corresponding
      to a unique user account shall be assigned to each staff member of the financial entity or staff
      of the ICT third-party service providers accessing the information assets and ICT assets of the
      financial entity;


      (b) a lifecycle management process for identities and accounts managing the creation, change, review
      and update, temporary deactivation, and termination of all accounts.


      For the purposes of point (a), financial entities shall maintain records of all identity assignments.
      Those records shall be kept following a reorganisation of the financial entity or after the end
      of the contractual relationship without prejudice to the retention requirements laid down in applicable
      Union and national law.


      For the purposes of point (b), financial entities shall, where feasible and appropriate, deploy
      automated solutions for the lifecycle identity management process.'
    section: Artículo 20
    source_sha256: 359efb65f7e4373e7435977476883aaf6a088de0354cd6d8aee6a7f8404b24c4
- id: t2c2.art21
  title_es: Control de acceso · artículo 21
  title_en: Access control · Article 21
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_21
  attributes:
    official_text_es: 'Dentro de su control de los derechos de gestión de accesos, las entidades financieras
      elaborarán, documentarán y aplicarán una política que incluya todos los aspectos siguientes:


      a) la asignación de derechos de acceso a los activos de TIC sobre la base de los principios de «necesidad
      de conocer», «necesidad de uso» y «mínimo privilegio», también para el acceso a distancia y de emergencia;


      b) la separación de funciones con el fin de impedir el acceso injustificado a datos esenciales o
      la asignación de combinaciones de derechos de acceso que puedan utilizarse para eludir los controles;


      c) una disposición sobre responsabilidad de los usuarios que limite en la medida de lo posible el
      uso de cuentas de usuario genéricas y compartidas y garantice que, en todo momento, los usuarios
      sean identificables cuando realicen acciones en los sistemas de TIC;


      d) una disposición sobre las restricciones de acceso a los activos de TIC que establezca controles
      y herramientas para impedir el acceso no autorizado;


      e) procedimientos de gestión de cuentas para la concesión, modificación o revocación de derechos
      de acceso en relación con las cuentas de usuario y las cuentas genéricas, incluidas las cuentas
      de administrador genéricas, que incluyan disposiciones sobre todos los aspectos siguientes: i) asignación
      de funciones y responsabilidades para la concesión, revisión y revocación de los derechos de acceso,
      ii) asignación de acceso privilegiado, de emergencia y de administrador sobre la base del principio
      de «necesidad de uso» o con carácter ad hoc para todos los sistemas de TIC, iii) retirada de los
      derechos de acceso sin demora indebida al término de la relación laboral o cuando el acceso ya no
      sea necesario, iv) actualización de los derechos de acceso cuando se requiera introducir cambios
      y al menos una vez al año para todos los sistemas de TIC que no sustenten funciones esenciales o
      importantes y al menos cada seis meses para los sistemas de TIC que sustenten funciones esenciales
      o importantes;


      i) asignación de funciones y responsabilidades para la concesión, revisión y revocación de los derechos
      de acceso,


      ii) asignación de acceso privilegiado, de emergencia y de administrador sobre la base del principio
      de «necesidad de uso» o con carácter ad hoc para todos los sistemas de TIC,


      iii) retirada de los derechos de acceso sin demora indebida al término de la relación laboral o
      cuando el acceso ya no sea necesario,


      iv) actualización de los derechos de acceso cuando se requiera introducir cambios y al menos una
      vez al año para todos los sistemas de TIC que no sustenten funciones esenciales o importantes y
      al menos cada seis meses para los sistemas de TIC que sustenten funciones esenciales o importantes;


      f) métodos de autenticación, incluidos todos los aspectos siguientes: i) el uso de métodos de autenticación
      que sean acordes con la clasificación establecida de conformidad con el artículo 8, apartado 1,
      del Reglamento (UE) 2022/2554 y con el perfil de riesgo general de los activos de TIC, y que tengan
      en cuenta las prácticas punteras, ii) el uso de métodos de autenticación sólidos de conformidad
      con las prácticas y técnicas punteras para el acceso a distancia a la red de la entidad financiera,
      el acceso privilegiado y el acceso a los activos de TIC que sustenten funciones esenciales o importantes
      o a los activos de TIC que sean de acceso público;


      i) el uso de métodos de autenticación que sean acordes con la clasificación establecida de conformidad
      con el artículo 8, apartado 1, del Reglamento (UE) 2022/2554 y con el perfil de riesgo general de
      los activos de TIC, y que tengan en cuenta las prácticas punteras,


      ii) el uso de métodos de autenticación sólidos de conformidad con las prácticas y técnicas punteras
      para el acceso a distancia a la red de la entidad financiera, el acceso privilegiado y el acceso
      a los activos de TIC que sustenten funciones esenciales o importantes o a los activos de TIC que
      sean de acceso público;


      g) medidas de control del acceso físico que incluyan lo siguiente: i) la identificación y el registro
      de las personas físicas autorizadas a acceder a los locales, los centros de datos y las zonas sensibles
      designadas determinadas por la entidad financiera en los que se encuentren los activos de TIC y
      de información, ii) la concesión de derechos de acceso físico a los activos de TIC esenciales únicamente
      a las personas autorizadas, de conformidad con los principios de «necesidad de conocer» y «mínimo
      privilegio» y con carácter ad hoc, iii) el seguimiento del acceso físico a los locales, los centros
      de datos y las zonas sensibles designadas determinadas por la entidad financiera en los que se encuentren
      los activos de TIC, los activos de información o ambos, iv) la revisión de los derechos de acceso
      físico para garantizar la rápida revocación de los derechos que no sean necesarios.


      i) la identificación y el registro de las personas físicas autorizadas a acceder a los locales,
      los centros de datos y las zonas sensibles designadas determinadas por la entidad financiera en
      los que se encuentren los activos de TIC y de información,


      ii) la concesión de derechos de acceso físico a los activos de TIC esenciales únicamente a las personas
      autorizadas, de conformidad con los principios de «necesidad de conocer» y «mínimo privilegio» y
      con carácter ad hoc,


      iii) el seguimiento del acceso físico a los locales, los centros de datos y las zonas sensibles
      designadas determinadas por la entidad financiera en los que se encuentren los activos de TIC, los
      activos de información o ambos,


      iv) la revisión de los derechos de acceso físico para garantizar la rápida revocación de los derechos
      que no sean necesarios.


      A efectos de la letra e), inciso i), las entidades financieras establecerán el período de conservación
      teniendo en cuenta los objetivos empresariales y de seguridad de la información, los motivos por
      los que se consigna el hecho de que se trate en los registros y los resultados de la evaluación
      del riesgo relacionado con las TIC.


      A efectos de la letra e), inciso ii), las entidades financieras utilizarán, en la medida de lo posible,
      cuentas específicas para la realización de tareas administrativas en los sistemas de TIC. Cuando
      sea factible y adecuado, las entidades financieras implementarán soluciones automatizadas para la
      gestión del acceso privilegiado.


      A efectos de la letra g), inciso i), la identificación y el registro serán acordes con la importancia
      de los locales, los centros de datos y las zonas sensibles designadas y con el carácter esencial
      de las operaciones que se realicen en ellos o los sistemas de TIC que se encuentren en ellos.


      A efectos de la letra g), inciso iii), el seguimiento será acorde con la clasificación establecida
      de conformidad con el artículo 8, apartado 1, del Reglamento (UE) 2022/2554 y con el carácter esencial
      de la zona a la que se acceda.'
    official_text_en: 'As part of their control of access management rights, financial entities shall
      develop, document, and implement a policy that contains all of the following:


      (a) the assignment of access rights to ICT assets based on need-to-know, need-to-use and least privilege
      principles, including for remote and emergency access;


      (b) the segregation of duties designed to prevent unjustified access to critical data or to prevent
      the allocation of combinations of access rights that may be used to circumvent controls;


      (c) a provision on user accountability, by limiting to the extent possible the use of generic and
      shared user accounts and ensuring that users are identifiable for the actions performed in the ICT
      systems at all times;


      (d) a provision on restrictions of access to ICT assets, setting out controls and tools to prevent
      unauthorised access;


      (e) account management procedures to grant, change or revoke access rights for user and generic
      accounts, including generic administrator accounts, including provision on all of the following:
      (i) assignment of roles and responsibilities for granting, reviewing, and revoking access rights;
      (ii) assignment of privileged, emergency, and administrator access on a need-to-use or an ad-hoc
      basis for all ICT systems; (iii) withdrawal of access rights without undue delay upon termination
      of the employment or when the access is no longer necessary; (iv) update of access rights where
      changes are necessary and at least once a year for all ICT systems, other than ICT systems supporting
      critical or important functions and at least every 6 months for ICT systems supporting critical
      or important functions;


      (i) assignment of roles and responsibilities for granting, reviewing, and revoking access rights;


      (ii) assignment of privileged, emergency, and administrator access on a need-to-use or an ad-hoc
      basis for all ICT systems;


      (iii) withdrawal of access rights without undue delay upon termination of the employment or when
      the access is no longer necessary;


      (iv) update of access rights where changes are necessary and at least once a year for all ICT systems,
      other than ICT systems supporting critical or important functions and at least every 6 months for
      ICT systems supporting critical or important functions;


      (f) authentication methods, including all of the following: (i) the use of authentication methods
      commensurate to the classification established in accordance with Article 8(1) of Regulation (EU)
      2022/2554 and to the overall risk profile of ICT assets and considering leading practices; (ii)
      the use of strong authentication methods in accordance with leading practices and techniques for
      remote access to the financial entity’s network, for privileged access, for access to ICT assets
      supporting critical or important functions or ICT assets that are publicly accessible;


      (i) the use of authentication methods commensurate to the classification established in accordance
      with Article 8(1) of Regulation (EU) 2022/2554 and to the overall risk profile of ICT assets and
      considering leading practices;


      (ii) the use of strong authentication methods in accordance with leading practices and techniques
      for remote access to the financial entity’s network, for privileged access, for access to ICT assets
      supporting critical or important functions or ICT assets that are publicly accessible;


      (g) physical access controls measures including: (i) the identification and logging of natural persons
      that are authorised to access premises, data centres, and sensitive designated areas identified
      by the financial entity where ICT and information assets reside; (ii) the granting of physical access
      rights to critical ICT assets to authorised persons only, in accordance with the need-to-know and
      least privilege principles, and on an ad-hoc basis; (iii) the monitoring of physical access to premises,
      data centres, and sensitive designated areas identified by the financial entity where ICT and information
      assets or both reside; (iv) the review of physical access rights to ensure that unnecessary access
      rights are promptly revoked.


      (i) the identification and logging of natural persons that are authorised to access premises, data
      centres, and sensitive designated areas identified by the financial entity where ICT and information
      assets reside;


      (ii) the granting of physical access rights to critical ICT assets to authorised persons only, in
      accordance with the need-to-know and least privilege principles, and on an ad-hoc basis;


      (iii) the monitoring of physical access to premises, data centres, and sensitive designated areas
      identified by the financial entity where ICT and information assets or both reside;


      (iv) the review of physical access rights to ensure that unnecessary access rights are promptly
      revoked.


      For the purposes of point (e)(i), financial entities shall establish the retention period taking
      into account the business and information security objectives, the reasons for recording the event
      in the logs, and the results of the ICT risk assessment.


      For the purposes of point (e)(ii), financial entities shall, where possible, use dedicated accounts
      for the performance of administrative tasks on ICT systems. Where feasible and appropriate, financial
      entities shall deploy automated solutions for the privilege access management.


      For the purposes of point (g)(i), the identification and logging shall be commensurate with the
      importance of the premises, data centres, sensitive designated areas, and the criticality of the
      operations or ICT systems located therein.


      For the purposes of point (g)(iii), the monitoring shall be commensurate to the classification established
      in accordance with Article 8(1) of Regulation (EU) 2022/2554 and the criticality of the area accessed.'
    section: Artículo 21
    source_sha256: 4028a2dc4b89f75a2e811995f5750a67bcbae2ad5dbf75f5241b9d44c930b960
- id: t2c3.art22
  title_es: Política de gestión de incidentes relacionados con las TIC · artículo 22
  title_en: ICT-related incident management policy · Article 22
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_22
  attributes:
    official_text_es: 'Dentro de los mecanismos para la detección de actividades anómalas, incluidos los
      problemas de rendimiento de las redes de TIC y los incidentes relacionados con las TIC, las entidades
      financieras elaborarán, documentarán y aplicarán una política de incidentes relacionados con las
      TIC en virtud de la cual:


      a) documentarán el proceso de gestión de incidentes relacionados con las TIC a que se refiere el
      artículo 17 del Reglamento (UE) 2022/2554;


      b) establecerán una lista de los contactos pertinentes con las funciones internas y las partes interesadas
      externas que participen directamente en la seguridad de las operaciones de TIC, en particular por
      lo que respecta a: i) la detección y el seguimiento de las ciberamenazas, ii) la detección de actividades
      anómalas, iii) la gestión de vulnerabilidades;


      i) la detección y el seguimiento de las ciberamenazas,


      ii) la detección de actividades anómalas,


      iii) la gestión de vulnerabilidades;


      c) establecerán, implementarán y aplicarán mecanismos técnicos, organizativos y operativos en apoyo
      del proceso de gestión de incidentes relacionados con las TIC, en particular mecanismos que permitan
      la rápida detección de actividades y comportamientos anómalos de conformidad con el artículo 23
      del presente Reglamento;


      d) conservarán todas las pruebas sobre los incidentes relacionados con las TIC por un período no
      superior al necesario para los fines con los que se hayan recopilado los datos y acorde con el carácter
      esencial de las funciones empresariales, los procesos de apoyo y los activos de información y de
      TIC afectados, de conformidad con el artículo 8, apartado 2, del Reglamento Delegado (UE) 2024/1772
      de la Comisión (12) y con cualquier requisito de conservación aplicable en virtud del Derecho de
      la Unión;


      e) establecerán y aplicarán mecanismos para analizar los incidentes relacionados con las TIC significativos
      o recurrentes y los patrones en el número y la frecuencia de los incidentes relacionados con las
      TIC.


      A efectos de la letra d), las entidades financieras conservarán las pruebas a que se refiere dicha
      letra de manera segura.'
    official_text_en: 'As part of the mechanisms to detect anomalous activities, including ICT network
      performance issues and ICT-related incidents, financial entities shall develop, document, and implement
      an ICT-related incident policy through which they shall:


      (a) document the ICT-related incident management process referred to in Article 17 of Regulation
      (EU) 2022/2554;


      (b) establish a list of relevant contacts with internal functions and external stakeholders that
      are directly involved in ICT operations security, including on: (i) the detection and monitoring
      of cyber threats; (ii) the detection of anomalous activities; (iii) vulnerability management;


      (i) the detection and monitoring of cyber threats;


      (ii) the detection of anomalous activities;


      (iii) vulnerability management;


      (c) establish, implement, and operate technical, organisational, and operational mechanisms to support
      the ICT-related incident management process, including mechanisms to enable a prompt detection of
      anomalous activities and behaviours in accordance with Article 23 of this Regulation;


      (d) retain all evidence relating to ICT-related incidents for a period that shall be no longer than
      necessary for the purposes for which the data are collected, commensurate with the criticality of
      the affected business functions, supporting processes, and ICT and information assets, in accordance
      with Article 8(2) of Commission Delegated Regulation (EU) 2024/1772 (12) and with any applicable
      retention requirement pursuant to Union law;


      (e) establish and implement mechanisms to analyse significant or recurring ICT-related incidents
      and patterns in the number and the occurrence of ICT-related incidents.


      For the purposes of point (d), financial entities shall retain the evidence referred to in that
      point in a secure manner.'
    section: Artículo 22
    source_sha256: 8d3c2bca0664616d41ef58a762b22a88c0eac99f7ca0a6b76d665a3b0a1a1052
- id: t2c3.art23
  title_es: Detección de actividades anómalas y criterios para detectar y responder a incidentes relacionados
    con las TIC · artículo 23
  title_en: Anomalous activities detection and criteria for ICT-related incidents detection and response
    · Article 23
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_23
  attributes:
    official_text_es: '1. Las entidades financieras establecerán funciones y responsabilidades claras
      para detectar incidentes relacionados con las TIC y actividades anómalas, así como para responder
      a tales incidentes y actividades, de manera eficaz.


      2. El mecanismo para detectar rápidamente las actividades anómalas, incluidos los problemas de rendimiento
      de las redes de TIC y los incidentes relacionados con las TIC, a que se refiere el artículo 10,
      apartado 1, del Reglamento (UE) 2022/2554 permitirá a las entidades financieras:


      a) recopilar, analizar y hacer un seguimiento de todos los aspectos siguientes: i) factores internos
      y externos, incluidos, como mínimo, los registros recopilados de conformidad con el artículo 12
      del presente Reglamento, la información de las funciones empresariales y de TIC, y los problemas
      notificados por los usuarios de la entidad financiera, ii) posibles ciberamenazas internas y externas,
      teniendo en cuenta los escenarios utilizados habitualmente por los agentes de riesgo y los escenarios
      basados en actividades de inteligencia sobre amenazas, iii) notificación por un proveedor tercero
      de servicios de TIC de la entidad financiera de incidentes relacionados con las TIC detectados en
      las redes y sistemas de TIC del proveedor que puedan afectar a la entidad financiera;


      i) factores internos y externos, incluidos, como mínimo, los registros recopilados de conformidad
      con el artículo 12 del presente Reglamento, la información de las funciones empresariales y de TIC,
      y los problemas notificados por los usuarios de la entidad financiera,


      ii) posibles ciberamenazas internas y externas, teniendo en cuenta los escenarios utilizados habitualmente
      por los agentes de riesgo y los escenarios basados en actividades de inteligencia sobre amenazas,


      iii) notificación por un proveedor tercero de servicios de TIC de la entidad financiera de incidentes
      relacionados con las TIC detectados en las redes y sistemas de TIC del proveedor que puedan afectar
      a la entidad financiera;


      b) detectar actividades y comportamientos anómalos e introducir herramientas que generen alertas
      sobre dichas actividades y comportamientos, al menos para los activos de TIC y los activos de información
      que sustenten funciones esenciales o importantes;


      c) dar prioridad a las alertas a que se refiere la letra b) para que los incidentes relacionados
      con las TIC detectados puedan gestionarse dentro del tiempo de resolución previsto, según lo especificado
      por las entidades financieras, tanto dentro como fuera del horario laboral;


      d) registrar, analizar y evaluar, de forma manual o automática, toda información pertinente sobre
      las actividades y comportamientos anómalos.


      A efectos de la letra b), las herramientas a que se refiere dicha letra incluirán herramientas que
      proporcionen alertas automatizadas sobre la base de reglas predefinidas para detectar las anomalías
      que afecten a la exhaustividad e integridad de las fuentes de datos o a la recogida de registros.


      3. Las entidades financieras protegerán los registros de las actividades anómalas contra la manipulación
      y el acceso no autorizado en reposo, en tránsito y, en su caso, en uso.


      4. Las entidades financieras registrarán, respecto de cada actividad anómala detectada, toda la
      información pertinente para:


      a) determinar la fecha y hora en que se haya producido la actividad anómala;


      b) determinar la fecha y hora en que se haya detectado la actividad anómala;


      c) determinar el tipo de actividad anómala.


      5. Las entidades financieras tendrán en cuenta todos los criterios que se indican a continuación
      para activar los procesos destinados a detectar y responder a incidentes relacionados con las TIC
      a que se refiere el artículo 10, apartado 2, del Reglamento (UE) 2022/2554:


      a) indicios de que puede haberse llevado a cabo una actividad malintencionada en una red o sistema
      de TIC, o de que dicha red o sistema de TIC puede haberse visto comprometido;


      b) detección de pérdidas de datos en relación con la disponibilidad, autenticidad, integridad y
      confidencialidad de los datos;


      c) detección de efectos adversos en las transacciones y operaciones de la entidad financiera;


      d) indisponibilidad de las redes y sistemas de TIC.


      6. A efectos del apartado 5, las entidades financieras también tendrán en cuenta el carácter esencial
      de los servicios afectados.'
    official_text_en: '1. Financial entities shall set clear roles and responsibilities to effectively
      detect and respond to ICT-related incidents and anomalous activities.


      2. The mechanism to promptly detect anomalous activities, including ICT network performance issues
      and ICT-related incidents, as referred to in Article 10(1) of Regulation (EU) 2022/2554, shall enable
      financial entities to:


      (a) collect, monitor, and analyse all of the following: (i) internal and external factors, including
      at least the logs collected in accordance with Article 12 of this Regulation, information from business
      and ICT functions, and any problem reported by users of the financial entity; (ii) potential internal
      and external cyber threats, considering scenarios commonly used by threat actors and scenarios based
      on threat intelligence activity; (iii) ICT-related incident notification from an ICT third-party
      service provider of the financial entity detected in the ICT systems and networks of the ICT third-party
      service provider and that may affect the financial entity;


      (i) internal and external factors, including at least the logs collected in accordance with Article
      12 of this Regulation, information from business and ICT functions, and any problem reported by
      users of the financial entity;


      (ii) potential internal and external cyber threats, considering scenarios commonly used by threat
      actors and scenarios based on threat intelligence activity;


      (iii) ICT-related incident notification from an ICT third-party service provider of the financial
      entity detected in the ICT systems and networks of the ICT third-party service provider and that
      may affect the financial entity;


      (b) identify anomalous activities and behaviour, and implement tools generating alerts for anomalous
      activities and behaviour, at least for ICT assets and information assets supporting critical or
      important functions;


      (c) prioritise the alerts referred to in point (b) to allow for the management of the detected ICT-related
      incidents within the expected resolution time, as specified by financial entities, both during and
      outside working hours;


      (d) record, analyse, and evaluate any relevant information on all anomalous activities and behaviours
      automatically or manually.


      For the purposes of point (b), the tools referred to in that point shall contain the tools that
      provide automated alerts based on pre-defined rules to identify anomalies affecting the completeness
      and integrity of the data sources or log collection.


      3. Financial entities shall protect any recording of the anomalous activities against tampering
      and unauthorised access at rest, in transit and, where relevant, in use.


      4. Financial entities shall log all relevant information for each detected anomalous activity enabling:


      (a) the identification of the date and time of occurrence of the anomalous activity;


      (b) the identification of the date and time of detection of the anomalous activity;


      (c) the identification of the type of the anomalous activity.


      5. Financial entities shall consider all of the following criteria to trigger the ICT-related incident
      detection and response processes referred to in Article 10(2) of Regulation (EU) 2022/2554:


      (a) indications that malicious activity may have been carried out in an ICT system or network, or
      that such ICT system or network may have been compromised;


      (b) data losses detected in relation to the availability, authenticity, integrity, and confidentiality
      of data;


      (c) adverse impact detected on financial entity’s transactions and operations;


      (d) ICT systems’ and network unavailability.


      6. For the purposes of paragraph 5, financial entities shall also consider the criticality of the
      services affected.'
