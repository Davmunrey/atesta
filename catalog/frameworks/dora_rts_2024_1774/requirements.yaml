- id: t2c4.art24
  title_es: Componentes de la política de continuidad de la actividad en materia de TIC · artículo 24
  title_en: Components of the ICT business continuity policy · Article 24
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R1774#art_24
  attributes:
    official_text_es: '1. Las entidades financieras incluirán en su política de continuidad de la actividad
      en materia de TIC a que se refiere el artículo 11, apartado 1, del Reglamento (UE) 2022/2554 todos
      los elementos siguientes:


      a) una descripción de: i) los objetivos de la política de continuidad de la actividad en materia
      de TIC, incluida la interrelación entre la continuidad de la actividad en sentido global y la continuidad
      de la actividad en materia de TIC, y teniendo en cuenta los resultados del análisis de impacto en
      el negocio a que se refiere el artículo 11, apartado 5, del Reglamento (UE) 2022/2554, ii) el alcance
      de las disposiciones, planes, procedimientos y mecanismos para la continuidad de la actividad en
      materia de TIC, incluidas las limitaciones y exclusiones, iii) el período que deben cubrir las disposiciones,
      planes, procedimientos y mecanismos para la continuidad de la actividad en materia de TIC, iv) los
      criterios para activar y desactivar los planes de continuidad de la actividad en materia de TIC,
      los planes de respuesta y recuperación en materia de TIC y los planes de comunicación de crisis;


      i) los objetivos de la política de continuidad de la actividad en materia de TIC, incluida la interrelación
      entre la continuidad de la actividad en sentido global y la continuidad de la actividad en materia
      de TIC, y teniendo en cuenta los resultados del análisis de impacto en el negocio a que se refiere
      el artículo 11, apartado 5, del Reglamento (UE) 2022/2554,


      ii) el alcance de las disposiciones, planes, procedimientos y mecanismos para la continuidad de
      la actividad en materia de TIC, incluidas las limitaciones y exclusiones,


      iii) el período que deben cubrir las disposiciones, planes, procedimientos y mecanismos para la
      continuidad de la actividad en materia de TIC,


      iv) los criterios para activar y desactivar los planes de continuidad de la actividad en materia
      de TIC, los planes de respuesta y recuperación en materia de TIC y los planes de comunicación de
      crisis;


      b) disposiciones sobre: i) la gobernanza y organización para aplicar la política de continuidad
      de la actividad en materia de TIC, en particular las funciones y responsabilidades y los procedimientos
      de traslado a la instancia jerárquica superior que garanticen la disponibilidad de recursos suficientes,
      ii) la armonización entre los planes de continuidad de la actividad en materia de TIC y los planes
      globales de continuidad de la actividad, en relación, como mínimo, con todos los aspectos siguientes:
      1) posibles escenarios de fallo, en particular los escenarios a que se refiere el artículo 26, apartado
      2, del presente Reglamento; 2) objetivos de recuperación, con la especificación de que, tras sufrir
      perturbaciones, la entidad financiera debe ser capaz de recuperar las operaciones de sus funciones
      esenciales o importantes dentro de un objetivo de tiempo de recuperación y un objetivo de punto
      de recuperación, iii) la elaboración, dentro de dichos planes, de planes de continuidad de la actividad
      en materia de TIC para el caso de perturbaciones graves de la actividad, y la priorización de las
      acciones de continuidad de la actividad en materia de TIC utilizando un enfoque basado en el riesgo,
      iv) la elaboración, sometimiento a prueba y revisión de planes de respuesta y recuperación en materia
      de TIC, de conformidad con los artículos 25 y 26 del presente Reglamento, v) la revisión de la eficacia
      de las disposiciones, planes, procedimientos y mecanismos para la continuidad de la actividad en
      materia de TIC aplicados, de conformidad con el artículo 26 del presente Reglamento, vi) la armonización
      de la política de continuidad de la actividad en materia de TIC con: 1) la política de comunicación
      a que se refiere el artículo 14, apartado 2, del Reglamento (UE) 2022/2554; 2) las acciones de comunicación
      y comunicación de crisis a que se refiere el artículo 11, apartado 2, letra e), del Reglamento (UE)
      2022/2554.


      i) la gobernanza y organización para aplicar la política de continuidad de la actividad en materia
      de TIC, en particular las funciones y responsabilidades y los procedimientos de traslado a la instancia
      jerárquica superior que garanticen la disponibilidad de recursos suficientes,


      ii) la armonización entre los planes de continuidad de la actividad en materia de TIC y los planes
      globales de continuidad de la actividad, en relación, como mínimo, con todos los aspectos siguientes:
      1) posibles escenarios de fallo, en particular los escenarios a que se refiere el artículo 26, apartado
      2, del presente Reglamento; 2) objetivos de recuperación, con la especificación de que, tras sufrir
      perturbaciones, la entidad financiera debe ser capaz de recuperar las operaciones de sus funciones
      esenciales o importantes dentro de un objetivo de tiempo de recuperación y un objetivo de punto
      de recuperación,


      1) posibles escenarios de fallo, en particular los escenarios a que se refiere el artículo 26, apartado
      2, del presente Reglamento;


      2) objetivos de recuperación, con la especificación de que, tras sufrir perturbaciones, la entidad
      financiera debe ser capaz de recuperar las operaciones de sus funciones esenciales o importantes
      dentro de un objetivo de tiempo de recuperación y un objetivo de punto de recuperación,


      iii) la elaboración, dentro de dichos planes, de planes de continuidad de la actividad en materia
      de TIC para el caso de perturbaciones graves de la actividad, y la priorización de las acciones
      de continuidad de la actividad en materia de TIC utilizando un enfoque basado en el riesgo,


      iv) la elaboración, sometimiento a prueba y revisión de planes de respuesta y recuperación en materia
      de TIC, de conformidad con los artículos 25 y 26 del presente Reglamento,


      v) la revisión de la eficacia de las disposiciones, planes, procedimientos y mecanismos para la
      continuidad de la actividad en materia de TIC aplicados, de conformidad con el artículo 26 del presente
      Reglamento,


      vi) la armonización de la política de continuidad de la actividad en materia de TIC con: 1) la política
      de comunicación a que se refiere el artículo 14, apartado 2, del Reglamento (UE) 2022/2554; 2) las
      acciones de comunicación y comunicación de crisis a que se refiere el artículo 11, apartado 2, letra
      e), del Reglamento (UE) 2022/2554.


      1) la política de comunicación a que se refiere el artículo 14, apartado 2, del Reglamento (UE)
      2022/2554;


      2) las acciones de comunicación y comunicación de crisis a que se refiere el artículo 11, apartado
      2, letra e), del Reglamento (UE) 2022/2554.


      2. Además de los requisitos a que se refiere el apartado 1, las entidades de contrapartida central
      velarán por que su política de continuidad de la actividad en materia de TIC:


      a) establezca un tiempo máximo de recuperación de sus funciones esenciales no superior a dos horas;


      b) tenga en cuenta los vínculos externos y las interdependencias existentes dentro de la infraestructura
      financiera, incluidos los centros de negociación de cuya compensación se encargue la entidad de
      contrapartida central, los sistemas de pago y de liquidación de valores y las entidades de crédito
      utilizadas por la entidad de contrapartida central o una entidad de contrapartida central vinculada;


      c) exija que se establezcan mecanismos para: i) garantizar la continuidad de las funciones esenciales
      o importantes de la entidad de contrapartida central sobre la base de escenarios de catástrofe,
      ii) mantener un centro de tratamiento secundario capaz de garantizar la continuidad de las funciones
      esenciales o importantes de la entidad de contrapartida central del mismo modo que el centro principal,
      iii) mantener un centro secundario de actividad, o tener acceso inmediato a él, para permitir al
      personal garantizar la continuidad del servicio en caso de que no pueda disponerse del emplazamiento
      principal de la actividad, iv) estudiar la necesidad de contar con centros de tratamiento adicionales,
      en particular si la diversidad de los perfiles de riesgo de los centros principal y secundario no
      ofrece suficiente seguridad en cuanto al cumplimiento de los objetivos de continuidad de la actividad
      de la entidad de contrapartida central en todos los escenarios.


      i) garantizar la continuidad de las funciones esenciales o importantes de la entidad de contrapartida
      central sobre la base de escenarios de catástrofe,


      ii) mantener un centro de tratamiento secundario capaz de garantizar la continuidad de las funciones
      esenciales o importantes de la entidad de contrapartida central del mismo modo que el centro principal,


      iii) mantener un centro secundario de actividad, o tener acceso inmediato a él, para permitir al
      personal garantizar la continuidad del servicio en caso de que no pueda disponerse del emplazamiento
      principal de la actividad,


      iv) estudiar la necesidad de contar con centros de tratamiento adicionales, en particular si la
      diversidad de los perfiles de riesgo de los centros principal y secundario no ofrece suficiente
      seguridad en cuanto al cumplimiento de los objetivos de continuidad de la actividad de la entidad
      de contrapartida central en todos los escenarios.


      A efectos de la letra a), las entidades de contrapartida central realizarán los pagos y procedimientos
      de cierre de jornada en cualquier circunstancia en el día y la hora previstos.


      A efectos de la letra c), inciso i), los mecanismos a que se refiere dicho inciso contemplarán la
      disponibilidad de recursos humanos adecuados, el tiempo máximo de paralización de las funciones
      esenciales y el traspaso para recuperación a un centro secundario.


      A efectos de la letra c), inciso ii), el centro de tratamiento secundario a que se refiere dicha
      letra tendrá un perfil de riesgo geográfico distinto al del centro principal.


      3. Además de los requisitos a que se refiere el apartado 1, los depositarios centrales de valores
      velarán por que su política de continuidad de la actividad en materia de TIC:


      a) tenga en cuenta los vínculos e interdependencias con los usuarios, los prestadores de servicios
      esenciales, otros depositarios centrales de valores y otras infraestructuras del mercado;


      b) exija que sus mecanismos de continuidad de la actividad en materia de TIC garanticen que el objetivo
      de tiempo de recuperación de sus funciones esenciales o importantes no sea superior a dos horas.


      4. Además de los requisitos a que se refiere el apartado 1, los centros de negociación velarán por
      que su política de continuidad de la actividad en materia de TIC garantice:


      a) que la negociación puede reanudarse antes de que transcurran dos horas desde que se produzca
      un incidente perturbador, o en un plazo cercano;


      b) que la cantidad máxima de datos que puedan perderse en cualquier servicio informático del centro
      de negociación después de un incidente perturbador sea próxima a cero.'
    official_text_en: '1. Financial entities shall include in their ICT business continuity policy referred
      to in Article 11(1) of Regulation (EU) 2022/2554 all of the following:


      (a) a description of: (i) the objectives of the ICT business continuity policy, including the interrelation
      of ICT and overall business continuity, and considering the results of the business impact analysis
      (BIA) referred to in Article 11(5) of Regulation (EU) 2022/2554; (ii) the scope of the ICT business
      continuity arrangements, plans, procedures, and mechanisms, including limitations and exclusions;
      (iii) the timeframe to be covered by the ICT business continuity arrangements, plans, procedures,
      and mechanisms; (iv) the criteria to activate and deactivate ICT business continuity plans, ICT
      response and recovery plans, and crisis communications plans;


      (i) the objectives of the ICT business continuity policy, including the interrelation of ICT and
      overall business continuity, and considering the results of the business impact analysis (BIA) referred
      to in Article 11(5) of Regulation (EU) 2022/2554;


      (ii) the scope of the ICT business continuity arrangements, plans, procedures, and mechanisms, including
      limitations and exclusions;


      (iii) the timeframe to be covered by the ICT business continuity arrangements, plans, procedures,
      and mechanisms;


      (iv) the criteria to activate and deactivate ICT business continuity plans, ICT response and recovery
      plans, and crisis communications plans;


      (b) provisions on: (i) the governance and organisation to implement the ICT business continuity
      policy, including roles, responsibilities and escalation procedures ensuring that sufficient resources
      are available; (ii) the alignment between the ICT business continuity plans and the overall business
      continuity plans, concerning at least all of the following: (1) potential failure scenarios, including
      the scenarios referred to in Article 26(2) of this Regulation; (2) recovery objectives, specifying
      that the financial entity shall be able to recover the operations of its critical or important functions
      after disruptions within a recovery time objective and a recovery point objective; (iii) the development
      of ICT business continuity plans for severe business disruptions as part of those plans, and the
      prioritisation of ICT business continuity actions using a risk-based approach; (iv) the development,
      testing and review of ICT response and recovery plans, in accordance with Articles 25 and 26 of
      this Regulation; (v) the review of the effectiveness of the implemented ICT business continuity
      arrangements, plans, procedures and mechanisms, in accordance with Article 26 of this Regulation;
      (vi) the alignment of the ICT business continuity policy to: (1) the communication policy referred
      to in Article 14(2) of Regulation (EU) 2022/2554; (2) the communication and crisis communication
      actions referred to in Article 11(2), point (e), of Regulation (EU) 2022/2554.


      (i) the governance and organisation to implement the ICT business continuity policy, including roles,
      responsibilities and escalation procedures ensuring that sufficient resources are available;


      (ii) the alignment between the ICT business continuity plans and the overall business continuity
      plans, concerning at least all of the following: (1) potential failure scenarios, including the
      scenarios referred to in Article 26(2) of this Regulation; (2) recovery objectives, specifying that
      the financial entity shall be able to recover the operations of its critical or important functions
      after disruptions within a recovery time objective and a recovery point objective;


      (1) potential failure scenarios, including the scenarios referred to in Article 26(2) of this Regulation;


      (2) recovery objectives, specifying that the financial entity shall be able to recover the operations
      of its critical or important functions after disruptions within a recovery time objective and a
      recovery point objective;


      (iii) the development of ICT business continuity plans for severe business disruptions as part of
      those plans, and the prioritisation of ICT business continuity actions using a risk-based approach;


      (iv) the development, testing and review of ICT response and recovery plans, in accordance with
      Articles 25 and 26 of this Regulation;


      (v) the review of the effectiveness of the implemented ICT business continuity arrangements, plans,
      procedures and mechanisms, in accordance with Article 26 of this Regulation;


      (vi) the alignment of the ICT business continuity policy to: (1) the communication policy referred
      to in Article 14(2) of Regulation (EU) 2022/2554; (2) the communication and crisis communication
      actions referred to in Article 11(2), point (e), of Regulation (EU) 2022/2554.


      (1) the communication policy referred to in Article 14(2) of Regulation (EU) 2022/2554;


      (2) the communication and crisis communication actions referred to in Article 11(2), point (e),
      of Regulation (EU) 2022/2554.


      2. In addition to the requirements referred to in paragraph 1, central counterparties shall ensure
      that their ICT business continuity policy:


      (a) contains a maximum recovery time for their critical functions that is not longer than 2 hours;


      (b) takes into account external links and interdependencies within the financial infrastructures,
      including trading venues cleared by the central counterparty, securities settlement and payment
      systems, and credit institutions used by the central counterparty or a linked central counterparty;


      (c) requires that arrangements are in place to: (i) ensure the continuity of critical or important
      functions of the central counterparty based on disaster scenarios; (ii) maintain a secondary processing
      site capable of ensuring continuity of critical or important functions of the central counterparty
      identical to the primary site; (iii) maintain or have immediate access to a secondary business site,
      to allow staff to ensure continuity of the service if the primary location of business is not available;
      (iv) consider the need for additional processing sites, in particular where the diversity of the
      risk profiles of the primary and secondary sites does not provide sufficient confidence that the
      central counterparty’s business continuity objectives will be met in all scenarios.


      (i) ensure the continuity of critical or important functions of the central counterparty based on
      disaster scenarios;


      (ii) maintain a secondary processing site capable of ensuring continuity of critical or important
      functions of the central counterparty identical to the primary site;


      (iii) maintain or have immediate access to a secondary business site, to allow staff to ensure continuity
      of the service if the primary location of business is not available;


      (iv) consider the need for additional processing sites, in particular where the diversity of the
      risk profiles of the primary and secondary sites does not provide sufficient confidence that the
      central counterparty’s business continuity objectives will be met in all scenarios.


      For the purposes of point (a), central counterparties shall complete end of day procedures and payments
      on the required time and day in all circumstances.


      For the purposes of point (c)(i), arrangements referred to in that point shall address the availability
      of adequate human resources, the maximum downtime of critical functions, and fail over and recovery
      to a secondary site.


      For the purposes of point (c)(ii), the secondary processing site referred to in that point shall
      have a geographical risk profile which is distinct from that of the primary site.


      3. In addition to the requirements referred to in paragraph 1, central securities depositories shall
      ensure that their ICT business continuity policy:


      (a) takes into account any links and interdependencies to users, critical utilities and critical
      service providers, other central securities depositories and other market infrastructures;


      (b) requires its ICT business continuity arrangements to ensure that the recovery time objective
      for their critical or important functions shall not be longer than 2 hours.


      4. In addition to the requirements referred to in paragraph 1, trading venues shall ensure that
      their ICT business continuity policy ensures that:


      (a) trading can be resumed within or close to 2 hours of a disruptive incident;


      (b) the maximum amount of data that may be lost from any IT service of the trading venue after a
      disruptive incident is close to zero.'
