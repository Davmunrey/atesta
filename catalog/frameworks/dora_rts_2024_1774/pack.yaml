id: dora_rts_2024_1774
name: DORA · RTS (UE) 2024/1774 · Gestión del riesgo TIC
version: 2024-1774.draft1
jurisdiction: EU; financial entities under Regulation (EU) 2022/2554
source: https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32024R1774
license_notes: Official Journal text (ES and EN) reproduced from the EU Publications Office, with corrigendum
  32024R1774R(02) applied; reuse of EU documents is authorised under Commission Decision 2011/833/EU,
  © European Union. Articles 1 to 41 are imported; coverage.yaml accounts for Article 42.
status: draft
attributes:
  content_state: partial
  assessment_enabled: false
  summary_es: 'Las normas técnicas de regulación que especifican las herramientas, métodos, procesos y
    políticas de gestión del riesgo relacionado con las TIC y el marco simplificado: artículos 1 a 41,
    en español e inglés. Mapeos candidatos pendientes de revisión cualificada. No es una evaluación.'
  summary_en: 'The regulatory technical standards specifying ICT risk management tools, methods, processes
    and policies, and the simplified framework: Articles 1 to 41, in Spanish and English. Candidate mappings
    await qualified review. Not an assessment.'
  scope_es: Entidades financieras sujetas a DORA. El título II desarrolla el artículo 15 de DORA; el título
    III recoge el marco simplificado para las entidades financieras del artículo 16, apartado 1, de DORA.
  scope_en: Financial entities subject to DORA. Title II details Article 15 of DORA; Title III sets out
    the simplified framework for the financial entities referred to in Article 16(1) of DORA.
  applicability_es: Determina con tu revisor si tu entidad aplica el título II o el título III. El artículo
    1 pide tener en cuenta el perfil de riesgo global y la complejidad de la entidad.
  applicability_en: Decide with your reviewer whether your entity applies Title II or Title III. Article
    1 asks for the entity's overall risk profile and complexity to be taken into account.
  limitations_es: Importados los artículos 1 a 41. Las demás normas técnicas de DORA (clasificación y
    notificación de incidentes, registro de información, pruebas de penetración guiadas por amenazas,
    subcontratación) no se importan todavía.
  limitations_en: Articles 1 to 41 are imported. The other DORA technical standards (incident classification
    and reporting, register of information, threat-led penetration testing, subcontracting) are not imported
    yet.
