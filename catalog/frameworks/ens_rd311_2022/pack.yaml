  scope_profiles:
  - key: pce_rfs_small_it
    title_es: "PCE de requisitos fundamentales (CCN-STIC 890C), entidades de menor tamaño, alcance IT"
    title_en: "Essential security requirements profile (CCN-STIC 890C), smaller entities, IT scope"
    summary_es: "Perfil transitorio publicado por el CCN para alcanzar la categoría BÁSICA cuando todas las dimensiones del sistema son de nivel bajo y la entidad tiene dificultades para adecuarse al ENS (CCN-STIC 890C, apartado 2). Selección para un alcance solo de tecnologías de la información: 38 medidas aplican. Tres medidas sin aplicación con criterio propio (op.exp.9, op.ext.3, op.cont.2) aplican si prestáis servicios de los anexos I y II de NIS2. Es una propuesta: cada medida la decidís vosotros."
    summary_en: "A transitional profile published by CCN to reach category BÁSICA when every dimension of the system is at low level and the entity finds it hard to adopt ENS (CCN-STIC 890C, section 2). Selection for a scope of information technology only: 38 measures apply. Three measures marked not applicable with their own criteria (op.exp.9, op.ext.3, op.cont.2) apply if you provide services listed in NIS2 Annexes I and II. It is a proposal: you decide each measure."
