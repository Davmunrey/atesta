    summary_es: "Perfil transitorio publicado por el CCN para alcanzar la categoría BÁSICA cuando todas las dimensiones del sistema son de nivel bajo y la entidad tiene dificultades para adecuarse al ENS (CCN-STIC 890C, apartado 2). Selección para un alcance convergente de tecnologías de la información, de operación (OT) e internet de las cosas (IoT): 42 medidas aplican. Tres medidas sin aplicación con criterio propio (op.exp.9, op.ext.3, op.cont.2) aplican si prestáis servicios de los anexos I y II de NIS2. Es una propuesta: cada medida la decidís vosotros."
