status: draft
attributes:
  content_state: partial
  assessment_enabled: false
  summary_es: 73 medidas del anexo II importadas del BOE. Mapeos y guías candidatos, pendientes de revisión cualificada. Ninguna evaluación de tu organización.
  summary_en: 73 Annex II measures imported from BOE. Candidate mappings and guidance await qualified review. No assessment of your organization.
  scope_es: Delimita sistemas, información y servicios dentro del ámbito del artículo 2, incluida la relación contractual pertinente con el sector público. No presupone que toda empresa deba certificarse.
  scope_en: Define systems, information and services within Article 2 scope, including the relevant contractual relationship with the public sector. This does not assume every business needs certification.
  applicability_es: Valora disponibilidad, integridad, confidencialidad, autenticidad y trazabilidad conforme al anexo I. La categoría depende del nivel máximo, pero no eleva las demás dimensiones. Selecciona medidas y refuerzos por categoría o dimensión, activos, riesgos y perfiles aplicables; documenta la declaración de aplicabilidad. Las tablas son referencia normativa, no una decisión automática sobre tu sistema.
  applicability_en: Assess availability, integrity, confidentiality, authenticity and traceability under Annex I. The highest level determines category without raising the other dimensions. Select measures and reinforcements by category or dimension, assets, risks and applicable profiles; document applicability. Tables are normative references, not automatic decisions about your system.
  limitations_es: Texto español de medidas y refuerzos, con tablas y cláusulas de aplicación. Faltan revisión cualificada, selección de alcance, evaluación real y cobertura de artículos, instrucciones técnicas, perfiles y auditoría como requisitos independientes. Los diagramas del BOE se consultan en la fuente. Las guías orientan; los escaneos parciales no certifican cumplimiento.
  limitations_en: Spanish measure/reinforcement text, tables and application clauses. Qualified review, scope selection, real assessment and independent coverage of articles, technical instructions, profiles and audits remain pending. Consult BOE for diagrams. Guidance supports preparation; partial scans do not certify compliance.
