- units:
  - art1
  - art2
  - art3
  - art4
  status: excluded
  reason_es: 'Objeto, ámbito, datos personales y definiciones: delimitan a quién y a qué se aplica el
    ENS; no son medidas que se evalúen.'
  reason_en: 'Subject matter, scope, personal data and definitions: they define who and what the ENS applies
    to; they are not measures to assess.'
- units:
  - art5
  - art6
  - art7
  - art8
  - art9
  - art10
  - art11
  status: excluded
  reason_es: Principios básicos. Este borrador los trata a través de las medidas del anexo II; una revisión
    cualificada debe confirmar que no queda ninguna obligación sin cubrir.
  reason_en: Basic principles. This draft handles them through the Annex II measures; a qualified review
    must confirm that no obligation is left uncovered.
