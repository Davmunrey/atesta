  - art36
  status: excluded
  reason_es: Requisitos mínimos de seguridad. Este borrador los trata a través de las medidas del anexo
    II; una revisión cualificada debe confirmar que no queda ninguna obligación sin cubrir.
  reason_en: Minimum security requirements. This draft handles them through the Annex II measures; a qualified
    review must confirm that no obligation is left uncovered.
- units:
  - art28
  status: excluded
  reason_es: 'Cumplimiento de los requisitos mínimos: la declaración de aplicabilidad se genera desde
    el registro de la organización; no es una medida que se evalúe.'
  reason_en: 'Compliance with the minimum requirements: the statement of applicability is generated from
    the organization''s register; it is not a measure to assess.'
- units:
  - art31
  - art38
  - annex3
  status: excluded
  reason_es: 'Auditoría y determinación de la conformidad: Atesta registra la autoevaluación y la revisión
    del responsable de la seguridad; la auditoría y la certificación las realiza un tercero.'
  reason_en: 'Audit and conformity assessment: Atesta records the self-assessment and the security officer''s
    review; audits and certification are carried out by a third party.'
- units:
  - art29
  - art30
  - art32
  - art33
  - art34
  - art35
  - art37
  - art39
  - art41
  status: excluded
  reason_es: 'Infraestructuras comunes, perfiles de cumplimiento, informe del estado de la seguridad,
    respuesta a incidentes del sector público, administración digital, mecanismos de control, actualización
    y facultades: funciones de las administraciones públicas y sus órganos, o desarrollo posterior. Los
    perfiles de cumplimiento específicos se revisarán aparte.'
  reason_en: 'Common infrastructures, compliance profiles, security status report, public-sector incident
    response, digital administration, control mechanisms, updating and powers: functions of public administrations
    and their bodies, or later development. Specific compliance profiles will be reviewed separately.'
- units:
  - art40
  - annex1
  status: excluded
  reason_es: 'Categorías de seguridad: se usan para definir el alcance (categoría y nivel por dimensión),
    no como medidas.'
  reason_en: 'Security categories: used to define the scope (category and level per dimension), not as
    measures.'
