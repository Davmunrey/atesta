- id: op.cont.4
  title_es: Medios alternativos
  title_en: null
  applies_to: []
  source: https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191#ai-2
  attributes:
    official_text_es: |-
      Requisitos.

      – [op.cont.4.1] Estará prevista la disponibilidad de medios alternativos para poder seguir prestando servicio cuando los medios habituales no estén disponibles. En concreto, se cubrirán los siguientes elementos del sistema:

      a) Servicios contratados a terceros.

      b) Instalaciones alternativas.

      c) Personal alternativo.

      d) Equipamiento informático alternativo.

      e) Medios de comunicación alternativos.

      – [op.cont.4.2] Se establecerá un tiempo máximo para que los medios alternativos entren en funcionamiento.

      – [op.cont.4.3] Los medios alternativos estarán sometidos a las mismas garantías de seguridad que los originales.

      Refuerzo R1-Automatización de la transición a medios alternativos.

      – [op.cont.4.r1.1] El sistema dispondrá de elementos hardware o software que permitan la transferencia de los servicios automáticamente a los medios alternativos.
    applicability_es: |-
      Aplicación de la medida (por disponibilidad).
      – Nivel BAJO: no aplica.
      – Nivel MEDIO: no aplica.
      – Nivel ALTO: op.cont.4.
    selection_basis: nivel · D
    selection_rules:
    - level: BAJO
      rule: n.a.
    - level: MEDIO
      rule: n.a.
    - level: ALTO
      rule: aplica
    section: 4.6.4
    source_sha256: c9ad1208439ab5902e84c42d286b22419bf29eae9a26b4d2610b7b0ad75028e6
    expected_evidence:
      reviewed_by: David Muñoz
      reviewed_on: 2026-11-23
      items:
      - es: Inventario de medios alternativos para la recuperación.
        en: Inventory of alternative means for recovery.
        ref: {guide: CCN-STIC 808, edition: 2026-04, section: 6.2.2.6 (op.cont.4), page: 64}
      - es: Contratos y SLA de los medios alternativos que presta un tercero.
        en: Contracts and SLAs for third-party alternative means.
        ref: {guide: CCN-STIC 808, edition: 2026-04, section: 6.2.2.6 (op.cont.4), page: 64}
      - es: Personal, instalaciones y comunicaciones alternativos.
        en: Alternative staff, premises and communications.
        ref: {guide: CCN-STIC 808, edition: 2026-04, section: 6.2.2.6 (op.cont.4), page: 64}
      - es: Conmutación automática a los medios alternativos.
        en: Automatic failover to the alternative means.
        ref: {guide: CCN-STIC 808, edition: 2026-04, section: 6.2.2.6 (op.cont.4), page: 64}
- id: op.mon.1
  title_es: Detección de intrusión
  title_en: null
