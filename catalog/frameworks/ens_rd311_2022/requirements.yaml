      Aplicación de la medida.
      – Categoría BÁSICA: mp.com.1.
      – Categoría MEDIA: mp.com.1.
      – Categoría ALTA: mp.com.1.
    selection_basis: categoría · Todas
    selection_rules:
    - level: BÁSICA
      rule: aplica
    - level: MEDIA
      rule: aplica
    - level: ALTA
      rule: aplica
    section: 5.4.1
    source_sha256: 6b354302c78d9922f64926cd494cf718c04ad575acf35d23176e84e1faddac9e
    expected_evidence:
      reviewed_by: David Muñoz
      reviewed_on: 2026-11-23
      items:
      - es: Cortafuegos y su conjunto de reglas.
        en: Firewalls and their rule sets.
        ref: {guide: CCN-STIC 808, edition: 2026-04, section: 6.2.3.4 (mp.com.1), page: 82}
      - es: Autorización previa de las reglas que abren flujos nuevos.
