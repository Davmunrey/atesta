- requirement_id: art32.1b
  control_id: ctl.privileged_accounts
  rationale: "Candidate: tenant settings for privileged accounts (count, dedication, phishing-resistant MFA, PIM approval, recovery). Who holds each role and why needs documentary review."
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_32
  reviewed_by: null
- requirement_id: art32.1b
  control_id: ctl.user_authentication
  rationale: "Candidate: tenant-wide MFA and authentication method settings. Exclusions, service accounts and the credential lifecycle need documentary review."
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_32
  reviewed_by: null
- requirement_id: art32.1b
  control_id: ctl.sign_in_controls
  rationale: "Candidate: sign-in risk and session duration policies. Licence-dependent coverage and exceptions need documentary review."
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_32
  reviewed_by: null
- requirement_id: art32.1b
  control_id: ctl.m365_external_sharing
  rationale: "Candidate: external sharing and guest settings in SharePoint, OneDrive and Entra. Individual sites and links already shared need documentary review."
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_32
  reviewed_by: null
- requirement_id: art32.1b
  control_id: ctl.email_protection
  rationale: "Candidate: DMARC enforcement and Gmail anti-spoofing and attachment protections. Defender checks that need PowerShell do not run yet; they need documentary review."
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_32
  reviewed_by: null
- requirement_id: art32.1b
  control_id: ctl.conditional_access_coverage
  rationale: "Candidate: Conditional Access coverage, exclusions and hygiene. Justified exceptions and licence-dependent policies need documentary review."
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_32
  reviewed_by: null
- requirement_id: art32.1b
  control_id: ctl.device_management
  rationale: "Candidate: device compliance, registration and managed-device access settings. The device inventory, encryption and patching need documentary review."
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_32
  reviewed_by: null
- requirement_id: art32.1b
  control_id: ctl.app_governance
  rationale: "Candidate: app consent, registration and credential settings, and legacy access. What each app does with data needs documentary review."
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_32
  reviewed_by: null
- requirement_id: art32.1b
  control_id: ctl.password_and_recovery
  rationale: "Candidate: password, lockout and recovery settings. They complement MFA; the credential lifecycle needs documentary review."
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_32
  reviewed_by: null
- requirement_id: art32.1b
  control_id: ctl.workspace_collaboration
  rationale: "Candidate: Google Workspace external sharing, DLP and mail delegation settings. Files and links already shared need documentary review."
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_32
  reviewed_by: null
- requirement_id: art32.1b
  control_id: ctl.directory_governance
  rationale: "Candidate: directory settings for group and tenant creation, scheduled access reviews and admin portals. Whether reviews are done needs documentary review."
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32016R0679#art_32
  reviewed_by: null
