id: gdpr_art32
name: RGPD · Art. 32-34
version: 2016-679.art32-34.draft7
jurisdiction: EU
source: https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679
license_notes: Official Journal text (ES and EN) reproduced from the EU Publications Office; reuse of
  EU documents is authorised under Commission Decision 2011/833/EU, © European Union. Only Articles 32
  (except paragraph 3), 33 and 34(1)-(3) are imported; coverage.yaml accounts for every other article.
  Not a complete GDPR pack; the security provisions of the LOPDGDD are in their own pack, lopdgdd.
status: draft
attributes:
  content_state: partial
  assessment_enabled: false
  summary_es: 14 requisitos oficiales del RGPD sobre seguridad del tratamiento y violaciones de la seguridad
    de los datos personales (artículos 32 a 34), en español e inglés. Mapeos candidatos pendientes de
    revisión cualificada. No es una evaluación de protección de datos completa.
  summary_en: 14 official GDPR requirements on security of processing and personal data breaches (Articles
    32 to 34), in Spanish and English. Candidate mappings await qualified review. Not a complete data
    protection assessment.
  scope_es: Identifica tratamientos, datos, responsables, encargados, sistemas y proveedores dentro del
    ámbito aplicable del RGPD.
  scope_en: Identify processing activities, data, controllers, processors, systems and providers within
    the applicable GDPR scope.
  applicability_es: Valora riesgos para las personas y el contexto del tratamiento para seleccionar medidas
    técnicas y organizativas. Revisa confidencialidad, integridad, disponibilidad, recuperación y comprobación
    periódica; no existe una configuración universal suficiente.
  applicability_en: Assess risks to individuals and processing context to select technical and organizational
    measures. Review confidentiality, integrity, availability, recovery and regular testing; no universal
    configuration is sufficient.
  limitations_es: Importados los artículos 32 (salvo el apartado 3), 33 y 34 (apartados 1 a 3); el resto
    del Reglamento figura en la cobertura con su motivo. No cubre bases jurídicas, derechos, transferencias
    ni evaluaciones de impacto. Los preceptos de seguridad de la LOPDGDD tienen su propio marco. Revisa
    con tu delegado de protección de datos cuando corresponda.
  limitations_en: Articles 32 (except paragraph 3), 33 and 34(1)-(3) are imported; the rest of the Regulation
    is listed in the coverage with its reason. Legal bases, rights, transfers and impact assessments
    are not covered. The security provisions of the Spanish LOPDGDD have their own framework. Review
    with your data protection officer where applicable.
