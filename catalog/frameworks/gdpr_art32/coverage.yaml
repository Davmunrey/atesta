  status: excluded
  reason_es: 'Principios y licitud del tratamiento: fuera del alcance de esta guía de seguridad del tratamiento.
    El principio de integridad y confidencialidad del artículo 5, apartado 1, letra f), se desarrolla
    en el artículo 32.'
  reason_en: 'Principles and lawfulness of processing: outside this security-of-processing guide. The
    integrity and confidentiality principle in Article 5(1)(f) is developed in Article 32.'
