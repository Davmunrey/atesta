  - art3
  - art4
  status: excluded
  reason_es: 'Objeto, ámbito material y territorial y definiciones: delimitan a qué tratamientos se aplica
    el Reglamento; no son medidas que se evalúen.'
  reason_en: 'Subject matter, material and territorial scope and definitions: they define which processing
    the Regulation applies to; they are not measures to assess.'
- units:
  - art5
  - art6
  - art7
