    desde el diseño, encargados, registro de actividades, cooperación): fuera de esta guía; candidatas
    a una versión posterior.'
  reason_en: 'General obligations of controllers and processors (responsibility, data protection by design,
    processors, records of processing, cooperation): outside this guide; candidates for a later version.'
