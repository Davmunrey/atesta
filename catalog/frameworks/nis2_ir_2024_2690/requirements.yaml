requirements:
- id: art2
  title_es: Requisitos técnicos y metodológicos · artículo 2
  title_en: Technical and methodological requirements · Article 2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#art_2
  attributes:
    official_text_es: '1. Con relación a las entidades pertinentes, los requisitos técnicos y metodológicos
      de las medidas para la gestión de riesgos de ciberseguridad a que se refiere el artículo 21, apartado
      2, letras a) a j), de la Directiva (UE) 2022/2555 se establecen en el anexo del presente Reglamento.


      2. Las entidades pertinentes garantizarán un nivel de seguridad de los sistemas de redes y de información
      adecuado a los riesgos que se planteen al llevar a la práctica y aplicar los requisitos técnicos
      y metodológicos de las medidas para la gestión de riesgos de ciberseguridad establecidos en el anexo
      del presente Reglamento. Para ello, tendrán debidamente en cuenta su grado de exposición a los riesgos,
      su tamaño y la probabilidad de que se produzcan incidentes y su gravedad, especialmente sus repercusiones
      sociales y económicas, a la hora de cumplir los requisitos técnicos y metodológicos de las medidas
      para la gestión de riesgos de ciberseguridad establecidos en el anexo del presente Reglamento.


      Cuando el anexo del presente Reglamento establezca que los requisitos técnicos y metodológicos de
      las medidas de gestión de riesgos de ciberseguridad se aplicarán «según proceda», «cuando proceda»
      o «en la medida de lo posible», y la entidad pertinente considere que no procede, que no resulta
      de aplicación o que no es posible aplicar determinados requisitos técnicos y metodológicos, la entidad
      redactará de manera comprensible su razonamiento a tal efecto.'
    official_text_en: '1. For the relevant entities the technical and methodological requirements of cybersecurity
      risk-management measures referred to in Article 21(2), points (a) to (j), of Directive (EU) 2022/2555
      are set out in the Annex to this Regulation.


      2. The relevant entities shall ensure a level of security of network and information systems appropriate
      to the risks posed when implementing and applying the technical and methodological requirements
      of cybersecurity risk-management measures set out in the Annex to this Regulation. For that purpose,
      they shall take due account of the degree of their exposure to risks, their size and the likelihood
      of occurrence of incidents and their severity, including their societal and economic impact, when
      complying with the technical and methodological requirements of cybersecurity risk-management measures
      set out in the Annex to this Regulation.


      Where the Annex to this Regulation provides that a technical or methodological requirement of a
      cybersecurity risk-management measure shall be applied ‘where appropriate’, ‘where applicable’ or
      ‘to the extent feasible’, and where a relevant entity considers it not appropriate, not applicable
      or not feasible for the relevant entity to apply certain such technical and methodological requirements,
      the relevant entity shall in a comprehensible manner document its reasoning to that effect.'
    section: Artículo 2
    source_sha256: b7dc2d3f01963954d85d596c3e0b3c975fdba453fa93654ded69a412ff498cf2
- id: 1.1.1
  title_es: Política sobre la seguridad de las redes y sistemas de información · punto 1.1.1
  title_en: Policy on the security of network and information systems · point 1.1.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A efectos del artículo 21, apartado 2, letra a), de la Directiva (UE) 2022/2555,
      la política de seguridad de los sistemas de redes y de información:


      a) determinará el enfoque de las entidades pertinentes para gestionar la seguridad de sus sistemas
      de redes y de información;


      b) se adecuará a la estrategia y los objetivos operativos de las entidades pertinentes y los completará;


      c) establecerá los objetivos de seguridad de las redes y de la información;


      d) se comprometerá a mejorar constantemente la seguridad de los sistemas de redes y de información;


      e) se comprometerá a facilitar los recursos oportunos para su aplicación, incluidos el personal,
      los recursos financieros, los procedimientos, las herramientas y las tecnologías que se necesiten;


      f) será comunicada a los empleados y partes externas que proceda, que deberán aprobarla;


      g) presentará los roles y responsabilidades con arreglo al punto 1.2;


      h) detallará la documentación que debe conservarse y la duración del período de conservación;


      i) enumerará las políticas específicas;


      j) fijará indicadores y medidas para supervisar su aplicación y el estado actual del nivel de madurez
      de la seguridad de las redes y de la información de las entidades pertinentes;


      k) indicará la fecha de la aprobación formal por parte de los órganos de dirección de las entidades
      pertinentes [en adelante, «órgano(s) de dirección»].'
    official_text_en: 'For the purpose of Article 21(2), point (a) of Directive (EU) 2022/2555, the policy
      on the security of network and information systems shall:


      (a) set out the relevant entities’ approach to managing the security of their network and information
      systems;


      (b) be appropriate to and complementary with the relevant entities’ business strategy and objectives;


      (c) set out network and information security objectives;


      (d) include a commitment to continual improvement of the security of network and information systems;


      (e) include a commitment to provide the appropriate resources needed for its implementation, including
      the necessary staff, financial resources, processes, tools and technologies;


      (f) be communicated to and acknowledged by relevant employees and relevant interested external parties;


      (g) lay down roles and responsibilities pursuant to point 1.2;


      (h) list the documentation to be kept and the duration of retention of the documentation;


      (i) list the topic-specific policies;


      (j) lay down indicators and measures to monitor its implementation and the current status of relevant
      entities’ maturity level of network and information security;


      (k) indicate the date of the formal approval by the management bodies of the relevant entities (the
      ‘management bodies’).'
    section: Anexo, punto 1.1.1
    source_sha256: 0f6fa8dff0bd3a202ce82f6157f7839e16e353c734459bc398782e993995d273
- id: 1.1.2
  title_es: Política sobre la seguridad de las redes y sistemas de información · punto 1.1.2
  title_en: Policy on the security of network and information systems · point 1.1.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: El órgano de dirección revisará y, cuando proceda, actualizará la política de seguridad
      de los sistemas de redes y de información al menos una vez al año, así como cuando se produzcan
      incidentes significativos o cambios significativos en las operaciones o los riesgos. Los resultados
      de las revisiones quedarán documentados.
    official_text_en: The network and information system security policy shall be reviewed and, where
      appropriate, updated by management bodies at least annually and when significant incidents or significant
      changes to operations or risks occur. The result of the reviews shall be documented.
    section: Anexo, punto 1.1.2
    source_sha256: 1872abbef8e6f9e5f84ccef0a93a611e86f937b2f69a40466a3f584b15070a6d
- id: 1.2.1
  title_es: Roles, responsabilidades y autoridades · punto 1.2.1
  title_en: Roles, responsibilities and authorities · point 1.2.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Como parte de la política de seguridad de los sistemas de redes y de información
      a que hace referencia el punto 1.1, las entidades pertinentes determinarán las responsabilidades
      y autoridades en materia de seguridad de los sistemas de redes y de información y las asignarán
      a distintos roles, las repartirán en función de las necesidades de la entidad y se las comunicarán
      a los órganos de dirección.
    official_text_en: As part of their policy on the security of network and information systems referred
      to in point 1.1, the relevant entities shall lay down responsibilities and authorities for network
      and information system security and assign them to roles, allocate them according to the relevant
      entities’ needs, and communicate them to the management bodies.
    section: Anexo, punto 1.2.1
    source_sha256: a476d9a0964b9401061a138e84595e251267553fd19033acebc6506e9f1bd195
- id: 1.2.2
  title_es: Roles, responsabilidades y autoridades · punto 1.2.2
  title_en: Roles, responsibilities and authorities · point 1.2.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes exigirán a todo el personal y a terceros que apliquen
      la seguridad de los sistemas de redes y de información de conformidad con la política de seguridad
      de las redes y la información y las políticas específicas existentes, así como con los procedimientos
      de las entidades pertinentes.
    official_text_en: The relevant entities shall require all personnel and third parties to apply network
      and information system security in accordance with the established network and information security
      policy, topic-specific policies and procedures of the relevant entities.
    section: Anexo, punto 1.2.2
    source_sha256: fe7f98da24cfc1b30444bd6d216d3c01614ad43069b7293f2df99579fa2b9163
- id: 1.2.3
  title_es: Roles, responsabilidades y autoridades · punto 1.2.3
  title_en: Roles, responsibilities and authorities · point 1.2.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Al menos una persona informará directamente a los órganos de dirección sobre cuestiones
      de seguridad de los sistemas de redes y de información.
    official_text_en: At least one person shall report directly to the management bodies on matters of
      network and information system security.
    section: Anexo, punto 1.2.3
    source_sha256: 52ae75f1bf903dec3452bc52c139580da229162804cb689a76160c34d152eb56
- id: 1.2.4
  title_es: Roles, responsabilidades y autoridades · punto 1.2.4
  title_en: Roles, responsibilities and authorities · point 1.2.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: En función del tamaño de las entidades pertinentes, la seguridad de las redes y
      los sistemas de información corresponderá a roles o funciones específicos que se desempeñarán además
      de los roles existentes.
    official_text_en: Depending on the size of the relevant entities, network and information system security
      shall be covered by dedicated roles or duties carried out in addition to existing roles.
    section: Anexo, punto 1.2.4
    source_sha256: 261f9a3f3fe7f2e3fc843a8eb53fae328c3e5635ff39a5606b9f9270274a8237
- id: 1.2.5
  title_es: Roles, responsabilidades y autoridades · punto 1.2.5
  title_en: Roles, responsibilities and authorities · point 1.2.5
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Aquellos cargos o áreas de responsabilidad que entren en conflicto se separarán,
      cuando proceda.
    official_text_en: Conflicting duties and conflicting areas of responsibility shall be segregated,
      where applicable.
    section: Anexo, punto 1.2.5
    source_sha256: 8a69870a6d135c200c6ccc9da16214893442c2db17cfef535676e74cf292be32
- id: 1.2.6
  title_es: Roles, responsabilidades y autoridades · punto 1.2.6
  title_en: Roles, responsibilities and authorities · point 1.2.6
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Los órganos de dirección revisarán y, cuando proceda, actualizarán los roles, responsabilidades
      y autoridades a intervalos planificados, así como cuando se produzcan incidentes significativos
      o cambios significativos en las operaciones o los riesgos.
    official_text_en: Roles, responsibilities and authorities shall be reviewed and, where appropriate,
      updated by management bodies at planned intervals and when significant incidents or significant
      changes to operations or risks occur.
    section: Anexo, punto 1.2.6
    source_sha256: fc4be287c2ecddacb5d92fcf83082f2a978712f6f397738a8ef3fa888e0c09f5
- id: 2.1.1
  title_es: Marco de la gestión de riesgos · punto 2.1.1
  title_en: Risk management framework · point 2.1.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A efectos del artículo 21, apartado 2, letra a), de la Directiva (UE) 2022/2555,
      las entidades pertinentes establecerán y mantendrán un marco de la gestión de riesgos adecuado para
      detectar y abordar los riesgos que se planteen para la seguridad de los sistemas de redes y de información.
      Las entidades pertinentes realizarán evaluaciones de riesgos cuyos resultados documentarán y, a
      partir de estos últimos, establecerán un plan de tratamiento de riesgos, que aplicarán y supervisarán.
      Siempre que las entidades pertinentes garanticen una información adecuada a los órganos de dirección,
      estos últimos o, cuando proceda, las personas que sean responsables y tengan autoridad para gestionar
      los riesgos, aprobarán los resultados de la evaluación de riesgos y los riesgos residuales.
    official_text_en: For the purpose of Article 21(2), point (a) of Directive (EU) 2022/2555, the relevant
      entities shall establish and maintain an appropriate risk management framework to identify and address
      the risks posed to the security of network and information systems. The relevant entities shall
      perform and document risk assessments and, based on the results, establish, implement and monitor
      a risk treatment plan. Risk assessment results and residual risks shall be accepted by management
      bodies or, where applicable, by persons who are accountable and have the authority to manage risks,
      provided that the relevant entities ensure adequate reporting to the management bodies.
    section: Anexo, punto 2.1.1
    source_sha256: e8f26bbf98efdd7614edca5a3743d696638ecaa4b2e29653e85dc9050dc0120d
- id: 2.1.2
  title_es: Marco de la gestión de riesgos · punto 2.1.2
  title_en: Risk management framework · point 2.1.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A los efectos del punto 2.1.1, las entidades pertinentes establecerán procedimientos
      para detectar, analizar, evaluar y tratar los riesgos («proceso de gestión de riesgos de ciberseguridad»).
      El proceso de gestión de riesgos de ciberseguridad formará parte del proceso de gestión de riesgos
      general de la entidad pertinente, según proceda. Como parte del proceso de gestión de riesgos de
      ciberseguridad, las entidades pertinentes:


      a) seguirán una metodología de gestión de riesgos;


      b) establecerán un nivel de tolerancia al riesgo conforme con la propensión al riesgo de la entidad;


      c) establecerán y mantendrán criterios de riesgo pertinentes;


      d) de conformidad con un enfoque que abarque todos los riesgos, determinarán y registrarán todos
      los riesgos existentes para la seguridad de los sistemas de redes y de información, en especial
      con relación a terceros o a aquellos riesgos que puedan generar alteraciones en la disponibilidad,
      integridad, autenticidad y confidencialidad de los sistemas de redes y de información, incluida
      la detección de puntos únicos de fallo;


      e) analizarán los riesgos que se planteen para la seguridad de los sistemas de redes y de información,
      especialmente la amenaza, la probabilidad, el impacto y el nivel de riesgo, teniendo en cuenta la
      inteligencia sobre ciberamenazas y las vulnerabilidades;


      f) evaluarán los riesgos detectados a partir de los criterios de riesgo;


      g) determinarán y priorizarán las opciones y medidas adecuadas de tratamiento de riesgos;


      h) supervisarán constantemente la aplicación de las medidas de tratamiento de riesgos;


      i) determinarán quién es responsable de la aplicación de las medidas de tratamiento de riesgos y
      cuándo deben aplicarse estas;


      j) informarán de manera comprensible de las medidas de tratamiento de riesgos elegidas en un plan
      de tratamiento de riesgos y de las razones que justifiquen la aceptación de los riesgos residuales.'
    official_text_en: 'For the purpose of point 2.1.1, the relevant entities shall establish procedures
      for identification, analysis, assessment and treatment of risks (‘cybersecurity risk management
      process’). The cybersecurity risk management process shall be an integral part of the relevant entities’
      overall risk management process, where applicable. As part of the cybersecurity risk management
      process, the relevant entities shall:


      (a) follow a risk management methodology;


      (b) establish the risk tolerance level in accordance with the risk appetite of the relevant entities;


      (c) establish and maintain relevant risk criteria;


      (d) in line with an all-hazards approach, identify and document the risks posed to the security
      of network and information systems, in particular in relation to third parties and risks that could
      lead to disruptions in the availability, integrity, authenticity and confidentiality of the network
      and information systems, including the identification of single point of failures;


      (e) analyse the risks posed to the security of network and information systems, including threat,
      likelihood, impact, and risk level, taking into account cyber threat intelligence and vulnerabilities;


      (f) evaluate the identified risks based on the risk criteria;


      (g) identify and prioritise appropriate risk treatment options and measures;


      (h) continuously monitor the implementation of the risk treatment measures;


      (i) identify who is responsible for implementing the risk treatment measures and when they should
      be implemented;


      (j) document the chosen risk treatment measures in a risk treatment plan and the reasons justifying
      the acceptance of residual risks in a comprehensible manner.'
    section: Anexo, punto 2.1.2
    source_sha256: 2c4bbb3d0131921b483f1b973c2b8a448314729ba3e09a086b2dc2d84d60c975
- id: 2.1.3
  title_es: Marco de la gestión de riesgos · punto 2.1.3
  title_en: Risk management framework · point 2.1.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Cuando detecten y prioricen las opciones y medidas adecuadas para el tratamiento
      de los riesgos, las entidades pertinentes tendrán en cuenta los resultados de la evaluación de riesgos,
      los resultados del procedimiento para evaluar la eficacia de las medidas para la gestión de riesgos
      de ciberseguridad, el coste de su aplicación en relación con los beneficios previstos, la clasificación
      de activos contemplada en el punto 12.1 y el análisis de impacto operativo a que se refiere el punto
      4.1.3.
    official_text_en: When identifying and prioritising appropriate risk treatment options and measures,
      the relevant entities shall take into account the risk assessment results, the results of the procedure
      to assess the effectiveness of cybersecurity risk-management measures, the cost of implementation
      in relation to the expected benefit, the asset classification referred to in point 12.1, and the
      business impact analysis referred to in point 4.1.3.
    section: Anexo, punto 2.1.3
    source_sha256: 7d52f292ae9e65c484c10f46382a019c225fab6997ddc40fde3ce31d3a12ed39
- id: 2.1.4
  title_es: Marco de la gestión de riesgos · punto 2.1.4
  title_en: Risk management framework · point 2.1.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán los resultados
      de la evaluación de riesgos y el plan de tratamiento de riesgos a intervalos planificados y como
      mínimo anualmente, así como cuando se produzcan incidentes significativos o cambios significativos
      en las operaciones o los riegos.
    official_text_en: The relevant entities shall review and, where appropriate, update the risk assessment
      results and the risk treatment plan at planned intervals and at least annually, and when significant
      changes to operations or risks or significant incidents occur.
    section: Anexo, punto 2.1.4
    source_sha256: e17b25fe4c44fc634b32d0dc9681ee2fb76fd0e09910ea1e629f5c7bb4ad5fa3
- id: 2.2.1
  title_es: Control del cumplimiento · punto 2.2.1
  title_en: Compliance monitoring · point 2.2.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán periódicamente el cumplimiento de sus políticas
      en materia de seguridad de los sistemas de redes y de información, políticas específicas, reglas
      y normas. Los órganos de dirección serán informados, mediante informes periódicos, del estado de
      seguridad de las redes y la información a partir de las revisiones del cumplimiento.
    official_text_en: The relevant entities shall regularly review the compliance with their policies
      on network and information system security, topic-specific policies, rules, and standards. The management
      bodies shall be informed of the status of network and information security on the basis of the compliance
      reviews by means of regular reporting.
    section: Anexo, punto 2.2.1
    source_sha256: a0297b8a22239df072435d28ab2054fe7b5fdf2ea9540b9ca5c64ea99b82a8d2
- id: 2.2.2
  title_es: Control del cumplimiento · punto 2.2.2
  title_en: Compliance monitoring · point 2.2.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes pondrán en marcha un sistema eficaz de notificación del
      cumplimiento que será adecuado a sus estructuras, sus entornos operativos y su panorama de amenazas.
      El sistema de notificación del cumplimiento podrá ofrecer a los órganos de dirección una visión
      informada del estado en que se encuentre la gestión de riesgos de las entidades pertinentes.
    official_text_en: The relevant entities shall put in place an effective compliance reporting system
      which shall be appropriate to their structures, operating environments and threat landscapes. The
      compliance reporting system shall be capable to provide to the management bodies an informed view
      of the current state of the relevant entities’ management of risks.
    section: Anexo, punto 2.2.2
    source_sha256: 31ad26c3876d9d8e4cb4d890565cb3bb34dbffd7668a61da9755aaefaca08b08
- id: 2.2.3
  title_es: Control del cumplimiento · punto 2.2.3
  title_en: Compliance monitoring · point 2.2.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes realizarán el control del cumplimiento a intervalos planificados,
      así como cuando se produzcan incidentes significativos o cambios significativos en las operaciones
      o los riesgos.
    official_text_en: The relevant entities shall perform the compliance monitoring at planned intervals
      and when significant incidents or significant changes to operations or risks occur.
    section: Anexo, punto 2.2.3
    source_sha256: 088f433c6dcecd9f762d604847d36b873cb0f484e1205c3671af1cbf098de4f7
- id: 2.3.1
  title_es: Revisión independiente de la seguridad de la información y las redes · punto 2.3.1
  title_en: Independent review of information and network security · point 2.3.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán de forma independiente su enfoque de gestión
      de la seguridad de los sistemas de redes y de información y su aplicación, incluidas las personas,
      los procesos y las tecnologías.
    official_text_en: The relevant entities shall review independently their approach to managing network
      and information system security and its implementation including people, processes and technologies.
    section: Anexo, punto 2.3.1
    source_sha256: 9d6bc7bff134ef26e65c6c931213255c18daa0451b41992606444ea2934bca0b
- id: 2.3.2
  title_es: Revisión independiente de la seguridad de la información y las redes · punto 2.3.2
  title_en: Independent review of information and network security · point 2.3.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes desarrollarán y mantendrán procedimientos para llevar
      a cabo revisiones independientes que serán ejecutados por personas con las debidas competencias
      en materia de auditoría. Cuando miembros del personal de la entidad pertinente realicen una revisión
      independiente, las personas encargadas de la misma no podrán ejercer poder jerárquico sobre el personal
      de la zona objeto de la revisión. Si el tamaño de la entidad pertinente no permite esta separación
      del poder jerárquico, la entidad pondrá en marcha medidas alternativas para garantizar la imparcialidad
      de las revisiones.
    official_text_en: The relevant entities shall develop and maintain processes to conduct independent
      reviews which shall be carried out by individuals with appropriate audit competence. Where the independent
      review is conducted by staff members of the relevant entity, the persons conducting the reviews
      shall not be in the line of authority of the personnel of the area under review. If the size of
      the relevant entities does not allow such separation of line of authority, the relevant entities
      shall put in place alternative measures to guarantee the impartiality of the reviews.
    section: Anexo, punto 2.3.2
    source_sha256: 53ff7247fd0d819207ed26209a2a6c311d0a60aefc4c1a63fa9f9b3b3d9c32be
- id: 2.3.3
  title_es: Revisión independiente de la seguridad de la información y las redes · punto 2.3.3
  title_en: Independent review of information and network security · point 2.3.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Los resultados de las revisiones independientes, especialmente los resultados del
      control del cumplimiento de conformidad con el punto 2.2 y del control y la medición con arreglo
      al punto 7, se notificarán a los órganos de control. De acuerdo con los criterios de aceptación
      del riesgo de las entidades pertinentes, se adoptarán medidas correctoras o se aceptará el riesgo
      residual.
    official_text_en: The results of the independent reviews, including the results from the compliance
      monitoring pursuant to point 2.2 and the monitoring and measurement pursuant to point 7, shall be
      reported to the management bodies. Corrective actions shall be taken or residual risk accepted according
      to the relevant entities’ risk acceptance criteria.
    section: Anexo, punto 2.3.3
    source_sha256: 94f82f2633d700c7c54f14e93ff097bb45c1fd852c271c30d43a431e5ed2a270
- id: 2.3.4
  title_es: Revisión independiente de la seguridad de la información y las redes · punto 2.3.4
  title_en: Independent review of information and network security · point 2.3.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las revisiones independientes tendrán lugar a intervalos planificados, así como
      cuando se produzcan incidentes significativos o cambios significativos en las operaciones o los
      riesgos.
    official_text_en: The independent reviews shall take place at planned intervals and when significant
      incidents or significant changes to operations or risks occur.
    section: Anexo, punto 2.3.4
    source_sha256: ad49df21b0304ee88fe6cfd15c8e4bbedf2ceba4b0835549d19c88e62f42905d
- id: 3.1.1
  title_es: Política de gestión de incidentes · punto 3.1.1
  title_en: Incident handling policy · point 3.1.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A los efectos del artículo 21, apartado 2, letra b), de la Directiva (UE) 2022/2555,
      las entidades pertinentes elaborarán y pondrán en marcha una política de gestión de incidentes por
      la que se establezcan los roles, responsabilidades y procedimientos para la detección, el análisis,
      la contención y la gestión de los incidentes, así como la posterior recuperación, documentación
      y notificación de los mismos a su debido tiempo.
    official_text_en: For the purpose of Article 21(2), point (b) of Directive (EU) 2022/2555, the relevant
      entities shall establish and implement an incident handling policy laying down the roles, responsibilities,
      and procedures for detecting, analysing, containing or responding to, recovering from, documenting
      and reporting of incidents in a timely manner.
    section: Anexo, punto 3.1.1
    source_sha256: f0d3720ded0564bd088e6b62e92b31d12436a425f09804c28482f760717db438
- id: 3.1.2
  title_es: Política de gestión de incidentes · punto 3.1.2
  title_en: Incident handling policy · point 3.1.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'La política prevista en el punto 3.1.1 será coherente con el plan de continuidad
      de las actividades y de recuperación en caso de catástrofe a que hace referencia el punto 4.1. La
      política incluirá:


      a) un sistema de clasificación de incidentes que sea coherente con la evaluación y clasificación
      de sucesos realizada de conformidad con el punto 3.4.1;


      b) planes de comunicación eficaces, especialmente en lo relativo a la activación de los niveles
      sucesivos de intervención y la presentación de informes;


      c) la asignación, a los empleados competentes, de roles para detectar y gestionar adecuadamente
      los incidentes;


      d) los documentos que han de utilizarse durante el proceso para detectar y gestionar los incidentes,
      como, por ejemplo, manuales de respuesta a incidentes, cuadros de activación por niveles, listas
      de contactos y plantillas.'
    official_text_en: 'The policy referred to in point 3.1.1 shall be coherent with the business continuity
      and disaster recovery plan referred to in point 4.1. The policy shall include:


      (a) a categorisation system for incidents that is consistent with the event assessment and classification
      carried out pursuant to point 3.4.1;


      (b) effective communication plans including for escalation and reporting;


      (c) assignment of roles to detect and appropriately respond to incidents to competent employees;


      (d) documents to be used in the course of incident detection and response such as incident response
      manuals, escalation charts, contact lists and templates.'
    section: Anexo, punto 3.1.2
    source_sha256: b96a9f15a8860fde474bd4d2208eab11c4ea4a6058d340c1e184f87f482174f5
- id: 3.1.3
  title_es: Política de gestión de incidentes · punto 3.1.3
  title_en: Incident handling policy · point 3.1.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Los roles, responsabilidades y procedimientos establecidos en la política se probarán,
      revisarán y, cuando proceda, se actualizarán a intervalos planificados, así como cuando se produzcan
      incidentes significativos o cambios significativos en las operaciones o los riesgos.
    official_text_en: The roles, responsibilities and procedures laid down in the policy shall be tested
      and reviewed and, where appropriate, updated at planned intervals and after significant incidents
      or significant changes to operations or risks.
    section: Anexo, punto 3.1.3
    source_sha256: 2855706d128f01acf29d7bfff166cd46a71ff61456dfc750fe762e53b0c0ecec
- id: 3.2.1
  title_es: Supervisión y registro · punto 3.2.1
  title_en: Monitoring and logging · point 3.2.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes establecerán procedimientos y utilizarán herramientas
      para supervisar y registrar las actividades en sus sistemas de redes y de información a fin de detectar
      sucesos que puedan considerarse incidentes y dar una respuesta consecuente para mitigar su impacto.
    official_text_en: The relevant entities shall lay down procedures and use tools to monitor and log
      activities on their network and information systems to detect events that could be considered as
      incidents and respond accordingly to mitigate the impact.
    section: Anexo, punto 3.2.1
    source_sha256: 16634cf5bf1562cdad839a0127478483d84105675e45ac4abfcf89b931df1159
- id: 3.2.2
  title_es: Supervisión y registro · punto 3.2.2
  title_en: Monitoring and logging · point 3.2.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: En la medida de lo posible, la supervisión se automatizará y se llevará a cabo bien
      de forma continua bien a intervalos periódicos, en función de las capacidades operativas. Las entidades
      pertinentes pondrán en marcha sus actividades de seguimiento de manera que se minimicen los falsos
      positivos y falsos negativos.
    official_text_en: To the extent feasible, monitoring shall be automated and carried out either continuously
      or in periodic intervals, subject to business capabilities. The relevant entities shall implement
      their monitoring activities in a way which minimises false positives and false negatives.
    section: Anexo, punto 3.2.2
    source_sha256: cbcca88bfe42dfd1820c390864e9fb34fc862e10fe224950287fd08e08556176
- id: 3.2.3
  title_es: Supervisión y registro · punto 3.2.3
  title_en: Monitoring and logging · point 3.2.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A partir de los procedimientos contemplados en el punto 3.2.1, las entidades pertinentes
      mantendrán, completarán y revisarán sus registros. Las entidades pertinentes establecerán una lista
      de los activos que deban registrarse teniendo en cuenta los resultados de la evaluación de riesgos
      efectuada conforme al punto 2.1. Cuando proceda, los registros incluirán información sobre:


      a) el tráfico de entrada y salida de la red;


      b) la creación, modificación o supresión de usuarios de los sistemas de redes y de información de
      las entidades pertinentes y la ampliación de los permisos;


      c) el acceso a los sistemas y aplicaciones;


      d) los sucesos relacionados con la autenticación;


      e) todo acceso privilegiado a los sistemas y aplicaciones, así como las actividades realizadas por
      las cuentas de administración;


      f) el acceso a los archivos críticos de configuración y a las copias de seguridad y todo cambio
      en los mismos;


      g) los registros de sucesos y los registros de las herramientas de seguridad, como antivirus, sistemas
      de detección de intrusiones o cortafuegos;


      h) el uso de los recursos del sistema, así como su rendimiento;


      i) el acceso físico a las instalaciones;


      j) el acceso a los equipos y dispositivos de red y su utilización;


      k) la activación, detención e interrupción de los distintos registros;


      l) los sucesos medioambientales.'
    official_text_en: 'Based on the procedures referred to in point 3.2.1, the relevant entities shall
      maintain, document, and review logs. The relevant entities shall establish a list of assets to be
      subject to logging based on the results of the risk assessment carried out pursuant to point 2.1.
      Where appropriate, logs shall include:


      (a) relevant outbound and inbound network traffic;


      (b) creation, modification or deletion of users of the relevant entities’ network and information
      systems and extension of the permissions;


      (c) access to systems and applications;


      (d) authentication-related events;


      (e) all privileged access to systems and applications, and activities performed by administrative
      accounts;


      (f) access or changes to critical configuration and backup files;


      (g) event logs and logs from security tools, such as antivirus, intrusion detection systems or firewalls;


      (h) use of system resources, as well as their performance;


      (i) physical access to facilities;


      (j) access to and use of their network equipment and devices;


      (k) activation, stopping and pausing of the various logs;


      (l) environmental events.'
    section: Anexo, punto 3.2.3
    source_sha256: 0fa98518c03d2b4efcb9e5a69c6e9fa2e52455bc365753a9388203a44d4aad44
- id: 3.2.4
  title_es: Supervisión y registro · punto 3.2.4
  title_en: Monitoring and logging · point 3.2.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Se revisará periódicamente la existencia de tendencias inusuales o indeseadas en
      los registros. Cuando proceda, las entidades pertinentes establecerán valores adecuados para los
      umbrales de alerta. Cuando se superen los valores establecidos para los umbrales de alerta, saltará
      una alarma que será, en su caso, automática. Las entidades pertinentes se asegurarán de que, en
      las situaciones de alerta, se adopte a su debido tiempo una respuesta cualificada y adecuada.
    official_text_en: The logs shall be regularly reviewed for any unusual or unwanted trends. Where appropriate,
      the relevant entities shall lay down appropriate values for alarm thresholds. If the laid down values
      for alarm threshold are exceeded, an alarm shall be triggered, where appropriate, automatically.
      The relevant entities shall ensure that, in case of an alarm, a qualified and appropriate response
      is initiated in a timely manner.
    section: Anexo, punto 3.2.4
    source_sha256: 5357dd3d45ed000b782d4c95da8171724f9ddc26d2fd12b6aece9a5f3bdbab34
- id: 3.2.5
  title_es: Supervisión y registro · punto 3.2.5
  title_en: Monitoring and logging · point 3.2.5
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes mantendrán registros, de los que harán copias de seguridad,
      durante un período predefinido, y los protegerán contra el acceso o los cambios no autorizados.
    official_text_en: The relevant entities shall maintain and back up logs for a predefined period and
      shall protect them from unauthorised access or changes.
    section: Anexo, punto 3.2.5
    source_sha256: cce95ea19f7c4750203180cd9c6108cf76fc750ce4279b5c6edf5a2dae08ef1b
- id: 3.2.6
  title_es: Supervisión y registro · punto 3.2.6
  title_en: Monitoring and logging · point 3.2.6
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: En la medida de lo posible, las entidades pertinentes velarán por que todos los
      sistemas dispongan de fuentes de información temporal sincronizadas para permitir la vinculación
      de registros entre sistemas de cara a la evaluación de sucesos. Las entidades pertinentes establecerán
      y mantendrán una lista de todos los activos que se registren y velarán por que los sistemas de seguimiento
      y registro sean redundantes. La disponibilidad de los sistemas de supervisión y registro se controlará
      con independencia de los sistemas que estén supervisando.
    official_text_en: To the extent feasible, the relevant entities shall ensure that all systems have
      synchronised time sources to be able to correlate logs between systems for event assessment. The
      relevant entities shall establish and keep a list of all assets that are being logged and ensure
      that monitoring and logging systems are redundant. The availability of the monitoring and logging
      systems shall be monitored independent of the systems they are monitoring.
    section: Anexo, punto 3.2.6
    source_sha256: d0904894261c388ddecf2e44dea932e0e22e9a5fb82358b0572178529fd6dec4
- id: 3.2.7
  title_es: Supervisión y registro · punto 3.2.7
  title_en: Monitoring and logging · point 3.2.7
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Tanto los procedimientos como la lista de activos que se registren se revisarán
      y, cuando proceda, se actualizarán a intervalos regulares y después de incidentes significativos.
    official_text_en: The procedures as well as the list of assets that are being logged shall be reviewed
      and, where appropriate, updated at regular intervals and after significant incidents.
    section: Anexo, punto 3.2.7
    source_sha256: 00fd874016e6bed570f3b8d748888adf72a66250558203c427135f3d322a2571
- id: 3.3.1
  title_es: Notificación de sucesos · punto 3.3.1
  title_en: Event reporting · point 3.3.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes pondrán en marcha un mecanismo sencillo que permita a
      sus empleados, proveedores y clientes notificar los sucesos sospechosos.
    official_text_en: The relevant entities shall put in place a simple mechanism allowing their employees,
      suppliers, and customers to report suspicious events.
    section: Anexo, punto 3.3.1
    source_sha256: 9446050c73c147f8a20e1a4ad13ca5b65d6486baadf646032f0ae65efb37cb6b
- id: 3.3.2
  title_es: Notificación de sucesos · punto 3.3.2
  title_en: Event reporting · point 3.3.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes informarán, cuando proceda, del mecanismo de notificación
      de sucesos a sus proveedores y clientes, y formarán periódicamente a sus empleados en el uso del
      mismo.
    official_text_en: The relevant entities shall, where appropriate, communicate the event reporting
      mechanism to their suppliers and customers, and shall regularly train their employees how to use
      the mechanism.
    section: Anexo, punto 3.3.2
    source_sha256: 98e0ced339b820631bc966f80123169366643e422993174a3f9921abcdff9c77
- id: 3.4.1
  title_es: Evaluación y clasificación de sucesos · punto 3.4.1
  title_en: Event assessment and classification · point 3.4.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes evaluarán los sucesos sospechosos para determinar si constituyen
      incidentes y, en su caso, esclarecer su naturaleza y gravedad.
    official_text_en: The relevant entities shall assess suspicious events to determine whether they constitute
      incidents and, if so, determine their nature and severity.
    section: Anexo, punto 3.4.1
    source_sha256: 77ba92f72d28605af706b4bcf41480dc256aa001da02ca4f25548f049e630453
- id: 3.4.2
  title_es: Evaluación y clasificación de sucesos · punto 3.4.2
  title_en: Event assessment and classification · point 3.4.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A los efectos del punto 3.4.1, las entidades pertinentes realizarán las acciones
      siguientes:


      a) una evaluación basada en criterios predefinidos fijados de antemano y en una clasificación que
      establezca las prioridades de contención y erradicación de incidentes;


      b) la evaluación trimestral de la existencia de incidentes recurrentes tal como contempla el artículo
      4 del presente Reglamento;


      c) la revisión de los registros adecuados a efectos de la evaluación y clasificación de los sucesos;


      d) la puesta en marcha de un procedimiento para vincular los registros y el análisis;


      e) y la reevaluación y reclasificación de los sucesos cuando se disponga de nueva información o
      tras analizar la información disponible previamente.'
    official_text_en: 'For the purpose of point 3.4.1, the relevant entities shall act in the following
      manner:


      (a) carry out the assessment based on predefined criteria laid down in advance, and on a triage
      to determine prioritisation of incident containment and eradication;


      (b) assess the existence of recurring incidents as referred to in Article 4 of this Regulation on
      a quarterly basis;


      (c) review the appropriate logs for the purposes of event assessment and classification;


      (d) put in place a process for log correlation and analysis, and


      (e) reassess and reclassify events in case of new information becoming available or after analysis
      of previously available information.'
    section: Anexo, punto 3.4.2
    source_sha256: 53f54c8dd3f4bc524b302662c6202d7151aa25c08c2dc5161800dce1b97cb9a5
- id: 3.5.1
  title_es: Respuesta ante incidentes · punto 3.5.1
  title_en: Incident response · point 3.5.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes responderán a los incidentes a su debido tiempo y de conformidad
      con procedimientos documentados.
    official_text_en: The relevant entities shall respond to incidents in accordance with documented procedures
      and in a timely manner.
    section: Anexo, punto 3.5.1
    source_sha256: 3865b2a2f41c9a918efab22affe11da66fc40b10aea2c86dc2f3dd41d061c454
- id: 3.5.2
  title_es: Respuesta ante incidentes · punto 3.5.2
  title_en: Incident response · point 3.5.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'Los procedimientos de respuesta ante los incidentes incluirán las siguientes fases:


      a) contención del incidente, para evitar las consecuencias de que se propague;


      b) erradicación, para evitar que el incidente continúe o reaparezca;


      c) recuperación tras el incidente, cuando se requiera.'
    official_text_en: 'The incident response procedures shall include the following stages:


      (a) incident containment, to prevent the consequences of the incident from spreading;


      (b) eradication, to prevent the incident from continuing or reappearing,


      (c) recovery from the incident, where necessary.'
    section: Anexo, punto 3.5.2
    source_sha256: 4e2780c36a23742e6368c33662825c33fafcf6ce12b8fb7fd6581a60c36bfcf7
- id: 3.5.3
  title_es: Respuesta ante incidentes · punto 3.5.3
  title_en: Incident response · point 3.5.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'Las entidades pertinentes establecerán procedimientos y planes de comunicación:


      a) con los equipos de respuesta ante incidentes de seguridad informática (CSIRT) o, cuando proceda,
      las autoridades competentes, en materia de notificación de incidentes;


      b) para la comunicación entre los miembros del personal de la entidad pertinente, y para la comunicación
      con las partes interesadas ajenas a la entidad.'
    official_text_en: 'The relevant entities shall establish communication plans and procedures:


      (a) with the Computer Security Incident Response Teams (CSIRTs) or, where applicable, the competent
      authorities, related to incident notification;


      (b) for communication among staff members of the relevant entity, and for communication with relevant
      stakeholders external to the relevant entity.'
    section: Anexo, punto 3.5.3
    source_sha256: 3d69730aba16c5748da6334a4986fa4f2cf8a98c49f958c737ab815da20446ce
- id: 3.5.4
  title_es: Respuesta ante incidentes · punto 3.5.4
  title_en: Incident response · point 3.5.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes registrarán tanto las actividades de respuesta ante incidentes
      de conformidad con los procedimientos contemplados en el punto 3.2.1 como las pruebas correspondientes.
    official_text_en: The relevant entities shall log incident response activities in accordance with
      the procedures referred to in point 3.2.1, and record evidence.
    section: Anexo, punto 3.5.4
    source_sha256: 54d944899bf88809c4d3fed26796cb7af456581af7be4fc69d5d5c82da5104ee
- id: 3.5.5
  title_es: Respuesta ante incidentes · punto 3.5.5
  title_en: Incident response · point 3.5.5
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes probarán a intervalos planificados sus procedimientos
      de respuesta ante los incidentes.
    official_text_en: The relevant entities shall test at planned intervals their incident response procedures.
    section: Anexo, punto 3.5.5
    source_sha256: 7af83fd62b657dc0b0f2bcae6c2788f9abfa738368e6402a3ee57f8ba076087c
- id: 3.6.1
  title_es: Revisiones posteriores al incidente · punto 3.6.1
  title_en: Post-incident reviews · point 3.6.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Cuando proceda, y una vez se hayan recuperado del incidente, las entidades pertinentes
      llevarán a cabo revisiones posteriores al mismo. Las revisiones posteriores al incidente identificarán,
      cuando se pueda, la causa subyacente y se traducirán en conclusiones documentadas para reducir la
      ocurrencia y las consecuencias de futuros incidentes.
    official_text_en: Where appropriate, the relevant entities shall carry out post-incident reviews after
      recovery from incidents. The post-incident reviews shall identify, where possible, the root cause
      of the incident and result in documented lessons learned to reduce the occurrence and consequences
      of future incidents.
    section: Anexo, punto 3.6.1
    source_sha256: 589af631fa724263f6c55130ef47e0fcfb615141273ae01e17f5db78341de9c7
- id: 3.6.2
  title_es: Revisiones posteriores al incidente · punto 3.6.2
  title_en: Post-incident reviews · point 3.6.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes velarán por que las revisiones posteriores a los incidentes
      contribuyan a mejorar su enfoque en materia de seguridad de las redes y de la información, de medidas
      de tratamiento de riesgos y de procedimientos de gestión, detección y respuesta ante incidentes.
    official_text_en: The relevant entities shall ensure that post-incident reviews contribute to improving
      their approach to network and information security, to risk treatment measures, and to incident
      handling, detection and response procedures.
    section: Anexo, punto 3.6.2
    source_sha256: e9e29fae2a72b9ff57fa3f4aad1cddbf6299ad34ea03ba233ab6a269c59514ea
- id: 3.6.3
  title_es: Revisiones posteriores al incidente · punto 3.6.3
  title_en: Post-incident reviews · point 3.6.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes comprobarán a intervalos planificados si los incidentes
      condujeron a revisiones posteriores al incidente.
    official_text_en: The relevant entities shall review at planned intervals if incidents led to post-incident
      reviews.
    section: Anexo, punto 3.6.3
    source_sha256: 79e9bd41e7eeaf73bba646991975c28027360a4e076613d6f51581d67eadb97e
- id: 4.1.1
  title_es: Plan de continuidad de las actividades y de recuperación en caso de catástrofe · punto 4.1.1
  title_en: Business continuity and disaster recovery plan · point 4.1.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A efectos del artículo 21, apartado 2, letra c), de la Directiva (UE) 2022/2555,
      las entidades pertinentes establecerán y mantendrán un plan de continuidad de las actividades y
      de recuperación en caso de catástrofe que pondrán en marcha si se producen incidentes.
    official_text_en: For the purpose of Article 21(2), point (c) of Directive (EU) 2022/2555, the relevant
      entities shall lay down and maintain a business continuity and disaster recovery plan to apply in
      the case of incidents.
    section: Anexo, punto 4.1.1
    source_sha256: 50c8ac8776b89009f12dad73824ac7d5e83b5b5971ab2a7c6561ba692ec81309
- id: 4.1.2
  title_es: Plan de continuidad de las actividades y de recuperación en caso de catástrofe · punto 4.1.2
  title_en: Business continuity and disaster recovery plan · point 4.1.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'Las operaciones de las entidades pertinentes se restablecerán de acuerdo con el
      plan de continuidad de las actividades y de recuperación en caso de catástrofe. El plan se basará
      en los resultados de la evaluación de riesgos realizada con arreglo al punto 2.1 e incluirá, según
      proceda, lo siguiente:


      a) objetivos, ámbito de aplicación y público destinatario;


      b) roles y responsabilidades;


      c) contactos clave y canales de comunicación (internos y externos);


      d) condiciones de activación y desactivación del plan;


      e) orden de recuperación de las operaciones;


      f) planes de recuperación de operaciones específicas, incluidos los objetivos de recuperación;


      g) recursos necesarios, incluidas las copias de seguridad y las redundancias;


      h) restablecimiento y reanudación de las actividades a partir de medidas temporales.'
    official_text_en: 'The relevant entities’ operations shall be restored according to the business continuity
      and disaster recovery plan. The plan shall be based on the results of the risk assessment carried
      out pursuant to point 2.1 and shall include, where appropriate, the following:


      (a) purpose, scope and audience;


      (b) roles and responsibilities;


      (c) key contacts and (internal and external) communication channels;


      (d) conditions for plan activation and deactivation;


      (e) order of recovery for operations;


      (f) recovery plans for specific operations, including recovery objectives;


      (g) required resources, including backups and redundancies;


      (h) restoring and resuming activities from temporary measures.'
    section: Anexo, punto 4.1.2
    source_sha256: a4e4ce7c554587e693f17e5042d007313073f882261962bc09195d06376b7d59
- id: 4.1.3
  title_es: Plan de continuidad de las actividades y de recuperación en caso de catástrofe · punto 4.1.3
  title_en: Business continuity and disaster recovery plan · point 4.1.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes realizarán un análisis de impacto operativo para evaluar
      el posible impacto de las perturbaciones graves en sus operaciones y establecerán, a partir de los
      resultados de dicho análisis, requisitos de continuidad para los sistemas de redes y de información.
    official_text_en: The relevant entities shall carry out a business impact analysis to assess the potential
      impact of severe disruptions to their business operations and shall, based on the results of the
      business impact analysis, establish continuity requirements for the network and information systems.
    section: Anexo, punto 4.1.3
    source_sha256: 53c8f2bc7d5d0075b9a113a1957f2f7da3520de9965438c60ca96df9230ad7f3
- id: 4.1.4
  title_es: Plan de continuidad de las actividades y de recuperación en caso de catástrofe · punto 4.1.4
  title_en: Business continuity and disaster recovery plan · point 4.1.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: El plan de continuidad de las actividades y el plan de recuperación en caso de catástrofe
      se probarán, revisarán y, cuando proceda, se actualizarán a intervalos planificados o tras incidentes
      significativos o cambios significativos en las operaciones o los riesgos. Las entidades pertinentes
      velarán por que dichos planes engloben las conclusiones extraídas en las pruebas.
    official_text_en: The business continuity plan and disaster recovery plan shall be tested, reviewed
      and, where appropriate, updated at planned intervals and following significant incidents or significant
      changes to operations or risks. The relevant entities shall ensure that the plans incorporate lessons
      learnt from such tests.
    section: Anexo, punto 4.1.4
    source_sha256: cc379abfeaaa45124ede669ca86fea1ea17b4e5d90923b9ef51531f9857cef71
- id: 4.2.1
  title_es: Gestión de las copias de seguridad y las redundancias · punto 4.2.1
  title_en: Backup and redundancy management · point 4.2.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes mantendrán copias de seguridad de los datos y pondrán
      a disposición recursos suficientes, como instalaciones, sistemas de redes y de información y personal,
      para velar por un nivel de redundancia adecuado.
    official_text_en: The relevant entities shall maintain backup copies of data and provide sufficient
      available resources, including facilities, network and information systems and staff, to ensure
      an appropriate level of redundancy.
    section: Anexo, punto 4.2.1
    source_sha256: e59e3af571ca841ad6606e412ee829fa79fa3c35b768f4dd9c5421895918b107
- id: 4.2.2
  title_es: Gestión de las copias de seguridad y las redundancias · punto 4.2.2
  title_en: Backup and redundancy management · point 4.2.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A partir de los resultados de la evaluación de riesgos realizada según el punto
      2.1 y el plan de continuidad de las actividades, las entidades pertinentes establecerán planes de
      copia de seguridad que incluirán lo siguiente:


      a) plazos de recuperación;


      b) garantías de que las copias de seguridad sean completas y precisas, especialmente los datos de
      configuración y la información almacenada en el entorno de proveedores de servicios de computación
      en nube;


      c) almacenamiento de copias de seguridad (en línea o fuera de línea) en uno o varios lugares seguros,
      que no estén en la misma red que el sistema y que estén a una distancia suficiente para escapar
      de cualquier daño provocado por una catástrofe en el emplazamiento principal;


      d) controles adecuados de acceso lógico y físico a las copias de seguridad, de conformidad con el
      nivel de clasificación de activos;


      e) recuperación de datos de las copias de seguridad;


      f) plazos de conservación sustentados en los requisitos operativos y reglamentarios.'
    official_text_en: 'Based on the results of the risk assessment carried out pursuant to point 2.1 and
      the business continuity plan, the relevant entities shall lay down backup plans which include the
      following:


      (a) recovery times;


      (b) assurance that backup copies are complete and accurate, including configuration data and data
      stored in cloud computing service environment;


      (c) storing backup copies (online or offline) in a safe location or locations, which are not in
      the same network as the system, and are at sufficient distance to escape any damage from a disaster
      at the main site;


      (d) appropriate physical and logical access controls to backup copies, in accordance with the asset
      classification level;


      (e) restoring data from backup copies;


      (f) retention periods based on business and regulatory requirements.'
    section: Anexo, punto 4.2.2
    source_sha256: 4b1ad7d334c404f6ca96950e71b7ca09c6c275886e33603fb8f87945a2619ac1
- id: 4.2.3
  title_es: Gestión de las copias de seguridad y las redundancias · punto 4.2.3
  title_en: Backup and redundancy management · point 4.2.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes verificarán regularmente la integridad de las copias de
      seguridad.
    official_text_en: The relevant entities shall perform regular integrity checks on the backup copies.
    section: Anexo, punto 4.2.3
    source_sha256: 6b9e01efdeb019f1040ee0956ca7a269b97b9a3f205863d700134f1bb9351f64
- id: 4.2.4
  title_es: Gestión de las copias de seguridad y las redundancias · punto 4.2.4
  title_en: Backup and redundancy management · point 4.2.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A partir de los resultados de la evaluación de riesgos realizada con arreglo al
      punto 2.1 y el plan de continuidad de las actividades, las entidades pertinentes garantizarán una
      disponibilidad suficiente de los recursos mediante, como mínimo, la redundancia parcial de lo siguiente:


      a) los sistemas de redes y de información;


      b) los activos, incluidos las instalaciones, los equipos y los suministros;


      c) el personal con la responsabilidad, la autoridad y las competencias necesarias;


      d) los canales de comunicación adecuados.'
    official_text_en: 'Based on the results of the risk assessment carried out pursuant to point 2.1 and
      the business continuity plan, the relevant entities shall ensure sufficient availability of resources
      by at least partial redundancy of the following:


      (a) network and information systems;


      (b) assets, including facilities, equipment and supplies;


      (c) personnel with the necessary responsibility, authority and competence;


      (d) appropriate communication channels.'
    section: Anexo, punto 4.2.4
    source_sha256: 4221d9dfe0534339b97bd66d76f20cd2df68b89eae227bc9c26bfa14d30a543d
- id: 4.2.5
  title_es: Gestión de las copias de seguridad y las redundancias · punto 4.2.5
  title_en: Backup and redundancy management · point 4.2.5
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Cuando proceda, las entidades pertinentes velarán por que la supervisión y el ajuste
      de los recursos, incluidas las instalaciones, los sistemas y el personal, estén debidamente fundados
      en los requisitos de copias de seguridad y redundancia.
    official_text_en: Where appropriate, the relevant entities shall ensure that monitoring and adjustment
      of resources, including facilities, systems and personnel, is duly informed by backup and redundancy
      requirements.
    section: Anexo, punto 4.2.5
    source_sha256: 664d0fc0837ba69e16ef89b0eaca20280e8515b170cc9ff4aa649819eb673610
- id: 4.2.6
  title_es: Gestión de las copias de seguridad y las redundancias · punto 4.2.6
  title_en: Backup and redundancy management · point 4.2.6
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes llevarán a cabo pruebas periódicas de la recuperación
      de copias de seguridad y las redundancias para asegurarse de que, en condiciones de recuperación,
      es posible depender de ellas y que engloban las copias, los procesos y los conocimientos necesarios
      para llevar a cabo una recuperación eficaz. Las entidades pertinentes documentarán los resultados
      de las pruebas y, cuando sea necesario, adoptarán medidas correctoras.
    official_text_en: The relevant entities shall carry out regular testing of the recovery of backup
      copies and redundancies to ensure that, in recovery conditions, they can be relied upon and cover
      the copies, processes and knowledge to perform an effective recovery. The relevant entities shall
      document the results of the tests and, where needed, take corrective action.
    section: Anexo, punto 4.2.6
    source_sha256: 3305c5734397c35ab1455f3e6dc6f44a38d68e78b00997773307c208276c7bc3
- id: 4.3.1
  title_es: Gestión de crisis · punto 4.3.1
  title_en: Crisis management · point 4.3.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes pondrán en marcha procesos de gestión de crisis.
    official_text_en: The relevant entities shall put in place a process for crisis management.
    section: Anexo, punto 4.3.1
    source_sha256: 313d4d64e59ca04d6c1be335a402ceb62cff6ba1a74d224e9123c6e0081254e1
- id: 4.3.2
  title_es: Gestión de crisis · punto 4.3.2
  title_en: Crisis management · point 4.3.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'Las entidades pertinentes velarán por que los procesos de gestión de crisis aborden
      al menos los siguientes elementos:


      a) los roles y responsabilidades del personal y, cuando proceda, los proveedores y los prestadores
      de servicios, especificando la asignación de roles en situaciones de crisis y los pasos específicos
      que deben seguirse;


      b) los medios de comunicación adecuados entre las entidades pertinentes y las autoridades competentes;


      c) la aplicación de medidas adecuadas para garantizar el mantenimiento de la seguridad de los sistemas
      de redes y de información en situaciones de crisis.


      A efectos de la letra b), el flujo de información entre las entidades pertinentes y las autoridades
      competentes incluirá comunicaciones obligatorias, como informes de incidentes y los plazos correspondientes,
      así como comunicaciones facultativas.'
    official_text_en: 'The relevant entities shall ensure that the crisis management process addresses
      at least the following elements:


      (a) roles and responsibilities for personnel and, where appropriate, suppliers and service providers,
      specifying the allocation of roles in crisis situations, including specific steps to follow;


      (b) appropriate communication means between the relevant entities and relevant competent authorities;


      (c) application of appropriate measures to ensure the maintenance of network and information system
      security in crisis situations.


      For the purpose of point (b), the flow of information between the relevant entities and relevant
      competent authorities shall include both obligatory communications, such as incident reports and
      related timelines, and non-obligatory communications.'
    section: Anexo, punto 4.3.2
    source_sha256: 72e950570adf9c0c492849abf0374d0c9686afb9b47e918eaa8b05b6bf6ca248
- id: 4.3.3
  title_es: Gestión de crisis · punto 4.3.3
  title_en: Crisis management · point 4.3.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes pondrán en marcha procesos para gestionar y usar la información
      recibida de los CSIRT o, cuando proceda, las autoridades competentes, en relación con incidentes,
      vulnerabilidades, amenazas o posibles medidas de mitigación.
    official_text_en: The relevant entities shall implement a process for managing and making use of information
      received from the CSIRTs or, where applicable, the competent authorities, concerning incidents,
      vulnerabilities, threats or possible mitigation measures.
    section: Anexo, punto 4.3.3
    source_sha256: 1ff780c5de79345cb99c80fe18048161cb71690cb11823fc41ebe35d06ef0787
- id: 4.3.4
  title_es: Gestión de crisis · punto 4.3.4
  title_en: Crisis management · point 4.3.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes comprobarán, revisarán y, cuando proceda, actualizarán
      los planes de gestión de la crisis de forma periódica o después de incidentes significativos o cambios
      significativos en las operaciones o los riesgos.
    official_text_en: The relevant entities shall test, review and, where appropriate, update the crisis
      management plan on a regular basis or following significant incidents or significant changes to
      operations or risks.
    section: Anexo, punto 4.3.4
    source_sha256: 0ab40fe3c282e9a11c3e697650e29b0ff749c9b89591bd09b0971d3ca449ca5c
- id: 5.1.1
  title_es: Política de seguridad de las cadenas de suministros · punto 5.1.1
  title_en: Supply chain security policy · point 5.1.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A efectos del artículo 21, apartado 2, letra d), de la Directiva (UE) 2022/2555,
      las entidades pertinentes establecerán, pondrán en marcha y aplicarán una política de seguridad
      de las cadenas de suministros que rija las relaciones con sus proveedores y prestadores de servicios
      directos con el fin de mitigar los riesgos detectados para la seguridad de los sistemas de redes
      y de información. En la política de seguridad de las cadenas de suministros, las entidades pertinentes
      determinarán su papel en la cadena de suministro y se lo comunicarán a sus proveedores y prestadores
      de servicios directos.
    official_text_en: For the purpose of Article 21(2), point (d) of Directive (EU) 2022/2555, the relevant
      entities shall establish, implement and apply a supply chain security policy which governs the relations
      with their direct suppliers and service providers in order to mitigate the identified risks to the
      security of network and information systems. In the supply chain security policy, the relevant entities
      shall identify their role in the supply chain and communicate it to their direct suppliers and service
      providers.
    section: Anexo, punto 5.1.1
    source_sha256: 560efbeba7162bfee513ed9dae2c56519794a972cde7f150544c1f3918c716b8
- id: 5.1.2
  title_es: Política de seguridad de las cadenas de suministros · punto 5.1.2
  title_en: Supply chain security policy · point 5.1.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'Como parte de la política de la cadena de suministro contemplada en el punto 5.1.1,
      las entidades pertinentes establecerán criterios para seleccionar y contratar a los proveedores
      y prestadores de servicios. Dichos criterios incluirán lo siguiente:


      a) las prácticas de ciberseguridad de sus proveedores y prestadores de servicios, incluidos sus
      procedimientos de desarrollo seguro;


      b) la capacidad de los proveedores y prestadores de servicios para cumplir las especificaciones
      de ciberseguridad establecidas por las entidades pertinentes;


      c) la calidad general y la resiliencia de los productos y servicios TIC y las medidas para la gestión
      de riesgos de ciberseguridad integradas en ellos, incluidos los riesgos y el nivel de clasificación
      de los productos y servicios TIC;


      d) la capacidad de las entidades pertinentes de diversificar las fuentes de suministro y limitar
      la dependencia de un proveedor, cuando proceda.'
    official_text_en: 'As part of the supply chain security policy referred to in point 5.1.1, the relevant
      entities shall lay down criteria to select and contract suppliers and service providers. Those criteria
      shall include the following:


      (a) the cybersecurity practices of the suppliers and service providers, including their secure development
      procedures;


      (b) the ability of the suppliers and service providers to meet cybersecurity specifications set
      by the relevant entities;


      (c) the overall quality and resilience of ICT products and ICT services and the cybersecurity risk-management
      measures embedded in them, including the risks and classification level of the ICT products and
      ICT services;


      (d) the ability of the relevant entities to diversify sources of supply and limit vendor lock-in,
      where applicable.'
    section: Anexo, punto 5.1.2
    source_sha256: c4dcdae393680e17a1eb7081adc248177f2a033d931dfcdc0b2759026221008e
- id: 5.1.3
  title_es: Política de seguridad de las cadenas de suministros · punto 5.1.3
  title_en: Supply chain security policy · point 5.1.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Cuando establezcan su política de seguridad de la cadena de suministro, las entidades
      pertinentes tendrán en cuenta los resultados de las evaluaciones coordinadas de riesgos para la
      seguridad de las cadenas de suministro críticas realizadas de conformidad con el artículo 22, apartado
      1, de la Directiva (UE) 2022/2555, según proceda.
    official_text_en: When establishing their supply chain security policy, relevant entities shall take
      into account the results of the coordinated security risk assessments of critical supply chains
      carried out in accordance with Article 22(1) of Directive (EU) 2022/2555, where applicable.
    section: Anexo, punto 5.1.3
    source_sha256: 82a5b69bbc69b59c6b69940ac66674055e348143f93469545436ff55e36148b9
- id: 5.1.4
  title_es: Política de seguridad de las cadenas de suministros · punto 5.1.4
  title_en: Supply chain security policy · point 5.1.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A partir de la política de seguridad de las cadenas de suministro y teniendo en
      cuenta los resultados de la evaluación de riesgos realizada de conformidad con el punto 2.1 del
      presente anexo, las entidades pertinentes se asegurarán de que sus contratos con los proveedores
      y prestadores de servicios especifiquen, cuando proceda mediante acuerdos de nivel de servicio,
      los siguientes elementos, según se requiera:


      a) los requisitos de ciberseguridad correspondientes a los proveedores y prestadores de servicios,
      incluidos los requisitos relativos a la seguridad en la adquisición de productos y servicios TIC
      establecidos en el punto 6.1;


      b) los requisitos relativos a la sensibilización, las capacidades y la formación y, cuando proceda,
      los certificados requeridos de los empleados de los proveedores o prestadores de servicios;


      c) los requisitos relativos a los controles de los antecedentes personales de los empleados de los
      proveedores y prestadores de servicios;


      d) la obligación de los proveedores y prestadores de servicios de informar, sin demora indebida,
      a las entidades pertinentes de aquellos incidentes que presenten un riesgo para la seguridad de
      los sistemas de redes y de información de dichas entidades;


      e) el derecho de auditoría o el derecho a recibir informes de auditoría;


      f) la obligación de los proveedores y prestadores de servicios de hacerse cargo de las vulnerabilidades
      que presenten un riesgo para la seguridad de los sistemas de redes y de información de las entidades
      pertinentes;


      g) los requisitos relativos a la subcontratación y, cuando las entidades pertinentes permitan esta
      última, los requisitos de ciberseguridad de los subcontratistas de conformidad con los requisitos
      de seguridad contemplados en la letra a);


      h) las obligaciones de los proveedores y prestadores de servicios al finalizar el contrato, tales
      como la recuperación y eliminación de información que hayan obtenido en el ejercicio de sus funciones.'
    official_text_en: 'Based on the supply chain security policy and taking into account the results of
      the risk assessment carried out in accordance with point 2.1 of this Annex, the relevant entities
      shall ensure that their contracts with the suppliers and service providers specify, where appropriate
      through service level agreements, the following, where appropriate:


      (a) cybersecurity requirements for the suppliers or service providers, including requirements as
      regards the security in acquisition of ICT services or ICT products set out in point 6.1;


      (b) requirements regarding awareness, skills and training, and where appropriate certifications,
      required from the suppliers’ or service providers’ employees;


      (c) requirements regarding the verification of the background of the suppliers’ and service providers’
      employees;


      (d) an obligation on suppliers and service providers to notify, without undue delay, the relevant
      entities of incidents that present a risk to the security of the network and information systems
      of those entities;


      (e) the right to audit or right to receive audit reports;


      (f) an obligation on suppliers and service providers to handle vulnerabilities that present a risk
      to the security of the network and information systems of the relevant entities;


      (g) requirements regarding subcontracting and, where the relevant entities allow subcontracting,
      cybersecurity requirements for subcontractors in accordance with the cybersecurity requirements
      referred to in point (a);


      (h) obligations on the suppliers and service providers at the termination of the contract, such
      as retrieval and disposal of the information obtained by the suppliers and service providers in
      the exercise of their tasks.'
    section: Anexo, punto 5.1.4
    source_sha256: 588377014b2c9f2878ccfcc6a2a5d3e557fbd60266a4b5593d796961566e81e8
- id: 5.1.5
  title_es: Política de seguridad de las cadenas de suministros · punto 5.1.5
  title_en: Supply chain security policy · point 5.1.5
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes tendrán en cuenta los elementos a que se refieren los
      puntos 5.1.2 y 5.1.3 como parte del proceso de selección de nuevos proveedores o prestadores de
      servicios, y como parte del proceso de contratación a que se refiere el punto 6.1.
    official_text_en: The relevant entities shall take into account the elements referred to in point
      5.1.2 and 5.1.3 as part of the selection process of new suppliers and service providers, as well
      as part of the procurement process referred to in point 6.1.
    section: Anexo, punto 5.1.5
    source_sha256: eb3a6a8536996e5c982593a44d3288ee8782184b84372d06ee54ab47d49eebc7
- id: 5.1.6
  title_es: Política de seguridad de las cadenas de suministros · punto 5.1.6
  title_en: Supply chain security policy · point 5.1.6
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán la política de seguridad de la cadena de suministro
      y supervisarán, evaluarán y, cuando proceda, tomarán medidas acordes con los cambios en las prácticas
      de ciberseguridad de los proveedores y prestadores de servicios, a intervalos planificados o cuando
      se produzcan cambios significativos en las operaciones o en los riesgos, o acontezcan incidentes
      significativos relativos a la prestación de servicios TIC o que tengan repercusiones en la seguridad
      del producto TIC de los proveedores y prestadores de servicios.
    official_text_en: The relevant entities shall review the supply chain security policy, and monitor,
      evaluate and, where necessary, act upon changes in the cybersecurity practices of suppliers and
      service providers, at planned intervals and when significant changes to operations or risks or significant
      incidents related to the provision of ICT services or having impact on the security of the ICT products
      from suppliers and service providers occur.
    section: Anexo, punto 5.1.6
    source_sha256: a34fd499b39ed0bd215b482f8169df5dc79ec5788479c71829c242f99726f3c9
- id: 5.1.7
  title_es: Política de seguridad de las cadenas de suministros · punto 5.1.7
  title_en: Supply chain security policy · point 5.1.7
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A los efectos del punto 5.1.6, las entidades pertinentes:


      a) supervisarán periódicamente los informes relativos a la aplicación de los acuerdos de nivel de
      servicio, cuando proceda;


      b) revisarán los incidentes relacionados con los productos y servicios TIC de los proveedores y
      prestadores de servicios;


      c) evaluarán la necesidad de revisiones no programadas y recopilarán las conclusiones de manera
      comprensible;


      d) analizarán los riesgos que planteen los cambios relativos a los productos y servicios TIC de
      los proveedores y prestadores de servicios y, cuando proceda, adoptarán medidas de mitigación a
      su debido tiempo.'
    official_text_en: 'For the purpose of point 5.1.6, the relevant entities shall:


      (a) regularly monitor reports on the implementation of the service level agreements, where applicable;


      (b) review incidents related to ICT products and ICT services from suppliers and service providers;


      (c) assess the need for unscheduled reviews and document the findings in a comprehensible manner;


      (d) analyse the risks presented by changes related to ICT products and ICT services from suppliers
      and service providers and, where appropriate, take mitigating measures in a timely manner.'
    section: Anexo, punto 5.1.7
    source_sha256: f9125e878c2ca5a6a059c15effee8df4acf1a1f1fc37602512c580a6d58364d2
- id: '5.2'
  title_es: Directorio de proveedores y prestadores de servicios · punto 5.2
  title_en: Directory of suppliers and service providers · point 5.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'Las entidades pertinentes mantendrán y actualizarán un registro de sus proveedores
      y prestadores de servicios directos, en el que incluirán:


      a) los puntos de contacto correspondientes a cada proveedor o prestador de servicios directo;


      b) una lista de productos TIC, servicios TIC y procesos TIC proporcionados por el proveedor o prestador
      de servicios directo a las entidades pertinentes.'
    official_text_en: 'The relevant entities shall maintain and keep up to date a registry of their direct
      suppliers and service providers, including:


      (a) contact points for each direct supplier and service provider;


      (b) a list of ICT products, ICT services, and ICT processes provided by the direct supplier or service
      provider to the relevant entities.'
    section: Anexo, punto 5.2
    source_sha256: 3e380dc5bead05486bc61aad3b8741c1b722e5150fdbe5783beb846e2379aa52
- id: 6.1.1
  title_es: Seguridad en la adquisición de servicios TIC o productos TIC · punto 6.1.1
  title_en: Security in acquisition of ICT services or ICT products · point 6.1.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A los efectos del artículo 21, apartado 2, letra e), de la Directiva (UE) 2022/2555,
      las entidades pertinentes establecerán y pondrán en marcha procedimientos para gestionar los riesgos
      derivados de la adquisición de servicios o productos TIC para componentes que sean críticos para
      la seguridad de los sistemas de redes y de información de las entidades pertinentes, de acuerdo
      con la evaluación de riesgos realizada con arreglo al punto 2.1, de los proveedores o prestadores
      de servicios a lo largo de su vida útil.
    official_text_en: For the purpose of Article 21(2), point (e) of Directive (EU) 2022/2555, the relevant
      entities shall set and implement processes to manage risks stemming from the acquisition of ICT
      services or ICT products for components that are critical for the relevant entities’ security of
      network and information systems, based on the risk assessment carried out pursuant to point 2.1,
      from suppliers or service providers throughout their life cycle.
    section: Anexo, punto 6.1.1
    source_sha256: 2da5f97bb094b6fa4b8a74d148d4f0cf24434f4a51e0b529d4541f2712c48b34
- id: 6.1.2
  title_es: Seguridad en la adquisición de servicios TIC o productos TIC · punto 6.1.2
  title_en: Security in acquisition of ICT services or ICT products · point 6.1.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A los efectos del punto 6.1.1, los procedimientos contemplados en el mismo incluirán:


      a) requisitos de seguridad aplicables a los servicios o productos TIC que vayan a adquirirse;


      b) requisitos relativos a las actualizaciones de seguridad a lo largo de toda la vida útil de los
      productos o servicios TIC o a su sustitución tras el final del período de soporte;


      c) información que describa los componentes de hardware y software utilizados en los servicios y
      productos TIC;


      d) información que describa las funciones de ciberseguridad de los servicios o productos TIC puestas
      en marcha o la configuración necesaria para su funcionamiento seguro;


      e) garantías de que los servicios o productos TIC cumplen los requisitos de seguridad con arreglo
      a la letra a);


      f) métodos para validar el cumplimiento de los requisitos de seguridad declarados por parte de los
      servicios o productos de TIC suministrados, y documentación de los resultados de la validación.'
    official_text_en: 'For the purpose of point 6.1.1, the processes referred to in point 6.1.1 shall
      include:


      (a) security requirements to apply to the ICT services or ICT products to be acquired;


      (b) requirements regarding security updates throughout the entire lifetime of the ICT services or
      ICT products, or replacement after the end of the support period;


      (c) information describing the hardware and software components used in the ICT services or ICT
      products;


      (d) information describing the implemented cybersecurity functions of the ICT services or ICT products
      and the configuration required for their secure operation;


      (e) assurance that the ICT services or ICT products comply with the security requirements according
      to point (a);


      (f) methods for validating that the delivered ICT services or ICT products are compliant to the
      stated security requirements, as well as documentation of the results of the validation.'
    section: Anexo, punto 6.1.2
    source_sha256: b5445be0e9e76c92ad170e781261a8496de1f05df225cd53c88eb27b03093840
- id: 6.1.3
  title_es: Seguridad en la adquisición de servicios TIC o productos TIC · punto 6.1.3
  title_en: Security in acquisition of ICT services or ICT products · point 6.1.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán los procedimientos
      a intervalos planificados, así como cuando se produzcan incidentes significativos.
    official_text_en: The relevant entities shall review and, where appropriate, update the processes
      at planned intervals and when significant incidents occur.
    section: Anexo, punto 6.1.3
    source_sha256: 5af72d67d8f895b5260bd9494df4a1dc16b93bfd312edb18bfd12ff55da1653b
- id: 6.2.1
  title_es: Ciclo de vida del desarrollo seguro · punto 6.2.1
  title_en: Secure development life cycle · point 6.2.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Antes de desarrollar un sistema de redes y de información, incluidos los programas
      informáticos, las entidades pertinentes establecerán normas para el desarrollo seguro del mismo,
      y las aplicarán al desarrollar estos sistemas de redes y de información internamente o cuando externalicen
      dicho desarrollo. Las normas englobarán todas las fases de desarrollo, como las especificaciones,
      el diseño, la creación, la implantación y las pruebas.
    official_text_en: Before developing a network and information system, including software, the relevant
      entities shall lay down rules for the secure development of network and information systems and
      apply them when developing network and information systems in-house, or when outsourcing the development
      of network and information systems. The rules shall cover all development phases, including specification,
      design, development, implementation and testing.
    section: Anexo, punto 6.2.1
    source_sha256: ed3cca1bc0ba75abcbfb3c32663b60bbbf00cbfc274dcf9b162787bd62113936
- id: 6.2.2
  title_es: Ciclo de vida del desarrollo seguro · punto 6.2.2
  title_en: Secure development life cycle · point 6.2.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A los efectos del punto 6.2.1, las entidades pertinentes:


      a) llevarán a cabo análisis de los requisitos de seguridad en las fases de especificación y diseño
      de cualquier proyecto de desarrollo o adquisición emprendido por ellas mismas o en su nombre;


      b) aplicarán los principios para diseñar sistemas seguros y principios de codificación seguros a
      toda actividad de desarrollo de sistemas de información, tales como la promoción de la ciberseguridad
      desde el diseño o las arquitecturas de confianza cero;


      c) establecerán requisitos de seguridad en relación con los entornos de desarrollo;


      d) establecerán y aplicarán procesos de pruebas de seguridad en el ciclo de vida del desarrollo;


      e) seleccionarán, protegerán y gestionarán adecuadamente los datos de las pruebas de seguridad;


      f) sanearán y anonimizarán los datos de las pruebas con arreglo a la evaluación de riesgos realizada
      de conformidad con el punto 2.1.'
    official_text_en: 'For the purpose of point 6.2.1, the relevant entities shall:


      (a) carry out an analysis of security requirements at the specification and design phases of any
      development or acquisition project undertaken by the relevant entities or on behalf of those entities;


      (b) apply principles for engineering secure systems and secure coding principles to any information
      system development activities such as promoting cybersecurity-by-design, zero-trust architectures;


      (c) lay down security requirements regarding development environments;


      (d) establish and implement security testing processes in the development life cycle;


      (e) appropriately select, protect and manage security test data;


      (f) sanitise and anonymise testing data according to the risk assessment carried out pursuant to
      point 2.1.'
    section: Anexo, punto 6.2.2
    source_sha256: ea532bd5d31dd9dc710d551bd0251b453d41a342aa662ec37725cf3213d29af8
- id: 6.2.3
  title_es: Ciclo de vida del desarrollo seguro · punto 6.2.3
  title_en: Secure development life cycle · point 6.2.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: En cuanto a la externalización del desarrollo de sistemas de redes y de información,
      las entidades pertinentes también aplicarán las políticas y procedimientos a que se refieren los
      puntos 5 y 6.1.
    official_text_en: For outsourced development of network and information systems, the relevant entities
      shall also apply the policies and procedures referred to in points 5 and 6.1.
    section: Anexo, punto 6.2.3
    source_sha256: 46b84e0d27dfacf2f596d8d887f92fb3161f46c9e5e2974b44801b26d1a9432c
- id: 6.2.4
  title_es: Ciclo de vida del desarrollo seguro · punto 6.2.4
  title_en: Secure development life cycle · point 6.2.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán las normas de
      desarrollo seguro a intervalos planificados.
    official_text_en: The relevant entities shall review and, where necessary, update their secure development
      rules at planned intervals.
    section: Anexo, punto 6.2.4
    source_sha256: 9a106bd4ea823c4087b21bd77642c9d9f1ebf92ce3fcd617f5b27e7b96567dc7
- id: 6.3.1
  title_es: Gestión de configuraciones · punto 6.3.1
  title_en: Configuration management · point 6.3.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes adoptarán las medidas adecuadas para establecer, documentar,
      poner en marcha y supervisar las configuraciones, incluidas las configuraciones de seguridad del
      hardware de los equipos y programas informáticos, los servicios y las redes.
    official_text_en: The relevant entities shall take the appropriate measures to establish, document,
      implement, and monitor configurations, including security configurations of hardware, software,
      services and networks.
    section: Anexo, punto 6.3.1
    source_sha256: c9f7e33b9cc38538d90425b1b02265e59a4a6a7af5f0ad5112571d93cdbe2158
- id: 6.3.2
  title_es: Gestión de configuraciones · punto 6.3.2
  title_en: Configuration management · point 6.3.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A los efectos del punto 6.3.1, las entidades pertinentes:


      a) crearán un entorno seguro en las configuraciones de sus equipos y programas informáticos, servicios
      y redes y lo mantendrán;


      b) establecerán y pondrán en marcha procesos y herramientas para dar cumplimiento a las configuraciones
      seguras establecidas para los equipos y programas informáticos, servicios y redes, para los sistemas
      de nueva instalación y los sistemas en funcionamiento a lo largo de todo su ciclo de vida.'
    official_text_en: 'For the purpose of point 6.3.1, the relevant entities shall:


      (a) lay down and ensure security in configurations for their hardware, software, services and networks;


      (b) lay down and implement processes and tools to enforce the laid down secure configurations for
      hardware, software, services and networks, for newly installed systems as well as for systems in
      operation over their lifetime.'
    section: Anexo, punto 6.3.2
    source_sha256: ac141c395b4eaf0717ad83f76fe40d58a460f286c5e45351e28c3df5eb54b18f
- id: 6.3.3
  title_es: Gestión de configuraciones · punto 6.3.3
  title_en: Configuration management · point 6.3.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán las configuraciones
      a intervalos planificados, así como cuando se produzcan incidentes significativos o cambios significativos
      en las operaciones o los riesgos.
    official_text_en: The relevant entities shall review and, where appropriate, update configurations
      at planned intervals or when significant incidents or significant changes to operations or risks
      occur.
    section: Anexo, punto 6.3.3
    source_sha256: 05c33dd2c101d330ccaa76ebb175e6d7d7dbef9c5b4e8d8ab9bfc27240358078
- id: 6.4.1
  title_es: Gestión de cambios, reparaciones y mantenimiento · punto 6.4.1
  title_en: Change management, repairs and maintenance · point 6.4.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes aplicarán procedimientos de gestión de cambios para controlar
      aquellos que se produzcan en los sistemas de redes y de información. Los procedimientos serán, según
      proceda, coherentes con las políticas generales de las entidades pertinentes relativas a la gestión
      de cambios.
    official_text_en: The relevant entities shall apply change management procedures to control changes
      of network and information systems. Where applicable, the procedures shall be consistent with the
      relevant entities’ general policies concerning change management.
    section: Anexo, punto 6.4.1
    source_sha256: 683b0d4276ec2aae977ec0756c42e2fa2c6099a0dc9323e8f7682c4203e93f98
- id: 6.4.2
  title_es: Gestión de cambios, reparaciones y mantenimiento · punto 6.4.2
  title_en: Change management, repairs and maintenance · point 6.4.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Los procedimientos contemplados en el punto 6.4.1 se aplicarán en el caso de lanzamientos,
      modificaciones y cambios de emergencia de cualquier equipo o programa informático en funcionamiento
      o de cambios en la configuración. Los procedimientos garantizarán que dichos cambios se documenten
      y, a partir de la evaluación de riesgos realizada de acuerdo con el punto 2.1, se prueben y evalúen
      teniendo en cuenta el impacto potencial antes de su aplicación.
    official_text_en: The procedures referred to in point 6.4.1 shall be applied for releases, modifications
      and emergency changes of any software and hardware in operation and changes to the configuration.
      The procedures shall ensure that those changes are documented and, based on the risk assessment
      carried out pursuant to point 2.1, tested and assessed in view of the potential impact before being
      implemented.
    section: Anexo, punto 6.4.2
    source_sha256: 1b2f32574d104ea6cef7ccfa3252105dbbd66769035cb713824518eba23f1373
- id: 6.4.3
  title_es: Gestión de cambios, reparaciones y mantenimiento · punto 6.4.3
  title_en: Change management, repairs and maintenance · point 6.4.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: En caso de que los procedimientos habituales de gestión de cambios no puedan seguirse
      debido a una emergencia, las entidades pertinentes documentarán el resultado del cambio y explicarán
      por qué no pudieron seguirse dichos procedimientos.
    official_text_en: In the event that the regular change management procedures could not be followed
      due to an emergency, the relevant entities shall document the result of the change, and the explanation
      for why the procedures could not be followed.
    section: Anexo, punto 6.4.3
    source_sha256: 172514a7251ced018896608504f4f7fe245fc592738a4772af2b68d7d6645955
- id: 6.4.4
  title_es: Gestión de cambios, reparaciones y mantenimiento · punto 6.4.4
  title_en: Change management, repairs and maintenance · point 6.4.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán los procedimientos
      a intervalos planificados, así como cuando se produzcan incidentes significativos o cambios significativos
      en las operaciones o los riesgos.
    official_text_en: The relevant entities shall review and, where appropriate, update the procedures
      at planned intervals and when significant incidents or significant changes to operations or risks.
    section: Anexo, punto 6.4.4
    source_sha256: 72020d8c0e4682713c3667f0d2be53ed6abd3176542d89a2cf056eeaeff5e428
- id: 6.5.1
  title_es: Pruebas de seguridad · punto 6.5.1
  title_en: Security testing · point 6.5.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes establecerán, pondrán en marcha y aplicarán orientaciones
      y procedimientos para las pruebas de seguridad.
    official_text_en: The relevant entities shall establish, implement and apply a policy and procedures
      for security testing.
    section: Anexo, punto 6.5.1
    source_sha256: cd70635a0ea136683dd147cbce589ffb4e7ac0b340702b1fdd0a5fe0537fad0e
- id: 6.5.2
  title_es: Pruebas de seguridad · punto 6.5.2
  title_en: Security testing · point 6.5.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'Las entidades pertinentes:


      a) establecerán, a partir de la evaluación de riesgos realizada de acuerdo con el punto 2.1, la
      necesidad, el alcance, la frecuencia y el tipo de pruebas de seguridad;


      b) realizarán pruebas de seguridad de acuerdo con una metodología de prueba documentada, que englobe
      los elementos señalados como relevantes para el funcionamiento seguro en un análisis de riesgos;


      c) documentarán el tipo, el alcance, la fecha y los resultados de las pruebas, incluidas la evaluación
      del carácter esencial y las medidas de mitigación correspondientes a cada hallazgo;


      d) aplicarán medidas de mitigación en caso de que se produzcan hallazgos críticos.'
    official_text_en: 'The relevant entities shall:


      (a) establish, based on the risk assessment carried out pursuant to point 2.1, the need, scope,
      frequency and type of security tests;


      (b) carry out security tests according to a documented test methodology, covering the components
      identified as relevant for secure operation in a risk analysis;


      (c) document the type, scope, time and results of the tests, including assessment of criticality
      and mitigating actions for each finding;


      (d) apply mitigating actions in case of critical findings.'
    section: Anexo, punto 6.5.2
    source_sha256: 7954ab3301fce176f22a4aed4795ec72abb9b3660d7e8157bf246a908adcf2fb
- id: 6.5.3
  title_es: Pruebas de seguridad · punto 6.5.3
  title_en: Security testing · point 6.5.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán las políticas
      de pruebas de seguridad a intervalos planificados.
    official_text_en: The relevant entities shall review and, where appropriate, update their security
      testing policies at planned intervals.
    section: Anexo, punto 6.5.3
    source_sha256: 72f0e2e5291aff1c741d4da4db14f6ab0a95bb9b58f254d628217ece46da9f1b
- id: 6.6.1
  title_es: Gestión de parches de seguridad · punto 6.6.1
  title_en: Security patch management · point 6.6.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'Las entidades pertinentes detallarán y aplicarán procedimientos coherentes con
      los procedimientos de gestión de cambios a que se refiere el punto 6.4.1, de gestión de vulnerabilidades,
      de gestión del riesgo y otros procedimientos de gestión pertinentes para garantizar que:


      a) los parches de seguridad se apliquen en un plazo razonable desde el momento en que estén disponibles;


      b) los parches de seguridad se sometan a ensayo antes de ponerlos en marcha en los sistemas de producción;


      c) los parches de seguridad procedan de fuentes de confianza y se compruebe su integridad;


      d) se adopten medidas adicionales y se acepten los riesgos residuales en aquellos casos en que no
      haya un parche disponible o no pueda aplicarse conforme al punto 6.6.2.'
    official_text_en: 'The relevant entities shall specify and apply procedures, coherent with the change
      management procedures referred to in point 6.4.1 as well as with vulnerability management, risk
      management and other relevant management procedures, for ensuring that:


      (a) security patches are applied within a reasonable time after they become available;


      (b) security patches are tested before being applied in production systems;


      (c) security patches come from trusted sources and are checked for integrity;


      (d) additional measures are implemented and residual risks are accepted in cases where a patch is
      not available or not applied pursuant to point 6.6.2.'
    section: Anexo, punto 6.6.1
    source_sha256: 1c35a1c4e00ba2d3713377825bdf626b6b49acae2ed3e3eba72595e9a5899cde
- id: 6.6.2
  title_es: Gestión de parches de seguridad · punto 6.6.2
  title_en: Security patch management · point 6.6.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Como excepción al punto 6.6.1, letra a), las entidades pertinentes podrán optar
      por no aplicar parches de seguridad cuando las desventajas de aplicarlos superen los beneficios
      de ciberseguridad. Las entidades pertinentes documentarán y justificarán debidamente los motivos
      de tal decisión.
    official_text_en: By way of derogation from point 6.6.1(a), the relevant entities may choose not to
      apply security patches when the disadvantages of applying the security patches outweigh the cybersecurity
      benefits. The relevant entities shall duly document and substantiate the reasons for any such decision.
    section: Anexo, punto 6.6.2
    source_sha256: 1fba50832cd51302d66f0aab8e7c6e6179108a15502476dbbc269ff5edeaf5c2
- id: 6.7.1
  title_es: Seguridad de las redes · punto 6.7.1
  title_en: Network security · point 6.7.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes adoptarán medidas adecuadas para proteger sus sistemas
      de redes y de información de las ciberamenazas.
    official_text_en: The relevant entities shall take the appropriate measures to protect their network
      and information systems from cyber threats.
    section: Anexo, punto 6.7.1
    source_sha256: 80e485a05b61cdeac1b87f056dbf1272b834146adbe2e496180da23ae3c7da13
- id: 6.7.2
  title_es: Seguridad de las redes · punto 6.7.2
  title_en: Network security · point 6.7.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A los efectos del punto 6.7.1, las entidades pertinentes:


      a) documentarán la arquitectura de la red de manera comprensible y actualizada;


      b) establecerán y aplicarán controles para proteger los dominios de red internos de las entidades
      pertinentes frente al acceso no autorizado;


      c) configurarán los controles para impedir el acceso y las comunicaciones de la red que no sean
      necesarios para el funcionamiento de las entidades pertinentes;


      d) establecerán y aplicarán controles del acceso remoto a los sistemas de redes y de información,
      incluido el acceso por parte de los proveedores de servicios;


      e) no utilizarán los sistemas empleados para gestionar la aplicación de la política de seguridad
      para otros fines;


      f) prohibirán de manera explícita o desactivarán las conexiones y servicios que no sean necesarios;


      g) cuando proceda, únicamente permitirán el acceso a los sistemas de redes y de información de las
      entidades pertinentes a los dispositivos autorizados por estas últimas;


      h) permitirán la conexión de los proveedores de servicios previa solicitud de autorización únicamente
      y durante un período de tiempo limitado, como la duración de una operación de mantenimiento;


      i) establecerán la comunicación entre distintos sistemas únicamente a través de canales de confianza
      que estén aislados mediante separación lógica, criptográfica o física de otros canales de comunicación,
      y facilitarán la identificación segura de su punto final y la protección de sus datos frente a la
      modificación o la revelación;


      j) adoptarán un plan de ejecución para realizar la transición hacia protocolos de comunicación de
      la capa de red de última generación de manera segura, adecuada y gradual, y establecerán medidas
      para acelerar dicha transición;


      k) adoptarán un plan de ejecución relativo a la implantación de normas sobre las comunicaciones
      por correo electrónico modernas, interoperables y aprobadas a escala internacional para proteger
      las comunicaciones por correo electrónico y mitigar las vulnerabilidades vinculadas a las amenazas
      relativas a este último, y establecerán medidas para acelerar dicha implantación;


      l) aplicarán las mejores prácticas sobre seguridad del sistema de nombres de dominio, la seguridad
      del enrutamiento de internet y la higiene del enrutamiento del tráfico con origen en la red o destinado
      a ella.'
    official_text_en: 'For the purpose of point 6.7.1, the relevant entities shall:


      (a) document the architecture of the network in a comprehensible and up to date manner;


      (b) determine and apply controls to protect the relevant entities’ internal network domains from
      unauthorised access;


      (c) configure controls to prevent accesses and network communication not required for the operation
      of the relevant entities;


      (d) determine and apply controls for remote access to network and information systems, including
      access by service providers;


      (e) not use systems used for administration of the security policy implementation for other purposes;


      (f) explicitly forbid or deactivate unneeded connections and services;


      (g) where appropriate, exclusively allow access to the relevant entities’ network and information
      systems by devices authorised by those entities;


      (h) allow connections of service providers only after an authorisation request and for a set time
      period, such as the duration of a maintenance operation;


      (i) establish communication between distinct systems only through trusted channels that are isolated
      using logical, cryptographic or physical separation from other communication channels and provide
      assured identification of their end points and protection of the channel data from modification
      or disclosure;


      (j) adopt an implementation plan for the full transition towards latest generation network layer
      communication protocols in a secure, appropriate and gradual way and establish measures to accelerate
      such transition;


      (k) adopt an implementation plan for the deployment of internationally agreed and interoperable
      modern e-mail communications standards to secure e-mail communications to mitigate vulnerabilities
      linked to e-mail-related threats and establish measures to accelerate such deployment;


      (l) apply best practices for the security of the DNS, and for Internet routing security and routing
      hygiene of traffic originating from and destined to the network.'
    section: Anexo, punto 6.7.2
    source_sha256: 088188b7c9f141a62ef65b26f00e6bfb6a2152a6555d65bd8546db58ce8037c7
- id: 6.7.3
  title_es: Seguridad de las redes · punto 6.7.3
  title_en: Network security · point 6.7.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán estas medidas
      a intervalos planificados o cuando se produzcan incidentes significativos o cambios significativos
      en las operaciones o los riesgos.
    official_text_en: The relevant entities shall review and, where appropriate, update these measures
      at planned intervals and when significant incidents or significant changes to operations or risks
      occur.
    section: Anexo, punto 6.7.3
    source_sha256: 4585c8f353d84252514ff33e7ae63f2d4a45264ddedce006885dca160be23d91
- id: 6.8.1
  title_es: Segmentación de la red · punto 6.8.1
  title_en: Network segmentation · point 6.8.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes segmentarán los sistemas en redes o zonas de acuerdo con
      los resultados de la evaluación de riesgos a que se refiere el punto 2.1. Segmentarán sus sistemas
      y redes de los sistemas y redes de terceros.
    official_text_en: The relevant entities shall segment systems into networks or zones in accordance
      with the results of the risk assessment referred to in point 2.1. They shall segment their systems
      and networks from third parties’ systems and networks.
    section: Anexo, punto 6.8.1
    source_sha256: 2912e41636a8370d6daa1202ab2748869f8975c845c1c7b36ae8796df918c513
- id: 6.8.2
  title_es: Segmentación de la red · punto 6.8.2
  title_en: Network segmentation · point 6.8.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A tal efecto, las entidades pertinentes:


      a) considerarán la relación funcional, lógica y física, incluida la ubicación, entre sistemas y
      servicios fiables;


      b) concederán acceso a una red o zona sobre la base de una evaluación de sus requisitos de seguridad;


      c) mantendrán los sistemas que resulten críticos para el funcionamiento de la entidad pertinente
      o para la protección en zonas seguras;


      d) implantarán una zona desmilitarizada dentro de sus redes de comunicación para ofrecer una comunicación
      segura desde o hacia sus redes;


      e) restringirán el acceso y las comunicaciones entre zonas y dentro de ellas a lo necesario para
      el funcionamiento de las entidades pertinentes o la seguridad;


      f) separarán la red específica para la administración de los sistemas de redes y de información
      de la red operativa de las entidades pertinentes;


      g) segregarán los canales de administración de la red del resto de tráfico de la red;


      h) separarán los sistemas de producción de los servicios de las entidades pertinentes de los sistemas
      utilizados para el desarrollo y las pruebas, incluidas las copias de seguridad.'
    official_text_en: 'For that purpose, the relevant entities shall:


      (a) consider the functional, logical and physical relationship, including location, between trustworthy
      systems and services;


      (b) grant access to a network or zone based on an assessment of its security requirements;


      (c) keep systems that are critical to the relevant entities operation or to safety in secured zones;


      (d) deploy a demilitarised zone within their communication networks to ensure secure communication
      originating from or destined to their networks;


      (e) restrict access and communications between and within zones to those necessary for the operation
      of the relevant entities or for safety;


      (f) separate the dedicated network for administration of network and information systems from the
      relevant entities’ operational network;


      (g) segregate network administration channels from other network traffic;


      (h) separate the production systems for the relevant entities’ services from systems used in development
      and testing, including backups.'
    section: Anexo, punto 6.8.2
    source_sha256: c9315ec262ccf9c9c6289aa701907535580e342bd1461407d8f64fa3b80fc58c
- id: 6.8.3
  title_es: Segmentación de la red · punto 6.8.3
  title_en: Network segmentation · point 6.8.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán la segmentación
      de la red a intervalos planificados, así como cuando se produzcan incidentes significativos o cambios
      significativos en las operaciones o los riesgos.
    official_text_en: The relevant entities shall review and, where appropriate, update network segmentation
      at planned intervals and when significant incidents or significant changes to operations or risks.
    section: Anexo, punto 6.8.3
    source_sha256: 4f4ea362dd840577f68ce521fdd6e2bcb90cb4973f062278ee6cd6c4ded854a9
- id: 6.9.1
  title_es: Protección frente a los programas informáticos maliciosos y no autorizados · punto 6.9.1
  title_en: Protection against malicious and unauthorised software · point 6.9.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes protegerán sus sistemas de redes y de información frente
      a los programas informáticos maliciosos y no autorizados.
    official_text_en: The relevant entities shall protect their network and information systems against
      malicious and unauthorised software.
    section: Anexo, punto 6.9.1
    source_sha256: d10e752e882b2ad528976ea52cd4f67acd659b71e235b0f81de241a726487dcb
- id: 6.9.2
  title_es: Protección frente a los programas informáticos maliciosos y no autorizados · punto 6.9.2
  title_en: Protection against malicious and unauthorised software · point 6.9.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Para ello, las entidades pertinentes aplicarán, en particular, medidas para detectar
      o impedir el uso de programas informáticos maliciosos o no autorizados. Las entidades pertinentes
      velarán, cuando proceda, por que sus sistemas de redes y de información estén equipados con programas
      informáticos de detección y respuesta, que se actualicen periódicamente de conformidad con la evaluación
      de riesgos realizada con arreglo al punto 2.1 y los acuerdos contractuales con los proveedores.
    official_text_en: For that purpose, the relevant entities shall in particular implement measures that
      detect or prevent the use of malicious or unauthorised software. The relevant entities shall, where
      appropriate, ensure that their network and information systems are equipped with detection and response
      software, which is updated regularly in accordance with the risk assessment carried out pursuant
      to point 2.1 and the contractual agreements with the providers.
    section: Anexo, punto 6.9.2
    source_sha256: e458abc767ef884663600603598621e22333e01a7110ea64e2c11aedebebc93c
- id: 6.10.1
  title_es: Gestión y divulgación de las vulnerabilidades · punto 6.10.1
  title_en: Vulnerability handling and disclosure · point 6.10.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes recibirán información sobre las vulnerabilidades de sus
      sistemas de redes y de información, evaluarán su exposición a dichas vulnerabilidades y adoptarán
      las medidas necesarias para gestionarlas.
    official_text_en: The relevant entities shall obtain information about technical vulnerabilities in
      their network and information systems, evaluate their exposure to such vulnerabilities, and take
      appropriate measures to manage the vulnerabilities.
    section: Anexo, punto 6.10.1
    source_sha256: 2026f51f0f319a2012c26958744d8f495b0c3cfa0db46dc44ede5666da3b730c
- id: 6.10.2
  title_es: Gestión y divulgación de las vulnerabilidades · punto 6.10.2
  title_en: Vulnerability handling and disclosure · point 6.10.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A los efectos del punto 6.10.1, las entidades pertinentes:


      a) supervisarán la información sobre vulnerabilidades a través de los canales adecuados, tales como
      los anuncios de los CSIRT, las autoridades competentes o la información facilitada por los proveedores
      o prestadores de servicios;


      b) realizarán, según proceda, exploraciones de vulnerabilidad y registrarán pruebas de los resultados
      de las mismas, a intervalos planificados;


      c) abordarán, sin demora indebida, las vulnerabilidades que las entidades pertinentes consideren
      críticas para sus operaciones;


      d) asegurarán que su gestión de vulnerabilidades sea compatible con sus procedimientos de gestión
      de cambios, gestión de parches de seguridad, gestión de riesgos y gestión de incidentes;


      e) establecerán un procedimiento de divulgación de las vulnerabilidades de conformidad con la política
      coordinada de divulgación de las vulnerabilidades nacional aplicable.'
    official_text_en: 'For the purpose of point 6.10.1, the relevant entities shall:


      (a) monitor information about vulnerabilities through appropriate channels, such as announcements
      of CSIRTs, competent authorities or information provided by suppliers or service providers;


      (b) perform, where appropriate, vulnerability scans, and record evidence of the results of the scans,
      at planned intervals;


      (c) address, without undue delay, vulnerabilities identified by the relevant entities as critical
      to their operations;


      (d) ensure that their vulnerability handling is compatible with their change management, security
      patch management, risk management and incident management procedures;


      (e) lay down a procedure for disclosing vulnerabilities in accordance with the applicable national
      coordinated vulnerability disclosure policy.'
    section: Anexo, punto 6.10.2
    source_sha256: 57a839b84b615e4a8617f2e9f0865b2f2ab396ab9efa0e3e328a7b5b753c0382
- id: 6.10.3
  title_es: Gestión y divulgación de las vulnerabilidades · punto 6.10.3
  title_en: Vulnerability handling and disclosure · point 6.10.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Cuando esté justificado por el posible impacto de la vulnerabilidad, las entidades
      pertinentes crearán y llevarán a la práctica un plan para mitigarla. En otros casos, las entidades
      pertinentes documentarán y justificarán el motivo por el que la vulnerabilidad no requiere reparación.
    official_text_en: When justified by the potential impact of the vulnerability, the relevant entities
      shall create and implement a plan to mitigate the vulnerability. In other cases, the relevant entities
      shall document and substantiate the reason why the vulnerability does not require remediation.
    section: Anexo, punto 6.10.3
    source_sha256: 3b559d51b916f8a0bb0f8c2e9012e08665dfb6e83478f901bac16e9ff9beb4c8
- id: 6.10.4
  title_es: Gestión y divulgación de las vulnerabilidades · punto 6.10.4
  title_en: Vulnerability handling and disclosure · point 6.10.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán a intervalos
      planificados los canales que utilizan para supervisar la información relativa a las vulnerabilidades.
    official_text_en: The relevant entities shall review and, where appropriate, update at planned intervals
      the channels they use for monitoring vulnerability information.
    section: Anexo, punto 6.10.4
    source_sha256: fdfb8f33b7d509bb4c97afe3fe82903b4404de658542c33b3e328961ffa767d1
- id: '7.1'
  title_es: Orientaciones y procedimientos para evaluar la eficacia de las medidas de gestión de riesgos
    de ciberseguridad [artículo 21, apartado 2, letra f), de la Directiva (UE) 2022/2555] · punto 7.1
  title_en: Policies and procedures to assess the effectiveness of cybersecurity risk-management measures
    (Article 21(2), point (f), of Directive (EU) 2022/2555) · point 7.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A los efectos del artículo 21, apartado 2, letra f), de la Directiva (UE) 2022/2555,
      las entidades pertinentes establecerán, llevarán a la práctica y aplicarán orientaciones y procedimientos
      para evaluar si las medidas para la gestión de riesgos de ciberseguridad que hayan adoptado se ejecutan
      y mantienen de manera efectiva.
    official_text_en: For the purpose of Article 21(2), point (f) of Directive (EU) 2022/2555, the relevant
      entities shall establish, implement and apply a policy and procedures to assess whether the cybersecurity
      risk-management measures taken by the relevant entity are effectively implemented and maintained.
    section: Anexo, punto 7.1
    source_sha256: 20593a7f3e1bceb3d6ff577d3688d51d196eb7d3d61539a5155bbcbdfaaf7131
- id: '7.2'
  title_es: Orientaciones y procedimientos para evaluar la eficacia de las medidas de gestión de riesgos
    de ciberseguridad [artículo 21, apartado 2, letra f), de la Directiva (UE) 2022/2555] · punto 7.2
  title_en: Policies and procedures to assess the effectiveness of cybersecurity risk-management measures
    (Article 21(2), point (f), of Directive (EU) 2022/2555) · point 7.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'Las orientaciones y procedimientos a que hace referencia el punto 7.1 tendrán en
      cuenta los resultados de la evaluación de riesgos conforme al punto 2.1 y los incidentes significativos
      ocurridos en el pasado. Las entidades pertinentes determinarán:


      a) qué medidas para la gestión de riesgos de ciberseguridad deben supervisarse y medirse, incluidos
      los procedimientos y controles;


      b) los métodos de supervisión, medición, análisis y evaluación, según corresponda, para asegurar
      resultados válidos;


      c) cuándo deben realizarse la supervisión y la medición;


      d) quiénes son los responsables de supervisar y medir la eficacia de las medidas para la gestión
      de riesgos de ciberseguridad;


      e) cuándo se deben analizar y evaluar los resultados de la supervisión y la medición;


      f) quiénes deben analizar y evaluar estos resultados.'
    official_text_en: 'The policy and procedures referred to in point 7.1 shall take into account results
      of the risk assessment pursuant to point 2.1 and past significant incidents. The relevant entities
      shall determine:


      (a) what cybersecurity risk-management measures are to be monitored and measured, including processes
      and controls;


      (b) the methods for monitoring, measurement, analysis and evaluation, as applicable, to ensure valid
      results;


      (c) when the monitoring and measuring is to be performed;


      (d) who is responsible for monitoring and measuring the effectiveness of the cybersecurity risk-management
      measures;


      (e) when the results from monitoring and measurement are to be analysed and evaluated;


      (f) who has to analyse and evaluate these results.'
    section: Anexo, punto 7.2
    source_sha256: 8d03b52a302dc8e41cf55ebdd8a08c2c8108448b848adb22e830bdc8865bfa27
- id: '7.3'
  title_es: Orientaciones y procedimientos para evaluar la eficacia de las medidas de gestión de riesgos
    de ciberseguridad [artículo 21, apartado 2, letra f), de la Directiva (UE) 2022/2555] · punto 7.3
  title_en: Policies and procedures to assess the effectiveness of cybersecurity risk-management measures
    (Article 21(2), point (f), of Directive (EU) 2022/2555) · point 7.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán las orientaciones
      y los procedimientos a intervalos planificados, así como cuando se produzcan incidentes significativos
      o cambios significativos en las operaciones o los riesgos.
    official_text_en: The relevant entities shall review and, where appropriate, update the policy and
      procedures at planned intervals and when significant incidents or significant changes to operations
      or risks.
    section: Anexo, punto 7.3
    source_sha256: fd1ca25bc2647a7de4a12833a39e77aabb12c261baec91d39154aa4b3d5a2119
- id: 8.1.1
  title_es: Mejora de la sensibilización y prácticas básicas de ciberhigiene · punto 8.1.1
  title_en: Awareness raising and basic cyber hygiene practices · point 8.1.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A los efectos del artículo 21, apartado 2, letra g), de la Directiva (UE) 2022/2555,
      las entidades pertinentes se asegurarán de que sus empleados, incluidos los miembros de los órganos
      de dirección, así como sus proveedores y prestadores de servicios directos sean conscientes de los
      riesgos, estén informados de la importancia de la ciberseguridad y apliquen prácticas de ciberhigiene.
    official_text_en: For the purpose of Article 21(2), point (g) of Directive (EU) 2022/2555, the relevant
      entities shall ensure that their employees, including members of management bodies, as well as direct
      suppliers and service providers are aware of risks, are informed of the importance of cybersecurity
      and apply cyber hygiene practices.
    section: Anexo, punto 8.1.1
    source_sha256: 3aea9ee9276b475faf598f42f0302abc2b4c16019739afd162c860753889c954
- id: 8.1.2
  title_es: Mejora de la sensibilización y prácticas básicas de ciberhigiene · punto 8.1.2
  title_en: Awareness raising and basic cyber hygiene practices · point 8.1.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A los efectos del punto 8.1.1, las entidades pertinentes ofrecerán a sus empleados,
      incluidos los miembros de los órganos de dirección, así como a sus proveedores y prestadores de
      servicios directos, según proceda de conformidad con el punto 5.1.4, un programa de mejora de la
      sensibilización que:


      a) se programará a lo largo del tiempo, de forma que se repitan las actividades e incluya a los
      nuevos empleados;


      b) se establecerá en consonancia con la política de seguridad de las redes y la información, las
      políticas específicas y los procedimientos pertinentes en materia de seguridad de las redes y de
      la información;


      c) englobará las ciberamenazas relevantes, las medidas para la gestión de riesgos de ciberseguridad
      en vigor, los puntos de contacto y los recursos para obtener información adicional y asesoramiento
      sobre aspectos de ciberseguridad, así como las prácticas de ciberhigiene para los usuarios.'
    official_text_en: 'For the purpose of point 8.1.1, the relevant entities shall offer to their employees,
      including members of management bodies, as well as to direct suppliers and service providers where
      appropriate in accordance with point 5.1.4, an awareness raising programme, which shall:


      (a) be scheduled over time, so that the activities are repeated and cover new employees;


      (b) be established in line with the network and information security policy, topic-specific policies
      and relevant procedures on network and information security;


      (c) cover relevant cyber threats, the cybersecurity risk-management measures in place, contact points
      and resources for additional information and advice on cybersecurity matters, as well as cyber hygiene
      practices for users.'
    section: Anexo, punto 8.1.2
    source_sha256: 54e05d472c67a6334c638e079fe32f07f50c0fe9637ab411e41016e2617d0e78
- id: 8.1.3
  title_es: Mejora de la sensibilización y prácticas básicas de ciberhigiene · punto 8.1.3
  title_en: Awareness raising and basic cyber hygiene practices · point 8.1.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: El programa de mejora de la sensibilización se probará en términos de eficacia,
      según proceda. El programa de mejora de la sensibilización se actualizará y se ofrecerá a intervalos
      planificados teniendo en cuenta los cambios en las prácticas de ciberhigiene y el panorama actual
      de amenazas y de riesgos para las entidades pertinentes.
    official_text_en: The awareness raising programme shall, where appropriate, be tested in terms of
      effectiveness. The awareness raising programme shall be updated and offered at planned intervals
      taking into account changes in cyber hygiene practices, and the current threat landscape and risks
      posed to the relevant entities.
    section: Anexo, punto 8.1.3
    source_sha256: 583f98548c9fda63148698a1b1c7a990b7cd554449995bca45b570acbbaa186d
- id: 8.2.1
  title_es: Formación en seguridad · punto 8.2.1
  title_en: Security training · point 8.2.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes indicarán cuáles son los empleados cuyos roles exigen
      capacidades y conocimientos especializados de seguridad y velarán por que reciban formación periódica
      sobre la seguridad de los sistemas de redes y de información.
    official_text_en: The relevant entities shall identify employees, whose roles require security relevant
      skill sets and expertise, and ensure that they receive regular training on network and information
      system security.
    section: Anexo, punto 8.2.1
    source_sha256: c026af7d596372ff6aab265d84e4aa16b89915d593b842889322db6a5ba9c5c6
- id: 8.2.2
  title_es: Formación en seguridad · punto 8.2.2
  title_en: Security training · point 8.2.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes establecerán, pondrán en marcha y ejecutarán un programa
      de formación en consonancia con la política de seguridad de las redes y de la información, las políticas
      específicas y otros procedimientos pertinentes en materia de seguridad de las redes y de la información
      que determine las necesidades de formación de ciertos roles y puestos de acuerdo con criterios concretos.
    official_text_en: The relevant entities shall establish, implement and apply a training program in
      line with the network and information security policy, topic-specific policies and other relevant
      procedures on network and information security which lays down the training needs for certain roles
      and positions based on criteria.
    section: Anexo, punto 8.2.2
    source_sha256: e580c6940ed028e9b640b5f87b1e3f6b5c4b7f037f29ad46b26b253243acb21f
- id: 8.2.3
  title_es: Formación en seguridad · punto 8.2.3
  title_en: Security training · point 8.2.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'La formación contemplada en el punto 8.2.1 se adecuará a las funciones laborales
      de los empleados y se evaluará su eficacia. La formación tendrá en cuenta las medidas de seguridad
      en vigor y englobará lo siguiente:


      a) instrucciones relativas a la configuración y el funcionamiento seguros de los sistemas de redes
      y de información, incluidos los dispositivos móviles;


      b) información sobre ciberamenazas conocidas;


      c) formación relativa al comportamiento frente a sucesos relevantes para la seguridad.'
    official_text_en: 'The training referred to in point 8.2.1 shall be relevant to the job function of
      the employee and its effectiveness shall be assessed. Training shall take into consideration security
      measures in place and cover the following:


      (a) instructions regarding the secure configuration and operation of the network and information
      systems, including mobile devices;


      (b) briefing on known cyber threats;


      (c) training of the behaviour when security-relevant events occur.'
    section: Anexo, punto 8.2.3
    source_sha256: afc1d67fdc959caa719f46e35b70723163c0fa783246c6a5c6eddbe9f4d02b51
- id: 8.2.4
  title_es: Formación en seguridad · punto 8.2.4
  title_en: Security training · point 8.2.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes llevarán a cabo la formación para los miembros del personal
      que se trasladen a nuevos puestos o roles que requieran capacidades y conocimientos especializados
      en seguridad.
    official_text_en: The relevant entities shall apply training to staff members who transfer to new
      positions or roles which require security relevant skill sets and expertise.
    section: Anexo, punto 8.2.4
    source_sha256: 10f09761a527e23dd13289b185bbb8a2dc67f3ba7a73c198200e2794719d624a
- id: 8.2.5
  title_es: Formación en seguridad · punto 8.2.5
  title_en: Security training · point 8.2.5
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: El programa se actualizará y desarrollará de manera periódica teniendo en cuenta
      las normas y reglas aplicables, los roles asignados, las responsabilidades, así como las ciberamenazas
      conocidas y los avances tecnológicos.
    official_text_en: The program shall be updated and run periodically taking into account applicable
      policies and rules, assigned roles, responsibilities, as well as known cyber threats and technological
      developments.
    section: Anexo, punto 8.2.5
    source_sha256: 89b8720b03961a875698d1d48dcfb1118632a20a03a621263d68d5acd12766dc
- id: '9.1'
  title_es: Criptografía [artículo 21, apartado 2, letra h), de la Directiva (UE) 2022/2555] · punto 9.1
  title_en: Cryptography (Article 21(2), point (h), of Directive (EU) 2022/2555) · point 9.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A los efectos del artículo 21, apartado 2, letra h), de la Directiva (UE) 2022/2555,
      las entidades pertinentes establecerán, llevarán a la práctica y aplicarán orientaciones y procedimientos
      relativos a la criptografía, con el objetivo de asegurar un uso adecuado y eficaz de la misma para
      proteger la confidencialidad, autenticidad e integridad de la información en consonancia con la
      clasificación de activos de las entidades pertinentes y los resultados de la evaluación de riesgos
      realizada de conformidad con el punto 2.1.
    official_text_en: For the purpose of Article 21(2), point (h) of Directive (EU) 2022/2555, the relevant
      entities shall establish, implement and apply a policy and procedures related to cryptography, with
      a view to ensuring adequate and effective use of cryptography to protect the confidentiality, authenticity
      and integrity of data in line with the relevant entities’ asset classification and the results of
      the risk assessment carried out pursuant to point 2.1.
    section: Anexo, punto 9.1
    source_sha256: a2aaef63d4687066f21856ae15dcedde52c7ed23b246138423540c9739e19279
- id: '9.2'
  title_es: Criptografía [artículo 21, apartado 2, letra h), de la Directiva (UE) 2022/2555] · punto 9.2
  title_en: Cryptography (Article 21(2), point (h), of Directive (EU) 2022/2555) · point 9.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: "Las orientaciones y procedimientos a que hace referencia el punto 9.1 establecerán:\n\
      \na) de acuerdo con la clasificación de activos de las entidades pertinentes, el tipo, la firmeza\
      \ y la calidad de las medidas criptográficas necesarias para proteger los activos de dichas entidades,\
      \ incluidos los datos en reposo y los datos en tránsito;\n\nb) teniendo en cuenta la letra a), los\
      \ protocolos o las familias de protocolos que deben adoptarse, así como los algoritmos criptográficos,\
      \ la solidez del cifrado, las soluciones criptográficas y las prácticas de uso que deben aprobarse\
      \ y exigirse para su uso en las entidades, siguiendo, cuando proceda, un enfoque de agilidad criptográfica;\n\
      \nc) el enfoque de las entidades pertinentes sobre la gestión de claves, que incluya, cuando proceda,\
      \ métodos para lo siguiente:\n  i) generar distintas claves para sistemas y aplicaciones criptográficos;\n\
      \  ii) expedir y obtener certificados de clave pública;\n  iii) distribuir claves a las entidades\
      \ en cuestión, incluida información sobre cómo activar las claves cuando se reciban;\n  iv) almacenar\
      \ claves, incluida información sobre cómo acceden a ellas los usuarios autorizados;\n  v) cambiar\
      \ o actualizar las claves, incluida información sobre cuándo y cómo modificarlas;\n  vi) gestionar\
      \ las claves en riesgo;\n  vii) anular claves, incluida información sobre cómo retirarlas o desactivarlas;\n\
      \  viii) recuperar las claves perdidas o corrompidas;\n  ix) hacer copias de seguridad y crear archivos\
      \ de las claves;\n  x) destruir claves;\n  xi) hacer un registro y auditar las actividades relativas\
      \ a la gestión de claves.\n  xii) fijar las fechas de activación y desactivación de las claves asegurándose\
      \ de que estas solo pueden utilizarse durante el período de tiempo especificado de acuerdo con las\
      \ normas de gestión de claves de la organización."
    official_text_en: "The policy and procedures referred to in point 9.1 shall establish:\n\n(a) in accordance\
      \ with the relevant entities’ classification of assets, the type, strength and quality of the cryptographic\
      \ measures required to protect the relevant entities’ assets, including data at rest and data in\
      \ transit;\n\n(b) based on point (a), the protocols or families of protocols to be adopted, as well\
      \ as cryptographic algorithms, cipher strength, cryptographic solutions and usage practices to be\
      \ approved and required for use in the relevant entities, following, where appropriate, a cryptographic\
      \ agility approach;\n\n(c) the relevant entities’ approach to key management, including, where appropriate,\
      \ methods for the following:\n  (i) generating different keys for cryptographic systems and applications;\n\
      \  (ii) issuing and obtaining public key certificates;\n  (iii) distributing keys to intended entities,\
      \ including how to activate keys when received;\n  (iv) storing keys, including how authorised users\
      \ obtain access to keys;\n  (v) changing or updating keys, including rules on when and how to change\
      \ keys;\n  (vi) dealing with compromised keys;\n  (vii) revoking keys including how to withdraw\
      \ or deactivate keys;\n  (viii) recovering lost or corrupted keys;\n  (ix) backing up or archiving\
      \ keys;\n  (x) destroying keys;\n  (xi) logging and auditing of key management-related activities;\n\
      \  (xii) setting activation and deactivation dates for keys ensuring that the keys can only be used\
      \ for the specified period of time according to the organization's rules on key management."
    section: Anexo, punto 9.2
    source_sha256: f19bc752c6abcdf18d229e3d22df51225f33b09a6f192e6e9bfcb525f67af845
- id: '9.3'
  title_es: Criptografía [artículo 21, apartado 2, letra h), de la Directiva (UE) 2022/2555] · punto 9.3
  title_en: Cryptography (Article 21(2), point (h), of Directive (EU) 2022/2555) · point 9.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán las orientaciones
      y los procedimientos a intervalos planificados teniendo en cuenta los últimos avances en criptografía.
    official_text_en: The relevant entities shall review and, where appropriate, update their policy and
      procedures at planned intervals, taking into account the state of the art in cryptography.
    section: Anexo, punto 9.3
    source_sha256: 8e082b606d45a04cb8780b96973069facd05ce86f43fe5948cf5177c0a74f31e
- id: 10.1.1
  title_es: Seguridad de los recursos humanos · punto 10.1.1
  title_en: Human resources security · point 10.1.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A los efectos del artículo 21, apartado 2, letra i), de la Directiva (UE) 2022/2555,
      las entidades pertinentes se asegurarán de que sus empleados y sus proveedores y prestadores de
      servicios directos, cuando proceda, entiendan sus responsabilidades en materia de seguridad y se
      comprometan a ellas, según convenga con relación a los servicios ofrecidos y el puesto de trabajo
      y en consonancia con la política de seguridad de los sistemas de redes y de información de la entidad
      pertinente.
    official_text_en: For the purpose of Article 21(2), point (i) of Directive (EU) 2022/2555, the relevant
      entities shall ensure that their employees and direct suppliers and service providers, wherever
      applicable, understand and commit to their security responsibilities, as appropriate for the offered
      services and the job and in line with the relevant entities’ policy on the security of network and
      information systems.
    section: Anexo, punto 10.1.1
    source_sha256: 2297a778ebbe4c96ebf4f97d6bf20ac61709fe3f9015c66e2fab92dab7dded02
- id: 10.1.2
  title_es: Seguridad de los recursos humanos · punto 10.1.2
  title_en: Human resources security · point 10.1.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'El requisito contemplado en el punto 10.1.1 incluirá lo siguiente:


      a) mecanismos para garantizar que todos los empleados, proveedores y prestadores de servicios directos,
      cuando proceda, entiendan y respeten las prácticas estándar de ciberhigiene aplicadas por las entidades
      pertinentes de acuerdo con el punto 8.1;


      b) mecanismos para garantizar que todos los usuarios que dispongan de acceso de administración o
      privilegiado conozcan sus roles, responsabilidades y autoridades y actúen de conformidad con ellos;


      c) mecanismos para garantizar que los miembros de los órganos de dirección conozcan sus roles, responsabilidades
      y autoridades y actúen de conformidad con ellos en lo que se refiere a la seguridad de los sistemas
      de redes y de información;


      d) mecanismos para contratar personal cualificado para los roles correspondientes, como por ejemplo,
      los controles de referencia, los procedimientos de evaluación, la validación de certificaciones
      o las pruebas escritas.'
    official_text_en: 'The requirement referred to in point 10.1.1 shall include the following:


      (a) mechanisms to ensure that all employees, direct suppliers and service providers, wherever applicable,
      understand and follow the standard cyber hygiene practices that the relevant entities apply pursuant
      to point 8.1;


      (b) mechanisms to ensure that all users with administrative or privileged access are aware of and
      act in accordance with their roles, responsibilities and authorities;


      (c) mechanisms to ensure that members of management bodies understand and act in accordance with
      their role, responsibilities and authorities regarding network and information system security;


      (d) mechanisms for hiring personnel qualified for the respective roles, such as reference checks,
      vetting procedures, validation of certifications, or written tests.'
    section: Anexo, punto 10.1.2
    source_sha256: 994a0600fd52e6a2fc89e1069c4cfe2b4edcc8fdae8531a84fdea2b928f18e2c
- id: 10.1.3
  title_es: Seguridad de los recursos humanos · punto 10.1.3
  title_en: Human resources security · point 10.1.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán la asignación de personal a roles específicos,
      tal como se recoge en el punto 1.2, así como su atribución de recursos humanos a este respecto,
      a intervalos planificados y al menos una vez al año. Las entidades actualizarán la asignación cuando
      sea necesario.
    official_text_en: The relevant entities shall review the assignment of personnel to specific roles
      as referred to in point 1.2, as well as their commitment of human resources in that regard, at planned
      intervals and at least annually. They shall updatethe assignment where necessary.
    section: Anexo, punto 10.1.3
    source_sha256: ba76eb2bae9386360261cd0708ca65247eb8690c3dca7515184b18dc519b3ec7
- id: 10.2.1
  title_es: Comprobación de antecedentes · punto 10.2.1
  title_en: Verification of background · point 10.2.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes se asegurarán, en la medida posible, de comprobar los
      antecedentes personales de sus empleados y, cuando proceda, de sus proveedores y prestadores de
      servicios directos, de conformidad con el apartado 5.1.4, cuando resulte necesario para sus roles,
      responsabilidades y autoridades.
    official_text_en: The relevant entities shall ensure to the extent feasible verification of the background
      of their employees, and where applicable of direct suppliers and service providers in accordance
      with point 5.1.4, if necessary for their role, responsibilities and authorisations.
    section: Anexo, punto 10.2.1
    source_sha256: f5c5b0c7f3c15a0da99ca9950df976caa078b9f899d4f283165629e9ecf29eb3
- id: 10.2.2
  title_es: Comprobación de antecedentes · punto 10.2.2
  title_en: Verification of background · point 10.2.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A los efectos del punto 10.2.1, las entidades pertinentes:


      a) aplicarán criterios que establezcan qué roles, responsabilidades y autoridades deben ejercer
      exclusivamente aquellas personas cuyos antecedentes hayan sido comprobados;


      b) se asegurarán de que estas comprobaciones contempladas en el punto 10.2.1 se lleven a cabo antes
      de que estas personas empiecen a ejercer dichos roles, responsabilidades y autoridades, que tendrán
      en cuenta las disposiciones legales, normativas y éticas aplicables en proporción a los requisitos
      operativos, la clasificación de activos contemplada en el apartado 12.1 y los sistemas de redes
      y de información a los que va a accederse, así como los riesgos percibidos.'
    official_text_en: 'For the purpose of point 10.2.1, the relevant entities shall:


      (a) put in place criteria, which set out which roles, responsibilities and authorities shall only
      be exercised by persons whose background has been verified;


      (b) ensure that verification referred to in point 10.2.1 is performed on these persons before they
      start exercising these roles, responsibilities and authorities, which shall take into consideration
      the applicable laws, regulations, and ethics in proportion to the business requirements, the asset
      classification as referred to in point 12.1 and the network and information systems to be accessed,
      and the perceived risks.'
    section: Anexo, punto 10.2.2
    source_sha256: 8a957cabf679efe9ece934edbee4b51deac5015cdeb5ae0d30de6e314865a64a
- id: 10.2.3
  title_es: Comprobación de antecedentes · punto 10.2.3
  title_en: Verification of background · point 10.2.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán la política a intervalos planificados y la actualizarán
      según proceda.
    official_text_en: The relevant entities shall review and, where appropriate, update the policy at
      planned intervals and update it where necessary.
    section: Anexo, punto 10.2.3
    source_sha256: cd8fe31fc32a5116ef98d5a6350ff2ec96aff5ac2afcf4f9c0013aa468d2e51e
- id: 10.3.1
  title_es: Terminación o cambio de los procedimientos de contratación · punto 10.3.1
  title_en: Termination or change of employment procedures · point 10.3.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes se asegurarán de que la seguridad de los sistemas de redes
      y de información y las tareas que sigan siendo válidas tras la terminación o el cambio de empleo
      de sus empleados se definan y ejecuten contractualmente.
    official_text_en: The relevant entities shall ensure that network and information system security
      responsibilities and duties that remain valid after termination or change of employment of their
      employees are contractually defined and enforced.
    section: Anexo, punto 10.3.1
    source_sha256: 92ae8c75980ff9e1b41afdf18c71639d95e9edb9816aa82c2e8c3efd37a76c04
- id: 10.3.2
  title_es: Terminación o cambio de los procedimientos de contratación · punto 10.3.2
  title_en: Termination or change of employment procedures · point 10.3.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A los efectos del punto 10.3.1, las entidades pertinentes recogerán en las condiciones
      de empleo, contrato o acuerdo de cada persona, las responsabilidades y funciones que siguen teniendo
      validez una vez finalizado el empleo o contrato, como por ejemplo las cláusulas de confidencialidad.
    official_text_en: For the purpose of point 10.3.1, the relevant entities shall include in the individual’s
      terms and conditions of employment, contract or agreement the responsibilities and duties that are
      still valid after termination of employment or contract, such as confidentiality clauses.
    section: Anexo, punto 10.3.2
    source_sha256: 85845679b008d1ca32ee3fde47f479d4101a56d0f81cc1e0398aa8ec79fbd32a
- id: 10.4.1
  title_es: Procedimiento disciplinario · punto 10.4.1
  title_en: Disciplinary process · point 10.4.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes establecerán, comunicarán y mantendrán un procedimiento
      disciplinario para gestionar los incumplimientos de las políticas de seguridad de los sistemas de
      redes y de información. El proceso tendrá en cuenta los requisitos legales, estatutarios, contractuales
      y empresariales pertinentes.
    official_text_en: The relevant entities shall establish, communicate and maintain a disciplinary process
      for handling violations of network and information system security policies. The process shall take
      into consideration relevant legal, statutory, contractual and business requirements.
    section: Anexo, punto 10.4.1
    source_sha256: 1d8c7a8fc18443a5f9a8bc6944633f0411198163580473ce2735394788e08077
- id: 10.4.2
  title_es: Procedimiento disciplinario · punto 10.4.2
  title_en: Disciplinary process · point 10.4.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán los procedimientos
      disciplinarios a intervalos planificados o cuando resulte necesario debido a cambios jurídicos o
      cambios significativos en las operaciones o los riesgos.
    official_text_en: The relevant entities shall review and, where appropriate, update the disciplinary
      process at planned intervals, and when necessary due to legal changes or significant changes to
      operations or risks.
    section: Anexo, punto 10.4.2
    source_sha256: 014092cf26e4bbd958a467a973c7e036637c9807a06a2bcb405fe8ac2d069d91
- id: 11.1.1
  title_es: Política de control de accesos · punto 11.1.1
  title_en: Access control policy · point 11.1.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A los efectos del artículo 21, apartado 2, letra i), de la Directiva (UE) 2022/2555,
      las entidades pertinentes establecerán, documentarán y pondrán en marcha políticas de control de
      acceso lógico y físico relativas al acceso a sus sistemas de redes y de información; basándose en
      requisitos empresariales y en requisitos de seguridad de los sistemas de redes y de información.
    official_text_en: For the purpose of Article 21(2), point (i) of Directive (EU) 2022/2555, the relevant
      entities shall establish, document and implement logical and physical access control policies for
      the access to their network and information systems, based on business requirements as well as network
      and information system security requirements.
    section: Anexo, punto 11.1.1
    source_sha256: 9ccfabc21a23e5dadde87cc1555608dfe648533da41fe53ab86a9d40bf2bbfeb
- id: 11.1.2
  title_es: Política de control de accesos · punto 11.1.2
  title_en: Access control policy · point 11.1.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'La política a que hace referencia el punto 11.1.1 se encargará de lo siguiente:


      a) el acceso de personas, como el personal, los visitantes y las entidades externas, como los proveedores
      y prestadores de servicios;


      b) el acceso por parte de los sistemas de redes y de información;


      c) garantizar que solo se autorice el acceso a usuarios que hayan sido debidamente autenticados.'
    official_text_en: 'The policies referred to in point 11.1.1. shall:


      (a) address access by persons, including staff, visitors, and external entities such as suppliers
      and service providers;


      (b) address access by network and information systems;


      (c) ensure that access is only granted to users that have been adequately authenticated.'
    section: Anexo, punto 11.1.2
    source_sha256: 465a13369dd3a9350622910f130a4145353a012ab950d3236b6ebfeec85bcb24
- id: 11.1.3
  title_es: Política de control de accesos · punto 11.1.3
  title_en: Access control policy · point 11.1.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán las políticas
      a intervalos planificados o cuando se produzcan incidentes significativos o cambios significativos
      en las operaciones o los riesgos.
    official_text_en: The relevant entities shall review and, where appropriate, update the policies at
      planned intervals and when significant incidents or significant changes to operations or risks occur.
    section: Anexo, punto 11.1.3
    source_sha256: 6cb913f2387178c91a2ee5a3859c2ef75f5855378fa9e0b5e2bcc2f2eefa4827
- id: 11.2.1
  title_es: Gestión de derechos de acceso · punto 11.2.1
  title_en: Management of access rights · point 11.2.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes ofrecerán, modificarán, retirarán y documentarán los derechos
      de acceso a los sistemas de redes y de información de conformidad con la política de control de
      accesos prevista en el punto 11.1.
    official_text_en: The relevant entities shall provide, modify, remove and document access rights to
      network and information systems in accordance with the access control policy referred to in point
      11.1.
    section: Anexo, punto 11.2.1
    source_sha256: 5cc48da483e5fdb1de103b1f25e6135d3be88651928d165d83e825e590266f66
- id: 11.2.2
  title_es: Gestión de derechos de acceso · punto 11.2.2
  title_en: Management of access rights · point 11.2.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'Las entidades pertinentes:


      a) concederán y retirarán los derechos de acceso sobre la base de los principios de necesidad de
      conocer, el mínimo privilegio y separación de competencias;


      b) velarán por que los derechos de acceso se modifiquen en consecuencia tras la terminación o el
      cambio de empleo;


      c) velarán por que las personas pertinentes autoricen el acceso a los sistemas de redes y de información;


      d) velarán por que los derechos de acceso se encarguen debidamente del acceso de terceros, como
      visitantes o proveedores y prestadores de servicios, especialmente limitando los derechos de acceso
      en su alcance y duración;


      e) mantendrán un registro de los derechos de acceso concedidos;


      f) realizarán un registro de la gestión de los derechos de acceso.'
    official_text_en: 'The relevant entities shall:


      (a) assign and revoke access rights based on the principles of need-to-know, least privilege and
      separation of duties;


      (b) ensure that access rights are modified accordingly upon termination or change of employment;


      (c) ensure that access to network and information systems is authorised by the relevant persons;


      (d) ensure that access rights appropriately address third-party access, such as visitors, suppliers
      and service providers, in particular by limiting access rights in scope and in duration;


      (e) maintain a register of access rights granted;


      (f) apply logging to the management of access rights.'
    section: Anexo, punto 11.2.2
    source_sha256: 772ddc2b44129db08dd98b280273b5d1085f57c418b56e78efd137913480614c
- id: 11.2.3
  title_es: Gestión de derechos de acceso · punto 11.2.3
  title_en: Management of access rights · point 11.2.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán los derechos de acceso a intervalos planificados
      y los modificarán según los cambios organizativos. Las entidades pertinentes documentarán los resultados
      de la revisión e incluirán los cambios necesarios de los derechos de acceso.
    official_text_en: The relevant entities shall review access rights at planned intervals and shall
      modify them based on organisational changes. The relevant entities shall document the results of
      the review including the necessary changes of access rights.
    section: Anexo, punto 11.2.3
    source_sha256: d5dc67b8bc4d41880f3383c7e1f50509579018d9d24cd5a5cc2884374a6907bb
- id: 11.3.1
  title_es: Cuentas privilegiadas y cuentas de administración del sistema · punto 11.3.1
  title_en: Privileged accounts and system administration accounts · point 11.3.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes dispondrán de orientaciones para la gestión de cuentas
      privilegiadas y cuentas de administración del sistema como parte de la política de control de acceso
      contemplada en el punto 11.1.
    official_text_en: The relevant entities shall maintain policies for management of privileged accounts
      and system administration accounts as part of the access control policy referred to in point 11.1.
    section: Anexo, punto 11.3.1
    source_sha256: c6670e3c6d3ae12352e5ed0d2471b44de37b765254c0240fd4c3150676490cec
- id: 11.3.2
  title_es: Cuentas privilegiadas y cuentas de administración del sistema · punto 11.3.2
  title_en: Privileged accounts and system administration accounts · point 11.3.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'La política a que hace referencia el punto 11.3.1 se encargará de lo siguiente:


      a) establecer procedimientos sólidos de identificación y autenticación, como la autenticación de
      múltiples factores, y procedimientos de autorización para cuentas privilegiadas y cuentas de administración
      del sistema;


      b) crear cuentas específicas que vayan a utilizarse exclusivamente para operaciones de administración
      del sistema, tales como la instalación, la configuración, la gestión o el mantenimiento;


      c) personalizar y restringir en la mayor medida posible los privilegios de la administración del
      sistema;


      d) prever que las cuentas de administración del sistema solo se utilicen para conectarse a los sistemas
      de administración correspondientes.'
    official_text_en: 'The policies referred to in point 11.3.1 shall:


      (a) establish strong identification, authentication such as multi-factor authentication, and authorisation
      procedures for privileged accounts and system administration accounts;


      (b) set up specific accounts to be used for system administration operations exclusively, such as
      installation, configuration, management or maintenance;


      (c) individualise and restrict system administration privileges to the highest extent possible,


      (d) provide that system administration accounts are only used to connect to system administration
      systems.'
    section: Anexo, punto 11.3.2
    source_sha256: 2f1329fb1c5f6bded664d435375388c03d8a73772e6419f339dd3509db78b2d6
- id: 11.3.3
  title_es: Cuentas privilegiadas y cuentas de administración del sistema · punto 11.3.3
  title_en: Privileged accounts and system administration accounts · point 11.3.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán los derechos de acceso de las cuentas privilegiadas
      y las cuentas de administración del sistema a intervalos planificados, los modificarán teniendo
      en cuenta los cambios organizativos y documentarán los resultados de la revisión, incluidos los
      cambios necesarios en los derechos de acceso.
    official_text_en: The relevant entities shall review access rights of privileged accounts and system
      administration accounts at planned intervals and be modified based on organisational changes, and
      shall document the results of the review, including the necessary changes of access rights.
    section: Anexo, punto 11.3.3
    source_sha256: 90dfab1240343ff248031c967dd69cfb15c68d519396c5306bd6d162103e1957
- id: 11.4.1
  title_es: Sistemas de administración · punto 11.4.1
  title_en: Administration systems · point 11.4.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes restringirán el uso de los sistemas de administración
      del sistema de conformidad con la política de control de accesos prevista en el punto 11.1.
    official_text_en: The relevant entities shall restrict and control the use of system administration
      systems in accordance with the access control policy referred to in point 11.1.
    section: Anexo, punto 11.4.1
    source_sha256: bc6ab770a12f003ec5bccdd804fefa557f4eea9d22ff07121d65d82f204bc994
- id: 11.4.2
  title_es: Sistemas de administración · punto 11.4.2
  title_en: Administration systems · point 11.4.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A tal efecto, las entidades pertinentes:


      a) utilizarán únicamente sistemas de administración del sistema a efectos de administración del
      mismo y no para otras operaciones;


      b) separar lógicamente estos sistemas de los programas de aplicación que no se utilicen con fines
      de administración del sistema;


      c) protegerán el acceso a los sistemas de administración del sistema mediante la autenticación y
      el cifrado.'
    official_text_en: 'For that purpose, the relevant entities shall:


      (a) only use system administration systems for system administration purposes, and not for any other
      operations;


      (b) separate logically such systems from application software not used for system administrative
      purposes,


      (c) protect access to system administration systems through authentication and encryption.'
    section: Anexo, punto 11.4.2
    source_sha256: 23f7890bf18092d653c27e786296147a2b3fcd8a2705b31e4a30efaf87822846
- id: 11.5.1
  title_es: Identificación · punto 11.5.1
  title_en: Identification · point 11.5.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes gestionarán todo el ciclo de vida de las identidades de
      los sistemas de redes y de información y sus usuarios.
    official_text_en: The relevant entities shall manage the full life cycle of identities of network
      and information systems and their users.
    section: Anexo, punto 11.5.1
    source_sha256: 9abfb39cb796e5a7a94a54d2d7cada5cb7cbd3a4abb1e4c3efb2b97c047efff3
- id: 11.5.2
  title_es: Identificación · punto 11.5.2
  title_en: Identification · point 11.5.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A tal efecto, las entidades pertinentes:


      a) crearán identidades únicas para los sistemas de redes y de información y sus usuarios;


      b) asociarán la identidad de los usuarios a una sola persona;


      c) se encargarán de la supervisión de las identidades de los sistemas de redes y de información;


      d) realizarán un registro de la gestión de las identidades.'
    official_text_en: 'For that purpose, the relevant entities shall:


      (a) set up unique identities for network and information systems and their users;


      (b) link the identity of users to a single person;


      (c) ensure oversight of identities of network and information systems;


      (d) apply logging to the management of identities.'
    section: Anexo, punto 11.5.2
    source_sha256: 21409948050fa787213e0ac88828dff9bc167d87e311261ca9416bd5ec8531bc
- id: 11.5.3
  title_es: Identificación · punto 11.5.3
  title_en: Identification · point 11.5.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: las entidades pertinentes solo autorizarán las identidades asignadas a múltiples
      personas, como las identidades compartidas, cuando sean necesarias por razones empresariales u operativas
      y estén sujetas a un proceso de aprobación y documentación explícito. Las entidades pertinentes
      tendrán en cuenta las identidades asignadas a múltiples personas en el marco de gestión de riesgos
      de ciberseguridad contemplado en el punto 2.1.
    official_text_en: The relevant entities shall only permit identities assigned to multiple persons,
      such as shared identities, where they are necessary for business or operational reasons and are
      subject to an explicit approval process and documentation. The relevant entities shall take identities
      assigned to multiple persons into account in the cybersecurity risk management framework referred
      to in point 2.1.
    section: Anexo, punto 11.5.3
    source_sha256: 6b6038d6561f7e2aee837733b2cdb292cd2c8ba572b2a62ae68fbf0583a5864c
- id: 11.5.4
  title_es: Identificación · punto 11.5.4
  title_en: Identification · point 11.5.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán periódicamente las identidades correspondientes
      a los sistemas de redes y de información y sus usuarios y, cuando ya no sean necesarias, las desactivarán
      inmediatamente.
    official_text_en: The relevant entities shall regularly review the identities for network and information
      systems and their users and, if no longer needed, deactivate them without delay.
    section: Anexo, punto 11.5.4
    source_sha256: 3a8523f4b170e9f6c4fc98051eb0bc6db37d7b5caa439f56fc3da18d07e04d8d
- id: 11.6.1
  title_es: Autenticación · punto 11.6.1
  title_en: Authentication · point 11.6.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes pondrán en marcha tecnologías y procedimientos de autenticación
      seguros basados en las restricciones de acceso y en la política de control de acceso.
    official_text_en: The relevant entities shall implement secure authentication procedures and technologies
      based on access restrictions and the policy on access control.
    section: Anexo, punto 11.6.1
    source_sha256: 0c040034ff33b5d1b63ac90b21a7c80e896420b757467ca3297d0033d1183bcb
- id: 11.6.2
  title_es: Autenticación · punto 11.6.2
  title_en: Authentication · point 11.6.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A tal efecto, las entidades pertinentes:


      a) garantizarán que la solidez de la autenticación sea adecuada para a la clasificación del activo
      al que se va a acceder;


      b) controlar la asignación a los usuarios y la gestión de información de autenticación secreta mediante
      un proceso que garantice la confidencialidad de la información, incluido el asesoramiento al personal
      sobre el tratamiento adecuado de la información de autenticación;


      c) exigir el cambio de credenciales de autenticación al principio, a intervalos predefinidos y cuando
      se sospeche que las credenciales corren algún peligro;


      d) exigir el restablecimiento de las credenciales y el bloqueo de los usuarios tras un número predefinido
      de intentos de conexión infructuosos;


      e) cerrar las sesiones inactivas tras un período de inactividad predefinido; y


      f) exigir credenciales separadas para obtener un acceso privilegiado o acceder a cuentas de administración.'
    official_text_en: 'For that purpose, the relevant entities shall:


      (a) ensure the strength of authentication is appropriate to the classification of the asset to be
      accessed;


      (b) control the allocation to users and management of secret authentication information by a process
      that ensures the confidentiality of the information, including advising personnel on appropriate
      handling of authentication information;


      (c) require the change of authentication credentials initially, at predefined intervals and upon
      suspicion that the credentials were compromised;


      (d) require the reset of authentication credentials and the blocking of users after a predefined
      number of unsuccessful log-in attempts;


      (e) terminate inactive sessions after a predefined period of inactivity; and


      (f) require separate credentials to access privileged access or administrative accounts.'
    section: Anexo, punto 11.6.2
    source_sha256: 56d621969acb82d6e86fa5f8fa0451b9eb911bfe6713d85a0126c32d09959af2
- id: 11.6.3
  title_es: Autenticación · punto 11.6.3
  title_en: Authentication · point 11.6.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: En la medida de lo posible, las entidades pertinentes utilizarán los métodos de
      autenticación más avanzados, de conformidad con el riesgo evaluado asociado y la clasificación del
      activo al que se vaya a acceder, así como información de autenticación exclusiva.
    official_text_en: The relevant entities shall to the extent feasible use state-of-the-art authentication
      methods, in accordance with the associated assessed risk and the classification of the asset to
      be accessed, and unique authentication information.
    section: Anexo, punto 11.6.3
    source_sha256: 31fe08c80e284067f87d165e46ce4dd02b20b75f3a4dbe77d170248dfdc5538d
- id: 11.6.4
  title_es: Autenticación · punto 11.6.4
  title_en: Authentication · point 11.6.4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán los procedimientos y las tecnologías de autenticación
      a intervalos planificados.
    official_text_en: The relevant entities shall review the authentication procedures and technologies
      at planned intervals.
    section: Anexo, punto 11.6.4
    source_sha256: a0845b8878eda823a7488e2a415796f628bebed34ebdc412bd32fa7e742659e1
- id: 11.7.1
  title_es: Autenticación de múltiples factores · punto 11.7.1
  title_en: Multi-factor authentication · point 11.7.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes velarán por que los usuarios sean autenticados mediante
      múltiples factores de autenticación o mecanismos de autenticación continua para acceder a los sistemas
      de redes y de información la entidad, cuando proceda, de conformidad con la clasificación del activo
      al que se va a acceder.
    official_text_en: The relevant entities shall ensure that users are authenticated by multiple authentication
      factors or continuous authentication mechanisms for accessing the relevant entities’ network and
      information systems, where appropriate, in accordance with the classification of the asset to be
      accessed.
    section: Anexo, punto 11.7.1
    source_sha256: c5ae6a2cdc06e40e8087a342b4a720fd79d783b2312ff630248e2a234bacabae
- id: 11.7.2
  title_es: Autenticación de múltiples factores · punto 11.7.2
  title_en: Multi-factor authentication · point 11.7.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes se asegurarán de que la solidez de la autenticación sea
      adecuada a la clasificación del activo al que se va a acceder.
    official_text_en: The relevant entities shall ensure that the strength of authentication is appropriate
      for the classification of the asset to be accessed.
    section: Anexo, punto 11.7.2
    source_sha256: 2c74e74930638aca189366eb9cb620ecde417639a7ad77a34246d91802308578
- id: 12.1.1
  title_es: Clasificación de activos · punto 12.1.1
  title_en: Asset classification · point 12.1.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A los efectos del artículo 21, apartado 2, letra i), de la Directiva (UE) 2022/2555,
      las entidades pertinentes establecerán los niveles de clasificación de todos los activos, incluida
      la información, que formen parte del ámbito de sus sistemas de redes y de información con relación
      al nivel de protección requerido.
    official_text_en: For the purpose of Article 21(2), point (i) of Directive (EU) 2022/2555, the relevant
      entities shall lay down classification levels of all assets, including information, in scope of
      their network and information systems for the level of protection required.
    section: Anexo, punto 12.1.1
    source_sha256: 7765038b6de6d411d202759d45461ed5aa9ef354d28fc2df92382648e4f067fa
- id: 12.1.2
  title_es: Clasificación de activos · punto 12.1.2
  title_en: Asset classification · point 12.1.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A los efectos del punto 12.1.1, las entidades pertinentes:


      a) establecerán un sistema de niveles de clasificación de los activos;


      b) asociarán todos los activos con un nivel de clasificación, basado en los requisitos de confidencialidad,
      integridad, autenticidad y disponibilidad, para indicar la protección requerida en función de su
      sensibilidad, criticidad, riesgo y valor empresarial;


      c) amoldarán los requisitos de disponibilidad de los activos a los objetivos de entrega y recuperación
      establecidos en sus planes de continuidad de las actividades y de recuperación en caso de catástrofe.'
    official_text_en: 'For the purpose of point 12.1.1, the relevant entities shall:


      (a) lay down a system of classification levels for assets;


      (b) associate all assets with a classification level, based on confidentiality, integrity, authenticity
      and availability requirements, to indicate the protection required according to their sensitivity,
      criticality, risk and business value;


      (c) align the availability requirements of the assets with the delivery and recovery objectives
      set out in their business continuity and disaster recovery plans.'
    section: Anexo, punto 12.1.2
    source_sha256: 0bde6f798948452ca08f37ca53295d8fe73571ed57bc9ada03346975ba19c241
- id: 12.1.3
  title_es: Clasificación de activos · punto 12.1.3
  title_en: Asset classification · point 12.1.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes realizarán revisiones periódicas de los niveles de clasificación
      de los activos y los actualizarán, según proceda.
    official_text_en: The relevant entities shall conduct periodic reviews of the classification levels
      of assets and update them, where appropriate.
    section: Anexo, punto 12.1.3
    source_sha256: d83728a3755a8a1e837c94ae3b54d8cf8a021192cf909cb3ed21edbac4b854cd
- id: 12.2.1
  title_es: Gestión de activos · punto 12.2.1
  title_en: Handling of assets · point 12.2.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes establecerán, pondrán en marcha y aplicarán una política
      para la correcta gestión de los activos, incluida la información, acorde con su política de seguridad
      de las redes y de la información y la pondrán en conocimiento de todo aquel que utilice o gestione
      los activos.
    official_text_en: The relevant entities shall establish, implement and apply a policy for the proper
      handling of assets, including information, in accordance with their network and information security
      policy, and shall communicate the policy on proper handling of assets to anyone who uses or handles
      assets.
    section: Anexo, punto 12.2.1
    source_sha256: d03abdfc60fc4617bc74d4c6b33aa0966738a28203b3c7b498e684b92c53a57d
- id: 12.2.2
  title_es: Gestión de activos · punto 12.2.2
  title_en: Handling of assets · point 12.2.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'Dicha política:


      a) hará referencia a toda la vida útil de los activos, especialmente su adquisición, uso, almacenamiento,
      transporte y eliminación;


      b) establecerá normas para su uso seguro, su almacenamiento seguro, su transporte seguro y la supresión
      y destrucción irreversibles de los activos;


      c) preverá que la transferencia se lleve a cabo de manera segura, de conformidad con el tipo de
      activo que transfiera.'
    official_text_en: 'The policy shall:


      (a) cover the entire life cycle of the assets, including acquisition, use, storage, transportation
      and disposal;


      (b) provide rules on the safe use, safe storage, safe transport, and the irretrievable deletion
      and destruction of the assets;


      (c) provide that the transfer shall take place in a secure manner, in accordance with the type of
      asset to be transferred.'
    section: Anexo, punto 12.2.2
    source_sha256: 071aa2e2cd1f97a356e23a4090e5d0888d67880cf316655067dea0ae02f26708
- id: 12.2.3
  title_es: Gestión de activos · punto 12.2.3
  title_en: Handling of assets · point 12.2.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán la política
      a intervalos planificados o cuando se produzcan incidentes significativos o cambios significativos
      en las operaciones o los riesgos.
    official_text_en: The relevant entities shall review and, where appropriate, update the policy at
      planned intervals and when significant incidents or significant changes to operations or risks occur.
    section: Anexo, punto 12.2.3
    source_sha256: 7836dc2d2c45e587b9a8156c5975b14c1b2f169652524af7e6132447cb1314bf
- id: 12.3.1
  title_es: Política de soportes extraíbles · punto 12.3.1
  title_en: Removable media policy · point 12.3.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes establecerán, pondrán en marcha y aplicarán una política
      relativa a la gestión de soportes de almacenamiento extraíbles y la pondrán en conocimiento de sus
      empleados y de terceros que manipulen soportes de almacenamiento extraíbles en las instalaciones
      de las entidades pertinentes o en otros lugares en los que los soportes extraíbles estén conectados
      a los sistemas de redes y de información de la entidad.
    official_text_en: The relevant entities shall establish, implement and apply a policy on the management
      of removable storage media and communicate it to their employees and third parties who handle removable
      storage media at the relevant entities’ premises or other locations where the removable media is
      connected to the relevant entities’ network and information systems.
    section: Anexo, punto 12.3.1
    source_sha256: 8d90ddd763bc58b7d4fa6c648efe3b27f46b2050da11ebf5e059f5e6e44d5694
- id: 12.3.2
  title_es: Política de soportes extraíbles · punto 12.3.2
  title_en: Removable media policy · point 12.3.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'Dicha política:


      a) preverá una prohibición técnica para la conexión de soportes extraíbles salvo que existan razones
      internas para su uso;


      b) preverá la deshabilitación de la reproducción automática desde dichos soportes y la detección
      de códigos maliciosos en los mismos antes de que se utilicen en los sistemas de las entidades pertinentes;


      c) preverá medidas para controlar y proteger los soportes de almacenamiento extraíbles que contengan
      datos durante el tránsito y el almacenamiento;


      d) según proceda, preverá medidas para la utilización de técnicas criptográficas para proteger los
      datos contenidos en los soportes de almacenamiento extraíbles.'
    official_text_en: 'The policy shall:


      (a) provide for a technical prohibition of the connection of removable media unless there is an
      organisational reason for their use;


      (b) provide for disabling self-execution from such media and scanning the media for malicious code
      before they are used on the relevant entities’ systems;


      (c) provide measures for controlling and protecting portable storage devices containing data while
      in transit and in storage;


      (d) where appropriate, provide measures for the use of cryptographic techniques to protect data
      on removable storage media.'
    section: Anexo, punto 12.3.2
    source_sha256: 76e795a7e02070a96c994df67c1f69b7070447dde29518d1f09d2d71ecaba073
- id: 12.3.3
  title_es: Política de soportes extraíbles · punto 12.3.3
  title_en: Removable media policy · point 12.3.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y, cuando proceda, actualizarán la política
      a intervalos planificados o cuando se produzcan incidentes significativos o cambios significativos
      en las operaciones o los riesgos.
    official_text_en: The relevant entities shall review and, where appropriate, update the policy at
      planned intervals and when significant incidents or significant changes to operations or risks occur.
    section: Anexo, punto 12.3.3
    source_sha256: 830e8618530f0a9b1e577218f20aa0cd0340797e58eaa692af7de97b309e6d69
- id: 12.4.1
  title_es: Inventario de activos · punto 12.4.1
  title_en: Asset inventory · point 12.4.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes crearán y mantendrán un inventario completo, preciso,
      actualizado y coherente de sus activos. Registrarán los cambios en las entradas del inventario de
      manera que puedan rastrearse.
    official_text_en: The relevant entities shall develop and maintain a complete, accurate, up-to-date
      and consistent inventory of their assets. They shall record changes to the entries in the inventory
      in a traceable manner.
    section: Anexo, punto 12.4.1
    source_sha256: 7795ab162c85e00255c523752a1121c241a53a77c507817997d1172c5413fd5a
- id: 12.4.2
  title_es: Inventario de activos · punto 12.4.2
  title_en: Asset inventory · point 12.4.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'La granularidad del inventario de los activos se situará en un nivel adecuado a
      las necesidades de las entidades pertinentes. El inventario incluirá lo siguiente:


      a) la lista de operaciones y servicios y su descripción;


      b) la lista de sistemas de redes y de información y otros activos asociados que sirvan de apoyo
      a las operaciones y servicios de las entidades pertinentes.'
    official_text_en: 'The granularity of the inventory of the assets shall be at a level appropriate
      for the needs of the relevant entities. The inventory shall include the following:


      (a) the list of operations and services and their description,


      (b) the list of network and information systems and other associated assets supporting the relevant
      entities’ operations and services.'
    section: Anexo, punto 12.4.2
    source_sha256: 7ce480a0b3d65bd430e50fdcb189b42b9a4f0e1984a55c7e72062ad895a99b9e
- id: 12.4.3
  title_es: Inventario de activos · punto 12.4.3
  title_en: Asset inventory · point 12.4.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes revisarán y actualizarán periódicamente el inventario
      y sus activos y registrarán el historial de cambios.
    official_text_en: The relevant entities shall regularly review and update the inventory and their
      assets and document the history of changes.
    section: Anexo, punto 12.4.3
    source_sha256: 3975c726af66e3f17e657114f2991b2c81c0b3d4df5783388a17150e77b7ae4f
- id: '12.5'
  title_es: Depósito, devolución o supresión de activos al término de la relación laboral · punto 12.5
  title_en: Deposit, return or deletion of assets upon termination of employment · point 12.5
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes crearán, pondrán en marcha y aplicarán procedimientos
      para que los activos bajo custodia del personal sean depositados, devueltos o suprimidos al término
      de la relación laboral, y documentarán el depósito, la devolución y la supresión de dichos activos.
      Cuando no sea posible el depósito, la devolución o la supresión de activos, las entidades pertinentes
      se asegurarán de que dichos activos ya no puedan acceder a los sistemas de redes y de información
      de la entidad de conformidad con el punto 12.2.2.
    official_text_en: The relevant entities shall establish, implement and apply procedures which ensure
      that their assets which are under custody of personnel are deposited, returned or deleted upon termination
      of employment, and shall document the deposit, return and deletion of those assets. Where the deposit,
      return or deletion of assets is not possible, the relevant entities shall ensure that the assets
      can no longer access the relevant entities’ network and information systems in accordance with point
      12.2.2.
    section: Anexo, punto 12.5
    source_sha256: 89e44b6c0aff6cc10ec4c05dbb1d457c685639df22a04145a7fe5a5571a81fde
- id: 13.1.1
  title_es: Servicios públicos · punto 13.1.1
  title_en: Supporting utilities · point 13.1.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A los efectos del artículo 21, apartado 2, letra c), de la Directiva (UE) 2022/2555,
      las entidades pertinentes evitarán las pérdidas, los daños o riesgos de los sistemas de redes y
      de información o la interrupción de sus operaciones debido al fallo y la interrupción de los servicios
      públicos.
    official_text_en: For the purpose of Article 21(2)(c) of Directive (EU) 2022/2555, the relevant entities
      shall prevent loss, damage or compromise of network and information systems or interruption to their
      operations due to the failure and disruption of supporting utilities.
    section: Anexo, punto 13.1.1
    source_sha256: f4cfdb8af150e1bcb29ddff7e75d941398be6d16074159143caabb3396e12540
- id: 13.1.2
  title_es: Servicios públicos · punto 13.1.2
  title_en: Supporting utilities · point 13.1.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A tal efecto, cuando proceda, las entidades pertinentes:


      a) protegerán las instalaciones de los fallos eléctricos y de otras alteraciones causadas por fallos
      en servicios públicos como la electricidad, las telecomunicaciones, el suministro de agua, el gas,
      las aguas residuales, la ventilación o el aire acondicionado;


      b) considerarán la utilización de redundancias en los servicios de utilidad pública;


      c) protegerán los servicios públicos de electricidad y telecomunicaciones, que transportan datos
      u ofrecen sistemas de redes y de información, frente a la interceptación y los daños;


      d) supervisarán los servicios públicos contemplados en la letra c) e informarán al personal interno
      o externo competente de los sucesos que tengan lugar más allá de los umbrales mínimo y máximo de
      control a que se refiere el punto 13.2.2, letra b), que afecten a los servicios de utilidad pública;


      e) concluirán contratos para el suministro de emergencia con los servicios correspondientes, tales
      como el combustible para el suministro eléctrico de emergencia;


      f) Garantizarán la eficacia continua, supervisarán, mantendrán y probarán el suministro de los sistemas
      de redes y de información necesarios para el funcionamiento del servicio ofrecido, especialmente
      la electricidad, el control de la temperatura y la humedad, las telecomunicaciones y la conexión
      a Internet.'
    official_text_en: 'For that purpose, the relevant entities shall, where appropriate:


      (a) protect facilities from power failures and other disruptions caused by failures in supporting
      utilities such as electricity, telecommunications, water supply, gas, sewage, ventilation and air
      conditioning;


      (b) consider the use of redundancy in utilities services;


      (c) protect utility services for electricity and telecommunications, which transport data or supply
      network and information systems, against interception and damage;


      (d) monitor the utility services referred to in point (c) and report to the competent internal or
      external personnel events outside the minimum and maximum control thresholds referred to in point
      13.2.2(b) affecting the utility services;


      (e) conclude contracts for the emergency supply with corresponding services, such as for the fuel
      for emergency power supply;


      (f) ensure continuous effectiveness, monitor, maintain and test the supply of the network and information
      systems necessary for the operation of the service offered, in particular the electricity, temperature
      and humidity control, telecommunications and Internet connection.'
    section: Anexo, punto 13.1.2
    source_sha256: 433efc61a28c0432151a26f33fe0ba5e60071fe5704890f681b51ffdc55ade52
- id: 13.1.3
  title_es: Servicios públicos · punto 13.1.3
  title_en: Supporting utilities · point 13.1.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes comprobarán, revisarán y, cuando proceda, actualizarán
      las medidas de protección de forma periódica o después de incidentes significativos o cambios significativos
      en las operaciones o los riesgos.
    official_text_en: The relevant entities shall test, review and, where appropriate, update the protection
      measures on a regular basis or following significant incidents or significant changes to operations
      or risks.
    section: Anexo, punto 13.1.3
    source_sha256: 3bcecdb92c8548324c4fb2fb2f1ff32c5b37f15fc6e0f99f9ce09f0299bc22c0
- id: 13.2.1
  title_es: Protección contra las amenazas físicas y medioambientales · punto 13.2.1
  title_en: Protection against physical and environmental threats · point 13.2.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A los efectos del artículo 21, apartado 2, letra e), de la Directiva (UE) 2022/2555,
      las entidades pertinentes evitarán o reducirán las consecuencias de los sucesos que tengan lugar
      a causa de amenazas físicas y medioambientales, como las catástrofes naturales y otras amenazas
      intencionadas o inintencionadas, a partir de los resultados de la evaluación de riesgos realizada
      de conformidad con el punto 2.1.
    official_text_en: For the purpose of Article 21(2)(e) of Directive (EU) 2022/2555, the relevant entities
      shall prevent or reduce the consequences of events originating from physical and environmental threats,
      such as natural disasters and other intentional or unintentional threats, based on the results of
      the risk assessment carried out pursuant to point 2.1.
    section: Anexo, punto 13.2.1
    source_sha256: 78704d6ecaa976d00a3be0b0d79fa725936c1de4337ddedf7f8f18cf07a28232
- id: 13.2.2
  title_es: Protección contra las amenazas físicas y medioambientales · punto 13.2.2
  title_en: Protection against physical and environmental threats · point 13.2.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A tal efecto, cuando proceda, las entidades pertinentes:


      a) diseñarán y pondrán en marcha medidas de protección contra las amenazas físicas y medioambientales;


      b) determinarán umbrales mínimos y máximos de control de las amenazas físicas y medioambientales;


      c) supervisarán los parámetros medioambientales e informarán al personal interno o externo competente
      de los sucesos que tengan lugar más allá de los umbrales mínimo y máximo de control a que se refiere
      la letra b).'
    official_text_en: 'For that purpose, the relevant entities shall, where appropriate:


      (a) design and implement protection measures against physical and environmental threats;


      (b) determine minimum and maximum control thresholds for physical and environmental threats;


      (c) monitor environmental parameters and report to the competent internal or external personnel
      events outside the minimum and maximum control thresholds referred to in point (b).'
    section: Anexo, punto 13.2.2
    source_sha256: e2324a0636cf0c1e06e04909fd98930fffa98114583aaed4baeed9c8b4560d1b
- id: 13.2.3
  title_es: Protección contra las amenazas físicas y medioambientales · punto 13.2.3
  title_en: Protection against physical and environmental threats · point 13.2.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes comprobarán, revisarán y, cuando proceda, actualizarán
      las medidas de protección de forma periódica o después de incidentes significativos o cambios significativos
      en las operaciones o los riesgos.
    official_text_en: The relevant entities shall test, review and, where appropriate, update the protection
      measures against physical and environmental threats on a regular basis or following significant
      incidents or significant changes to operations or risks.
    section: Anexo, punto 13.2.3
    source_sha256: 00a0b0f20b985a398b39fdfde10d6870d2c242f00587e3d7c245c75a6e0835b3
- id: 13.3.1
  title_es: Control de acceso perimetral y físico · punto 13.3.1
  title_en: Perimeter and physical access control · point 13.3.1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: A los efectos del artículo 21, apartado 2, letra i), de la Directiva (UE) 2022/2555,
      las entidades pertinentes evitarán y controlarán el acceso físico no autorizado, los daños y las
      interferencias a sus sistemas de redes y de información.
    official_text_en: For the purpose of Article 21(2)(i) of Directive (EU) 2022/2555, the relevant entities
      shall prevent and monitor unauthorised physical access, damage and interference to their network
      and information systems.
    section: Anexo, punto 13.3.1
    source_sha256: 07449a5831e66c869efea35751475a624264ed8568201cdbaa18cd76b28f1770
- id: 13.3.2
  title_es: Control de acceso perimetral y físico · punto 13.3.2
  title_en: Perimeter and physical access control · point 13.3.2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: 'A tal efecto, las entidades pertinentes:


      a) sobre la base de la evaluación de riesgos realizada con arreglo al punto 2.1, establecerán y
      utilizarán perímetros de seguridad para proteger las zonas en las que se ubican los sistemas de
      redes y de información;


      b) protegerán las zonas a que se refiere la letra a) mediante controles de entrada y puntos de acceso
      adecuados;


      c) diseñarán e implantarán la seguridad física de las oficinas, las salas y las instalaciones;


      d) supervisarán de manera continuada sus instalaciones en lo que se refiere al acceso físico no
      autorizado.'
    official_text_en: 'For that purpose, the relevant entities shall:


      (a) on the basis of the risk assessment carried out pursuant to point 2.1, lay down and use security
      perimeters to protect areas where network and information systems and other associated assets are
      located;


      (b) protect the areas referred to in point (a) by appropriate entry controls and access points;


      (c) design and implement physical security for offices, rooms and facilities,


      (d) continuously monitor their premises for unauthorised physical access.'
    section: Anexo, punto 13.3.2
    source_sha256: 2b57e9bde15d37beadabdb463e581931ff0c1ab4fa9206ad6718e090d28a6701
- id: 13.3.3
  title_es: Control de acceso perimetral y físico · punto 13.3.3
  title_en: Perimeter and physical access control · point 13.3.3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32024R2690#anx_1
  attributes:
    official_text_es: Las entidades pertinentes comprobarán, revisarán y, cuando proceda, actualizarán
      las medidas de control del acceso físico de forma periódica o después de incidentes significativos
      o cambios significativos en las operaciones o los riesgos.
    official_text_en: The relevant entities shall test, review and, where appropriate, update the physical
      access control measures on a regular basis or following significant incidents or significant changes
      to operations or risks.
    section: Anexo, punto 13.3.3
    source_sha256: 2fc1c0f76c27c1c46ce19955a579d4c6d511e929dd811dc31db7084c930fc4bd
