id: nis2_ir_2024_2690
name: NIS2 · Reglamento de Ejecución (UE) 2024/2690
version: 2024-2690.draft2
jurisdiction: EU; applies to the relevant entities listed in its Article 1
source: https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32024R2690
license_notes: Official Journal text (ES and EN) reproduced from the EU Publications Office; reuse of
  EU documents is authorised under Commission Decision 2011/833/EU, © European Union. Article 2 and the
  161 points of the Annex are imported; coverage.yaml accounts for every other unit.
status: draft
attributes:
  content_state: partial
  assessment_enabled: false
  summary_es: 'Los requisitos técnicos y metodológicos de las medidas del artículo 21, apartado 2, de
    NIS2: el artículo 2 y los 161 puntos del anexo, en español e inglés. Mapeos candidatos pendientes
    de revisión cualificada. No es una evaluación.'
  summary_en: 'The technical and methodological requirements of the measures in Article 21(2) of NIS2:
    Article 2 and the 161 points of the Annex, in Spanish and English. Candidate mappings await qualified
    review. Not an assessment.'
  scope_es: 'Se aplica a las entidades pertinentes de su artículo 1: los proveedores de servicios de DNS,
    los registros de nombres de dominio de primer nivel, los proveedores de servicios de computación en
    nube, los proveedores de servicios de centros de datos, los proveedores de redes de distribución de
    contenidos, los proveedores de servicios gestionados, los proveedores de servicios de seguridad gestionados,
    así como los proveedores de mercados en línea, de motores de búsqueda en línea y de plataformas de
    servicios de redes sociales, y los prestadores de servicios de confianza.'
  scope_en: 'It applies to the relevant entities in its Article 1: DNS service providers, TLD name registries,
    cloud computing service providers, data centre service providers, content delivery network providers,
    managed service providers, managed security service providers, providers of online market places,
    of online search engines and of social networking services platforms, and trust service providers.'
  applicability_es: El artículo 2 pide aplicar los requisitos de forma adecuada a los riesgos, según la
    exposición, el tamaño y la probabilidad y gravedad de los incidentes. Cuando el anexo dice «según
    proceda», «cuando proceda» o «en la medida de lo posible» y la entidad decide no aplicar un requisito,
    debe dejar escrito su razonamiento.
  applicability_en: Article 2 asks for the requirements to be applied in a way appropriate to the risks,
    taking account of exposure, size, and the likelihood and severity of incidents. Where the Annex says
    ‘where appropriate’, ‘where applicable’ or ‘to the extent feasible’ and the entity decides not to
    apply a requirement, it must document its reasoning.
  limitations_es: Importados el artículo 2 y los 161 puntos del anexo. Los criterios de incidente significativo
    (artículos 3 a 14) no se importan; la cobertura lo explica. Confirma con tu revisor si tu entidad
    está entre las del artículo 1.
  limitations_en: Article 2 and the 161 points of the Annex are imported. The criteria for significant
    incidents (Articles 3 to 14) are not; the coverage explains why. Confirm with your reviewer whether
    your entity is among those in Article 1.
