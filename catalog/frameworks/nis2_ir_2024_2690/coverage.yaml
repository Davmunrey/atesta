source: Commission Implementing Regulation (EU) 2024/2690, OJ L, 2024/2690, 18.10.2024 (CELEX 32024R2690)
entries:
- units:
  - art1
  status: excluded
  reason_es: 'Objeto: enumera las entidades pertinentes a las que se aplica el Reglamento. Sirve para
    decidir si la organización está en su ámbito; no es una medida. La ficha del marco lo resume.'
  reason_en: 'Subject matter: it lists the relevant entities the Regulation applies to. It decides whether
    the organization is in scope; it is not a measure. The framework summary states it.'
