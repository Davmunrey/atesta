  summary_es: A 24 de noviembre de 2026, la Oficina de Publicaciones de la UE no lista ninguna medida
    nacional notificada por España para la Directiva (UE) 2022/2555. En la legislación consolidada del
    BOE, tres normas citan la Directiva y ninguna figura entre las medidas notificadas. El Real Decreto
    443/2024 (artículo 28.1) remite la notificación de incidentes al Real Decreto-ley 12/2018 y al Real
    Decreto 43/2021, o a la normativa que los sustituya fruto de la transposición. Ninguna fuente oficial
    consultada designa autoridades competentes ni CSIRT para España en virtud de la Directiva; por eso
    no se lista ninguno.
  summary_en: As of 24 November 2026, the EU Publications Office lists no national measure notified by
    Spain for Directive (EU) 2022/2555. In the BOE consolidated legislation, three texts cite the Directive
    and none is among the notified measures. Royal Decree 443/2024 (Article 28(1)) refers incident notification
    to Royal Decree-law 12/2018 and Royal Decree 43/2021, or to the rules that replace them as a result
    of transposition. No official source checked designates competent authorities or CSIRTs for Spain
    under the Directive, so none is listed.
  references:
  - id: BOE-A-2024-8715
    title: Real Decreto 443/2024, de 30 de abril, por el que se aprueba el Esquema Nacional de Seguridad
      de redes y servicios 5G.
    url: https://www.boe.es/buscar/act.php?id=BOE-A-2024-8715
    section: Artículo 28. Prestación de servicios de respuesta a incidentes de seguridad.
    quote_es: 1. La notificación de incidentes será llevada a cabo según los términos establecidos en
      el Real Decreto-ley 12/2018, de 7 de septiembre, de seguridad de las redes y sistemas de información
      y en el Real Decreto 43/2021, de 26 de enero, por el que se desarrolla el Real Decreto-ley 12/2018,
      de 7 de septiembre, de seguridad de las redes y sistemas de información, o en base a la normativa
      que pudiera remplazar a esta regulación fruto de la transposición de la Directiva (UE) 2022/2555
      del Parlamento Europeo y del Consejo, de 14 de diciembre de 2022, relativa a las medidas destinadas
      a garantizar un elevado nivel común de ciberseguridad en toda la Unión.
  - id: BOE-A-2025-16214
    title: Orden PJC/845/2025, de 29 de julio, por la que se publica el Acuerdo del Consejo de Seguridad
      Nacional de 14 de julio de 2025, por el que se aprueba la Estrategia de Seguridad Aeroespacial Nacional.
    url: https://www.boe.es/buscar/act.php?id=BOE-A-2025-16214
    section: CAPÍTULO 3
    quote_es: Es necesario enfatizar la importancia de una adecuada concienciación en ciberseguridad y
      la adopción de buenas prácticas y procedimientos de actualización de seguridad. Este esfuerzo permitirá
      establecer un esquema de auditoría y certificación basado en la Directiva (UE) 2022/2555 (NIS2),
      que garantice la aplicación de medidas para la gestión de riesgos de ciberseguridad y obligaciones
      de notificación de incidentes para los operadores aeronáuticos.
  - id: BOE-A-2026-16757
    title: Orden TES/804/2026, de 23 de julio, por la que se aprueba la Política de Seguridad de la Información
      y de los Servicios en el ámbito de la administración digital del Ministerio de Trabajo y Economía
      Social y se crea el Comité de Seguridad de las Tecnologías de la Información y las Comunicaciones
      del departamento.
    url: https://www.boe.es/buscar/act.php?id=BOE-A-2026-16757
    section: Preámbulo
    quote_es: Respecto al marco normativo europeo, la Directiva (UE) 2022/2555 del Parlamento Europeo
      y del Consejo, de 14 de diciembre, relativa a las medidas destinadas a garantizar un elevado nivel
      común de ciberseguridad en toda la Unión, por la que se modifican el Reglamento (UE) n.º 910/2014
      y la Directiva (UE) 2018/1972 y por la que se deroga la Directiva (UE) 2016/1148, en adelante, Directiva
      NIS2, establece obligaciones de ciberseguridad para los Estados miembros, medidas para la gestión
      de riesgos de ciberseguridad y obligaciones de notificación para las entidades comprendidas en su
      ámbito de aplicación, así como obligaciones referentes al intercambio de información sobre ciberseguridad
      y obligaciones de supervisión y ejecución para los Estados miembros.
