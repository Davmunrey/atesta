  - art26
  status: excluded
  reason_es: 'Objeto, ámbito, entidades, definiciones y jurisdicción: sirven para decidir si la entidad
    está sujeta y cómo; no son medidas que se evalúen. El artículo 3, apartado 4, pide facilitar datos
    al registro nacional: depende de la transposición española.'
  reason_en: 'Subject matter, scope, entities, definitions and jurisdiction: they decide whether and how
    the entity is in scope; they are not measures to assess. Article 3(4) asks for data for the national
    registry, which depends on the Spanish transposition.'
