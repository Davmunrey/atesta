  status: excluded
  reason_es: 'Respuesta del CSIRT, información al público y a otros Estados, informes a ENISA y actos
    de ejecución: obligaciones de autoridades y de la Comisión.'
  reason_en: 'CSIRT response, informing the public and other States, reports to ENISA and implementing
    acts: duties of authorities and the Commission.'
- units:
  - art24
  - art25
  status: excluded
  reason_es: 'Certificación y normalización: el Estado miembro puede exigir productos certificados; depende
    de la transposición española.'
  reason_en: 'Certification and standardisation: a Member State may require certified products; this depends
    on the Spanish transposition.'
- units:
  - art27
  - art28
  status: excluded
  reason_es: 'Registro de entidades y datos de registro de dominios: afectan a tipos concretos de entidades
    digitales (DNS, dominios, nube, centros de datos, proveedores de servicios gestionados y otros). Pendiente
    para una versión posterior.'
  reason_en: 'Registry of entities and domain registration data: they apply to specific digital entity
    types (DNS, domains, cloud, data centres, managed service providers and others). Planned for a later
    version.'
