      (c) business continuity, such as backup management and disaster recovery, and crisis management;'
    section: Artículo 21, apartado 2, letra c)
    source_sha256: 7fe49850935eaaa90c3a9d511467b9094455367658cc9a75bcff5e3f4cecc3c3
- id: art21.2d
  title_es: La seguridad de la cadena de suministro, incluidos los aspectos de seguridad relativos a las
    relaciones entre cada entidad y sus proveedores o prestadores de servicios directos
  title_en: Supply chain security, including security-related aspects concerning the relationships between
    each entity and its direct suppliers or service providers
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_21
  attributes:
    official_text_es: '2. Las medidas a que se hace referencia en el apartado 1 se fundamentarán en un
