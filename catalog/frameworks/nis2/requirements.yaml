- id: art21.2i
  title_es: La seguridad de los recursos humanos, las políticas de control de acceso y la gestión de activos
  title_en: Human resources security, access control policies and asset management
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_21
  attributes:
