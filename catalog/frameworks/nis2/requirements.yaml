      (d) supply chain security, including security-related aspects concerning the relationships between
      each entity and its direct suppliers or service providers;'
    section: Artículo 21, apartado 2, letra d)
    source_sha256: 9f261449d01e586b54a2733a84e3184f23d9fa87f0d598770adfd1e3d777b792
- id: art21.2e
  title_es: La seguridad en la adquisición, el desarrollo y el mantenimiento de sistemas de redes y de
