requirements:
- id: art20.1
  title_es: Gobernanza · apartado 1
  title_en: Governance · paragraph 1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_20
  attributes:
    official_text_es: '1. Los Estados miembros velarán por que los órganos de dirección de las entidades
      esenciales e importantes aprueben las medidas para la gestión de riesgos de ciberseguridad adoptadas
      por dichas entidades para dar cumplimiento al artículo 21, supervisen su puesta en práctica y respondan
      por el incumplimiento por parte de las entidades de dicho artículo.


      La aplicación del presente apartado se entenderá sin perjuicio del Derecho nacional relativo a las
      normas sobre responsabilidad aplicables a las instituciones públicas, así como a la responsabilidad
      de los funcionarios públicos y los cargos electos o designados.'
    official_text_en: '1. Member States shall ensure that the management bodies of essential and important
      entities approve the cybersecurity risk-management measures taken by those entities in order to
      comply with Article 21, oversee its implementation and can be held liable for infringements by the
      entities of that Article.


      The application of this paragraph shall be without prejudice to national law as regards the liability
      rules applicable to public institutions, as well as the liability of public servants and elected
      or appointed officials.'
    section: Artículo 20, apartado 1
    source_sha256: 897ac46c76bd12e65153f63cb259e2c0de32f425edafbcfdf2cbb1221c9d54fa
- id: art20.2
  title_es: Gobernanza · apartado 2
  title_en: Governance · paragraph 2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_20
  attributes:
    official_text_es: 2. Los Estados miembros garantizarán que los miembros de los órganos de dirección
      de las entidades esenciales e importantes deban asistir a formaciones y alentarán a estas entidades
      para que ofrezcan formaciones similares a sus empleados periódicamente al objeto de adquirir conocimientos
      y destrezas suficientes que les permitan detectar riesgos y evaluar las prácticas de gestión de
      riesgos de ciberseguridad y su repercusión en los servicios proporcionados por la entidad.
    official_text_en: 2. Member States shall ensure that the members of the management bodies of essential
      and important entities are required to follow training, and shall encourage essential and important
      entities to offer similar training to their employees on a regular basis, in order that they gain
      sufficient knowledge and skills to enable them to identify risks and assess cybersecurity risk-management
      practices and their impact on the services provided by the entity.
    section: Artículo 20, apartado 2
    source_sha256: d2851d082a3619efacf0f4b1c74940d95d3bcafeb1155b39f5d748f3d67ec38e
- id: art21.1
  title_es: Medidas para la gestión de riesgos de ciberseguridad · apartado 1
  title_en: Cybersecurity risk-management measures · paragraph 1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_21
  attributes:
    official_text_es: '1. Los Estados miembros velarán por que las entidades esenciales e importantes
      tomen las medidas técnicas, operativas y de organización adecuadas y proporcionadas para gestionar
      los riesgos que se planteen para la seguridad de los sistemas de redes y de información que utilizan
      dichas entidades en sus operaciones o en la prestación de sus servicios y prevenir o minimizar las
      repercusiones de los incidentes en los destinatarios de sus servicios y en otros servicios.


      Teniendo en cuenta la situación y, en su caso, las normas europeas e internacionales pertinentes,
      así como el coste de su aplicación, las medidas a que se refiere el párrafo primero garantizarán
      un nivel de seguridad de los sistemas de redes y de información adecuado en relación con los riesgos
      planteados. Al evaluar la proporcionalidad de dichas medidas, se tendrá debidamente en cuenta el
      grado de exposición de la entidad a los riesgos, el tamaño de la entidad y la probabilidad de que
      se produzcan incidentes y su gravedad, incluidas sus repercusiones sociales y económicas.'
    official_text_en: '1. Member States shall ensure that essential and important entities take appropriate
      and proportionate technical, operational and organisational measures to manage the risks posed to
      the security of network and information systems which those entities use for their operations or
      for the provision of their services, and to prevent or minimise the impact of incidents on recipients
      of their services and on other services.


      Taking into account the state-of-the-art and, where applicable, relevant European and international
      standards, as well as the cost of implementation, the measures referred to in the first subparagraph
      shall ensure a level of security of network and information systems appropriate to the risks posed.
      When assessing the proportionality of those measures, due account shall be taken of the degree of
      the entity’s exposure to risks, the entity’s size and the likelihood of occurrence of incidents
      and their severity, including their societal and economic impact.'
    section: Artículo 21, apartado 1
    source_sha256: dfa705a146385998e9b7f58ab7a13b63b7fc46f47b5302144c43e1f7ce85ef0f
- id: art21.2a
  title_es: Las políticas de seguridad de los sistemas de información y análisis de riesgos
  title_en: Policies on risk analysis and information system security
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_21
  attributes:
    official_text_es: '2. Las medidas a que se hace referencia en el apartado 1 se fundamentarán en un
      enfoque basado en todos los peligros que tenga por objeto proteger los sistemas de redes y de información
      y el entorno físico de dichos sistemas frente a incidentes, e incluirán al menos los siguientes
      elementos:


      a) las políticas de seguridad de los sistemas de información y análisis de riesgos;'
    official_text_en: '2. The measures referred to in paragraph 1 shall be based on an all-hazards approach
      that aims to protect network and information systems and the physical environment of those systems
      from incidents, and shall include at least the following:


      (a) policies on risk analysis and information system security;'
    section: Artículo 21, apartado 2, letra a)
    source_sha256: 63fcbba0ed029a67d89a73052a01504b055717e1afc80e0c56d4b4102b99431a
- id: art21.2b
  title_es: La gestión de incidentes
  title_en: Incident handling
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_21
  attributes:
    official_text_es: '2. Las medidas a que se hace referencia en el apartado 1 se fundamentarán en un
      enfoque basado en todos los peligros que tenga por objeto proteger los sistemas de redes y de información
      y el entorno físico de dichos sistemas frente a incidentes, e incluirán al menos los siguientes
      elementos:


      b) la gestión de incidentes;'
    official_text_en: '2. The measures referred to in paragraph 1 shall be based on an all-hazards approach
      that aims to protect network and information systems and the physical environment of those systems
      from incidents, and shall include at least the following:


      (b) incident handling;'
    section: Artículo 21, apartado 2, letra b)
    source_sha256: f357fe17ff099e2300e0b68920da587adb56ee515d1413edf81cce9ba58a8dd4
- id: art21.2c
  title_es: La continuidad de las actividades, como la gestión de copias de seguridad y la recuperación
