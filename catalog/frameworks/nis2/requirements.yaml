      e) la seguridad en la adquisición, el desarrollo y el mantenimiento de sistemas de redes y de información,
      incluida la gestión y divulgación de las vulnerabilidades;'
    official_text_en: '2. The measures referred to in paragraph 1 shall be based on an all-hazards approach
      that aims to protect network and information systems and the physical environment of those systems
      from incidents, and shall include at least the following:


      (e) security in network and information systems acquisition, development and maintenance, including
      vulnerability handling and disclosure;'
    section: Artículo 21, apartado 2, letra e)
    source_sha256: d8e1d95adc3608b9c3446c2920eedc4993e3a78e83588f6d0c9589241366c4d5
- id: art21.2f
  title_es: Las políticas y los procedimientos para evaluar la eficacia de las medidas para la gestión
