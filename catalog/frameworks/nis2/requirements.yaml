      y el entorno físico de dichos sistemas frente a incidentes, e incluirán al menos los siguientes
      elementos:


      i) la seguridad de los recursos humanos, las políticas de control de acceso y la gestión de activos;'
    official_text_en: '2. The measures referred to in paragraph 1 shall be based on an all-hazards approach
      that aims to protect network and information systems and the physical environment of those systems
      from incidents, and shall include at least the following:


      (i) human resources security, access control policies and asset management;'
    section: Artículo 21, apartado 2, letra i)
    source_sha256: e29bfa30e818d52ca0ce2628351cf8ba8884e4391d98fc4dd97388157c341689
- id: art21.2j
  title_es: El uso de soluciones de autenticación multifactorial o de autenticación continua, comunicaciones
    de voz, vídeo y texto seguras y sistemas seguros de comunicaciones de emergencia en la entidad, cuando
    proceda
  title_en: The use of multi-factor authentication or continuous authentication solutions, secured voice,
    video and text communications and secured emergency communication systems within the entity, where
    appropriate
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_21
  attributes:
    official_text_es: '2. Las medidas a que se hace referencia en el apartado 1 se fundamentarán en un
      enfoque basado en todos los peligros que tenga por objeto proteger los sistemas de redes y de información
      y el entorno físico de dichos sistemas frente a incidentes, e incluirán al menos los siguientes
      elementos:


      j) el uso de soluciones de autenticación multifactorial o de autenticación continua, comunicaciones
      de voz, vídeo y texto seguras y sistemas seguros de comunicaciones de emergencia en la entidad,
      cuando proceda.'
    official_text_en: '2. The measures referred to in paragraph 1 shall be based on an all-hazards approach
      that aims to protect network and information systems and the physical environment of those systems
      from incidents, and shall include at least the following:


      (j) the use of multi-factor authentication or continuous authentication solutions, secured voice,
      video and text communications and secured emergency communication systems within the entity, where
      appropriate.'
    section: Artículo 21, apartado 2, letra j)
    source_sha256: e0990bc8306cafc25d83ebba7d97cd332c1fa6cea1d9c3241e7699133297da34
- id: art21.3
  title_es: Medidas para la gestión de riesgos de ciberseguridad · apartado 3
  title_en: Cybersecurity risk-management measures · paragraph 3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_21
  attributes:
    official_text_es: 3. Los Estados miembros velarán por que, al estudiar la idoneidad de las medidas
      a que se refiere el apartado 2, letra d), del presente artículo, las entidades tengan en cuenta
      las vulnerabilidades específicas de cada proveedor y prestador de servicios directo y la calidad
      general de los productos y las prácticas en materia de ciberseguridad de sus proveedores y prestadores
      de servicios, incluidos sus procedimientos de desarrollo seguro. Los Estados miembros también velarán
      por que, al estudiar la idoneidad de las medidas a que se refiere el apartado 2, letra d), las entidades
      deban tener en cuenta los resultados de las evaluaciones coordinadas de los riesgos de seguridad
      de las cadenas de suministro críticas realizadas de conformidad con el artículo 22, apartado 1.
    official_text_en: 3. Member States shall ensure that, when considering which measures referred to
      in paragraph 2, point (d), of this Article are appropriate, entities take into account the vulnerabilities
      specific to each direct supplier and service provider and the overall quality of products and cybersecurity
      practices of their suppliers and service providers, including their secure development procedures.
      Member States shall also ensure that, when considering which measures referred to in that point
      are appropriate, entities are required to take into account the results of the coordinated security
      risk assessments of critical supply chains carried out in accordance with Article 22(1).
    section: Artículo 21, apartado 3
    source_sha256: 0d335750a39c91afda8a70c2fbf018b910bcff57de6b2c68e2e5317218e1be9b
- id: art21.4
  title_es: Medidas para la gestión de riesgos de ciberseguridad · apartado 4
  title_en: Cybersecurity risk-management measures · paragraph 4
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_21
  attributes:
    official_text_es: 4. Los Estados miembros se asegurarán de que cuando una entidad constate que no
      cumple las medidas previstas en el apartado 2, adopte, sin demora indebida, todas las medidas correctoras
      apropiadas y proporcionadas necesarias.
    official_text_en: 4. Member States shall ensure that an entity that finds that it does not comply
      with the measures provided for in paragraph 2 takes, without undue delay, all necessary, appropriate
      and proportionate corrective measures.
    section: Artículo 21, apartado 4
    source_sha256: 29693eb55258366f097cbf9b587e26659b5618c334617715cee75093e1aa865e
- id: art23.1
  title_es: Obligaciones de notificación · apartado 1
  title_en: Reporting obligations · paragraph 1
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_23
  attributes:
    official_text_es: '1. Cada Estado miembro velará por que las entidades esenciales e importantes notifiquen,
      sin demora indebida, a su CSIRT o, en su caso, a su autoridad competente de conformidad con el apartado
      4 cualquier incidente que tenga un impacto significativo en la prestación de sus servicios según
      se contempla en el apartado 3 (incidente significativo). Cuando proceda, las entidades afectadas
      notificarán, sin demora indebida, a los destinatarios de sus servicios los incidentes significativos
      susceptibles de afectar negativamente a la prestación de dichos servicios. Cada Estado miembro garantizará
      que dichas entidades notifiquen, entre otros detalles, cualquier información que permita al CSIRT
      o, en su caso, a la autoridad competente determinar las repercusiones transfronterizas del incidente.
      El mero acto de notificar no elevará la responsabilidad de la entidad notificante.


      Cuando las entidades afectadas notifiquen a la autoridad competente un incidente significativo con
      arreglo al párrafo primero, el Estado miembro velará por que dicha autoridad competente transmita
      la notificación al CSIRT en el momento de su recepción.


      En caso de un incidente significativo transfronterizo o intersectorial, los Estados miembros velarán
      por que se facilite a sus puntos de contacto únicos, a su debido tiempo, la información pertinente
      notificada de conformidad con el apartado 4.'
    official_text_en: '1. Each Member State shall ensure that essential and important entities notify,
      without undue delay, its CSIRT or, where applicable, its competent authority in accordance with
      paragraph 4 of any incident that has a significant impact on the provision of their services as
      referred to in paragraph 3 (significant incident). Where appropriate, entities concerned shall notify,
      without undue delay, the recipients of their services of significant incidents that are likely to
      adversely affect the provision of those services. Each Member State shall ensure that those entities
      report, inter alia, any information enabling the CSIRT or, where applicable, the competent authority
      to determine any cross-border impact of the incident. The mere act of notification shall not subject
      the notifying entity to increased liability.


      Where the entities concerned notify the competent authority of a significant incident under the
      first subparagraph, the Member State shall ensure that that competent authority forwards the notification
      to the CSIRT upon receipt.


      In the case of a cross-border or cross-sectoral significant incident, Member States shall ensure
      that their single points of contact are provided in due time with relevant information notified
      in accordance with paragraph 4.'
    section: Artículo 23, apartado 1
    source_sha256: 20cef7159150b9801b0765c02c8ea442cfb3877e9621652e42486fa1b99ad40e
- id: art23.2
  title_es: Obligaciones de notificación · apartado 2
  title_en: Reporting obligations · paragraph 2
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_23
  attributes:
    official_text_es: 2. Cuando proceda, los Estados miembros garantizarán que las entidades esenciales
      e importantes comuniquen, sin demora indebida, a los destinatarios de sus servicios que puedan verse
      afectados por una ciberamenaza significativa las medidas o soluciones que dichos destinatarios pueden
      aplicar en respuesta a la amenaza. Cuando proceda, las entidades notificarán asimismo la propia
      ciberamenaza significativa a esos destinatarios.
    official_text_en: 2. Where applicable, Member States shall ensure that essential and important entities
      communicate, without undue delay, to the recipients of their services that are potentially affected
      by a significant cyber threat any measures or remedies that those recipients are able to take in
      response to that threat. Where appropriate, the entities shall also inform those recipients of the
      significant cyber threat itself.
    section: Artículo 23, apartado 2
    source_sha256: 5019997b4752adc2c27be3c0e549fe2ef2220237693c7c256874d25f2f432d43
- id: art23.3
  title_es: Obligaciones de notificación · apartado 3
  title_en: Reporting obligations · paragraph 3
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_23
  attributes:
    official_text_es: '3. Un incidente se considerará significativo si:


      a) ha causado o puede causar graves perturbaciones operativas de los servicios o pérdidas económicas
      para la entidad afectada;


      b) ha afectado o puede afectar a otras personas físicas o jurídicas al causar perjuicios materiales
      o inmateriales considerables.'
    official_text_en: '3. An incident shall be considered to be significant if:


      (a) it has caused or is capable of causing severe operational disruption of the services or financial
      loss for the entity concerned;


      (b) it has affected or is capable of affecting other natural or legal persons by causing considerable
      material or non-material damage.'
    section: Artículo 23, apartado 3
    source_sha256: e1e1cd6cef5fe65b25f62db0ccfdaa253e920bbcfdd86c78598b153387a04cf5
- id: art23.4a
  title_es: Obligaciones de notificación · apartado 4, letra a)
  title_en: Reporting obligations · paragraph 4, point (a)
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_23
  attributes:
    official_text_es: '4. Los Estados miembros velarán por que, a los efectos de la notificación con arreglo
      al apartado 1, las entidades afectadas presenten al CSIRT o, en su caso, a la autoridad competente:


      a) sin demora indebida y, en cualquier caso, en el plazo de veinticuatro horas desde que se haya
      tenido constancia del incidente significativo, una alerta temprana en la que se indicará, cuando
      proceda, si cabe sospechar que el incidente significativo responde a una acción ilícita o malintencionada
      o puede tener repercusiones transfronterizas;'
    official_text_en: '4. Member States shall ensure that, for the purpose of notification under paragraph
      1, the entities concerned submit to the CSIRT or, where applicable, the competent authority:


      (a) without undue delay and in any event within 24 hours of becoming aware of the significant incident,
      an early warning, which, where applicable, shall indicate whether the significant incident is suspected
      of being caused by unlawful or malicious acts or could have a cross-border impact;'
    section: Artículo 23, apartado 4, letra a)
    source_sha256: e2596ae89eccd0954f3850e9d21ecda12fc123ce90e2c627a2ba90d75e884c95
- id: art23.4b
  title_es: Obligaciones de notificación · apartado 4, letra b)
  title_en: Reporting obligations · paragraph 4, point (b)
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_23
  attributes:
    official_text_es: '4. Los Estados miembros velarán por que, a los efectos de la notificación con arreglo
      al apartado 1, las entidades afectadas presenten al CSIRT o, en su caso, a la autoridad competente:


      b) sin demora indebida y, en cualquier caso, en el plazo de setenta y dos horas desde que se haya
      tenido constancia del incidente significativo, una notificación del incidente en la que se actualizará,
      cuando proceda, la información contemplada en la letra a) y se expondrá una evaluación inicial del
      incidente significativo, incluyendo su gravedad e impacto, así como indicadores de compromiso, cuando
      estén disponibles;


      Como excepción a lo dispuesto en la letra b) del párrafo primero, un prestador de servicios de confianza,
      con respecto a los incidentes significativos que afecten a la prestación de sus servicios de confianza,
      lo notificará al CSIRT o, en su caso, a la autoridad competente, sin demora indebida y, en cualquier
      caso, en un plazo de veinticuatro horas desde que haya tenido constancia del incidente significativo.'
    official_text_en: '4. Member States shall ensure that, for the purpose of notification under paragraph
      1, the entities concerned submit to the CSIRT or, where applicable, the competent authority:


      (b) without undue delay and in any event within 72 hours of becoming aware of the significant incident,
      an incident notification, which, where applicable, shall update the information referred to in point
      (a) and indicate an initial assessment of the significant incident, including its severity and impact,
      as well as, where available, the indicators of compromise;


      By way of derogation from the first subparagraph, point (b), a trust service provider shall, with
      regard to significant incidents that have an impact on the provision of its trust services, notify
      the CSIRT or, where applicable, the competent authority, without undue delay and in any event within
      24 hours of becoming aware of the significant incident.'
    section: Artículo 23, apartado 4, letra b)
    source_sha256: c224be5678aeb35454748e7f2e4cfe7775408745ddefc1c6aedbb760559ef41e
- id: art23.4c
  title_es: Obligaciones de notificación · apartado 4, letra c)
  title_en: Reporting obligations · paragraph 4, point (c)
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_23
  attributes:
    official_text_es: '4. Los Estados miembros velarán por que, a los efectos de la notificación con arreglo
      al apartado 1, las entidades afectadas presenten al CSIRT o, en su caso, a la autoridad competente:


      c) a instancias de un CSIRT o, en su caso, de la autoridad competente, un informe intermedio con
      las actualizaciones pertinentes sobre la situación;'
    official_text_en: '4. Member States shall ensure that, for the purpose of notification under paragraph
      1, the entities concerned submit to the CSIRT or, where applicable, the competent authority:


      (c) upon the request of a CSIRT or, where applicable, the competent authority, an intermediate report
      on relevant status updates;'
    section: Artículo 23, apartado 4, letra c)
    source_sha256: 1784782f9728d65b528cb2001a97c6685984cb4c6902fc5a80a2bef821be9093
- id: art23.4d
  title_es: Obligaciones de notificación · apartado 4, letra d)
  title_en: Reporting obligations · paragraph 4, point (d)
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_23
  attributes:
    official_text_es: '4. Los Estados miembros velarán por que, a los efectos de la notificación con arreglo
      al apartado 1, las entidades afectadas presenten al CSIRT o, en su caso, a la autoridad competente:


      d) un informe final, a más tardar un mes después de presentar la notificación del incidente contemplada
      en la letra b), en el que se recojan los siguientes elementos: i) una descripción detallada del
      incidente, incluyendo su gravedad e impacto; ii) el tipo de amenaza o causa principal que probablemente
      haya desencadenado el incidente; iii) las medidas paliativas aplicadas y en curso; iv) cuando proceda,
      las repercusiones transfronterizas del incidente;


      i) una descripción detallada del incidente, incluyendo su gravedad e impacto;


      ii) el tipo de amenaza o causa principal que probablemente haya desencadenado el incidente;


      iii) las medidas paliativas aplicadas y en curso;


      iv) cuando proceda, las repercusiones transfronterizas del incidente;'
    official_text_en: '4. Member States shall ensure that, for the purpose of notification under paragraph
      1, the entities concerned submit to the CSIRT or, where applicable, the competent authority:


      (d) a final report not later than one month after the submission of the incident notification under
      point (b), including the following: (i) a detailed description of the incident, including its severity
      and impact; (ii) the type of threat or root cause that is likely to have triggered the incident;
      (iii) applied and ongoing mitigation measures; (iv) where applicable, the cross-border impact of
      the incident;


      (i) a detailed description of the incident, including its severity and impact;


      (ii) the type of threat or root cause that is likely to have triggered the incident;


      (iii) applied and ongoing mitigation measures;


      (iv) where applicable, the cross-border impact of the incident;'
    section: Artículo 23, apartado 4, letra d)
    source_sha256: 7fd612333477af57ac03aa13c655f2b9108174a45c98f1ceac5eaba751e2eaa9
- id: art23.4e
  title_es: Obligaciones de notificación · apartado 4, letra e)
  title_en: Reporting obligations · paragraph 4, point (e)
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022L2555#art_23
  attributes:
    official_text_es: '4. Los Estados miembros velarán por que, a los efectos de la notificación con arreglo
      al apartado 1, las entidades afectadas presenten al CSIRT o, en su caso, a la autoridad competente:


      e) en el caso de que el incidente siga en curso en el momento de la presentación del informe final
      contemplado en la letra d), los Estados miembros velarán por que las entidades afectadas presenten
      un informe de situación en ese momento y un informe final en el plazo de un mes a partir de que
      hayan gestionado el incidente.'
    official_text_en: '4. Member States shall ensure that, for the purpose of notification under paragraph
      1, the entities concerned submit to the CSIRT or, where applicable, the competent authority:


      (e) in the event of an ongoing incident at the time of the submission of the final report referred
      to in point (d), Member States shall ensure that entities concerned provide a progress report at
      that time and a final report within one month of their handling of the incident.'
    section: Artículo 23, apartado 4, letra e)
    source_sha256: f03e15ccdfee68bb3e0a07f9866c6682f552ccff06dd9546c0c183fb55891c4d
