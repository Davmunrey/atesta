- id: c3.art23
  title_es: Incidentes operativos o de seguridad relacionados con los pagos que atañen a entidades de
    crédito, entidades de pago, proveedores de servicios de información sobre cuentas y entidades de dinero
    electrónico
  title_en: Operational or security payment-related incidents concerning credit institutions, payment
    institutions, account information service providers, and electronic money institutions
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_23
  attributes:
    official_text_es: Los requisitos establecidos en el presente capítulo se aplicarán también a los incidentes
      operativos o de seguridad, graves o no, relacionados con los pagos cuando atañan a entidades de
      crédito, entidades de pago, proveedores de servicios de información sobre cuentas y entidades de
      dinero electrónico.
    official_text_en: The requirements laid down in this Chapter shall also apply to operational or security
      payment-related incidents and to major operational or security payment-related incidents, where
      they concern credit institutions, payment institutions, account information service providers, and
      electronic money institutions.
