requirements:
- id: c2.art5
  title_es: Gobernanza y organización
  title_en: Governance and organisation
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_5
  attributes:
    official_text_es: '1. A fin lograr un nivel elevado de resiliencia operativa digital, las entidades
      financieras dispondrán de un marco interno de gobernanza y control que garantice una gestión efectiva
      y prudente del riesgo relacionado con las TIC, de conformidad con el artículo 6, apartado 4.


      2. El órgano de dirección de la entidad financiera definirá, aprobará y supervisará todas las disposiciones
      relacionadas con el marco de gestión del riesgo relacionado con las TIC a que se refiere el artículo
      6, apartado 1, y será responsable de su aplicación.


      A efectos del párrafo primero, el órgano de dirección:


      a) asumirá la responsabilidad última de gestionar el riesgo relacionado con las TIC de la entidad
      financiera;


      b) adoptará políticas encaminadas a garantizar el mantenimiento de unos niveles elevados de disponibilidad,
      autenticidad, integridad y confidencialidad de los datos;


      c) definirá claramente los cometidos y responsabilidades por lo que respecta a todas las funciones
      relacionadas con las TIC y establecerá mecanismos de gobernanza adecuados para garantizar una comunicación,
      cooperación y coordinación efectivas y oportunas entre dichas funciones;


      d) asumirá la responsabilidad general de establecer y aprobar la estrategia de resiliencia operativa
      digital a que se refiere el artículo 6, apartado 8, lo que incluye determinar el nivel adecuado
      de tolerancia al riesgo relacionado con las TIC de la entidad financiera a que se refiere el artículo
      6, apartado 8, letra b);


      e) aprobará, supervisará y revisará periódicamente la aplicación de la política de continuidad de
      la actividad en materia de TIC y de los planes de respuesta y recuperación en materia de TIC de
      la entidad financiera a que se refiere, respectivamente, el artículo 11 apartados 1 y 3, que podrán
      ser adoptados como una política específica que forme parte integrante de la política global de continuidad
      de la actividad y del plan de respuesta y recuperación de la entidad financiera;


      f) aprobará y revisará periódicamente los planes de auditoría internos de TIC y las auditorías de
      TIC de la entidad financiera, así como sus modificaciones significativas;


      g) asignará y revisará periódicamente el presupuesto adecuado para satisfacer las necesidades de
      resiliencia operativa digital de la entidad financiera con respecto a todos los tipos de recursos,
      incluidos los programas de sensibilización en materia de seguridad de las TIC y las actividades
      de formación sobre resiliencia operativa digital pertinentes a que se refiere el artículo 13, apartado
      6, y las capacidades en materia de TIC para todo el personal;


      h) aprobará y revisará periódicamente la política de la entidad financiera sobre los acuerdos relativos
      al uso de servicios de TIC prestados por proveedores terceros de servicios de TIC;


      i) establecerá, a escala corporativa, canales de comunicación que le permitan estar debidamente
      informado de lo siguiente: i) de los acuerdos celebrados con proveedores terceros de servicios de
      TIC sobre el uso de servicios de TIC, ii) de cualquier cambio sustancial pertinente previsto en
      relación con los proveedores terceros de servicios de TIC, iii) de las posibles repercusiones de
      tales cambios en las funciones esenciales o importantes reguladas por dichos acuerdos, incluido
      un resumen del análisis de riesgos para evaluar las repercusiones de dichos cambios, y al menos
      de los incidentes graves relacionados con las TIC y sus repercusiones, así como de las medidas de
      respuesta, recuperación y corrección.


      i) de los acuerdos celebrados con proveedores terceros de servicios de TIC sobre el uso de servicios
      de TIC,


      ii) de cualquier cambio sustancial pertinente previsto en relación con los proveedores terceros
      de servicios de TIC,


      iii) de las posibles repercusiones de tales cambios en las funciones esenciales o importantes reguladas
      por dichos acuerdos, incluido un resumen del análisis de riesgos para evaluar las repercusiones
      de dichos cambios, y al menos de los incidentes graves relacionados con las TIC y sus repercusiones,
      así como de las medidas de respuesta, recuperación y corrección.


      3. Las entidades financieras que no sean microempresas crearán un cargo para el seguimiento de los
      acuerdos celebrados con proveedores terceros de servicios de TIC sobre el uso de servicios de TIC
      o designarán a un miembro de la alta dirección como responsable de supervisar la exposición al riesgo
      correspondiente y la documentación pertinente.


      4. Los miembros del órgano de dirección de la entidad financiera mantendrán al día de manera activa
      conocimientos y capacidades suficientes para comprender y evaluar el riesgo relacionado con las
      TIC y sus repercusiones en las operaciones de la entidad financiera, también siguiendo periódicamente
      una formación específica que sea acorde al riesgo relacionado con las TIC que se esté gestionando.'
    official_text_en: '1. Financial entities shall have in place an internal governance and control framework
      that ensures an effective and prudent management of ICT risk, in accordance with Article 6(4), in
      order to achieve a high level of digital operational resilience.


      2. The management body of the financial entity shall define, approve, oversee and be responsible
      for the implementation of all arrangements related to the ICT risk management framework referred
      to in Article 6(1).


      For the purposes of the first subparagraph, the management body shall:


      (a) bear the ultimate responsibility for managing the financial entity’s ICT risk;


      (b) put in place policies that aim to ensure the maintenance of high standards of availability,
      authenticity, integrity and confidentiality, of data;


      (c) set clear roles and responsibilities for all ICT-related functions and establish appropriate
      governance arrangements to ensure effective and timely communication, cooperation and coordination
      among those functions;


      (d) bear the overall responsibility for setting and approving the digital operational resilience
      strategy as referred to in Article 6(8), including the determination of the appropriate risk tolerance
      level of ICT risk of the financial entity, as referred to in Article 6(8), point (b);


      (e) approve, oversee and periodically review the implementation of the financial entity’s ICT business
      continuity policy and ICT response and recovery plans, referred to, respectively, in Article 11(1)
      and (3), which may be adopted as a dedicated specific policy forming an integral part of the financial
      entity’s overall business continuity policy and response and recovery plan;


      (f) approve and periodically review the financial entity’s ICT internal audit plans, ICT audits
      and material modifications to them;


      (g) allocate and periodically review the appropriate budget to fulfil the financial entity’s digital
      operational resilience needs in respect of all types of resources, including relevant ICT security
      awareness programmes and digital operational resilience training referred to in Article 13(6), and
      ICT skills for all staff;


      (h) approve and periodically review the financial entity’s policy on arrangements regarding the
      use of ICT services provided by ICT third-party service providers;


      (i) put in place, at corporate level, reporting channels enabling it to be duly informed of the
      following: (i) arrangements concluded with ICT third-party service providers on the use of ICT services,
      (ii) any relevant planned material changes regarding the ICT third-party service providers, (iii)
      the potential impact of such changes on the critical or important functions subject to those arrangements,
      including a risk analysis summary to assess the impact of those changes, and at least major ICT-related
      incidents and their impact, as well as response, recovery and corrective measures.


      (i) arrangements concluded with ICT third-party service providers on the use of ICT services,


      (ii) any relevant planned material changes regarding the ICT third-party service providers,


      (iii) the potential impact of such changes on the critical or important functions subject to those
      arrangements, including a risk analysis summary to assess the impact of those changes, and at least
      major ICT-related incidents and their impact, as well as response, recovery and corrective measures.


      3. Financial entities, other than microenterprises, shall establish a role in order to monitor the
      arrangements concluded with ICT third-party service providers on the use of ICT services, or shall
      designate a member of senior management as responsible for overseeing the related risk exposure
      and relevant documentation.


      4. Members of the management body of the financial entity shall actively keep up to date with sufficient
      knowledge and skills to understand and assess ICT risk and its impact on the operations of the financial
      entity, including by following specific training on a regular basis, commensurate to the ICT risk
      being managed.'
    section: Artículo 5
    source_sha256: 650fe5179cd1823bf39f45001062d6ac31ed7a4200bb344ed61b2106b8078394
- id: c2.art6
  title_es: Marco de gestión del riesgo relacionado con las TIC
  title_en: ICT risk management framework
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_6
  attributes:
    official_text_es: '1. Las entidades financieras contarán con un marco de gestión del riesgo relacionado
      con las TIC sólido, completo y bien documentado como parte de su sistema global de gestión de riesgos,
      que les permita hacer frente al riesgo relacionado con las TIC de forma rápida, eficiente y exhaustiva
      y asegurar un alto nivel de resiliencia operativa digital.


      2. El marco de gestión del riesgo relacionado con las TIC incluirá al menos las estrategias, las
      políticas, los procedimientos, y los protocolos y herramientas de TIC que sean necesarios para proteger
      debida y adecuadamente todos los activos de información y activos de TIC, incluidos el software,
      el hardware y los servidores, así como para proteger todos los componentes e infraestructuras físicos
      pertinentes, como locales, centros de datos y zonas sensibles designadas, a fin de garantizar que
      todos los activos de información y activos de TIC estén adecuadamente protegidos de los riesgos,
      incluidos los daños y el acceso o uso no autorizados.


      3. De conformidad con el marco de gestión del riesgo relacionado con las TIC, las entidades financieras
      minimizarán las consecuencias de dicho riesgo mediante el despliegue de estrategias, políticas,
      procedimientos, protocolos y herramientas de TIC adecuados. Proporcionarán a las autoridades competentes
      que lo soliciten información completa y actualizada sobre el riesgo relacionado con las TIC y sobre
      su marco de gestión de dicho riesgo.


      4. Las entidades financieras que no sean microempresas encomendarán a una función de control la
      gestión y la supervisión del riesgo relacionado con las TIC y garantizarán un nivel adecuado de
      independencia de dicha función para evitar conflictos de intereses. Las entidades financieras garantizarán
      una separación e independencia adecuadas de las funciones de gestión del riesgo relacionado con
      las TIC, las funciones de control y las funciones de auditoría interna, con arreglo al modelo de
      tres líneas de defensa o a un modelo interno de gestión y control de riesgos.


      5. El marco de gestión del riesgo relacionado con las TIC se documentará y revisará al menos una
      vez al año, o periódicamente en el caso de las microempresas, así como cuando se produzcan incidentes
      graves relacionados con las TIC, y siguiendo las instrucciones de supervisión o conclusiones derivadas
      de los procesos pertinentes de prueba o auditoría de la resiliencia operativa digital. Se mejorará
      continuamente sobre la base de las enseñanzas derivadas de la aplicación y el seguimiento. Se presentará
      a la autoridad competente que lo solicite un informe sobre la revisión del marco de gestión del
      riesgo relacionado con las TIC.


      6. El marco de gestión del riesgo relacionado con las TIC de las entidades financieras que no sean
      microempresas será objeto de auditoría interna llevada a cabo por auditores con carácter periódico
      en consonancia con el plan de auditoría de las entidades financieras. Dichos auditores poseerán
      conocimientos, capacidades y pericia suficientes en materia de riesgo relacionado con las TIC, y
      gozarán de la independencia adecuada. La frecuencia y el enfoque de las auditorías de TIC serán
      acordes con el riesgo relacionado con las TIC de la entidad financiera.


      7. A partir de las conclusiones de la auditoría interna, las entidades financieras establecerán
      un proceso formal de seguimiento que incluirá normas para la oportuna verificación y corrección
      de los resultados problemáticos de la auditoría de TIC.


      8. El marco de gestión del riesgo relacionado con las TIC incluirá una estrategia de resiliencia
      operativa digital que establezca cómo se aplicará el marco. A tal fin, la estrategia de resiliencia
      operativa digital incluirá métodos para hacer frente al riesgo relacionado con las TIC y alcanzar
      los objetivos específicos en materia de TIC, para lo cual:


      a) explicará cómo apoya el marco de gestión del riesgo relacionado con las TIC la estrategia y los
      objetivos empresariales de la entidad financiera;


      b) establecerá el nivel de tolerancia al riesgo relacionado con las TIC, de acuerdo con la propensión
      al riesgo de la entidad financiera, y analizará la tolerancia al impacto de las perturbaciones de
      las TIC;


      c) establecerá objetivos claros en materia de seguridad de la información, incluidos indicadores
      clave de rendimiento y parámetros clave de medición del riesgo;


      d) explicará la arquitectura de referencia de TIC y cualquier cambio necesario para alcanzar objetivos
      empresariales específicos;


      e) esbozará los diferentes mecanismos establecidos para detectar incidentes relacionados con las
      TIC, prevenir su impacto y protegerse de sus efectos;


      f) hará constar la situación actual de la resiliencia operativa digital sobre la base del número
      de incidentes graves relacionados con las TIC notificados y la eficacia de las medidas preventivas;


      g) efectuará pruebas de resiliencia operativa digital, de conformidad con el capítulo IV del presente
      Reglamento;


      h) esbozará una estrategia de comunicación en caso de aquellos incidentes relacionados con las TIC
      que sea obligatorio divulgar conformidad con el artículo 14.


      9. Las entidades financieras podrán, en el contexto de la estrategia de resiliencia operativa digital
      a que se refiere el apartado 8, definir una estrategia global multiproveedor en materia de TIC a
      nivel de grupo o entidad, que muestre las dependencias clave de los proveedores terceros de servicios
      de TIC y explique los motivos subyacentes a la contratación de una combinación de proveedores terceros
      de servicios de TIC.


      10. Las entidades financieras podrán externalizar, de conformidad con el Derecho sectorial de la
      Unión y nacional, a empresas externas o de su mismo grupo las tareas de verificación del cumplimiento
      de los requisitos de gestión del riesgo relacionado con las TIC. En los casos en que se produzca
      tal externalización, la entidad financiera seguirá siendo plenamente responsable de la verificación
      del cumplimiento de los requisitos en materia de gestión del riesgo relacionado con las TIC.'
    official_text_en: '1. Financial entities shall have a sound, comprehensive and well-documented ICT
      risk management framework as part of their overall risk management system, which enables them to
      address ICT risk quickly, efficiently and comprehensively and to ensure a high level of digital
      operational resilience.


      2. The ICT risk management framework shall include at least strategies, policies, procedures, ICT
      protocols and tools that are necessary to duly and adequately protect all information assets and
      ICT assets, including computer software, hardware, servers, as well as to protect all relevant physical
      components and infrastructures, such as premises, data centres and sensitive designated areas, to
      ensure that all information assets and ICT assets are adequately protected from risks including
      damage and unauthorised access or usage.


      3. In accordance with their ICT risk management framework, financial entities shall minimise the
      impact of ICT risk by deploying appropriate strategies, policies, procedures, ICT protocols and
      tools. They shall provide complete and updated information on ICT risk and on their ICT risk management
      framework to the competent authorities upon their request.


      4. Financial entities, other than microenterprises, shall assign the responsibility for managing
      and overseeing ICT risk to a control function and ensure an appropriate level of independence of
      such control function in order to avoid conflicts of interest. Financial entities shall ensure appropriate
      segregation and independence of ICT risk management functions, control functions, and internal audit
      functions, according to the three lines of defence model, or an internal risk management and control
      model.


      5. The ICT risk management framework shall be documented and reviewed at least once a year, or periodically
      in the case of microenterprises, as well as upon the occurrence of major ICT-related incidents,
      and following supervisory instructions or conclusions derived from relevant digital operational
      resilience testing or audit processes. It shall be continuously improved on the basis of lessons
      derived from implementation and monitoring. A report on the review of the ICT risk management framework
      shall be submitted to the competent authority upon its request.


      6. The ICT risk management framework of financial entities, other than microenterprises, shall be
      subject to internal audit by auditors on a regular basis in line with the financial entities’ audit
      plan. Those auditors shall possess sufficient knowledge, skills and expertise in ICT risk, as well
      as appropriate independence. The frequency and focus of ICT audits shall be commensurate to the
      ICT risk of the financial entity.


      7. Based on the conclusions from the internal audit review, financial entities shall establish a
      formal follow-up process, including rules for the timely verification and remediation of critical
      ICT audit findings.


      8. The ICT risk management framework shall include a digital operational resilience strategy setting
      out how the framework shall be implemented. To that end, the digital operational resilience strategy
      shall include methods to address ICT risk and attain specific ICT objectives, by:


      (a) explaining how the ICT risk management framework supports the financial entity’s business strategy
      and objectives;


      (b) establishing the risk tolerance level for ICT risk, in accordance with the risk appetite of
      the financial entity, and analysing the impact tolerance for ICT disruptions;


      (c) setting out clear information security objectives, including key performance indicators and
      key risk metrics;


      (d) explaining the ICT reference architecture and any changes needed to reach specific business
      objectives;


      (e) outlining the different mechanisms put in place to detect ICT-related incidents, prevent their
      impact and provide protection from it;


      (f) evidencing the current digital operational resilience situation on the basis of the number of
      major ICT-related incidents reported and the effectiveness of preventive measures;


      (g) implementing digital operational resilience testing, in accordance with Chapter IV of this Regulation;


      (h) outlining a communication strategy in the event of ICT-related incidents the disclosure of which
      is required in accordance with Article 14.


      9. Financial entities may, in the context of the digital operational resilience strategy referred
      to in paragraph 8, define a holistic ICT multi-vendor strategy, at group or entity level, showing
      key dependencies on ICT third-party service providers and explaining the rationale behind the procurement
      mix of ICT third-party service providers.


      10. Financial entities may, in accordance with Union and national sectoral law, outsource the tasks
      of verifying compliance with ICT risk management requirements to intra-group or external undertakings.
      In case of such outsourcing, the financial entity remains fully responsible for the verification
      of compliance with the ICT risk management requirements.'
    section: Artículo 6
    source_sha256: c276bc67ab650652c8c620f1bc848c929ae8035b17123543a4647be8e671ccd6
- id: c2.art7
  title_es: Sistemas, protocolos y herramientas de TIC
  title_en: ICT systems, protocols and tools
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_7
  attributes:
    official_text_es: 'Con el fin de abordar y gestionar los riesgos relacionados con las TIC, las entidades
      financieras utilizarán y mantendrán actualizados sistemas, protocolos y herramientas de TIC que:


      a) sean adecuados a la magnitud de las operaciones que sustentan la realización de sus actividades,
      de conformidad con el principio de proporcionalidad a que se refiere el artículo 4;


      b) sean fiables;


      c) dispongan de capacidad suficiente para tratar con exactitud los datos necesarios para llevar
      a cabo las actividades y prestar los servicios a tiempo, y para hacer frente a los volúmenes máximos
      de pedidos, mensajes u operaciones, según sea necesario, también en caso de introducción de nuevas
      tecnologías;


      d) sean tecnológicamente resilientes a fin de hacer frente adecuadamente a las necesidades adicionales
      de tratamiento de la información que surjan en condiciones de tensión del mercado u otras situaciones
      adversas.'
    official_text_en: 'In order to address and manage ICT risk, financial entities shall use and maintain
      updated ICT systems, protocols and tools that are:


      (a) appropriate to the magnitude of operations supporting the conduct of their activities, in accordance
      with the proportionality principle as referred to in Article 4;


      (b) reliable;


      (c) equipped with sufficient capacity to accurately process the data necessary for the performance
      of activities and the timely provision of services, and to deal with peak orders, message or transaction
      volumes, as needed, including where new technology is introduced;


      (d) technologically resilient in order to adequately deal with additional information processing
      needs as required under stressed market conditions or other adverse situations.'
    section: Artículo 7
    source_sha256: 9a5baef66e138ef6b45f281971aa274a46103b89b37de6fb48f09efc1a1ddbcd
- id: c2.art8
  title_es: Identificación
  title_en: Identification
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_8
  attributes:
    official_text_es: '1. Como parte del marco de gestión del riesgo relacionado con las TIC a que se
      refiere el artículo 6, apartado 1, las entidades financieras identificarán, clasificarán y documentarán
      adecuadamente todas las funciones, cometidos y responsabilidades empresariales sustentados por las
      TIC, los activos de información y activos de TIC que sustenten dichas funciones, y sus cometidos
      y dependencias en relación con el riesgo relacionado con las TIC. Las entidades financieras revisarán
      en caso necesario, y al menos una vez al año, la idoneidad de esta clasificación y de cualquier
      documentación pertinente.


      2. Las entidades financieras identificarán de forma continua todas las fuentes de riesgo relacionado
      con las TIC, en particular la exposición al riesgo para con otras entidades financieras y derivada
      de otras entidades financieras, y evaluarán las ciberamenazas y vulnerabilidades en materia de TIC
      pertinentes para sus funciones empresariales sustentadas por TIC, activos de información y activos
      de TIC. Las entidades financieras revisarán periódicamente, y al menos una vez al año, los escenarios
      de riesgo que les afecten.


      3. Las entidades financieras que no sean microempresas llevarán a cabo una evaluación del riesgo
      cada vez que se produzca un cambio importante en la infraestructura de las redes y los sistemas
      de información, en los procesos o procedimientos que afecten a sus funciones empresariales sustentadas
      por TIC, activos de información o activos de TIC.


      4. Las entidades financieras identificarán todos los activos de información y activos de TIC, incluidos
      los que se encuentren en emplazamientos remotos, recursos de red y equipos de hardware, y cartografiarán
      aquellos considerados esenciales. Cartografiarán la configuración de los activos de información
      y activos de TIC y los vínculos e interdependencias entre los distintos activos de información y
      activos de TIC.


      5. Las entidades financieras identificarán y documentarán todos los procesos que dependan de proveedores
      terceros de servicios de TIC, e identificarán las interconexiones con proveedores terceros de servicios
      de TIC que presten servicios que sustenten funciones esenciales o importantes.


      6. A los efectos de los apartados 1, 4 y 5, las entidades financieras mantendrán los inventarios
      pertinentes y los actualizarán periódicamente y cada vez que se produzcan los cambios importantes
      a que se refiere el apartado 3.


      7. Las entidades financieras que no sean microempresas llevarán a cabo periódicamente, y al menos
      una vez al año, una evaluación específica del riesgo relacionado con las TIC en todos los sistemas
      de TIC heredados y, en cualquier caso, antes y después de conectar tecnologías, aplicaciones o sistemas.'
    official_text_en: '1. As part of the ICT risk management framework referred to in Article 6(1), financial
      entities shall identify, classify and adequately document all ICT supported business functions,
      roles and responsibilities, the information assets and ICT assets supporting those functions, and
      their roles and dependencies in relation to ICT risk. Financial entities shall review as needed,
      and at least yearly, the adequacy of this classification and of any relevant documentation.


      2. Financial entities shall, on a continuous basis, identify all sources of ICT risk, in particular
      the risk exposure to and from other financial entities, and assess cyber threats and ICT vulnerabilities
      relevant to their ICT supported business functions, information assets and ICT assets. Financial
      entities shall review on a regular basis, and at least yearly, the risk scenarios impacting them.


      3. Financial entities, other than microenterprises, shall perform a risk assessment upon each major
      change in the network and information system infrastructure, in the processes or procedures affecting
      their ICT supported business functions, information assets or ICT assets.


      4. Financial entities shall identify all information assets and ICT assets, including those on remote
      sites, network resources and hardware equipment, and shall map those considered critical. They shall
      map the configuration of the information assets and ICT assets and the links and interdependencies
      between the different information assets and ICT assets.


      5. Financial entities shall identify and document all processes that are dependent on ICT third-party
      service providers, and shall identify interconnections with ICT third-party service providers that
      provide services that support critical or important functions.


      6. For the purposes of paragraphs 1, 4 and 5, financial entities shall maintain relevant inventories
      and update them periodically and every time any major change as referred to in paragraph 3 occurs.


      7. Financial entities, other than microenterprises, shall on a regular basis, and at least yearly,
      conduct a specific ICT risk assessment on all legacy ICT systems and, in any case before and after
      connecting technologies, applications or systems.'
    section: Artículo 8
    source_sha256: 272c9a95ddcf5375b4d2b82778fd1901e4d29471513eb7524493bb4495b18174
- id: c2.art9
  title_es: Protección y prevención
  title_en: Protection and prevention
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_9
  attributes:
    official_text_es: '1. Con el fin de proteger adecuadamente los sistemas de TIC y con vistas a organizar
      medidas de respuesta, las entidades financieras realizarán un seguimiento y un control permanentes
      de la seguridad y el funcionamiento de los sistemas y herramientas de TIC y minimizarán las repercusiones
      en dichos sistemas del riesgo relacionado con las TIC mediante el despliegue de herramientas, políticas
      y procedimientos adecuados en materia de seguridad de las TIC.


      2. Las entidades financieras diseñarán, adquirirán y aplicarán políticas, procedimientos, protocolos
      y herramientas en materia de seguridad de las TIC que tengan por objeto asegurar la resiliencia,
      la continuidad y la disponibilidad de los sistemas de TIC, en particular aquellos que sustentan
      funciones esenciales o importantes, así como mantener elevados niveles de disponibilidad, autenticidad,
      integridad y confidencialidad de los datos, con independencia de que estén en reposo, en uso o en
      tránsito.


      3. A fin de alcanzar los objetivos mencionados en el apartado 2, las entidades financieras utilizarán
      soluciones y procesos de TIC que sean adecuados de conformidad con el artículo 4. Dichas soluciones
      y procesos de TIC deberán:


      a) garantizar la seguridad de los medios de transmisión de datos;


      b) minimizar el riesgo de corrupción o pérdida de datos, acceso no autorizado y defectos técnicos
      que puedan obstaculizar la actividad empresarial;


      c) evitar la falta de disponibilidad, el menoscabo de la autenticidad e integridad, la vulneración
      de la confidencialidad y la pérdida de datos;


      d) garantizar que los datos estén protegidos de riesgos derivados de su gestión, incluidos los debidos
      a una mala administración, los relacionados con el tratamiento y los errores humanos.


      4. Como parte del marco de gestión del riesgo relacionado con las TIC a que se refiere el artículo
      6, apartado 1, las entidades financieras deberán:


      a) elaborar y documentar una política de seguridad de la información que defina normas para proteger
      la confidencialidad, disponibilidad, integridad o autenticidad de los datos, activos de información
      y activos de TIC, incluidos los de sus clientes, en su caso;


      b) siguiendo un enfoque basado en el riesgo, establecer una estructura de gestión sólida de redes
      e infraestructuras utilizando técnicas, métodos y protocolos adecuados que puedan incluir la aplicación
      de mecanismos automatizados para aislar los activos de información afectados en caso de ciberataques;


      c) aplicar políticas que limiten el acceso físico o lógico a los activos de información y activos
      de TIC a lo que sea necesario únicamente para funciones y actividades legítimas y aprobadas, y establecer
      a tal fin un conjunto de políticas, procedimientos y controles que se centren en los derechos de
      acceso y garanticen una buena administración de estos;


      d) aplicar políticas y protocolos para mecanismos de autenticación fuerte, basados en estándares
      pertinentes y sistemas de control específicos, y medidas de protección de las claves criptográficas
      mediante las que se cifran los datos en función de los resultados de los procesos aprobados de clasificación
      de datos y evaluación de riesgos relacionados con las TIC;


      e) aplicar políticas, procedimientos y controles documentados para la gestión de los cambios en
      las TIC, incluidos los cambios en el software, el hardware, los componentes de firmware, los sistemas
      o los parámetros de seguridad, que se basen en un enfoque de evaluación de riesgos y formen parte
      integrante del proceso general de gestión de cambios de la entidad financiera, a fin de garantizar
      que todos los cambios en los sistemas de TIC se registren, sometan a prueba, evalúen, aprueben,
      apliquen y verifiquen de forma controlada;


      f) contar con políticas documentadas adecuadas y globales para los parches y actualizaciones.


      A efectos del párrafo primero, letra b), las entidades financieras diseñarán la infraestructura
      de conexión a la red de manera que permita su ruptura o segmentación instantánea con el fin de minimizar
      y prevenir el contagio, especialmente en los procesos financieros interconectados.


      A efectos del párrafo primero, letra e), el proceso de gestión de cambios en las TIC será aprobado
      por los niveles directivos adecuados y dispondrá de protocolos específicos.'
    official_text_en: '1. For the purposes of adequately protecting ICT systems and with a view to organising
      response measures, financial entities shall continuously monitor and control the security and functioning
      of ICT systems and tools and shall minimise the impact of ICT risk on ICT systems through the deployment
      of appropriate ICT security tools, policies and procedures.


      2. Financial entities shall design, procure and implement ICT security policies, procedures, protocols
      and tools that aim to ensure the resilience, continuity and availability of ICT systems, in particular
      for those supporting critical or important functions, and to maintain high standards of availability,
      authenticity, integrity and confidentiality of data, whether at rest, in use or in transit.


      3. In order to achieve the objectives referred to in paragraph 2, financial entities shall use ICT
      solutions and processes that are appropriate in accordance with Article 4. Those ICT solutions and
      processes shall:


      (a) ensure the security of the means of transfer of data;


      (b) minimise the risk of corruption or loss of data, unauthorised access and technical flaws that
      may hinder business activity;


      (c) prevent the lack of availability, the impairment of the authenticity and integrity, the breaches
      of confidentiality and the loss of data;


      (d) ensure that data is protected from risks arising from data management, including poor administration,
      processing-related risks and human error.


      4. As part of the ICT risk management framework referred to in Article 6(1), financial entities
      shall:


      (a) develop and document an information security policy defining rules to protect the availability,
      authenticity, integrity and confidentiality of data, information assets and ICT assets, including
      those of their customers, where applicable;


      (b) following a risk-based approach, establish a sound network and infrastructure management structure
      using appropriate techniques, methods and protocols that may include implementing automated mechanisms
      to isolate affected information assets in the event of cyber-attacks;


      (c) implement policies that limit the physical or logical access to information assets and ICT assets
      to what is required for legitimate and approved functions and activities only, and establish to
      that end a set of policies, procedures and controls that address access rights and ensure a sound
      administration thereof;


      (d) implement policies and protocols for strong authentication mechanisms, based on relevant standards
      and dedicated control systems, and protection measures of cryptographic keys whereby data is encrypted
      based on results of approved data classification and ICT risk assessment processes;


      (e) implement documented policies, procedures and controls for ICT change management, including
      changes to software, hardware, firmware components, systems or security parameters, that are based
      on a risk assessment approach and are an integral part of the financial entity’s overall change
      management process, in order to ensure that all changes to ICT systems are recorded, tested, assessed,
      approved, implemented and verified in a controlled manner;


      (f) have appropriate and comprehensive documented policies for patches and updates.


      For the purposes of the first subparagraph, point (b), financial entities shall design the network
      connection infrastructure in a way that allows it to be instantaneously severed or segmented in
      order to minimise and prevent contagion, especially for interconnected financial processes.


      For the purposes of the first subparagraph, point (e), the ICT change management process shall be
      approved by appropriate lines of management and shall have specific protocols in place.'
    section: Artículo 9
    source_sha256: 258a2684ae8606e38443119b1c79f82be56e7f1150124bccb9af0262c22e6604
- id: c2.art10
  title_es: Detección
  title_en: Detection
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_10
  attributes:
    official_text_es: '1. Las entidades financieras dispondrán de mecanismos para detectar rápidamente
      las actividades anómalas, de conformidad con el artículo 17, incluidos los problemas de rendimiento
      de las redes de TIC y los incidentes relacionados con las TIC, y para identificar los posibles puntos
      únicos de fallo significativos.


      Todos los mecanismos de detección mencionados en el párrafo primero se someterán a pruebas periódicas
      de conformidad con el artículo 25.


      2. Los mecanismos de detección a que se refiere el apartado 1 permitirán múltiples niveles de control,
      definirán criterios y umbrales de alerta para activar e iniciar procesos de respuesta a incidentes
      relacionados con las TIC, incluidos mecanismos automáticos de alerta para el personal responsable
      de la respuesta a incidentes relacionados con las TIC.


      3. Las entidades financieras dedicarán recursos y capacidades suficientes al seguimiento de la actividad
      de los usuarios y la aparición de anomalías en las TIC y de incidentes relacionados con las TIC,
      en particular de ciberataques.


      4. Los proveedores de servicios de suministro de datos dispondrán además de sistemas que permitan
      controlar de manera efectiva la exhaustividad de los informes de operaciones, detectar omisiones
      y errores manifiestos y solicitar la retransmisión de tales informes.'
    official_text_en: '1. Financial entities shall have in place mechanisms to promptly detect anomalous
      activities, in accordance with Article 17, including ICT network performance issues and ICT-related
      incidents, and to identify potential material single points of failure.


      All detection mechanisms referred to in the first subparagraph shall be regularly tested in accordance
      with Article 25.


      2. The detection mechanisms referred to in paragraph 1 shall enable multiple layers of control,
      define alert thresholds and criteria to trigger and initiate ICT-related incident response processes,
      including automatic alert mechanisms for relevant staff in charge of ICT-related incident response.


      3. Financial entities shall devote sufficient resources and capabilities to monitor user activity,
      the occurrence of ICT anomalies and ICT-related incidents, in particular cyber-attacks.


      4. Data reporting service providers shall, in addition, have in place systems that can effectively
      check trade reports for completeness, identify omissions and obvious errors, and request re-transmission
      of those reports.'
    section: Artículo 10
    source_sha256: 326c173fde67b1f11c1c4e42e3d539b4b3928555d6159a86d50d20d50fd6a00a
- id: c2.art11
  title_es: Respuesta y recuperación
  title_en: Response and recovery
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_11
  attributes:
    official_text_es: '1. Como parte del marco de gestión del riesgo relacionado con las TIC a que se
      refiere el artículo 6, apartado 1, y sobre la base de los requisitos de identificación establecidos
      en el artículo 8, las entidades financieras pondrán en práctica una política global de continuidad
      de la actividad en materia de TIC, que podrá ser adoptada como una política específica propia que
      forme parte integrante de la política global de continuidad de la actividad de la entidad financiera.


      2. Las entidades financieras aplicarán la política de continuidad de la actividad en materia de
      TIC mediante disposiciones, planes, procedimientos y mecanismos específicos, adecuados y documentados
      destinados a:


      a) garantizar la continuidad de las funciones esenciales o importantes de la entidad financiera;


      b) responder a todos los incidentes relacionados con las TIC y resolverlos rápida, adecuada y eficazmente
      de manera que se limiten los daños y se dé prioridad a la reanudación de las actividades y a las
      acciones de recuperación;


      c) activar, sin demora, planes específicos que permitan recurrir a medidas de contención, procesos
      y tecnologías adaptados a cada tipo de incidente relacionado con las TIC y que eviten nuevos daños,
      así como a procedimientos de respuesta y recuperación adaptados establecidos de conformidad con
      el artículo 12;


      d) estimar con carácter preliminar las repercusiones, daños y pérdidas;


      e) definir acciones de comunicación y gestión de crisis que garanticen la transmisión de información
      actualizada a todo el personal interno y las partes interesadas externas pertinentes de conformidad
      con el artículo 14, y su notificación a las autoridades competentes de conformidad con el artículo
      19.


      3. Como parte del marco de gestión del riesgo relacionado con las TIC a que se refiere el artículo
      6, apartado 1, las entidades financieras aplicarán planes conexos de respuesta y recuperación en
      materia de TIC que, en el caso de entidades financieras que no sean microempresas, estarán sujetos
      a auditorías internas independientes.


      4. Las entidades financieras establecerán, mantendrán y someterán a prueba periódicamente planes
      adecuados de continuidad de las actividades de TIC, en particular en lo que se refiere a las funciones
      esenciales o importantes externalizadas o contratadas mediante acuerdos con proveedores terceros
      de servicios de TIC.


      5. Como parte de la política global de continuidad de la actividad, las entidades financieras llevarán
      a cabo un análisis de impacto en el negocio de sus exposiciones a perturbaciones graves de la actividad.
      En el marco de dicho análisis, las entidades financieras evaluarán el impacto potencial de las perturbaciones
      graves de la actividad mediante criterios cuantitativos y cualitativos, utilizando datos internos
      y externos y análisis de escenarios, según proceda. El análisis de impacto en el negocio tendrá
      en cuenta el carácter esencial de las funciones empresariales identificadas y cartografiadas, los
      procesos de apoyo, las dependencias de terceros y los activos de información, así como sus interdependencias.
      Las entidades financieras garantizarán que los activos de TIC y los servicios de TIC se diseñen
      y utilicen en plena consonancia con el análisis de impacto en el negocio, en particular en lo que
      se refiere a garantizar adecuadamente la redundancia de todos los componentes esenciales.


      6. Como parte de su gestión global del riesgo relacionado con las TIC, las entidades financieras:


      a) someterán a prueba los planes de continuidad de la actividad y los planes de respuesta y recuperación
      en materia de TIC en relación con los sistemas de TIC que sustenten todas las funciones al menos
      una vez al año, así como en caso de que se produzca cualquier cambio sustancial en los sistemas
      de TIC que sustenten funciones esenciales o importantes;


      b) someterán a prueba los planes de comunicación en caso de crisis establecidos de conformidad con
      el artículo 14.


      A efectos del párrafo primero, letra a), las entidades financieras que no sean microempresas incluirán,
      en los planes de pruebas, escenarios de ciberataques y de conmutación entre la infraestructura primaria
      de TIC y la capacidad redundante, las copias de seguridad y las instalaciones redundantes necesarias
      para cumplir con las obligaciones establecidas en el artículo 12.


      Las entidades financieras revisarán periódicamente su política de continuidad de la actividad en
      materia de TIC y sus planes de respuesta y recuperación en materia de TIC teniendo en cuenta los
      resultados de las pruebas realizadas de conformidad con el párrafo primero y las recomendaciones
      derivadas de los controles de auditoría o las revisiones supervisoras.


      7. Las entidades financieras que no sean microempresas dispondrán de una función de gestión de crisis
      que, en caso de activación de sus planes de continuidad de la actividad en materia de TIC o de sus
      planes de respuesta y recuperación en materia de TIC, establecerá, entre otros, procedimientos claros
      para gestionar las comunicaciones de crisis internas y externas de conformidad con el artículo 14.


      8. Las entidades financieras mantendrán registros fácilmente accesibles de las actividades antes
      de las perturbaciones y durante estas cuando se activen sus planes de continuidad de la actividad
      en materia de TIC y sus planes de respuesta y recuperación en materia de TIC.


      9. Los depositarios centrales de valores facilitarán a las autoridades competentes copias de los
      resultados de las pruebas de continuidad de la actividad en materia de TIC, o de ejercicios similares.


      10. Las entidades financieras que no sean microempresas informarán a las autoridades competentes,
      si estas lo solicitan, una estimación de los costes y pérdidas anuales agregados causados por incidentes
      graves relacionados con las TIC.


      11. De conformidad con el artículo 16 del Reglamento (UE) n.o 1093/2010, el artículo 16 del Reglamento
      (UE) n.o 1094/2010 y el artículo 16 del Reglamento (UE) n.o 1095/2010, las Autoridades Europeas
      de Supervisión, a través del Comité Mixto, elaborarán, a más tardar el 17 de julio de 2024, directrices
      comunes sobre la estimación de los costes y pérdidas anuales agregados a que se refiere el apartado
      10.'
    official_text_en: '1. As part of the ICT risk management framework referred to in Article 6(1) and
      based on the identification requirements set out in Article 8, financial entities shall put in place
      a comprehensive ICT business continuity policy, which may be adopted as a dedicated specific policy,
      forming an integral part of the overall business continuity policy of the financial entity.


      2. Financial entities shall implement the ICT business continuity policy through dedicated, appropriate
      and documented arrangements, plans, procedures and mechanisms aiming to:


      (a) ensure the continuity of the financial entity’s critical or important functions;


      (b) quickly, appropriately and effectively respond to, and resolve, all ICT-related incidents in
      a way that limits damage and prioritises the resumption of activities and recovery actions;


      (c) activate, without delay, dedicated plans that enable containment measures, processes and technologies
      suited to each type of ICT-related incident and prevent further damage, as well as tailored response
      and recovery procedures established in accordance with Article 12;


      (d) estimate preliminary impacts, damages and losses;


      (e) set out communication and crisis management actions that ensure that updated information is
      transmitted to all relevant internal staff and external stakeholders in accordance with Article
      14, and report to the competent authorities in accordance with Article 19.


      3. As part of the ICT risk management framework referred to in Article 6(1), financial entities
      shall implement associated ICT response and recovery plans which, in the case of financial entities
      other than microenterprises, shall be subject to independent internal audit reviews.


      4. Financial entities shall put in place, maintain and periodically test appropriate ICT business
      continuity plans, notably with regard to critical or important functions outsourced or contracted
      through arrangements with ICT third-party service providers.


      5. As part of the overall business continuity policy, financial entities shall conduct a business
      impact analysis (BIA) of their exposures to severe business disruptions. Under the BIA, financial
      entities shall assess the potential impact of severe business disruptions by means of quantitative
      and qualitative criteria, using internal and external data and scenario analysis, as appropriate.
      The BIA shall consider the criticality of identified and mapped business functions, support processes,
      third-party dependencies and information assets, and their interdependencies. Financial entities
      shall ensure that ICT assets and ICT services are designed and used in full alignment with the BIA,
      in particular with regard to adequately ensuring the redundancy of all critical components.


      6. As part of their comprehensive ICT risk management, financial entities shall:


      (a) test the ICT business continuity plans and the ICT response and recovery plans in relation to
      ICT systems supporting all functions at least yearly, as well as in the event of any substantive
      changes to ICT systems supporting critical or important functions;


      (b) test the crisis communication plans established in accordance with Article 14.


      For the purposes of the first subparagraph, point (a), financial entities, other than microenterprises,
      shall include in the testing plans scenarios of cyber-attacks and switchovers between the primary
      ICT infrastructure and the redundant capacity, backups and redundant facilities necessary to meet
      the obligations set out in Article 12.


      Financial entities shall regularly review their ICT business continuity policy and ICT response
      and recovery plans, taking into account the results of tests carried out in accordance with the
      first subparagraph and recommendations stemming from audit checks or supervisory reviews.


      7. Financial entities, other than microenterprises, shall have a crisis management function, which,
      in the event of activation of their ICT business continuity plans or ICT response and recovery plans,
      shall, inter alia, set out clear procedures to manage internal and external crisis communications
      in accordance with Article 14.


      8. Financial entities shall keep readily accessible records of activities before and during disruption
      events when their ICT business continuity plans and ICT response and recovery plans are activated.


      9. Central securities depositories shall provide the competent authorities with copies of the results
      of the ICT business continuity tests, or of similar exercises.


      10. Financial entities, other than microenterprises, shall report to the competent authorities,
      upon their request, an estimation of aggregated annual costs and losses caused by major ICT-related
      incidents.


      11. In accordance with Article 16 of Regulations (EU) No 1093/2010, (EU) No 1094/2010 and (EU) No
      1095/2010, the ESAs, through the Joint Committee, shall by 17 July 2024 develop common guidelines
      on the estimation of aggregated annual costs and losses referred to in paragraph 10.'
    section: Artículo 11
    source_sha256: 5b2cc48595ee2cb4beda9dc8c67a02160802cd7157c1269763dbd96e9d15b5c6
- id: c2.art12
  title_es: Políticas y procedimientos de respaldo y procedimientos y métodos de restablecimiento y recuperación
  title_en: Backup policies and procedures, restoration and recovery procedures and methods
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_12
  attributes:
    official_text_es: '1. Con el fin de garantizar el restablecimiento de los sistemas de TIC y los datos
      con un tiempo mínimo de inactividad y una perturbación y pérdida limitadas, como parte de su marco
      de gestión del riesgo relacionado con las TIC, las entidades financieras desarrollarán y documentarán:


      a) políticas y procedimientos de respaldo que especifiquen el alcance de los datos objeto de respaldo
      y la frecuencia mínima de este, en función del carácter esencial de la información o del nivel de
      confidencialidad de los datos;


      b) procedimientos y métodos de restablecimiento y recuperación.


      2. Las entidades financieras establecerán sistemas de respaldo que puedan activarse de conformidad
      con las políticas y procedimientos de respaldo, así como procedimientos y métodos de restablecimiento
      y recuperación. La activación de sistemas de respaldo no pondrá en peligro la seguridad de las redes
      y los sistemas de información ni la disponibilidad, autenticidad, integridad o confidencialidad
      de los datos. Las pruebas de los procedimientos de respaldo y restablecimiento y los procedimientos
      y métodos de recuperación se llevarán a cabo periódicamente.


      3. Al restablecer los datos de seguridad mediante sus propios sistemas, las entidades financieras
      utilizarán sistemas de TIC que estén separados, física y lógicamente, del sistema de TIC de origen.
      Los sistemas de TIC estarán protegidos de forma segura contra cualquier acceso no autorizado o corrupción
      de las TIC y permitirán el rápido restablecimiento de los servicios utilizando los respaldos de
      los sistemas y los datos que sean necesarios.


      En el caso de las entidades de contrapartida central, los planes de recuperación permitirán la recuperación
      de todas las operaciones en el momento de la perturbación, para que la entidad de contrapartida
      central pueda seguir operando de manera segura y finalizar la liquidación en la fecha programada.


      Los proveedores de servicios de suministro de datos mantendrán además recursos suficientes y dispondrán
      de instalaciones de respaldo y restablecimiento para ofrecer y mantener sus servicios en todo momento.


      4. Las entidades financieras que no sean microempresas mantendrán capacidades de TIC redundantes
      provistas de recursos, medios y funciones adecuados para satisfacer las necesidades empresariales.
      Las microempresas evaluarán la necesidad de mantener estas capacidades de TIC redundantes sobre
      la base de su perfil de riesgo.


      5. Los depositarios centrales de valores mantendrán al menos un centro de tratamiento secundario
      dotado de recursos, capacidades, funciones y personal adecuados para satisfacer las necesidades
      empresariales.


      El centro de proceso secundario deberá:


      a) estar situado a una determinada distancia geográfica del centro de proceso primario para garantizar
      que presente un perfil de riesgo distinto y evitar que se vea afectado por el suceso que haya afectado
      al centro primario;


      b) ser capaz de garantizar la continuidad de las funciones esenciales o importantes del mismo modo
      que el centro primario, o de prestar el nivel de servicios necesario para garantizar que la entidad
      financiera realice sus operaciones esenciales dentro de los objetivos de recuperación;


      c) estar inmediatamente accesible para el personal de la entidad financiera a fin de garantizar
      la continuidad de las funciones esenciales o importantes en caso de que el centro de proceso primario
      no esté disponible.


      6. Al determinar los objetivos de tiempo y punto de recuperación para cada función, las entidades
      financieras tendrán en cuenta si se trata de una función esencial o importante y las posibles repercusiones
      globales en la eficiencia del mercado. Estos objetivos garantizarán que, en situaciones extremas,
      se alcancen los niveles de servicio acordados.


      7. Al recuperarse de un incidente relacionado con las TIC, las entidades financieras realizarán
      las comprobaciones necesarias, incluidas múltiples comprobaciones y conciliaciones, a fin de garantizar
      que se mantenga el máximo nivel de integridad de los datos. Estas comprobaciones también se llevarán
      a cabo cuando se reconstruyan datos de partes interesadas externas, a fin de garantizar que todos
      los datos sean coherentes entre los sistemas.'
    official_text_en: '1. For the purpose of ensuring the restoration of ICT systems and data with minimum
      downtime, limited disruption and loss, as part of their ICT risk management framework, financial
      entities shall develop and document:


      (a) backup policies and procedures specifying the scope of the data that is subject to the backup
      and the minimum frequency of the backup, based on the criticality of information or the confidentiality
      level of the data;


      (b) restoration and recovery procedures and methods.


      2. Financial entities shall set up backup systems that can be activated in accordance with the backup
      policies and procedures, as well as restoration and recovery procedures and methods. The activation
      of backup systems shall not jeopardise the security of the network and information systems or the
      availability, authenticity, integrity or confidentiality of data. Testing of the backup procedures
      and restoration and recovery procedures and methods shall be undertaken periodically.


      3. When restoring backup data using own systems, financial entities shall use ICT systems that are
      physically and logically segregated from the source ICT system. The ICT systems shall be securely
      protected from any unauthorised access or ICT corruption and allow for the timely restoration of
      services making use of data and system backups as necessary.


      For central counterparties, the recovery plans shall enable the recovery of all transactions at
      the time of disruption to allow the central counterparty to continue to operate with certainty and
      to complete settlement on the scheduled date.


      Data reporting service providers shall additionally maintain adequate resources and have back-up
      and restoration facilities in place in order to offer and maintain their services at all times.


      4. Financial entities, other than microenterprises, shall maintain redundant ICT capacities equipped
      with resources, capabilities and functions that are adequate to ensure business needs. Microenterprises
      shall assess the need to maintain such redundant ICT capacities based on their risk profile.


      5. Central securities depositories shall maintain at least one secondary processing site endowed
      with adequate resources, capabilities, functions and staffing arrangements to ensure business needs.


      The secondary processing site shall be:


      (a) located at a geographical distance from the primary processing site to ensure that it bears
      a distinct risk profile and to prevent it from being affected by the event which has affected the
      primary site;


      (b) capable of ensuring the continuity of critical or important functions identically to the primary
      site, or providing the level of services necessary to ensure that the financial entity performs
      its critical operations within the recovery objectives;


      (c) immediately accessible to the financial entity’s staff to ensure continuity of critical or important
      functions in the event that the primary processing site has become unavailable.


      6. In determining the recovery time and recovery point objectives for each function, financial entities
      shall take into account whether it is a critical or important function and the potential overall
      impact on market efficiency. Such time objectives shall ensure that, in extreme scenarios, the agreed
      service levels are met.


      7. When recovering from an ICT-related incident, financial entities shall perform necessary checks,
      including any multiple checks and reconciliations, in order to ensure that the highest level of
      data integrity is maintained. These checks shall also be performed when reconstructing data from
      external stakeholders, in order to ensure that all data is consistent between systems.'
    section: Artículo 12
    source_sha256: 1ef581625d51046372c272f647018b0ad4b87d05af2a9494fce99d3a18c14c05
- id: c2.art13
  title_es: Aprendizaje y evolución
  title_en: Learning and evolving
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_13
  attributes:
    official_text_es: '1. Las entidades financieras dispondrán de capacidades y de personal para recopilar
      información sobre vulnerabilidades, ciberamenazas e incidentes relacionados con las TIC, en particular
      ciberataques, y para analizar las repercusiones que es probable que tengan en su resiliencia operativa
      digital.


      2. Las entidades financieras llevarán a cabo revisiones tras incidentes relacionados con las TIC
      después de que un incidente grave relacionado con las TIC perturbe sus actividades principales,
      analizando sus causas e identificando las mejoras necesarias para las operaciones de TIC o en la
      política de continuidad de la actividad en materia de TIC a que se refiere el artículo 11.


      Las entidades financieras que no sean microempresas comunicarán, previa petición, a las autoridades
      competentes los cambios que se hayan introducido después de las revisiones tras incidentes relacionados
      con las TIC a que se refiere el párrafo primero.


      Las revisiones tras incidentes relacionados con las TIC a que se refiere el párrafo primero determinarán
      si se han seguido los procedimientos establecidos y si las medidas adoptadas han sido eficaces,
      inclusive en relación con lo siguiente:


      a) la rapidez a la hora de responder a las alertas de seguridad y determinar las repercusiones de
      los incidentes relacionados con las TIC y su gravedad;


      b) la calidad y rapidez en la realización de un análisis forense, cuando se considere oportuno;


      c) la eficacia de la activación de los niveles sucesivos de intervención en caso de incidente dentro
      de la entidad financiera;


      d) la eficacia de la comunicación interna y externa.


      3. Las enseñanzas derivadas de las pruebas de resiliencia operativa digital llevadas a cabo de conformidad
      con los artículos 26 y 27 y de los incidentes reales relacionados con las TIC, en particular los
      ciberataques, junto con los problemas que se hayan planteado al activar los planes de continuidad
      de la actividad en materia de TIC y los planes de respuesta y recuperación en materia de TIC, además
      de la información pertinente intercambiada con las contrapartes y evaluada durante las revisiones
      supervisoras, se incorporarán debidamente de forma continua al proceso de evaluación del riesgo
      relacionado con las TIC. Tales hallazgos conformarán la base para las revisiones adecuadas de los
      componentes pertinentes del marco de gestión del riesgo relacionado con las TIC a que se refiere
      el artículo 6, apartado 1.


      4. Las entidades financieras harán un seguimiento de la efectividad de la aplicación de su estrategia
      de resiliencia operativa digital establecida en el artículo 6, apartado 8. Cartografiarán la evolución
      del riesgo relacionado con las TIC a lo largo del tiempo, analizarán la frecuencia, los tipos, la
      magnitud y la evolución de los incidentes relacionados con las TIC, en particular los ciberataques
      y sus patrones, con el fin de comprender el nivel de exposición al riesgo relacionado con las TIC,
      en particular por cuanto atañe a funciones esenciales o importantes, y mejorar la madurez y preparación
      cibernéticas de la entidad financiera.


      5. El personal directivo responsable de las TIC informará al menos una vez al año al órgano de dirección
      de los hallazgos a que se refiere el apartado 3 y formulará recomendaciones.


      6. Las entidades financieras desarrollarán programas de sensibilización en materia de seguridad
      de las TIC y formación sobre resiliencia operativa digital, que constituirán módulos obligatorios
      en sus programas de formación del personal. Esos programas y acciones formativas serán aplicables
      a todos los empleados y al personal de alta dirección y tendrán un nivel de complejidad acorde con
      las atribuciones de sus funciones. Cuando proceda, las entidades financieras también incluirán a
      proveedores terceros de servicios de TIC en sus planes de formación pertinentes de conformidad con
      el artículo 30, apartado 2, letra i).


      7. Las entidades financieras que no sean microempresas supervisarán continuamente los avances tecnológicos
      pertinentes, también con vistas a comprender las posibles repercusiones del despliegue de esas nuevas
      tecnologías en los requisitos de seguridad de las TIC y la resiliencia operativa digital. Se mantendrán
      al día de los últimos procesos de gestión del riesgo relacionado con las TIC, para luchar efectivamente
      contra las formas existentes o nuevas de ciberataques.'
    official_text_en: '1. Financial entities shall have in place capabilities and staff to gather information
      on vulnerabilities and cyber threats, ICT-related incidents, in particular cyber-attacks, and analyse
      the impact they are likely to have on their digital operational resilience.


      2. Financial entities shall put in place post ICT-related incident reviews after a major ICT-related
      incident disrupts their core activities, analysing the causes of disruption and identifying required
      improvements to the ICT operations or within the ICT business continuity policy referred to in Article
      11.


      Financial entities, other than microenterprises, shall, upon request, communicate to the competent
      authorities, the changes that were implemented following post ICT-related incident reviews as referred
      to in the first subparagraph.


      The post ICT-related incident reviews referred to in the first subparagraph shall determine whether
      the established procedures were followed and the actions taken were effective, including in relation
      to the following:


      (a) the promptness in responding to security alerts and determining the impact of ICT-related incidents
      and their severity;


      (b) the quality and speed of performing a forensic analysis, where deemed appropriate;


      (c) the effectiveness of incident escalation within the financial entity;


      (d) the effectiveness of internal and external communication.


      3. Lessons derived from the digital operational resilience testing carried out in accordance with
      Articles 26 and 27 and from real life ICT-related incidents, in particular cyber-attacks, along
      with challenges faced upon the activation of ICT business continuity plans and ICT response and
      recovery plans, together with relevant information exchanged with counterparts and assessed during
      supervisory reviews, shall be duly incorporated on a continuous basis into the ICT risk assessment
      process. Those findings shall form the basis for appropriate reviews of relevant components of the
      ICT risk management framework referred to in Article 6(1).


      4. Financial entities shall monitor the effectiveness of the implementation of their digital operational
      resilience strategy set out in Article 6(8). They shall map the evolution of ICT risk over time,
      analyse the frequency, types, magnitude and evolution of ICT-related incidents, in particular cyber-attacks
      and their patterns, with a view to understanding the level of ICT risk exposure, in particular in
      relation to critical or important functions, and enhance the cyber maturity and preparedness of
      the financial entity.


      5. Senior ICT staff shall report at least yearly to the management body on the findings referred
      to in paragraph 3 and put forward recommendations.


      6. Financial entities shall develop ICT security awareness programmes and digital operational resilience
      training as compulsory modules in their staff training schemes. Those programmes and training shall
      be applicable to all employees and to senior management staff, and shall have a level of complexity
      commensurate to the remit of their functions. Where appropriate, financial entities shall also include
      ICT third-party service providers in their relevant training schemes in accordance with Article
      30(2), point (i).


      7. Financial entities, other than microenterprises, shall monitor relevant technological developments
      on a continuous basis, also with a view to understanding the possible impact of the deployment of
      such new technologies on ICT security requirements and digital operational resilience. They shall
      keep up-to-date with the latest ICT risk management processes, in order to effectively combat current
      or new forms of cyber-attacks.'
    section: Artículo 13
    source_sha256: 04c7599e87cbcd1a7847195b8202d3664636140786d32a293367f6c160fe0c73
- id: c2.art14
  title_es: Comunicación
  title_en: Communication
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_14
  attributes:
    official_text_es: '1. Como parte del marco de gestión del riesgo relacionado con las TIC a que se
      refiere el artículo 6, apartado 1, las entidades financieras dispondrán de planes de comunicación
      de crisis que permitan la divulgación responsable de, al menos, los incidentes graves relacionados
      con las TIC o las vulnerabilidades importantes a clientes y contrapartes, así como al público, según
      proceda.


      2. Como parte del marco de gestión del riesgo relacionado con las TIC, las entidades financieras
      aplicarán políticas de comunicación destinadas al personal interno y a las partes interesadas externas.
      Las políticas de comunicación destinadas al personal tendrán en cuenta la necesidad de diferenciar
      entre el personal que participa en la gestión del riesgo relacionado con las TIC, en particular
      el personal responsable de la respuesta y la recuperación, y el personal al que es necesario informar.


      3. Al menos una persona de la entidad financiera se encargará de aplicar la estrategia de comunicación
      sobre incidentes relacionados con las TIC y desempeñará a tal efecto la función de portavoz ante
      el público y los medios de comunicación.'
    official_text_en: '1. As part of the ICT risk management framework referred to in Article 6(1), financial
      entities shall have in place crisis communication plans enabling a responsible disclosure of, at
      least, major ICT-related incidents or vulnerabilities to clients and counterparts as well as to
      the public, as appropriate.


      2. As part of the ICT risk management framework, financial entities shall implement communication
      policies for internal staff and for external stakeholders. Communication policies for staff shall
      take into account the need to differentiate between staff involved in ICT risk management, in particular
      the staff responsible for response and recovery, and staff that needs to be informed.


      3. At least one person in the financial entity shall be tasked with implementing the communication
      strategy for ICT-related incidents and fulfil the public and media function for that purpose.'
    section: Artículo 14
    source_sha256: 301199cccf586e0aeefc59d219e60cddfa535bb6ecb8680bd498fec7032dedcd
- id: c2.art16
  title_es: Marco simplificado de gestión del riesgo relacionado con las TIC
  title_en: Simplified ICT risk management framework
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_16
  attributes:
    official_text_es: '1. Los artículos 5 a 15 del presente Reglamento no se aplicarán a las empresas
      de servicios de inversión pequeñas y no interconectadas ni a las entidades de pago exentas en virtud
      de la Directiva (UE) 2015/2366; ni a las entidades exentas en virtud de la Directiva 2013/36/UE
      respecto de las cuales los Estados miembros hayan decidido no aplicar la opción a que se refiere
      el artículo 2, apartado 4, del presente Reglamento, ni a las entidades de dinero electrónico exentas
      en virtud de la Directiva 2009/110/CE; ni a los fondos de pensiones de empleo pequeños.


      Sin perjuicio de lo dispuesto en el párrafo primero, las entidades enumeradas en el párrafo primero
      deberán:


      a) crear y mantener un marco de gestión sólido y documentado de riesgos relacionados con las TIC
      en el que se detallen los mecanismos y las medidas encaminados a procurar una gestión rápida, efectiva
      y global del riesgo relacionado con las TIC, incluida la protección de las infraestructuras y los
      componentes físicos pertinentes;


      b) supervisar de manera permanente la seguridad y el funcionamiento de todos los sistemas de TIC;


      c) minimizar las consecuencias del riesgo relacionado con las TIC mediante el uso de sistemas, protocolos
      y herramientas de TIC sólidos, resilientes y actualizados que sean apropiados para sustentar el
      desempeño de sus actividades y la prestación de servicios y para proteger adecuadamente la disponibilidad,
      autenticidad, integridad y confidencialidad de los datos en las redes y sistemas de información;


      d) permitir que las fuentes de riesgo relacionado con las TIC y las anomalías en las redes y sistemas
      de información se identifiquen y detecten de inmediato y que los incidentes relacionados con las
      TIC se gestionen con rapidez;


      e) identificar dependencias clave de proveedores terceros de servicios de TIC;


      f) garantizar la continuidad de las funciones esenciales o importantes mediante planes de continuidad
      de la actividad y medidas de respuesta y recuperación que incluyan, al menos, medidas de respaldo
      y restablecimiento de datos;


      g) someter a pruebas periódicas los planes y medidas a que se refiere la letra f), así como la eficacia
      de los controles llevados a cabo de conformidad con las letras a) y c);


      h) aplicar, según proceda, las conclusiones operativas pertinentes resultantes de las pruebas a
      que se refiere la letra g) y de los análisis tras incidentes al proceso de evaluación del riesgo
      relacionado con las TIC y desarrollar, de acuerdo con las necesidades y el perfil de riesgo de TIC,
      programas de sensibilización en materia de seguridad de las TIC y formación en materia de resiliencia
      operativa digital para el personal y la dirección.


      2. El marco de gestión del riesgo relacionado con las TIC a que se refiere el apartado 1, párrafo
      segundo, letra a), se documentará y revisará periódicamente y cuando se produzcan incidentes graves
      relacionados con las TIC, de conformidad con las instrucciones de supervisión. Se mejorará continuamente
      sobre la base de las enseñanzas derivadas de la aplicación y el seguimiento. Se presentará a la
      autoridad competente cuando esta lo solicite un informe sobre la revisión del marco de gestión del
      riesgo relacionado con las TIC.


      3. Las Autoridades Europeas de Supervisión, a través del Comité Mixto y en consulta con la ENISA,
      desarrollarán proyectos de normas técnicas de regulación comunes a fin de:


      a) especificar más detalladamente los elementos que deben incluirse en el marco de gestión del riesgo
      relacionado con las TIC a que se refiere el apartado 1, párrafo segundo, letra a);


      b) especificar más detalladamente los elementos en relación con los sistemas, protocolos y herramientas
      para minimizar las consecuencias del riesgo relacionado con las TIC a que se refiere el apartado
      1, párrafo segundo, letra c), con el fin de garantizar la seguridad de las redes, permitir el establecimiento
      de salvaguardias adecuadas contra las intrusiones y el uso indebido de los datos y preservar la
      disponibilidad, autenticidad, integridad y confidencialidad de los datos;


      c) especificar más detalladamente los componentes de los planes de continuidad de la actividad en
      materia de TIC a que se refiere el apartado 1, párrafo segundo, letra f);


      d) especificar más detalladamente las normas sobre las pruebas de los planes de continuidad de la
      actividad y garantizar la efectividad de los controles a que se refiere el apartado 1, párrafo segundo,
      letra g), y asegurar que estas pruebas tengan debidamente en cuenta escenarios en los que la calidad
      de la ejecución de una función esencial o importante se deteriore hasta un nivel inaceptable o falle;


      e) especificar más detalladamente el contenido y el formato del informe sobre la revisión del marco
      de gestión del riesgo relacionado con las TIC a que se refiere el apartado 2.


      A la hora de elaborar dichos proyectos de normas técnicas de regulación, las Autoridades Europeas
      de Supervisión tendrán en cuenta el tamaño y el perfil de riesgo general de la entidad financiera,
      así como la naturaleza, escala y complejidad de sus servicios, actividades y operaciones.


      Las Autoridades Europeas de Supervisión presentarán a la Comisión dichos proyectos de normas técnicas
      de regulación a más tardar el 17 de enero de 2024.


      Se delegan en la Comisión los poderes para completar el presente Reglamento mediante la adopción
      de las normas técnicas de regulación a que se refiere el párrafo primero de conformidad con los
      artículos 10 a 14 del Reglamento (UE) n.o 1093/2010, los artículos 10 a 14 del Reglamento (UE) n.o
      1094/2010 y los artículos 10 a 14 del Reglamento (UE) n.o 1095/2010.'
    official_text_en: '1. Articles 5 to 15 of this Regulation shall not apply to small and non-interconnected
      investment firms, payment institutions exempted pursuant to Directive (EU) 2015/2366; institutions
      exempted pursuant to Directive 2013/36/EU in respect of which Member States have decided not to
      apply the option referred to in Article 2(4) of this Regulation; electronic money institutions exempted
      pursuant to Directive 2009/110/EC; and small institutions for occupational retirement provision.


      Without prejudice to the first subparagraph, the entities listed in the first subparagraph shall:


      (a) put in place and maintain a sound and documented ICT risk management framework that details
      the mechanisms and measures aimed at a quick, efficient and comprehensive management of ICT risk,
      including for the protection of relevant physical components and infrastructures;


      (b) continuously monitor the security and functioning of all ICT systems;


      (c) minimise the impact of ICT risk through the use of sound, resilient and updated ICT systems,
      protocols and tools which are appropriate to support the performance of their activities and the
      provision of services and adequately protect availability, authenticity, integrity and confidentiality
      of data in the network and information systems;


      (d) allow sources of ICT risk and anomalies in the network and information systems to be promptly
      identified and detected and ICT-related incidents to be swiftly handled;


      (e) identify key dependencies on ICT third-party service providers;


      (f) ensure the continuity of critical or important functions, through business continuity plans
      and response and recovery measures, which include, at least, back-up and restoration measures;


      (g) test, on a regular basis, the plans and measures referred to in point (f), as well as the effectiveness
      of the controls implemented in accordance with points (a) and (c);


      (h) implement, as appropriate, relevant operational conclusions resulting from the tests referred
      to in point (g) and from post-incident analysis into the ICT risk assessment process and develop,
      according to needs and ICT risk profile, ICT security awareness programmes and digital operational
      resilience training for staff and management.


      2. The ICT risk management framework referred to in paragraph 1, second subparagraph, point (a),
      shall be documented and reviewed periodically and upon the occurrence of major ICT-related incidents
      in compliance with supervisory instructions. It shall be continuously improved on the basis of lessons
      derived from implementation and monitoring. A report on the review of the ICT risk management framework
      shall be submitted to the competent authority upon its request.


      3. The ESAs shall, through the Joint Committee, in consultation with the ENISA, develop common draft
      regulatory technical standards in order to:


      (a) specify further the elements to be included in the ICT risk management framework referred to
      in paragraph 1, second subparagraph, point (a);


      (b) specify further the elements in relation to systems, protocols and tools to minimise the impact
      of ICT risk referred to in paragraph 1, second subparagraph, point (c), with a view to ensuring
      the security of networks, enabling adequate safeguards against intrusions and data misuse and preserving
      the availability, authenticity, integrity and confidentiality of data;


      (c) specify further the components of the ICT business continuity plans referred to in paragraph
      1, second subparagraph, point (f);


      (d) specify further the rules on the testing of business continuity plans and ensure the effectiveness
      of the controls referred to in paragraph 1, second subparagraph, point (g) and ensure that such
      testing duly takes into account scenarios in which the quality of the provision of a critical or
      important function deteriorates to an unacceptable level or fails;


      (e) specify further the content and format of the report on the review of the ICT risk management
      framework referred to in paragraph 2.


      When developing those draft regulatory technical standards, the ESAs shall take into account the
      size and the overall risk profile of the financial entity, and the nature, scale and complexity
      of its services, activities and operations.


      The ESAs shall submit those draft regulatory technical standards to the Commission by 17 January
      2024.


      Power is delegated to the Commission to supplement this Regulation by adopting the regulatory technical
      standards referred to in the first subparagraph in accordance with Articles 10 to 14 of Regulations
      (EU) No 1093/2010, (EU) No 1094/2010 and (EU) No 1095/2010.'
    section: Artículo 16
    source_sha256: f115d764bf06df515fa7411c54ae0c8d24e1ffb32eac72f6a0fce28ce42c1fb5
- id: c3.art17
  title_es: Proceso de gestión de incidentes relacionados con las TIC
  title_en: ICT-related incident management process
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_17
  attributes:
    official_text_es: '1. Las entidades financieras definirán, establecerán y aplicarán un proceso de
      gestión de incidentes relacionados con las TIC para detectar, gestionar y notificar dichos incidentes.


      2. Las entidades financieras registrarán todos los incidentes relacionados con las TIC y las ciberamenazas
      importantes. Las entidades financieras establecerán los procedimientos y procesos adecuados para
      que los incidentes relacionados con las TIC sean objeto de un seguimiento, un tratamiento y una
      respuesta coherentes e integrados, a fin de asegurarse de que se identifiquen, se documenten y se
      aborden las causas subyacentes para evitar que se produzcan.


      3. El proceso de gestión de incidentes relacionados con las TIC mencionado en el apartado 1:


      a) establecerá indicadores de alerta temprana;


      b) establecerá procedimientos para identificar, rastrear, registrar, categorizar y clasificar los
      incidentes relacionados con las TIC en función de su prioridad y gravedad y en función del carácter
      esencial de los servicios perjudicados, conforme a los criterios establecidos en el artículo 18,
      apartado 1;


      c) asignará funciones y responsabilidades que deban activarse para los diferentes tipos y escenarios
      de incidentes relacionados con las TIC;


      d) expondrá planes para la comunicación con el personal, las partes interesadas externas y los medios
      de comunicación de conformidad con el artículo 14, para la notificación a los clientes, para los
      procedimientos internos de traslado a la instancia jerárquica superior, que abarquen también las
      reclamaciones de los clientes relacionadas con las TIC, así como para el suministro de información
      a las entidades financieras que actúen como contraparte, según proceda;


      e) garantizará que al menos los incidentes graves relacionados con las TIC se pongan en conocimiento
      de los altos directivos pertinentes y que se informe de ellos al órgano de dirección, explicando
      sus repercusiones, las medidas adoptadas como respuesta y los controles adicionales que se prevé
      implantar como resultado de estos incidentes graves relacionados con las TIC;


      f) establecerá procedimientos de respuesta a los incidentes relacionados con las TIC para mitigar
      sus repercusiones y garantizar que los servicios sean nuevamente operativos y seguros de manera
      oportuna.'
    official_text_en: '1. Financial entities shall define, establish and implement an ICT-related incident
      management process to detect, manage and notify ICT-related incidents.


      2. Financial entities shall record all ICT-related incidents and significant cyber threats. Financial
      entities shall establish appropriate procedures and processes to ensure a consistent and integrated
      monitoring, handling and follow-up of ICT-related incidents, to ensure that root causes are identified,
      documented and addressed in order to prevent the occurrence of such incidents.


      3. The ICT-related incident management process referred to in paragraph 1 shall:


      (a) put in place early warning indicators;


      (b) establish procedures to identify, track, log, categorise and classify ICT-related incidents
      according to their priority and severity and according to the criticality of the services impacted,
      in accordance with the criteria set out in Article 18(1);


      (c) assign roles and responsibilities that need to be activated for different ICT-related incident
      types and scenarios;


      (d) set out plans for communication to staff, external stakeholders and media in accordance with
      Article 14 and for notification to clients, for internal escalation procedures, including ICT-related
      customer complaints, as well as for the provision of information to financial entities that act
      as counterparts, as appropriate;


      (e) ensure that at least major ICT-related incidents are reported to relevant senior management
      and inform the management body of at least major ICT-related incidents, explaining the impact, response
      and additional controls to be established as a result of such ICT-related incidents;


      (f) establish ICT-related incident response procedures to mitigate impacts and ensure that services
      become operational and secure in a timely manner.'
    section: Artículo 17
    source_sha256: 3fd65518ddd69ab565b114370227b64cfac57b1efc6d942ecacf1be9f39eb782
- id: c3.art18
  title_es: Clasificación de los incidentes relacionados con las TIC y las ciberamenazas
  title_en: Classification of ICT-related incidents and cyber threats
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_18
  attributes:
    official_text_es: '1. Las entidades financieras clasificarán los incidentes relacionados con las TIC
      y determinarán su repercusión con arreglo a los siguientes criterios:


      a) número y/o pertinencia de los clientes o las contrapartes financieras afectados y, cuando proceda,
      la cantidad o el número de transacciones afectadas por el incidente relacionado con las TIC, y si
      dicho incidente ha repercutido en la reputación;


      b) duración del incidente relacionado con las TIC, incluida la duración de la interrupción del servicio;


      c) extensión geográfica de las zonas afectadas por el incidente relacionado con las TIC, en especial
      si afecta a más de dos Estados miembros;


      d) pérdidas de datos que el incidente relacionado con las TIC acarree, en relación con la disponibilidad,
      la autenticidad, la integridad o la confidencialidad de los datos;


      e) carácter esencial de los servicios afectados, incluidas las transacciones y operaciones de la
      entidad financiera;


      f) las consecuencias económicas, en particular los costes y las pérdidas directos e indirectos,
      del incidente relacionado con las TIC, tanto en términos absolutos como relativos.


      2. Las entidades financieras clasificarán las ciberamenazas como importantes en función del carácter
      esencial de los servicios en situación de riesgo, incluidas las transacciones y operaciones de la
      entidad financiera, el número y/o la pertinencia de los clientes o de las contrapartes financieras
      a las que se dirigen las amenazas y la extensión geográfica de las zonas de riesgo.


      3. Las Autoridades Europeas de Supervisión, a través del Comité Mixto y en consulta con el BCE y
      la ENISA, elaborarán proyectos de normas técnicas de regulación comunes en las que se especificará
      más detalladamente lo siguiente:


      a) los criterios expuestos en el apartado 1, y en concreto los umbrales de importancia relativa
      para determinar los incidentes graves relacionados con las TIC o, según corresponda, los incidentes
      operativos o de seguridad graves relacionados con los pagos que son de obligada notificación con
      arreglo al artículo 19, apartado 1;


      b) los criterios que deberán aplicar las autoridades competentes para evaluar la relevancia de los
      incidentes graves relacionados con las TIC o, según corresponda, los incidentes operativos o de
      seguridad graves relacionados con los pagos, para las autoridades competentes pertinentes de otros
      Estados miembros, y los detalles de las notificaciones de incidentes graves relacionados con las
      TIC o, según corresponda, incidentes operativos o de seguridad graves relacionados con los pagos,
      que deberán compartirse con otras autoridades competentes en virtud del artículo 19, apartados 6
      y 7;


      c) los criterios establecidos en el apartado 2 del presente artículo, incluidos umbrales de importancia
      relativa elevados para determinar las ciberamenazas importantes.


      4. Cuando elaboren los proyectos de normas técnicas de regulación comunes a que se refiere el apartado
      3 del presente artículo, las Autoridades Europeas de Supervisión tendrán en cuenta los criterios
      establecidos en el artículo 4, apartado 2, así como las normas internacionales, las orientaciones
      y las especificaciones elaboradas y publicadas por la ENISA, incluidas, cuando proceda, las especificaciones
      para otros sectores económicos. A efectos de la aplicación de los criterios establecidos en el artículo
      4, apartado 2, las Autoridades Europeas de Supervisión tendrán debidamente en cuenta la necesidad
      de que las microempresas y las pequeñas y medianas empresas movilicen recursos y capacidades suficientes
      para garantizar una gestión rápida de los incidentes relacionado con las TIC.


      Las Autoridades Europeas de Supervisión presentarán a la Comisión dichos proyectos de normas técnicas
      de regulación comunes a más tardar el 17 de enero de 2024.


      Se delegan en la Comisión los poderes para completar el presente Reglamento mediante la adopción
      de las normas técnicas de regulación a que se refiere el apartado 3 de conformidad con los artículos
      10 a 14 del Reglamento (UE) n.o 1093/2010, los artículos 10 a 14 del Reglamento (UE) n.o 1094/2010
      y los artículos 10 a 14 del Reglamento (UE) n.o 1095/2010.'
    official_text_en: '1. Financial entities shall classify ICT-related incidents and shall determine
      their impact based on the following criteria:


      (a) the number and/or relevance of clients or financial counterparts affected and, where applicable,
      the amount or number of transactions affected by the ICT-related incident, and whether the ICT-related
      incident has caused reputational impact;


      (b) the duration of the ICT-related incident, including the service downtime;


      (c) the geographical spread with regard to the areas affected by the ICT-related incident, particularly
      if it affects more than two Member States;


      (d) the data losses that the ICT-related incident entails, in relation to availability, authenticity,
      integrity or confidentiality of data;


      (e) the criticality of the services affected, including the financial entity’s transactions and
      operations;


      (f) the economic impact, in particular direct and indirect costs and losses, of the ICT-related
      incident in both absolute and relative terms.


      2. Financial entities shall classify cyber threats as significant based on the criticality of the
      services at risk, including the financial entity’s transactions and operations, number and/or relevance
      of clients or financial counterparts targeted and the geographical spread of the areas at risk.


      3. The ESAs shall, through the Joint Committee and in consultation with the ECB and ENISA, develop
      common draft regulatory technical standards further specifying the following:


      (a) the criteria set out in paragraph 1, including materiality thresholds for determining major
      ICT-related incidents or, as applicable, major operational or security payment-related incidents,
      that are subject to the reporting obligation laid down in Article 19(1);


      (b) the criteria to be applied by competent authorities for the purpose of assessing the relevance
      of major ICT-related incidents or, as applicable, major operational or security payment-related
      incidents, to relevant competent authorities in other Member States’, and the details of reports
      of major ICT-related incidents or, as applicable, major operational or security payment-related
      incidents, to be shared with other competent authorities pursuant to Article 19(6) and (7);


      (c) the criteria set out in paragraph 2 of this Article, including high materiality thresholds for
      determining significant cyber threats.


      4. When developing the common draft regulatory technical standards referred to in paragraph 3 of
      this Article, the ESAs shall take into account the criteria set out in Article 4(2), as well as
      international standards, guidance and specifications developed and published by ENISA, including,
      where appropriate, specifications for other economic sectors. For the purposes of applying the criteria
      set out in Article 4(2), the ESAs shall duly consider the need for microenterprises and small and
      medium-sized enterprises to mobilise sufficient resources and capabilities to ensure that ICT-related
      incidents are managed swiftly.


      The ESAs shall submit those common draft regulatory technical standards to the Commission by 17
      January 2024.


      Power is delegated to the Commission to supplement this Regulation by adopting the regulatory technical
      standards referred to in paragraph 3 in accordance with Articles 10 to 14 of Regulations (EU) No
      1093/2010, (EU) No 1094/2010 and (EU) No 1095/2010.'
    section: Artículo 18
    source_sha256: 1daf4ce9ad1d343164475e0807904c812f411748e235102845d3786203d28193
- id: c3.art19
  title_es: Notificación de los incidentes graves relacionados con las TIC y notificación voluntaria de
    las ciberamenazas importantes
  title_en: Reporting of major ICT-related incidents and voluntary notification of significant cyber threats
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_19
  attributes:
    official_text_es: '1. Las entidades financieras notificarán los incidentes graves relacionados con
      las TIC a la autoridad competente pertinente a que se refiere el artículo 46, de conformidad con
      el apartado 4 del presente artículo.


      Cuando una entidad financiera sea supervisada por más de una autoridad nacional competente contemplada
      en el artículo 46, los Estados miembros designarán a una única autoridad competente autoridad competente
      pertinente responsable del desempeño de las funciones y tareas establecidas en el presente artículo.


      Las entidades de crédito clasificadas como significativas de conformidad con el artículo 6, apartado
      4, del Reglamento (UE) n.o 1024/2013 notificarán los incidentes graves relacionados con las TIC
      a la autoridad nacional competente pertinente designada con arreglo al artículo 4 de la Directiva
      2013/36/UE, que transmitirá dicho informe de forma inmediata al BCE.


      A los efectos del párrafo primero, tras recopilar y analizar toda la información pertinente, las
      entidades financieras elaborarán la notificación inicial y los informes a que se refiere el apartado
      4 del presente artículo mediante la plantilla a que se refiere el artículo 20 y los presentarán
      a la autoridad competente. En caso de que un impedimento técnico haga imposible la presentación
      de la notificación inicial mediante la plantilla, las entidades financieras presentarán la notificación
      a la autoridad competente por medios alternativos.


      La notificación inicial y los informes a que hace referencia el apartado 4 incluirán toda la información
      necesaria para que la autoridad competente pueda determinar la importancia del incidente grave relacionado
      con las TIC y evaluar sus posibles efectos transfronterizos.


      Sin perjuicio de la notificación en virtud del párrafo primero por parte de la entidad financiera
      a la autoridad competente pertinente, los Estados miembros podrán determinar de manera adicional
      que algunas entidades financieras, o todas ellas, presenten también la notificación inicial y cada
      uno de los informes a que se refiere el apartado 4 del presente artículo, utilizando las plantillas
      mencionadas en el artículo 20, a las autoridades competentes o a los equipos de respuesta a incidentes
      de seguridad informática (CSIRT), designados o establecidos de conformidad con la Directiva (UE)
      2022/2555.


      2. Las entidades financieras podrán notificar, de manera voluntaria, ciberamenazas importantes a
      la autoridad competente pertinente cuando consideren que la amenaza es pertinente para el sistema
      financiero, los usuarios del servicio o los clientes. La autoridad competente pertinente podrá transmitir
      esta información a otras autoridades pertinentes mencionadas en el apartado 6.


      Las entidades de crédito clasificadas como significativas de conformidad con el artículo 6, apartado
      4, del Reglamento (UE) n.o 1024/2013 podrán, de manera voluntaria, notificar las ciberamenazas importantes
      a la autoridad nacional competente pertinente designada con arreglo al artículo 4 de la Directiva
      2013/36/UE, que transmitirá dicho informe de forma inmediata al BCE.


      Los Estados miembros podrán determinar que las entidades financieras que notifiquen voluntariamente
      de conformidad con el párrafo primero puedan también transmitir dicha notificación a los CSIRT designados
      o establecidos de conformidad con la Directiva (UE) 2022/2555.


      3. Cuando se produzca un incidente grave relacionado con las TIC y tenga consecuencias para los
      intereses financieros de los clientes, las entidades financieras informarán sin demora indebida
      de dicho incidente tan pronto como tengan conocimiento del mismo, a sus clientes y les comunicarán
      todas las medidas que se hayan adoptado para mitigar sus efectos adversos.


      En caso de ciberamenaza importante, las entidades financieras informarán, cuando proceda, a aquellos
      de sus clientes que pudieran verse afectados de cualquier medida de protección adecuada que estos
      consideren oportuno adoptar.


      4. Las entidades financieras presentarán a la autoridad competente pertinente, dentro de los plazos
      que se establezcan de conformidad con el artículo 20, párrafo primero, letra a), inciso ii), la
      siguiente información:


      a) una notificación inicial;


      b) un informe intermedio posterior a la notificación inicial a que se refiere la letra a), tan pronto
      como la situación del incidente original haya cambiado considerablemente o la gestión del incidente
      grave relacionado con las TIC haya cambiado en función de las últimas informaciones disponibles,
      seguido, cuando sea necesario, de notificaciones actualizadas cada vez que se disponga de una actualización
      pertinente de la situación, y siempre que lo solicite expresamente la autoridad competente;


      c) un informe final, cuando haya concluido el análisis de la causa subyacente, con independencia
      de que ya se hayan aplicado medidas paliativas, y cuando se disponga de las cifras reales de incidencia
      para sustituir a las estimaciones.


      5. Las entidades financieras podrán externalizar, de conformidad con el Derecho sectorial de la
      Unión y nacional, las obligaciones de información establecidas en el presente artículo a un proveedor
      tercero de servicios. En el caso de tal externalización, la entidad financiera seguirá siendo plenamente
      responsable del cumplimiento de los requisitos en materia de notificación de incidentes.


      6. Una vez reciba la notificación inicial y de cada uno de los informes a que se refiere el apartado
      4, la autoridad competente facilitará oportunamente información detallada sobre el incidente grave
      relacionado con las TIC a los siguientes destinatarios en función, según proceda, de sus competencias
      respectivas:


      a) la ABE, la AEVM o la AESPJ;


      b) el BCE en el caso de las entidades financieras a que se refiere el artículo 2, apartado 1, letras
      a), b) y d);


      c) las autoridades competentes, los puntos de contacto únicos o los CSIRT designados o establecidos
      de conformidad con la Directiva (UE) 2022/2555;


      d) las autoridades de resolución a que se refiere el artículo 3 de la Directiva 2014/59/UE, y la
      Junta Única de Resolución con respecto a las entidades a que se refiere el artículo 7, apartado
      2, del Reglamento (UE) n.o 806/2014 del Parlamento Europeo y del Consejo (37) y con respecto a las
      entidades y grupos a que se refiere el artículo 7, apartado 4, letra b), y apartado 5, del Reglamento
      (UE) n.o 806/2014 en caso de que dicha información detallada haga referencia a incidentes que suponen
      un riesgo para garantizar funciones esenciales en el sentido del artículo 2, apartado 1, punto 35,
      de la Directiva 2014/59/UE, y


      e) otras autoridades públicas pertinentes con arreglo al Derecho nacional.


      7. Una vez recibida la información de conformidad con el apartado 6, la ABE, la AEVM o la AESPJ
      y el BCE, en consulta con la ENISA y en cooperación con la autoridad competente pertinente, evaluarán
      si el incidente grave relacionado con las TIC es pertinente para las autoridades competentes de
      otros Estados miembros. Tras esta evaluación, la ABE, la AEVM o la AESPJ notificarán en consecuencia
      lo antes posible a las autoridades competentes pertinentes de otros Estados miembros. El BCE notificará
      las cuestiones pertinentes para el sistema de pagos a los miembros del Sistema Europeo de Bancos
      Centrales. Basándose en dicha notificación, las autoridades competentes tomarán, en su caso, las
      medidas necesarias para proteger la estabilidad inmediata del sistema financiero.


      8. La notificación que debe efectuar la AEVM en virtud del apartado 7 del presente artículo se entiende
      sin perjuicio de la responsabilidad de la autoridad competente de transmitir urgentemente la información
      detallada sobre el incidente grave relacionado con las TIC a la autoridad pertinente del Estado
      miembro de acogida cuando un depositario central de valores tenga una actividad transfronteriza
      significativa en el Estado miembro de acogida, cuando el incidente grave relacionado con las TIC
      pueda tener consecuencias graves para los mercados financieros del Estado miembro de acogida y cuando
      existan acuerdos de cooperación entre las autoridades competentes en relación con la supervisión
      de las entidades financieras.'
    official_text_en: '1. Financial entities shall report major ICT-related incidents to the relevant
      competent authority as referred to in Article 46 in accordance with paragraph 4 of this Article.


      Where a financial entity is subject to supervision by more than one national competent authority
      referred to in Article 46, Member States shall designate a single competent authority as the relevant
      competent authority responsible for carrying out the functions and duties provided for in this Article.


      Credit institutions classified as significant, in accordance with Article 6(4) of Regulation (EU)
      No 1024/2013, shall report major ICT-related incidents to the relevant national competent authority
      designated in accordance with Article 4 of Directive 2013/36/EU, which shall immediately transmit
      that report to the ECB.


      For the purpose of the first subparagraph, financial entities shall produce, after collecting and
      analysing all relevant information, the initial notification and reports referred to in paragraph
      4 of this Article using the templates referred to in Article 20 and submit them to the competent
      authority. In the event that a technical impossibility prevents the submission of the initial notification
      using the template, financial entities shall notify the competent authority about it via alternative
      means.


      The initial notification and reports referred to in paragraph 4 shall include all information necessary
      for the competent authority to determine the significance of the major ICT-related incident and
      assess possible cross-border impacts.


      Without prejudice to the reporting pursuant to the first subparagraph by the financial entity to
      the relevant competent authority, Member States may additionally determine that some or all financial
      entities shall also provide the initial notification and each report referred to in paragraph 4
      of this Article using the templates referred to in Article 20 to the competent authorities or the
      computer security incident response teams (CSIRTs) designated or established in accordance with
      Directive (EU) 2022/2555.


      2. Financial entities may, on a voluntary basis, notify significant cyber threats to the relevant
      competent authority when they deem the threat to be of relevance to the financial system, service
      users or clients. The relevant competent authority may provide such information to other relevant
      authorities referred to in paragraph 6.


      Credit institutions classified as significant, in accordance with Article 6(4) of Regulation (EU)
      No 1024/2013, may, on a voluntary basis, notify significant cyber threats to relevant national competent
      authority, designated in accordance with Article 4 of Directive 2013/36/EU, which shall immediately
      transmit the notification to the ECB.


      Member States may determine that those financial entities that on a voluntary basis notify in accordance
      with the first subparagraph may also transmit that notification to the CSIRTs designated or established
      in accordance with Directive (EU) 2022/2555.


      3. Where a major ICT-related incident occurs and has an impact on the financial interests of clients,
      financial entities shall, without undue delay as soon as they become aware of it, inform their clients
      about the major ICT-related incident and about the measures that have been taken to mitigate the
      adverse effects of such incident.


      In the case of a significant cyber threat, financial entities shall, where applicable, inform their
      clients that are potentially affected of any appropriate protection measures which the latter may
      consider taking.


      4. Financial entities shall, within the time limits to be laid down in accordance with Article 20,
      first paragraph, point (a), point (ii), submit the following to the relevant competent authority:


      (a) an initial notification;


      (b) an intermediate report after the initial notification referred to in point (a), as soon as the
      status of the original incident has changed significantly or the handling of the major ICT-related
      incident has changed based on new information available, followed, as appropriate, by updated notifications
      every time a relevant status update is available, as well as upon a specific request of the competent
      authority;


      (c) a final report, when the root cause analysis has been completed, regardless of whether mitigation
      measures have already been implemented, and when the actual impact figures are available to replace
      estimates.


      5. Financial entities may outsource, in accordance with Union and national sectoral law, the reporting
      obligations under this Article to a third-party service provider. In case of such outsourcing, the
      financial entity remains fully responsible for the fulfilment of the incident reporting requirements.


      6. Upon receipt of the initial notification and of each report referred to in paragraph 4, the competent
      authority shall, in a timely manner, provide details of the major ICT-related incident to the following
      recipients based, as applicable, on their respective competences:


      (a) EBA, ESMA or EIOPA;


      (b) the ECB, in the case of financial entities referred to in Article 2(1), points (a), (b) and
      (d);


      (c) the competent authorities, single points of contact or CSIRTs designated or established in accordance
      with Directive (EU) 2022/2555;


      (d) the resolution authorities, as referred to in Article 3 of Directive 2014/59/EU, and the Single
      Resolution Board (SRB) with respect to entities referred to in Article 7(2) of Regulation (EU) No
      806/2014 of the European Parliament and of the Council (37), and with respect to entities and groups
      referred to in Article 7(4)(b) and (5) of Regulation (EU) No 806/2014 if such details concern incidents
      that pose a risk to ensuring critical functions within the meaning of Article 2(1), point (35),
      of Directive 2014/59/EU; and


      (e) other relevant public authorities under national law.


      7. Following receipt of information in accordance with paragraph 6, EBA, ESMA or EIOPA and the ECB,
      in consultation with ENISA and in cooperation with the relevant competent authority, shall assess
      whether the major ICT-related incident is relevant for competent authorities in other Member States.
      Following that assessment, EBA, ESMA or EIOPA shall, as soon as possible, notify relevant competent
      authorities in other Member States accordingly. The ECB shall notify the members of the European
      System of Central Banks on issues relevant to the payment system. Based on that notification, the
      competent authorities shall, where appropriate, take all of the necessary measures to protect the
      immediate stability of the financial system.


      8. The notification to be done by ESMA pursuant to paragraph 7 of this Article shall be without
      prejudice to the responsibility of the competent authority to urgently transmit the details of the
      major ICT-related incident to the relevant authority in the host Member State, where a central securities
      depository has significant cross-border activity in the host Member State, the major ICT-related
      incident is likely to have severe consequences for the financial markets of the host Member State
      and where there are cooperation arrangements among competent authorities related to the supervision
      of financial entities.'
