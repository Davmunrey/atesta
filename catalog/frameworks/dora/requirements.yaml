- id: c4.art24
  title_es: Requisitos generales para la realización de pruebas de resiliencia operativa digital
  title_en: General requirements for the performance of digital operational resilience testing
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_24
  attributes:
    official_text_es: '1. A fin de evaluar el estado de preparación para gestionar incidentes relacionados
      con las TIC, o de detectar debilidades, deficiencias y carencias en materia de resiliencia operativa
      digital y de aplicar sin demora medidas correctoras, las entidades financieras que no sean microempresas
      establecerán, mantendrán y revisarán, teniendo en cuenta los criterios establecidos en el artículo
      4, apartado 2, un programa de pruebas de resiliencia operativa digital sólido y completo que forme
      parte del marco de gestión del riesgo relacionado con las TIC a que se refiere el artículo 6.


      2. El programa de pruebas de resiliencia operativa digital incluirá una serie de evaluaciones, pruebas,
      métodos, prácticas y herramientas que se aplicarán de conformidad con los artículos 25 y 26.


      3. Al llevar a cabo el programa de pruebas de resiliencia operativa digital a que se refiere el
      apartado 1 del presente artículo, las entidades financieras que no sean microempresas seguirán un
      enfoque basado en el riesgo que tengan en cuenta los criterios establecidos en el artículo 4, apartado
      2, considerando debidamente el panorama cambiante del riesgo relacionado con las TIC, todo riesgo
      específico al que la entidad financiera de que se trate esté o pueda estar expuesta, el carácter
      esencial de los activos de información y de los servicios prestados, así como cualquier otro factor
      que la entidad financiera considere apropiado.


      4. Las entidades financieras que no sean microempresas garantizarán que las pruebas sean realizadas
      por partes independientes, ya sean internas o externas. Cuando un probador interno se encargue de
      realizar las pruebas, las entidades financieras dedicarán recursos suficientes y garantizarán que
      se evitan los conflictos de intereses durante todas las fases de constitución y ejecución de las
      pruebas.


      5. Las entidades financieras que no sean microempresas establecerán procedimientos y políticas para
      ordenar por prioridades, clasificar y corregir todos los problemas descubiertos durante la realización
      de las pruebas y establecerán métodos de validación internos para asegurarse de que todas las debilidades,
      deficiencias o carencias sean tratadas de manera exhaustiva.


      6. Las entidades financieras que no sean microempresas garantizarán, al menos una vez al año, que
      se efectúen las pruebas apropiadas de todos los sistemas y aplicaciones de TIC que sustenten funciones
      esenciales o importantes.'
    official_text_en: '1. For the purpose of assessing preparedness for handling ICT-related incidents,
      of identifying weaknesses, deficiencies and gaps in digital operational resilience, and of promptly
      implementing corrective measures, financial entities, other than microenterprises, shall, taking
      into account the criteria set out in Article 4(2), establish, maintain and review a sound and comprehensive
      digital operational resilience testing programme as an integral part of the ICT risk-management
      framework referred to in Article 6.


      2. The digital operational resilience testing programme shall include a range of assessments, tests,
      methodologies, practices and tools to be applied in accordance with Articles 25 and 26.


      3. When conducting the digital operational resilience testing programme referred to in paragraph
      1 of this Article, financial entities, other than microenterprises, shall follow a risk-based approach
      taking into account the criteria set out in Article 4(2) duly considering the evolving landscape
      of ICT risk, any specific risks to which the financial entity concerned is or might be exposed,
      the criticality of information assets and of services provided, as well as any other factor the
      financial entity deems appropriate.


      4. Financial entities, other than microenterprises, shall ensure that tests are undertaken by independent
      parties, whether internal or external. Where tests are undertaken by an internal tester, financial
      entities shall dedicate sufficient resources and ensure that conflicts of interest are avoided throughout
      the design and execution phases of the test.


      5. Financial entities, other than microenterprises, shall establish procedures and policies to prioritise,
      classify and remedy all issues revealed throughout the performance of the tests and shall establish
      internal validation methodologies to ascertain that all identified weaknesses, deficiencies or gaps
      are fully addressed.


      6. Financial entities, other than microenterprises, shall ensure, at least yearly, that appropriate
      tests are conducted on all ICT systems and applications supporting critical or important functions.'
    section: Artículo 24
    source_sha256: cb93c3b44b82996772ae02b265b255357ce2f9a70e944547769d2974c762a47b
- id: c4.art25
  title_es: Pruebas de las herramientas y los sistemas de TIC
  title_en: Testing of ICT tools and systems
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_25
  attributes:
    official_text_es: '1. El programa de pruebas de resiliencia operativa digital a que se refiere el
      artículo 24 dispondrá, de conformidad con los criterios establecidos en el artículo 4, apartado
      2, la ejecución de las pruebas adecuadas, como evaluaciones y exploraciones de vulnerabilidad, análisis
      del software de código abierto, evaluaciones de seguridad de la red, análisis de carencias, exámenes
      de la seguridad física, cuestionarios y soluciones de software de detección, revisiones del código
      fuente cuando sea posible, pruebas basadas en escenarios, pruebas de compatibilidad, pruebas de
      rendimiento, pruebas de extremo a extremo y pruebas de penetración.


      2. Los depositarios centrales de valores y las entidades de contrapartida central realizarán evaluaciones
      de vulnerabilidad antes de implantar o reimplantar aplicaciones y componentes de infraestructuras
      y servicios de TIC que sustenten funciones esenciales o importantes de la entidad financiera nuevos
      o ya existentes.


      3. Las microempresas realizarán las pruebas a que se refiere el apartado 1 mediante la combinación
      de un enfoque basado en el riesgo con una planificación estratégica de las pruebas de TIC, teniendo
      debidamente en cuenta la necesidad de mantener un planteamiento equilibrado entre la dimensión de
      los recursos y el tiempo que se asigne a las pruebas de TIC previstas en el presente artículo, por
      una parte, y la urgencia, el tipo de riesgo, el carácter esencial de los activos de información
      y de los servicios prestados, así como cualquier otro factor pertinente, incluida la capacidad de
      la entidad financiera para asumir riesgos calculados, por otra.'
    official_text_en: '1. The digital operational resilience testing programme referred to in Article
      24 shall provide, in accordance with the criteria set out in Article 4(2), for the execution of
      appropriate tests, such as vulnerability assessments and scans, open source analyses, network security
      assessments, gap analyses, physical security reviews, questionnaires and scanning software solutions,
      source code reviews where feasible, scenario-based tests, compatibility testing, performance testing,
      end-to-end testing and penetration testing.


      2. Central securities depositories and central counterparties shall perform vulnerability assessments
      before any deployment or redeployment of new or existing applications and infrastructure components,
      and ICT services supporting critical or important functions of the financial entity.


      3. Microenterprises shall perform the tests referred to in paragraph 1 by combining a risk-based
      approach with a strategic planning of ICT testing, by duly considering the need to maintain a balanced
      approach between the scale of resources and the time to be allocated to the ICT testing provided
      for in this Article, on the one hand, and the urgency, type of risk, criticality of information
      assets and of services provided, as well as any other relevant factor, including the financial entity’s
      ability to take calculated risks, on the other hand.'
    section: Artículo 25
    source_sha256: 57252a0d503e243c14cca4cafa5b58f5c26533d1cd3c51c773dd8eb50bc46a81
- id: c4.art26
  title_es: Pruebas avanzadas de las herramientas, los sistemas y los procesos de TIC basadas en pruebas
    de penetración basadas en amenazas
  title_en: Advanced testing of ICT tools, systems and processes based on TLPT
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_26
  attributes:
    official_text_es: '1. Las entidades financieras distintas de las contempladas en el artículo 16, apartado
      1, párrafo primero, y distintas de microempresas, determinadas de conformidad con el apartado 8,
      párrafo tercero, del presente artículo, llevarán a cabo al menos cada tres años pruebas avanzadas
      consistentes en pruebas de penetración basadas en amenazas. A partir del perfil de riesgo de la
      entidad financiera y teniendo en cuenta las circunstancias operativas, la autoridad competente podrá,
      en caso necesario, solicitar a la entidad financiera que reduzca o aumente esta frecuencia.


      2. Cada una de las pruebas de penetración basadas en amenazas abarcará algunas o todas las funciones
      esenciales o importantes de una entidad financiera y se realizarán sobre los sistemas de producción
      activos que sustenten esas funciones.


      Las entidades financieras determinarán todos los sistemas, procesos y tecnologías de TIC pertinentes
      subyacentes que sustenten funciones esenciales o importantes y servicios de TIC, incluidos aquellos
      que sustenten los servicios y funciones esenciales o importantes externalizados o contratados a
      proveedores terceros de servicios de TIC.


      Las entidades financieras evaluarán qué funciones esenciales o importantes es necesario incluir
      en las pruebas de penetración basadas en amenazas. El resultado de esta evaluación determinará el
      alcance exacto de las pruebas de penetración basadas en amenazas y será validado por las autoridades
      competentes.


      3. Cuando haya proveedores terceros de servicios de TIC incluidos en el ámbito de cobertura de las
      pruebas de penetración basadas en amenazas, la entidad financiera tomará las medidas y salvaguardias
      necesarias para asegurar la participación de estos proveedores terceros de servicios de TIC en las
      pruebas de penetración basadas en amenazas y mantendrá en todo momento la plena responsabilidad
      de garantizar el cumplimiento del presente Reglamento.


      4. Sin perjuicio de lo dispuesto en el apartado 2, párrafos primero y segundo, cuando quepa esperar
      razonablemente que la participación de un proveedor tercero de servicios de TIC en las pruebas de
      penetración basadas en amenazas a que se refiere el apartado 3 tenga una repercusión negativa en
      la calidad o la seguridad de los servicios prestados por el proveedor tercero de servicios de TIC
      a clientes que sean entidades excluidas del ámbito de aplicación del presente Reglamento, o en la
      confidencialidad de los datos relacionados con dichos servicios, la entidad financiera y el proveedor
      tercero de servicios de TIC podrán acordar por escrito que el proveedor tercero de servicios de
      TIC celebre directamente un acuerdo contractual con un probador externo, a efectos de llevar a cabo,
      bajo la dirección de una entidad financiera designada, una prueba de penetración basada en amenazas
      conjunta en la que participen varias entidades financieras (prueba conjunta) a las que el proveedor
      tercero de servicios de TIC preste servicios de TIC.


      Dicha prueba conjunta abarcará la gama pertinente de servicios de TIC que sustenten funciones esenciales
      o importantes contratadas por las entidades financieras al proveedor tercero de servicios de TIC
      en cuestión. Se considerará que la prueba conjunta es una prueba de penetración basada en amenazas
      realizada por las entidades financieras que participen en ella.


      El número de entidades financieras que participen en la prueba conjunta se calibrará debidamente
      teniendo en cuenta la complejidad y los tipos de servicios de que se trate.


      5. Las entidades financieras, con la cooperación de los proveedores terceros de servicios de TIC
      y otras partes involucradas, incluidos los probadores pero con exclusión de las autoridades competentes,
      aplicarán controles efectivos de gestión del riesgo para mitigar los riesgos de cualquier posible
      repercusión en los datos, daño de los activos y perturbación de funciones, servicios u operaciones
      esenciales o importantes en la propia entidad financiera, en sus contrapartes o en el sector financiero.


      6. Al finalizar la prueba, y una vez que se hayan aprobado los informes y los planes correctores,
      la entidad financiera y, en su caso, los probadores externos facilitarán a la autoridad, designada
      de conformidad con los apartados 9 o 10, un resumen de los hallazgos pertinentes, los planes correctores
      y la documentación que demuestre que la prueba de penetración basada en amenazas se ha realizado
      conforme a los requisitos.


      7. Las autoridades proporcionarán a las entidades financieras un informe de validación que confirme
      que la prueba se efectuó de conformidad con los requisitos según constan en la documentación, con
      el fin de permitir el reconocimiento mutuo de las pruebas de penetración basadas en amenazas entre
      las autoridades competentes. La entidad financiera notificará a la autoridad competente pertinente
      la validación, el resumen de los hallazgos pertinentes y los planes correctores.


      Sin perjuicio de dicha validación, las entidades financieras seguirán siendo plenamente responsables
      en todo momento de las repercusiones de las pruebas a que se refiere el apartado 4.


      8. Las entidades financieras contratarán, de conformidad con el artículo 27, a probadores a efectos
      de la realización de pruebas de penetración basadas en amenazas. Cuando las entidades financieras
      recurran a probadores internos para realizar pruebas de penetración basadas en amenazas, contratarán
      a probadores externos cada tres pruebas.


      Las entidades de crédito clasificadas como significativas de conformidad con el artículo 6, apartado
      4, del Reglamento (UE) n.o 1024/2013 solo recurrirán a probadores externos de conformidad con el
      artículo 27, apartado 1, letras a) a e), del presente Reglamento.


      Las autoridades competentes determinarán qué entidades financieras deberán realizar pruebas de penetración
      basadas en amenazas teniendo en cuenta los criterios establecidos en el artículo 4, apartado 2,
      basándose en la evaluación de:


      a) factores relacionados con la repercusión, en particular la medida en que los servicios prestados
      y las actividades realizadas por la entidad financiera repercuten en el sector financiero;


      b) posibles problemas de estabilidad financiera, incluido el carácter sistémico de la entidad financiera
      a escala de la Unión o nacional, según proceda;


      c) el perfil de riesgo relacionado con las TIC específico, el nivel de madurez de las TIC de la
      entidad financiera o las características tecnológicas presentes.


      9. Los Estados miembros podrán designar a una única autoridad pública en el sector financiero responsable
      de las cuestiones relacionadas con las pruebas de penetración basadas en amenazas en el sector financiero
      a escala nacional y le confiarán todas las competencias y tareas a tal efecto.


      10. A falta de designación de conformidad con el apartado 9 del presente artículo, y sin perjuicio
      de la competencia para determinar las entidades financieras que están obligadas a llevar a cabo
      pruebas de penetración basadas en amenazas, una autoridad competente podrá delegar el ejercicio
      de todas o algunas de las tareas a que se refieren el presente artículo y el artículo 27 en otra
      autoridad nacional del sector financiero.


      11. Las Autoridades Europeas de Supervisión desarrollarán, de acuerdo con el BCE proyectos de normas
      técnicas de regulación comunes de conformidad con el marco TIBER-EU para especificar más detalladamente:


      a) los criterios utilizados a efectos de la aplicación del apartado 8, párrafo segundo;


      b) los requisitos y normas que rigen el recurso a probadores internos;


      c) los requisitos en relación con: i) el alcance de las pruebas de penetración basadas en amenazas
      a que se refiere el apartado 2, ii) la metodología y el enfoque de realización de pruebas que deberán
      seguirse en cada fase específica del proceso de prueba, iii) las fases de resultados, conclusión
      y adopción de medidas correctoras del proceso de prueba;


      i) el alcance de las pruebas de penetración basadas en amenazas a que se refiere el apartado 2,


      ii) la metodología y el enfoque de realización de pruebas que deberán seguirse en cada fase específica
      del proceso de prueba,


      iii) las fases de resultados, conclusión y adopción de medidas correctoras del proceso de prueba;


      d) el tipo de cooperación en materia de supervisión y otros tipos de cooperación pertinente necesarios
      para llevar a cabo pruebas de penetración basadas en amenazas, así como la facilitación del reconocimiento
      mutuo de dichas pruebas, en el contexto de entidades financieras que operen en más de un Estado
      miembro, para permitir un nivel adecuado de participación de los supervisores y una ejecución flexible
      que tenga en cuenta las características específicas de subsectores financieros o mercados financieros
      locales.


      Al elaborar dichos proyectos de normas técnicas de regulación, las Autoridades Europeas de Supervisión
      tendrán debidamente en cuenta cualquier característica específica derivada de la distinta naturaleza
      de las actividades en los distintos sectores de los servicios financieros.


      Las Autoridades Europeas de Supervisión presentarán a la Comisión dichos proyectos de normas técnicas
      de regulación a más tardar el 17 de julio de 2024.


      Se delegan en la Comisión los poderes para completar el presente Reglamento mediante la adopción
      de las normas técnicas de regulación a que se refiere el párrafo primero de conformidad con los
      artículos 10 a 14 del Reglamento (UE) n.o 1093/2010, los artículos 10 a 14 del Reglamento (UE) n.o
      1094/2010 y los artículos 10 a 14 del Reglamento (UE) n.o 1095/2010.'
    official_text_en: '1. Financial entities, other than entities referred to in Article 16(1), first
      subparagraph, and other than microenterprises, which are identified in accordance with paragraph
      8, third subparagraph, of this Article, shall carry out at least every 3 years advanced testing
      by means of TLPT. Based on the risk profile of the financial entity and taking into account operational
      circumstances, the competent authority may, where necessary, request the financial entity to reduce
      or increase this frequency.


      2. Each threat-led penetration test shall cover several or all critical or important functions of
      a financial entity, and shall be performed on live production systems supporting such functions.


      Financial entities shall identify all relevant underlying ICT systems, processes and technologies
      supporting critical or important functions and ICT services, including those supporting the critical
      or important functions which have been outsourced or contracted to ICT third-party service providers.


      Financial entities shall assess which critical or important functions need to be covered by the
      TLPT. The result of this assessment shall determine the precise scope of TLPT and shall be validated
      by the competent authorities.


      3. Where ICT third-party service providers are included in the scope of TLPT, the financial entity
      shall take the necessary measures and safeguards to ensure the participation of such ICT third-party
      service providers in the TLPT and shall retain at all times full responsibility for ensuring compliance
      with this Regulation.


      4. Without prejudice to paragraph 2, first and second subparagraphs, where the participation of
      an ICT third-party service provider in the TLPT, referred to in paragraph 3, is reasonably expected
      to have an adverse impact on the quality or security of services delivered by the ICT third-party
      service provider to customers that are entities falling outside the scope of this Regulation, or
      on the confidentiality of the data related to such services, the financial entity and the ICT third-party
      service provider may agree in writing that the ICT third-party service provider directly enters
      into contractual arrangements with an external tester, for the purpose of conducting, under the
      direction of one designated financial entity, a pooled TLPT involving several financial entities
      (pooled testing) to which the ICT third-party service provider provides ICT services.


      That pooled testing shall cover the relevant range of ICT services supporting critical or important
      functions contracted to the respective ICT third-party service provider by the financial entities.
      The pooled testing shall be considered TLPT carried out by the financial entities participating
      in the pooled testing.


      The number of financial entities participating in the pooled testing shall be duly calibrated taking
      into account the complexity and types of services involved.


      5. Financial entities shall, with the cooperation of ICT third-party service providers and other
      parties involved, including the testers but excluding the competent authorities, apply effective
      risk management controls to mitigate the risks of any potential impact on data, damage to assets,
      and disruption to critical or important functions, services or operations at the financial entity
      itself, its counterparts or to the financial sector.


      6. At the end of the testing, after reports and remediation plans have been agreed, the financial
      entity and, where applicable, the external testers shall provide to the authority, designated in
      accordance with paragraph 9 or 10, a summary of the relevant findings, the remediation plans and
      the documentation demonstrating that the TLPT has been conducted in accordance with the requirements.


      7. Authorities shall provide financial entities with an attestation confirming that the test was
      performed in accordance with the requirements as evidenced in the documentation in order to allow
      for mutual recognition of threat led penetration tests between competent authorities. The financial
      entity shall notify the relevant competent authority of the attestation, the summary of the relevant
      findings and the remediation plans.


      Without prejudice to such attestation, financial entities shall remain at all times fully responsible
      for the impact of the tests referred to in paragraph 4.


      8. Financial entities shall contract testers for the purposes of undertaking TLPT in accordance
      with Article 27. When financial entities use internal testers for the purposes of undertaking TLPT,
      they shall contract external testers every three tests.


      Credit institutions that are classified as significant in accordance with Article 6(4) of Regulation
      (EU) No 1024/2013, shall only use external testers in accordance with Article 27(1), points (a)
      to (e).


      Competent authorities shall identify financial entities that are required to perform TLPT taking
      into account the criteria set out in Article 4(2), based on an assessment of the following:


      (a) impact-related factors, in particular the extent to which the services provided and activities
      undertaken by the financial entity impact the financial sector;


      (b) possible financial stability concerns, including the systemic character of the financial entity
      at Union or national level, as applicable;


      (c) specific ICT risk profile, level of ICT maturity of the financial entity or technology features
      involved.


      9. Member States may designate a single public authority in the financial sector to be responsible
      for TLPT-related matters in the financial sector at national level and shall entrust it with all
      competences and tasks to that effect.


      10. In the absence of a designation in accordance with paragraph 9 of this Article, and without
      prejudice to the power to identify the financial entities that are required to perform TLPT, a competent
      authority may delegate the exercise of some or all of the tasks referred to in this Article and
      Article 27 to another national authority in the financial sector.


      11. The ESAs shall, in agreement with the ECB, develop joint draft regulatory technical standards
      in accordance with the TIBER-EU framework in order to specify further:


      (a) the criteria used for the purpose of the application of paragraph 8, second subparagraph;


      (b) the requirements and standards governing the use of internal testers;


      (c) the requirements in relation to: (i) the scope of TLPT referred to in paragraph 2; (ii) the
      testing methodology and approach to be followed for each specific phase of the testing process;
      (iii) the results, closure and remediation stages of the testing;


      (i) the scope of TLPT referred to in paragraph 2;


      (ii) the testing methodology and approach to be followed for each specific phase of the testing
      process;


      (iii) the results, closure and remediation stages of the testing;


      (d) the type of supervisory and other relevant cooperation which are needed for the implementation
      of TLPT, and for the facilitation of mutual recognition of that testing, in the context of financial
      entities that operate in more than one Member State, to allow an appropriate level of supervisory
      involvement and a flexible implementation to cater for specificities of financial sub-sectors or
      local financial markets.


      When developing those draft regulatory technical standards, the ESAs shall give due consideration
      to any specific feature arising from the distinct nature of activities across different financial
      services sectors.


      The ESAs shall submit those draft regulatory technical standards to the Commission by 17 July 2024.


      Power is delegated to the Commission to supplement this Regulation by adopting the regulatory technical
      standards referred to in the first subparagraph in accordance with Articles 10 to 14 of Regulations
      (EU) No 1093/2010, (EU) No 1094/2010 and (EU) No 1095/2010.'
    section: Artículo 26
    source_sha256: 6693cd39e2a0ae48af13c5e504d7b2120dd4ed1951decc784c89cb658303fdb0
- id: c4.art27
  title_es: Requisitos aplicables a los probadores para la realización de pruebas de penetración basadas
    en amenazas
  title_en: Requirements for testers for the carrying out of TLPT
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_27
  attributes:
    official_text_es: '1. Para la realización de pruebas de penetración basadas en amenazas, las entidades
      financieras solo recurrirán a probadores que:


      a) tengan el más alto grado de idoneidad y prestigio;


      b) posean capacidades técnicas y organizativas y demuestren conocimientos especializados en inteligencia
      sobre amenazas, pruebas de penetración y pruebas de equipo rojo;


      c) estén acreditados por un órgano de certificación de un Estado miembro o se adhieran a códigos
      de conducta o marcos éticos oficiales;


      d) proporcionen una garantía independiente o un informe de auditoría que acrediten la buena gestión
      de los riesgos asociados con la realización de pruebas de penetración basadas en amenazas, incluidas
      la protección debida de la información confidencial de la entidad financiera y medidas de reparación
      en caso de riesgos empresariales para ella;


      e) estén debida y completamente cubiertos por los seguros pertinentes de responsabilidad civil profesional,
      también frente a los riesgos de falta intencionada y negligencia.


      2. En caso de recurrir a probadores internos, las entidades financieras garantizarán que se cumplan,
      además de todos los requisitos establecidos en el apartado 1, todas las condiciones siguientes:


      a) el recurso a los probadores ha sido autorizado por la autoridad competente correspondiente o
      por la autoridad pública única designada de conformidad con el artículo 26, apartados 9 y 10;


      b) la autoridad competente correspondiente ha verificado que la entidad financiera dispone de recursos
      específicos suficientes y ha garantizado que se eviten los conflictos de intereses durante todas
      las fases de constitución y ejecución de las pruebas, y


      c) el proveedor de inteligencia sobre amenazas es externo con respecto a la entidad financiera.


      3. Las entidades financieras se asegurarán de que los contratos con probadores externos exijan una
      buena gestión de los resultados de las pruebas de penetración basadas en amenazas y de que ningún
      tratamiento de datos del que sean objeto, incluido cualquier proceso de generación, almacenamiento,
      agregación, redacción, notificación, comunicación o destrucción cree riesgos para la entidad financiera.'
    official_text_en: '1. Financial entities shall only use testers for the carrying out of TLPT, that:


      (a) are of the highest suitability and reputability;


      (b) possess technical and organisational capabilities and demonstrate specific expertise in threat
      intelligence, penetration testing and red team testing;


      (c) are certified by an accreditation body in a Member State or adhere to formal codes of conduct
      or ethical frameworks;


      (d) provide an independent assurance, or an audit report, in relation to the sound management of
      risks associated with the carrying out of TLPT, including the due protection of the financial entity’s
      confidential information and redress for the business risks of the financial entity;


      (e) are duly and fully covered by relevant professional indemnity insurances, including against
      risks of misconduct and negligence.


      2. When using internal testers, financial entities shall ensure that, in addition to the requirements
      in paragraph 1, the following conditions are met:


      (a) such use has been approved by the relevant competent authority or by the single public authority
      designated in accordance with Article 26(9) and (10);


      (b) the relevant competent authority has verified that the financial entity has sufficient dedicated
      resources and ensured that conflicts of interest are avoided throughout the design and execution
      phases of the test; and


      (c) the threat intelligence provider is external to the financial entity.


      3. Financial entities shall ensure that contracts concluded with external testers require a sound
      management of the TLPT results and that any data processing thereof, including any generation, store,
      aggregation, draft, report, communication or destruction, do not create risks to the financial entity.'
    section: Artículo 27
    source_sha256: 46cc080be5bcbdfaa9f30aad4aaa52963d8684c067c16909dfc88170936e208c
- id: c5.art28
  title_es: Principios generales
  title_en: General principles
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_28
  attributes:
    official_text_es: '1. Las entidades financieras gestionarán el riesgo relacionado con las TIC derivado
      de terceros como un elemento integrante del riesgo relacionado con las TIC dentro de su marco de
      gestión del riesgo relacionado con las TIC a que se refiere el artículo 6, apartado 1, y de conformidad
      con los principios siguientes:


      a) las entidades financieras que tengan acuerdos contractuales en vigor para utilizar servicios
      de TIC en el funcionamiento de sus operaciones comerciales serán, en todo momento, plenamente responsables
      del cumplimiento y observancia de todas las obligaciones con arreglo al presente Reglamento y al
      Derecho aplicable en materia de servicios financieros;


      b) las entidades financieras gestionarán el riesgo relacionado con las TIC derivado de terceros
      con arreglo al principio de proporcionalidad, teniendo en cuenta: i) la naturaleza, la escala, la
      complejidad y la importancia de las dependencias con respecto a las TIC, ii) los riesgos derivados
      de los acuerdos contractuales sobre el uso de servicios de TIC celebrados con proveedores terceros
      de servicios de TIC, teniendo en cuenta el carácter esencial o la importancia del servicio, el proceso
      o la función de que se trate, y la repercusión potencial en la continuidad y la disponibilidad de
      las actividades y los servicios financieros, a escala particular y de grupo.


      i) la naturaleza, la escala, la complejidad y la importancia de las dependencias con respecto a
      las TIC,


      ii) los riesgos derivados de los acuerdos contractuales sobre el uso de servicios de TIC celebrados
      con proveedores terceros de servicios de TIC, teniendo en cuenta el carácter esencial o la importancia
      del servicio, el proceso o la función de que se trate, y la repercusión potencial en la continuidad
      y la disponibilidad de las actividades y los servicios financieros, a escala particular y de grupo.


      2. Como parte de su marco de gestión del riesgo relacionado con las TIC, las entidades financieras
      distintas de las entidades contempladas en el artículo 16, apartado 1, párrafo primero, y distintas
      de microempresas adoptarán una estrategia, que revisarán periódicamente, sobre el riesgo relacionado
      con las TIC derivado de terceros, teniendo en cuenta la estrategia de múltiples proveedores a que
      se refiere el artículo 6, apartado 9, cuando proceda. Esa estrategia relativa al riesgo relacionado
      con las TIC derivado de terceros incluirá una política sobre el uso de servicios de TIC que sustenten
      funciones esenciales o importantes prestados por proveedores terceros de servicios de TIC y se aplicará
      a título particular y, cuando proceda, de forma subconsolidada y consolidada. El órgano de dirección,
      a partir de una evaluación del perfil de riesgo general de la entidad financiera y la escala y la
      complejidad de los servicios empresariales, revisará periódicamente los riesgos detectados por lo
      que respecta a los acuerdos contractuales relativos al uso de servicios de TIC que sustenten funciones
      esenciales o importantes.


      3. Como parte de su marco de gestión del riesgo relacionado con las TIC, las entidades financieras
      mantendrán y actualizarán a nivel de la entidad, y a nivel subconsolidado y consolidado, un registro
      de información en relación con todos los acuerdos contractuales sobre el uso de servicios de TIC
      prestados por proveedores terceros de servicios de TIC.


      Los acuerdos contractuales a que se refiere el párrafo primero se documentarán adecuadamente, distinguiendo
      entre los que comprendan servicios de TIC que sustentan funciones esenciales o importantes y los
      que no.


      Las entidades financieras comunicarán al menos una vez al año a las autoridades competentes información
      sobre el número de nuevos acuerdos relativos al uso de servicios de TIC, las categorías de proveedores
      terceros de servicios de TIC, el tipo de acuerdos contractuales y los servicios y funciones prestados
      en materia de TIC.


      Las entidades financieras pondrán a disposición de la autoridad competente que lo solicite el registro
      completo de información o, cuando así se solicite, secciones específicas de este, junto con toda
      información que se considere necesaria para permitir la supervisión efectiva de la entidad financiera.


      Las entidades financieras informarán oportunamente a la autoridad competente cuando se propongan
      celebrar cualquier acuerdo contractual para el uso de servicios de TIC que sustenten funciones esenciales
      o importantes y cuando una función se haya convertido en esencial o importante.


      4. Antes de celebrar un acuerdo contractual sobre el uso de servicios de TIC, las entidades financieras:


      a) evaluarán si el acuerdo contractual se refiere al uso de servicios de TIC que sustenten una función
      esencial o importante;


      b) evaluarán si se cumplen las condiciones de supervisión para la contratación;


      c) determinarán y evaluarán todos los riesgos pertinentes en relación con el acuerdo contractual,
      incluida la posibilidad de que dicho acuerdo pueda contribuir a reforzar el riesgo de concentración
      de TIC a que se refiere el artículo 29;


      d) llevarán a cabo todas las comprobaciones debidas con respecto a los posibles proveedores terceros
      de servicios de TIC y se asegurarán, a través de los procesos de selección y evaluación, de la idoneidad
      de dichos proveedores;


      e) determinarán y evaluarán los conflictos de intereses que el acuerdo contractual pueda causar.


      5. Las entidades financieras únicamente podrán celebrar acuerdos contractuales con proveedores terceros
      de servicios de TIC que cumplan estándares adecuados en materia de seguridad de la información.
      Cuando tales acuerdos contractuales se refieran a funciones esenciales o importantes, las entidades
      financieras, antes de celebrarlos, prestarán la debida consideración a la aplicación, por parte
      de proveedores terceros de servicios de TIC, de los estándares en materia de seguridad de la información
      más actualizados y más estrictos en términos de calidad.


      6. Al ejercer los derechos de acceso, inspección y auditoría sobre el proveedor tercero de servicios
      de TIC, las entidades financieras determinarán previamente, con arreglo a un enfoque basado en el
      riesgo, la frecuencia de las auditorías e inspecciones y los ámbitos que deben auditarse, según
      normas de auditoría comúnmente aceptadas en consonancia con las instrucciones de supervisión sobre
      el uso y la incorporación de dichas normas de auditoría.


      Cuando los acuerdos contractuales relativos al uso de servicios de TIC celebrados con proveedores
      terceros de servicios de TIC impliquen una gran complejidad técnica, la entidad financiera verificará
      que los auditores, ya sean internos, externos o un grupo de auditores, posean las capacidades y
      los conocimientos adecuados para llevar a cabo efectivamente las auditorías y evaluaciones pertinentes.


      7. Las entidades financieras garantizarán la posibilidad de terminar los acuerdos contractuales
      sobre el uso de servicios de TIC en cualquiera de los siguientes casos:


      a) incumplimiento importante por parte del proveedor tercero de servicios de TIC de las disposiciones
      legales o reglamentarias o las cláusulas contractuales aplicables;


      b) circunstancias observadas durante el seguimiento del riesgo relacionado con las TIC derivado
      de terceros que se considere que pueden alterar el desempeño de las funciones prestadas en virtud
      del acuerdo contractual, incluidos cambios importantes que afecten al acuerdo o a la situación del
      proveedor tercero de servicios de TIC;


      c) debilidades manifiestas del proveedor tercero de servicios de TIC en cuanto a su gestión global
      del riesgo relacionado con las TIC y, en particular, a la forma en que garantiza la disponibilidad,
      la autenticidad, la integridad y la confidencialidad de los datos, ya sean personales o sensibles
      en cualquier otro sentido, o no personales;


      d) cuando la autoridad competente haya dejado de poder supervisar efectivamente a la entidad financiera
      como resultado de las condiciones del acuerdo contractual de que se trate o las circunstancias relacionadas
      con él.


      8. En el caso de los servicios de TIC que sustenten funciones esenciales o importantes, las entidades
      financieras establecerán estrategias de salida. Las estrategias de salida tendrán en cuenta los
      riesgos que puedan surgir en relación con los proveedores terceros de servicios de TIC, en particular
      un posible fallo por su parte, un deterioro de la calidad de los servicios de TIC prestados, cualquier
      perturbación de la actividad debida a una falta de prestación de servicios de TIC o a una prestación
      inadecuada, o cualquier riesgo sustancial que pueda plantearse en relación con el ejercicio adecuado
      y continuo del servicio de TIC correspondiente, o la terminación de los acuerdos contractuales con
      proveedores terceros de servicios de TIC en cualquiera de las circunstancias enumeradas en el apartado
      7.


      Las entidades financieras se asegurarán de poder abandonar los acuerdos contractuales sin:


      a) perturbación de sus operaciones comerciales;


      b) limitación del cumplimiento de los requisitos reglamentarios;


      c) perjuicio para la continuidad y la calidad de los servicios prestados a los clientes.


      Los planes de salida serán globales, estarán documentados y, de conformidad con los criterios establecidos
      en el artículo 4, apartado 2, se someterán a suficientes pruebas y se revisarán periódicamente.


      Las entidades financieras hallarán soluciones alternativas y elaborarán planes de transición que
      les permitan recuperar los servicios de TIC contratados y los datos pertinentes del proveedor tercero
      de servicios de TIC y transferirlos de forma segura e íntegra a proveedores alternativos o reincorporarlos
      internamente.


      Las entidades financieras dispondrán de medidas de contingencia adecuadas para mantener la continuidad
      de la actividad en caso de que se den las circunstancias mencionadas en el párrafo primero.


      9. Las Autoridades Europeas de Supervisión, a través del Comité Mixto, elaborarán proyectos de normas
      técnicas de ejecución a fin de establecer las plantillas normalizadas para el registro de información
      a que se refiere el apartado 3, incluyendo la información común a todos los acuerdos contractuales
      relativa al uso de servicios de TIC. Las Autoridades Europeas de Supervisión presentarán a la Comisión
      dichos proyectos de normas técnicas de ejecución a más tardar el 17 de enero de 2024.


      Se otorgan a la Comisión competencias para adoptar las normas técnicas de ejecución a que se refiere
      el párrafo primero de conformidad con el artículo 15 del Reglamento (UE) n.o 1093/2010, el artículo
      15 del Reglamento (UE) n.o 1094/2010 y el artículo 15 del Reglamento (UE) n.o 1095/2010.


      10. Las Autoridades Europeas de Supervisión, a través del Comité Mixto, elaborarán proyectos de
      normas técnicas de regulación a fin de especificar en más profundidad el contenido detallado de
      la política a que se refiere el apartado 2 en relación con los acuerdos contractuales sobre el uso
      de servicios de TIC que sustenten funciones esenciales o importantes prestados por proveedores terceros
      de servicios de TIC.


      A la hora de elaborar dichos proyectos de normas técnicas de regulación, las Autoridades Europeas
      de Supervisión tendrán en cuenta el tamaño y el perfil de riesgo general de la entidad financiera,
      así como la naturaleza, escala y complejidad de sus servicios, actividades y operaciones. Las Autoridades
      Europeas de Supervisión presentarán a la Comisión dichos proyectos de normas técnicas de regulación
      a más tardar el 17 de enero de 2024.


      Se delegan en la Comisión los poderes para completar el presente Reglamento mediante la adopción
      de las normas técnicas de regulación a que se refiere el párrafo primero de conformidad con los
      artículos 10 a 14 del Reglamento (UE) n.o 1093/2010, los artículos 10 a 14 del Reglamento (UE) n.o
      1094/2010 y los artículos 10 a 14 del Reglamento (UE) n.o 1095/2010.'
    official_text_en: '1. Financial entities shall manage ICT third-party risk as an integral component
      of ICT risk within their ICT risk management framework as referred to in Article 6(1), and in accordance
      with the following principles:


      (a) financial entities that have in place contractual arrangements for the use of ICT services to
      run their business operations shall, at all times, remain fully responsible for compliance with,
      and the discharge of, all obligations under this Regulation and applicable financial services law;


      (b) financial entities’ management of ICT third-party risk shall be implemented in light of the
      principle of proportionality, taking into account: (i) the nature, scale, complexity and importance
      of ICT-related dependencies, (ii) the risks arising from contractual arrangements on the use of
      ICT services concluded with ICT third-party service providers, taking into account the criticality
      or importance of the respective service, process or function, and the potential impact on the continuity
      and availability of financial services and activities, at individual and at group level.


      (i) the nature, scale, complexity and importance of ICT-related dependencies,


      (ii) the risks arising from contractual arrangements on the use of ICT services concluded with ICT
      third-party service providers, taking into account the criticality or importance of the respective
      service, process or function, and the potential impact on the continuity and availability of financial
      services and activities, at individual and at group level.


      2. As part of their ICT risk management framework, financial entities, other than entities referred
      to in Article 16(1), first subparagraph, and other than microenterprises, shall adopt, and regularly
      review, a strategy on ICT third-party risk, taking into account the multi-vendor strategy referred
      to in Article 6(9), where applicable. The strategy on ICT third-party risk shall include a policy
      on the use of ICT services supporting critical or important functions provided by ICT third-party
      service providers and shall apply on an individual basis and, where relevant, on a sub-consolidated
      and consolidated basis. The management body shall, on the basis of an assessment of the overall
      risk profile of the financial entity and the scale and complexity of the business services, regularly
      review the risks identified in respect to contractual arrangements on the use of ICT services supporting
      critical or important functions.


      3. As part of their ICT risk management framework, financial entities shall maintain and update
      at entity level, and at sub-consolidated and consolidated levels, a register of information in relation
      to all contractual arrangements on the use of ICT services provided by ICT third-party service providers.


      The contractual arrangements referred to in the first subparagraph shall be appropriately documented,
      distinguishing between those that cover ICT services supporting critical or important functions
      and those that do not.


      Financial entities shall report at least yearly to the competent authorities on the number of new
      arrangements on the use of ICT services, the categories of ICT third-party service providers, the
      type of contractual arrangements and the ICT services and functions which are being provided.


      Financial entities shall make available to the competent authority, upon its request, the full register
      of information or, as requested, specified sections thereof, along with any information deemed necessary
      to enable the effective supervision of the financial entity.


      Financial entities shall inform the competent authority in a timely manner about any planned contractual
      arrangement on the use of ICT services supporting critical or important functions as well as when
      a function has become critical or important.


      4. Before entering into a contractual arrangement on the use of ICT services, financial entities
      shall:


      (a) assess whether the contractual arrangement covers the use of ICT services supporting a critical
      or important function;


      (b) assess if supervisory conditions for contracting are met;


      (c) identify and assess all relevant risks in relation to the contractual arrangement, including
      the possibility that such contractual arrangement may contribute to reinforcing ICT concentration
      risk as referred to in Article 29;


      (d) undertake all due diligence on prospective ICT third-party service providers and ensure throughout
      the selection and assessment processes that the ICT third-party service provider is suitable;


      (e) identify and assess conflicts of interest that the contractual arrangement may cause.


      5. Financial entities may only enter into contractual arrangements with ICT third-party service
      providers that comply with appropriate information security standards. When those contractual arrangements
      concern critical or important functions, financial entities shall, prior to concluding the arrangements,
      take due consideration of the use, by ICT third-party service providers, of the most up-to-date
      and highest quality information security standards.


      6. In exercising access, inspection and audit rights over the ICT third-party service provider,
      financial entities shall, on the basis of a risk-based approach, pre-determine the frequency of
      audits and inspections as well as the areas to be audited through adhering to commonly accepted
      audit standards in line with any supervisory instruction on the use and incorporation of such audit
      standards.


      Where contractual arrangements concluded with ICT third-party service providers on the use of ICT
      services entail high technical complexity, the financial entity shall verify that auditors, whether
      internal or external, or a pool of auditors, possess appropriate skills and knowledge to effectively
      perform the relevant audits and assessments.


      7. Financial entities shall ensure that contractual arrangements on the use of ICT services may
      be terminated in any of the following circumstances:


      (a) significant breach by the ICT third-party service provider of applicable laws, regulations or
      contractual terms;


      (b) circumstances identified throughout the monitoring of ICT third-party risk that are deemed capable
      of altering the performance of the functions provided through the contractual arrangement, including
      material changes that affect the arrangement or the situation of the ICT third-party service provider;


      (c) ICT third-party service provider’s evidenced weaknesses pertaining to its overall ICT risk management
      and in particular in the way it ensures the availability, authenticity, integrity and, confidentiality,
      of data, whether personal or otherwise sensitive data, or non-personal data;


      (d) where the competent authority can no longer effectively supervise the financial entity as a
      result of the conditions of, or circumstances related to, the respective contractual arrangement.


      8. For ICT services supporting critical or important functions, financial entities shall put in
      place exit strategies. The exit strategies shall take into account risks that may emerge at the
      level of ICT third-party service providers, in particular a possible failure on their part, a deterioration
      of the quality of the ICT services provided, any business disruption due to inappropriate or failed
      provision of ICT services or any material risk arising in relation to the appropriate and continuous
      deployment of the respective ICT service, or the termination of contractual arrangements with ICT
      third-party service providers under any of the circumstances listed in paragraph 7.


      Financial entities shall ensure that they are able to exit contractual arrangements without:


      (a) disruption to their business activities,


      (b) limiting compliance with regulatory requirements,


      (c) detriment to the continuity and quality of services provided to clients.


      Exit plans shall be comprehensive, documented and, in accordance with the criteria set out in Article
      4(2), shall be sufficiently tested and reviewed periodically.


      Financial entities shall identify alternative solutions and develop transition plans enabling them
      to remove the contracted ICT services and the relevant data from the ICT third-party service provider
      and to securely and integrally transfer them to alternative providers or reincorporate them in-house.


      Financial entities shall have appropriate contingency measures in place to maintain business continuity
      in the event of the circumstances referred to in the first subparagraph.


      9. The ESAs shall, through the Joint Committee, develop draft implementing technical standards to
      establish the standard templates for the purposes of the register of information referred to in
      paragraph 3, including information that is common to all contractual arrangements on the use of
      ICT services. The ESAs shall submit those draft implementing technical standards to the Commission
      by 17 January 2024.


      Power is conferred on the Commission to adopt the implementing technical standards referred to in
      the first subparagraph in accordance with Article 15 of Regulations (EU) No 1093/2010, (EU) No 1094/2010
      and (EU) No 1095/2010.


      10. The ESAs shall, through the Joint Committee, develop draft regulatory technical standards to
      further specify the detailed content of the policy referred to in paragraph 2 in relation to the
      contractual arrangements on the use of ICT services supporting critical or important functions provided
      by ICT third-party service providers.


      When developing those draft regulatory technical standards, the ESAs shall take into account the
      size and the overall risk profile of the financial entity, and the nature, scale and complexity
      of its services, activities and operations. The ESAs shall submit those draft regulatory technical
      standards to the Commission by 17 January 2024.


      Power is delegated to the Commission to supplement this Regulation by adopting the regulatory technical
      standards referred to in the first subparagraph in accordance with Articles 10 to 14 of Regulations
      (EU) No 1093/2010, (EU) No 1094/2010 and (EU) No 1095/2010.'
    section: Artículo 28
    source_sha256: e6db0f6a43c6d76efdde3a1cb4406e36b453eb2fbaf43a54fa110f74b36adbb9
- id: c5.art29
  title_es: Evaluación preliminar del riesgo de concentración de TIC a nivel de la entidad
  title_en: Preliminary assessment of ICT concentration risk at entity level
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_29
  attributes:
    official_text_es: '1. Al llevar a cabo la determinación y evaluación de los riesgos a que se refiere
      el artículo 28, apartado 4, letra c), las entidades financieras también tendrán en cuenta si la
      celebración prevista de un acuerdo contractual en relación con los servicios de TIC que sustenten
      funciones esenciales o importantes podría dar lugar a alguna de las siguientes circunstancias:


      a) la celebración de un contrato con un proveedor tercero de servicios de TIC que no sea fácilmente
      sustituible, o


      b) la coexistencia de múltiples acuerdos contractuales en relación con la prestación de servicios
      de TIC que sustenten funciones esenciales o importantes con el mismo proveedor tercero de servicios
      de TIC o con proveedores terceros de servicios de TIC estrechamente relacionados.


      Las entidades financieras ponderarán los beneficios y los costes de soluciones alternativas, como
      el recurso a distintos proveedores terceros de servicios de TIC, considerando si las soluciones
      contempladas se ajustan a las necesidades y objetivos empresariales establecidos en su estrategia
      de resiliencia digital y de qué manera.


      2. Cuando el acuerdo contractual sobre el uso de servicios de TIC que sustenten funciones esenciales
      o importantes incluya la posibilidad de que un proveedor tercero de servicios de TIC subcontrate
      a su vez servicios de TIC que sustenten una función esencial o importante a otros proveedores terceros
      de servicios de TIC, las entidades financieras ponderarán los beneficios y los riesgos que puedan
      derivarse de esa posible subcontratación, en particular cuando se trate de un subcontratista de
      TIC establecido en un tercer país.


      Cuando el acuerdo contractual afecte a servicios de TIC que sustenten funciones esenciales o importantes,
      las entidades financieras ponderarán debidamente las disposiciones legislativas en materia de insolvencia
      que se aplicarían en caso de quiebra del proveedor tercero de servicios de TIC, así como cualquier
      restricción que pueda surgir y que afecte a la recuperación urgente de los datos de la entidad financiera.


      Cuando se celebren acuerdos contractuales sobre el uso de servicios de TIC que sustenten funciones
      esenciales o importantes con un proveedor tercero de servicios de TIC establecido en un tercer país,
      las entidades financieras tendrán en consideración, además de lo mencionado el párrafo segundo,
      el cumplimiento de la normativa en materia de protección de datos de la Unión y la aplicación efectiva
      del Derecho en ese tercer país.


      Cuando el acuerdo contractual sobre el uso de servicios de TIC que sustenten funciones esenciales
      o importantes contemple la subcontratación, las entidades financieras evaluarán si las cadenas de
      subcontratación potencialmente largas o complejas pueden afectar a su capacidad para efectuar un
      seguimiento completo de las funciones contratadas y a la capacidad de la autoridad competente para
      supervisar efectivamente a la entidad financiera a este respecto, y de qué manera.'
    official_text_en: '1. When performing the identification and assessment of risks referred to in Article
      28(4), point (c), financial entities shall also take into account whether the envisaged conclusion
      of a contractual arrangement in relation to ICT services supporting critical or important functions
      would lead to any of the following:


      (a) contracting an ICT third-party service provider that is not easily substitutable; or


      (b) having in place multiple contractual arrangements in relation to the provision of ICT services
      supporting critical or important functions with the same ICT third-party service provider or with
      closely connected ICT third-party service providers.


      Financial entities shall weigh the benefits and costs of alternative solutions, such as the use
      of different ICT third-party service providers, taking into account if and how envisaged solutions
      match the business needs and objectives set out in their digital resilience strategy.


      2. Where the contractual arrangements on the use of ICT services supporting critical or important
      functions include the possibility that an ICT third-party service provider further subcontracts
      ICT services supporting a critical or important function to other ICT third-party service providers,
      financial entities shall weigh benefits and risks that may arise in connection with such subcontracting,
      in particular in the case of an ICT subcontractor established in a third-country.


      Where contractual arrangements concern ICT services supporting critical or important functions,
      financial entities shall duly consider the insolvency law provisions that would apply in the event
      of the ICT third-party service provider’s bankruptcy as well as any constraint that may arise in
      respect to the urgent recovery of the financial entity’s data.


      Where contractual arrangements on the use of ICT services supporting critical or important functions
      are concluded with an ICT third-party service provider established in a third country, financial
      entities shall, in addition to the considerations referred to in the second subparagraph, also consider
      the compliance with Union data protection rules and the effective enforcement of the law in that
      third country.


      Where the contractual arrangements on the use of ICT services supporting critical or important functions
      provide for subcontracting, financial entities shall assess whether and how potentially long or
      complex chains of subcontracting may impact their ability to fully monitor the contracted functions
      and the ability of the competent authority to effectively supervise the financial entity in that
      respect.'
    section: Artículo 29
    source_sha256: 6f7a2b25570d4a4da393a573482b654f2a9ad013ba1af56addc0aac2268fe89e
- id: c5.art30
  title_es: Cláusulas contractuales fundamentales
  title_en: Key contractual provisions
  applies_to: []
  source: https://eur-lex.europa.eu/legal-content/ES/TXT/HTML/?uri=CELEX:32022R2554#art_30
  attributes:
    official_text_es: '1. Los derechos y obligaciones de la entidad financiera y del proveedor tercero
      de servicios de TIC estarán claramente asignados y establecidos por escrito. El contrato completo
      incluirá los acuerdos de nivel de servicio y se formalizará en un documento escrito que estará a
      disposición de las partes en papel, o en un documento en otro formato descargable, duradero y accesible.


      2. Los acuerdos contractuales sobre el uso de servicios de TIC incluirán, como mínimo, los elementos
      siguientes:


      a) una descripción clara y completa de todas las funciones y los servicios de TIC que deba prestar
      el proveedor tercero de servicios de TIC en la que se indique si está permitida la subcontratación
      de un servicio de TIC que sustente una función esencial o importante, o partes sustanciales de ellas,
      y, en caso afirmativo, las condiciones aplicables a dicha subcontratación;


      b) los lugares, en concreto, las regiones o países, en los que deberán proporcionarse las funciones
      y los servicios de TIC contratados o subcontratados y en los que deberán tratarse los datos, incluido
      el lugar de almacenamiento, y el requisito de que el proveedor tercero de servicios de TIC notifique
      por adelantado a la entidad financiera cualquier cambio previsto de dichos lugares;


      c) disposiciones sobre disponibilidad, autenticidad, integridad y confidencialidad en relación con
      la protección de los datos, incluidos los datos personales;


      d) disposiciones sobre las garantías de la entidad financiera de poder acceder a los datos personales
      y no personales tratados y de poder recuperarlos y que le sean devueltos en un formato fácilmente
      accesible en caso de insolvencia, resolución o interrupción de las operaciones comerciales del proveedor
      tercero de servicios de TIC o en caso de terminación de los acuerdos contractuales;


      e) descripciones del nivel de servicio, incluidas sus actualizaciones y revisiones;


      f) la obligación del proveedor tercero de servicios de TIC de prestar asistencia a la entidad financiera
      sin coste adicional, o a un coste determinado con anterioridad, cuando se produzca un incidente
      de TIC relacionado con el servicio de TIC prestado a la entidad financiera;


      g) la obligación del proveedor tercero de servicios de TIC de cooperar plenamente con las autoridades
      competentes y las autoridades de resolución de la entidad financiera, incluidas las personas nombradas
      por ellas;


      h) los derechos de terminación y los correspondientes plazos mínimos de notificación para la terminación
      de los acuerdos contractuales, conforme a las expectativas de las autoridades competentes y las
      autoridades de resolución;


      i) las condiciones para la participación de proveedores terceros de servicios de TIC en los programas
      de sensibilización en materia de seguridad de las TIC y en las actividades de formación sobre resiliencia
      operativa digital de las entidades financieras, de conformidad con el artículo 13, apartado 6.


      3. Además de los elementos a que se refiere el apartado 2, los acuerdos contractuales sobre el uso
      de servicios de TIC que sustenten funciones esenciales o importantes incluirán por lo menos lo siguiente:


      a) descripciones completas del nivel de servicio, incluidas sus actualizaciones y revisiones, con
      objetivos precisos de rendimiento cuantitativos y cualitativos dentro de los niveles de servicio
      acordados, de modo que la entidad financiera pueda realizar un seguimiento efectivo de los servicios
      de TIC y que se puedan adoptar sin demora indebida las medidas correctoras adecuadas cuando no se
      alcancen los niveles de servicio acordados;


      b) plazos de notificación y obligaciones de información del proveedor tercero de servicios de TIC
      a la entidad financiera, incluida la notificación de cualquier hecho que pueda afectar considerablemente
      a la capacidad del proveedor tercero de servicios de TIC para prestar de forma efectiva los servicios
      de TIC que sustentan funciones esenciales o importantes de conformidad con los niveles de servicio
      acordados;


      c) requisitos para que el proveedor tercero de servicios de TIC aplique y someta apruebe los planes
      de contingencia empresarial y disponga de medidas, herramientas y políticas de seguridad de las
      TIC que proporcionen un nivel adecuado de seguridad para la prestación de servicios por parte de
      la entidad financiera en consonancia con su marco regulador;


      d) la obligación de que el proveedor tercero de servicios de TIC participe y coopere plenamente
      en las pruebas de penetración basadas en amenazas de la entidad financiera a que se refieren los
      artículos 26 y 27;


      e) el derecho a realizar un seguimiento continuo de la actuación del proveedor tercero de servicios
      de TIC, lo que implica lo siguiente: i) derechos ilimitados de acceso, inspección y auditoría por
      la entidad financiera o un tercero designado, y por la autoridad competente, y el derecho a hacer
      copias de la documentación pertinente in situ si son esenciales para las operaciones del proveedor
      tercero de servicios de TIC, cuyo ejercicio efectivo no se vea obstaculizado o limitado por otros
      acuerdos contractuales o políticas de aplicación, ii) el derecho a pactar niveles de garantía alternativos
      si se ven afectados los derechos de otros clientes, iii) la obligación de que el proveedor tercero
      de servicios de TIC coopere plenamente durante las inspecciones y las auditorías in situ realizadas
      por las autoridades competentes, el supervisor principal, la entidad financiera o un tercero designado,
      y iv) la obligación de proporcionar detalles sobre el alcance, los procedimientos que deben seguirse
      y la frecuencia de tales inspecciones y auditorías;


      i) derechos ilimitados de acceso, inspección y auditoría por la entidad financiera o un tercero
      designado, y por la autoridad competente, y el derecho a hacer copias de la documentación pertinente
      in situ si son esenciales para las operaciones del proveedor tercero de servicios de TIC, cuyo ejercicio
      efectivo no se vea obstaculizado o limitado por otros acuerdos contractuales o políticas de aplicación,


      ii) el derecho a pactar niveles de garantía alternativos si se ven afectados los derechos de otros
      clientes,


      iii) la obligación de que el proveedor tercero de servicios de TIC coopere plenamente durante las
      inspecciones y las auditorías in situ realizadas por las autoridades competentes, el supervisor
      principal, la entidad financiera o un tercero designado, y


      iv) la obligación de proporcionar detalles sobre el alcance, los procedimientos que deben seguirse
      y la frecuencia de tales inspecciones y auditorías;


      f) estrategias de salida, en particular el establecimiento de un período transitorio suficiente
      obligatorio: i) durante el cual el proveedor tercero de servicios de TIC seguirá proporcionando
      las funciones o los servicios de TIC de que se trate con el fin de reducir el riesgo de perturbación
      en la entidad financiera o de garantizar su resolución y reestructuración efectivas, ii) que permita
      a la entidad financiera migrar a otro proveedor tercero de servicios de TIC o adoptar soluciones
      internas coherentes con la complejidad del servicio prestado.


      i) durante el cual el proveedor tercero de servicios de TIC seguirá proporcionando las funciones
      o los servicios de TIC de que se trate con el fin de reducir el riesgo de perturbación en la entidad
      financiera o de garantizar su resolución y reestructuración efectivas,


      ii) que permita a la entidad financiera migrar a otro proveedor tercero de servicios de TIC o adoptar
      soluciones internas coherentes con la complejidad del servicio prestado.


      Como excepción a lo dispuesto en la letra e), el proveedor tercero de servicios de TIC y la entidad
      financiera que sea una microempresa podrán acordar que se puedan delegar los derechos de acceso,
      inspección y auditoría de la entidad financiera en un tercero independiente, designado por el proveedor
      tercero de servicios de TIC, y que la entidad financiera pueda solicitar al tercero en cualquier
      momento información y garantías sobre la actuación del proveedor tercero de servicios de TIC.


      4. Al negociar acuerdos contractuales, las entidades financieras y los proveedores terceros de servicios
      de TIC considerarán el uso de cláusulas contractuales tipo elaboradas por las autoridades públicas
      para servicios específicos.


      5. Las Autoridades Europeas de Supervisión, a través del Comité Mixto, elaborarán proyectos de normas
      técnicas de regulación para especificar más detalladamente los elementos a que se refiere el apartado
      2, letra a), que una entidad financiera debe determinar y evaluar a la hora de subcontratar servicios
      de TIC que sustenten funciones esenciales o importantes.


      A la hora de elaborar dichos proyectos de normas técnicas de regulación, las Autoridades Europeas
      de Supervisión tendrán en cuenta el tamaño y el perfil de riesgo general de la entidad financiera,
      así como la naturaleza, escala y complejidad de sus servicios, actividades y operaciones.


      Las Autoridades Europeas de Supervisión presentarán a la Comisión dichos proyectos de normas técnicas
      de regulación a más tardar el 17 de julio de 2024.


      Se delegan en la Comisión los poderes para completar el presente Reglamento mediante la adopción
      de las normas técnicas de regulación a que se refiere el párrafo primero de conformidad con los
      artículos 10 a 14 del Reglamento (UE) n.o 1093/2010, los artículos 10 a 14 del Reglamento (UE) n.o
      1094/2010 y los artículos 10 a 14 del Reglamento (UE) n.o 1095/2010.'
    official_text_en: '1. The rights and obligations of the financial entity and of the ICT third-party
      service provider shall be clearly allocated and set out in writing. The full contract shall include
      the service level agreements and be documented in one written document which shall be available
      to the parties on paper, or in a document with another downloadable, durable and accessible format.


      2. The contractual arrangements on the use of ICT services shall include at least the following
      elements:


      (a) a clear and complete description of all functions and ICT services to be provided by the ICT
      third-party service provider, indicating whether subcontracting of an ICT service supporting a critical
      or important function, or material parts thereof, is permitted and, when that is the case, the conditions
      applying to such subcontracting;


      (b) the locations, namely the regions or countries, where the contracted or subcontracted functions
      and ICT services are to be provided and where data is to be processed, including the storage location,
      and the requirement for the ICT third-party service provider to notify the financial entity in advance
      if it envisages changing such locations;


      (c) provisions on availability, authenticity, integrity and confidentiality in relation to the protection
      of data, including personal data;


      (d) provisions on ensuring access, recovery and return in an easily accessible format of personal
      and non-personal data processed by the financial entity in the event of the insolvency, resolution
      or discontinuation of the business operations of the ICT third-party service provider, or in the
      event of the termination of the contractual arrangements;


      (e) service level descriptions, including updates and revisions thereof;


      (f) the obligation of the ICT third-party service provider to provide assistance to the financial
      entity at no additional cost, or at a cost that is determined ex-ante, when an ICT incident that
      is related to the ICT service provided to the financial entity occurs;


      (g) the obligation of the ICT third-party service provider to fully cooperate with the competent
      authorities and the resolution authorities of the financial entity, including persons appointed
      by them;


      (h) termination rights and related minimum notice periods for the termination of the contractual
      arrangements, in accordance with the expectations of competent authorities and resolution authorities;


      (i) the conditions for the participation of ICT third-party service providers in the financial entities’
      ICT security awareness programmes and digital operational resilience training in accordance with
      Article 13(6).


      3. The contractual arrangements on the use of ICT services supporting critical or important functions
      shall include, in addition to the elements referred to in paragraph 2, at least the following:


      (a) full service level descriptions, including updates and revisions thereof with precise quantitative
      and qualitative performance targets within the agreed service levels to allow effective monitoring
      by the financial entity of ICT services and enable appropriate corrective actions to be taken, without
      undue delay, when agreed service levels are not met;


      (b) notice periods and reporting obligations of the ICT third-party service provider to the financial
      entity, including notification of any development that might have a material impact on the ICT third-party
      service provider’s ability to effectively provide the ICT services supporting critical or important
      functions in line with agreed service levels;


      (c) requirements for the ICT third-party service provider to implement and test business contingency
      plans and to have in place ICT security measures, tools and policies that provide an appropriate
      level of security for the provision of services by the financial entity in line with its regulatory
      framework;


      (d) the obligation of the ICT third-party service provider to participate and fully cooperate in
      the financial entity’s TLPT as referred to in Articles 26 and 27;


      (e) the right to monitor, on an ongoing basis, the ICT third-party service provider’s performance,
      which entails the following: (i) unrestricted rights of access, inspection and audit by the financial
      entity, or an appointed third party, and by the competent authority, and the right to take copies
      of relevant documentation on-site if they are critical to the operations of the ICT third-party
      service provider, the effective exercise of which is not impeded or limited by other contractual
      arrangements or implementation policies; (ii) the right to agree on alternative assurance levels
      if other clients’ rights are affected; (iii) the obligation of the ICT third-party service provider
      to fully cooperate during the onsite inspections and audits performed by the competent authorities,
      the Lead Overseer, financial entity or an appointed third party; and (iv) the obligation to provide
      details on the scope, procedures to be followed and frequency of such inspections and audits;


      (i) unrestricted rights of access, inspection and audit by the financial entity, or an appointed
      third party, and by the competent authority, and the right to take copies of relevant documentation
      on-site if they are critical to the operations of the ICT third-party service provider, the effective
      exercise of which is not impeded or limited by other contractual arrangements or implementation
      policies;


      (ii) the right to agree on alternative assurance levels if other clients’ rights are affected;


      (iii) the obligation of the ICT third-party service provider to fully cooperate during the onsite
      inspections and audits performed by the competent authorities, the Lead Overseer, financial entity
      or an appointed third party; and


      (iv) the obligation to provide details on the scope, procedures to be followed and frequency of
      such inspections and audits;


      (f) exit strategies, in particular the establishment of a mandatory adequate transition period:
      (i) during which the ICT third-party service provider will continue providing the respective functions,
      or ICT services, with a view to reducing the risk of disruption at the financial entity or to ensure
      its effective resolution and restructuring; (ii) allowing the financial entity to migrate to another
      ICT third-party service provider or change to in-house solutions consistent with the complexity
      of the service provided.


      (i) during which the ICT third-party service provider will continue providing the respective functions,
      or ICT services, with a view to reducing the risk of disruption at the financial entity or to ensure
      its effective resolution and restructuring;


      (ii) allowing the financial entity to migrate to another ICT third-party service provider or change
      to in-house solutions consistent with the complexity of the service provided.


      By way of derogation from point (e), the ICT third-party service provider and the financial entity
      that is a microenterprise may agree that the financial entity’s rights of access, inspection and
      audit can be delegated to an independent third party, appointed by the ICT third-party service provider,
      and that the financial entity is able to request information and assurance on the ICT third-party
      service provider’s performance from the third party at any time.


      4. When negotiating contractual arrangements, financial entities and ICT third-party service providers
      shall consider the use of standard contractual clauses developed by public authorities for specific
      services.


      5. The ESAs shall, through the Joint Committee, develop draft regulatory technical standards to
      specify further the elements referred to in paragraph 2, point (a), which a financial entity needs
      to determine and assess when subcontracting ICT services supporting critical or important functions.


      When developing those draft regulatory technical standards, the ESAs shall take into consideration
      the size and overall risk profile of the financial entity, and the nature, scale and complexity
      of its services, activities and operations.


      The ESAs shall submit those draft regulatory technical standards to the Commission by 17 July 2024.


      Power is delegated to the Commission to supplement this Regulation by adopting the regulatory technical
      standards referred to in the first subparagraph in accordance with Articles 10 to 14 of Regulations
      (EU) No 1093/2010, (EU) No 1094/2010 and (EU) No 1095/2010.'
