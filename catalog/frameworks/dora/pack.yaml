id: dora
name: DORA
version: 2022-2554.draft8
jurisdiction: EU
source: https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32022R2554
license_notes: Official Journal text (ES and EN) reproduced from the EU Publications Office; reuse of
  EU documents is authorised under Commission Decision 2011/833/EU, © European Union. Articles 5-14, 16-19,
  23 and 24-30 are imported, one requirement per article; coverage.yaml accounts for every other article.
  Delegated and implementing technical standards are not imported.
status: draft
attributes:
  content_state: partial
  assessment_enabled: false
  summary_es: 22 artículos oficiales de DORA sobre gestión del riesgo TIC, incidentes, pruebas de resiliencia
    y riesgo de terceros, en español e inglés, uno por requisito. Mapeos candidatos pendientes de revisión
    cualificada. Solo para entidades financieras.
  summary_en: 22 official DORA articles on ICT risk management, incidents, resilience testing and third-party
    risk, in Spanish and English, one per requirement. Candidate mappings await qualified review. For
    financial entities only.
  scope_es: Comprueba tipo de entidad, servicios financieros, exclusiones y papel de proveedores TIC conforme
    al ámbito del reglamento; no presupongas aplicación por usar servicios cloud.
  scope_en: Check entity type, financial services, exclusions and ICT-provider role under the regulation
    scope; cloud usage alone does not establish applicability.
  applicability_es: Determina régimen y proporcionalidad con el responsable. Prepara gobierno del riesgo
    TIC, incidentes, continuidad, pruebas de resiliencia y gestión de terceros. Confirma las normas técnicas
    y obligaciones específicas aplicables.
  applicability_en: Determine regime and proportionality with the accountable owner. Prepare ICT-risk
    governance, incidents, continuity, resilience testing and third-party management. Confirm applicable
    technical standards and specific duties.
  limitations_es: 'Cada requisito es un artículo completo: revisa cada apartado con tu revisor. Las normas
    técnicas del marco de gestión del riesgo TIC (Reglamento Delegado (UE) 2024/1774) tienen su propio
    marco. Faltan las demás normas técnicas de regulación y de ejecución, y el marco de vigilancia de
    proveedores críticos.'
  limitations_en: 'Each requirement is a whole article: review every paragraph with your reviewer. The
    technical standards on the ICT risk management framework (Delegated Regulation (EU) 2024/1774) have
    their own framework. The other regulatory and implementing technical standards, and the oversight
    framework for critical providers, are missing.'
