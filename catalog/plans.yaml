# Framework grants per plan and add-on (ADR-009, billing-entitlements spec).
# Keys are pack ids from catalog/frameworks/<pack>/pack.yaml. Values are "all" or a list of that
# pack's applies_to values; a plan may instead be "all", every framework including packs added
# later. A new pack or level is a YAML change, never code (MF-03, rule 9).
# Business plan hypothesis, accepted by the owner on 2026-11-23: starter = the first pack at its
# lowest level; pro = the first pack, all levels; business = every pack.
# Levels are not enforced yet: a listed framework is open whatever its scope (spec, Out of scope).
plans:
  starter:
    ens_rd311_2022: [BÁSICA]
  pro:
    ens_rd311_2022: all
  business: all
addons: {}
