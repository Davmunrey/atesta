# Local Postgres for DB tests, same image digest as CI. Bound to localhost only.
# ATESTA_TEST_DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/postgres uv run pytest
services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
