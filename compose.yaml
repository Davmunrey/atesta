# Local Postgres for DB tests, same image digest as CI. Bound to localhost only.
# ATESTA_TEST_DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/postgres uv run pytest
services:
  postgres:
    image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
